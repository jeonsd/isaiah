<style>
  :root { --bg:#FAF8F3; --ink:#1F2A24; --mute:#5E6B63; --acc:#2E7D4F; --hl:#AEDDBF; --bar:#1F3A2B; --fs:22px; }

  body { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.95; word-break:keep-all; padding-bottom:84px; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 0; }

  .seg { cursor:pointer; border-radius:8px; padding:1px 3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; scroll-margin-top:24px; transition:background .2s; }
  .seg.on { background:var(--hl); box-shadow:0 0 0 3px var(--hl); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bar); color:#fff; padding:0 12px calc(6px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(0,0,0,.25); z-index:50; }
  .prog { height:10px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden; margin:0 -12px 6px; }
  .prog i { display:block; height:100%; width:0; background:#8fe0a8; }
  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  button:active { transform:scale(.96); }
  button:focus-visible { outline:3px solid #FFE680; outline-offset:2px; }
  #play { background:#3FAE6A; font-size:18px; min-width:100px; }
  button.o { font-size:14px; min-width:40px; padding:0 10px; background:rgba(255,255,255,.1); }
  #tolist { display:none; font-size:16px; color:var(--mute); text-decoration:none; font-weight:700; margin-bottom:6px; }
  #nvnote { display:none; background:#FFF3DC; color:#1F2A24; border:2px solid #F0D49A; border-radius:14px; padding:10px 14px; margin:8px 0; font-size:17px; line-height:1.6; text-align:center; }
  #nvnote button { background:var(--acc); color:#fff; padding:0 18px; margin-left:8px; font-size:17px; }
  .nvcard { display:none; margin:34px 0 10px; background:#fff; border:2px solid #DCE6DF; border-radius:16px; padding:18px 20px; }
  .nvcard .lb { color:var(--mute); font-size:16px; }
  .nvcard .nm { font-size:calc(var(--fs) + 2px); font-weight:900; margin:4px 0 14px; line-height:1.5; }
  .nvcard a.go { display:inline-block; background:var(--acc); color:#fff; text-decoration:none; font-weight:900; font-size:19px; border-radius:14px; padding:12px 22px; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(63,174,106,.75); } 50% { box-shadow:0 0 0 10px rgba(63,174,106,0); } }
  #play.wait { animation:pulse 1.2s infinite; }
  #resume button { background:var(--acc); color:#fff; height:auto; padding:8px 14px; margin-left:8px; font-size:16px; }
  @media (max-width:640px) { header h1 { font-size:25px; } button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }
</style>

<script>
(function () {
  const TITLE = "5. 도구로 쓰셨는데 왜 벌하시는가", AUDIO_SRC = "doc05_2610241127.mp3", DUR = 677, SEGS = [{"t":"도구로 쓰셨는데 왜 벌하시는가: 앗수르의 교만과 하나님의 공의","s":0,"e":4.984,"p":false,"h":true},{"t":"본문: 이사야 10:5-19 (함께 읽을 본문: 사 5:25-30; 9:8-10:4; 10:20-34; 14:24-27; 36~37장; 합 1:12-2:8; 창 50:20; 행 2:23, 4:27-28)","s":6.156,"e":34.913,"p":true,"h":false},{"t":"앞의 네 편에서 고소당한 쪽은 언제나 이스라엘과 유다였습니다.","s":35.748,"e":40.193,"p":false,"h":false},{"t":"그런데 이사야 10장 5절에서 본문은 방향을 틀어, 심판의 몽둥이를 든 쪽에 \"화 있을진저\"를 외칩니다.","s":40.788,"e":48.16,"p":false,"h":false},{"t":"하나님이 보내서 간 자를 왜 벌하시는가, 이것이 공정한가 하는 물음이 여기서 생깁니다.","s":48.816,"e":54.922,"p":false,"h":false},{"t":"이 물음은 이사야 시대에만 있던 것이 아니라, 제국의 칼 아래서 고난당한 사람들이 늘 물어 온 것입니다.","s":55.548,"e":62.652,"p":true,"h":false},{"t":"후렴이 끝나는 자리","s":63.756,"e":65.254,"p":false,"h":true},{"t":"문맥부터 보겠습니다.","s":66.42,"e":68.188,"p":false,"h":false},{"t":"9장 8절부터 이어진 후렴, 곧 \"그래도 그의 노가 돌이켜지지 아니하고 그의 손이 여전히 펴져 있도다\"는 10장 4절에서 네 번째로 나오고 끝납니다.","s":68.724,"e":79.362,"p":false,"h":false},{"t":"그리고 곧바로 10장 5절이 이어집니다.","s":80.028,"e":82.836,"p":false,"h":false},{"t":"앗수르는 난데없이 나타난 이방 나라가 아니라, 해설서 9장에서 우리가 답답하게 읽은 그 펴진 손이 쥐고 있는 몽둥이입니다.","s":83.448,"e":91.67,"p":true,"h":false},{"t":"\"화 있을진저\"라는 말도 눈여겨볼 만합니다.","s":92.736,"e":95.814,"p":false,"h":false},{"t":"5장에서 포도원 노래 뒤에 여섯 번 나온 선고, 10장 1절에서 불의한 재판관들에게 던진 선고와 같은 말입니다.","s":96.444,"e":104.022,"p":false,"h":false},{"t":"이스라엘의 죄에 쓰이던 선고가 이제 앗수르에게 쓰입니다.","s":104.652,"e":108.68,"p":false,"h":false},{"t":"선택받은 백성이라고 면제되지 않았듯, 쓰임받는 도구라고 면제되지도 않습니다.","s":109.224,"e":115.067,"p":true,"h":false},{"t":"보내는 분과 가는 자","s":116.136,"e":117.736,"p":false,"h":true},{"t":"5절과 6절은 하늘의 시점입니다.","s":118.944,"e":121.442,"p":false,"h":false},{"t":"앗수르는 \"내 노의 막대기\"이고, 하나님은 내가 그를 보내고 내가 그에게 명령한다고 하십니다.","s":122.04,"e":128.53,"p":false,"h":false},{"t":"보내는 주체가 하나님이시라는 점을 본문은 조금도 감추지 않습니다.","s":129.168,"e":133.623,"p":false,"h":false},{"t":"대상은 \"경건하지 아니한 나라\"인데, 10장 1절과 2절이 이 나라의 죄를 적어 두었습니다.","s":134.244,"e":140.524,"p":false,"h":false},{"t":"불의한 법령으로 가난한 자의 권리를 빼앗는 일입니다.","s":141.192,"e":144.762,"p":true,"h":false},{"t":"그런데 7절이 장면을 뒤집습니다.","s":145.872,"e":148.387,"p":false,"h":false},{"t":"앗수르의 뜻은 그렇지 않았다는 것입니다.","s":148.86,"e":151.779,"p":false,"h":false},{"t":"그의 마음에 있는 것은 징계가 아니라 파괴였고, 한두 나라가 아니라 허다한 나라를 멸절하는 일이었습니다.","s":152.46,"e":159.37,"p":false,"h":false},{"t":"같은 사건이 두 시점으로 기록된 셈입니다.","s":160.02,"e":163.036,"p":false,"h":false},{"t":"하늘에서 보면 징계이고, 앗수르가 보면 정복입니다.","s":163.548,"e":167.458,"p":true,"h":false},{"t":"문제는 그의 마음이었다","s":168.48,"e":170.528,"p":false,"h":true},{"t":"8절에서 11절은 앗수르의 속말을 그대로 들려줍니다.","s":171.648,"e":175.471,"p":false,"h":false},{"t":"내 신하들이 다 왕이 아니냐며 갈로, 갈그미스, 하맛, 아르밧, 사마리아, 다메섹을 줄줄이 꼽습니다.","s":176.076,"e":186.329,"p":false,"h":false},{"t":"그러고는 결론에 이릅니다.","s":186.984,"e":188.926,"p":false,"h":false},{"t":"내가 사마리아와 그 우상에게 행한 것처럼 예루살렘과 그 우상에게 못 하겠느냐는 것입니다.","s":189.54,"e":195.596,"p":false,"h":false},{"t":"죄의 핵심이 여기서 드러납니다.","s":196.272,"e":198.539,"p":false,"h":false},{"t":"그는 예루살렘의 하나님을 이미 꺾은 다른 나라들의 신들과 같은 한 지역 신으로 보았습니다.","s":199.188,"e":205.005,"p":false,"h":false},{"t":"13절과 14절에서는 \"내 손의 힘과 내 지혜로 하였다\"고 자랑하며, 나라들의 재물을 새 둥지의 알을 줍듯 거두었다고 말합니다.","s":205.668,"e":214.578,"p":false,"h":false},{"t":"고대 앗수르 왕들의 비문이 왕의 힘으로 이룬 정복을 즐겨 자랑하는 것으로 알려져 있으니, 이 대목은 그 어조를 그대로 옮긴 것으로 읽힙니다.","s":215.172,"e":224.613,"p":true,"h":false},{"t":"12절은 판결의 근거를 밝힙니다.","s":225.684,"e":228.146,"p":false,"h":false},{"t":"주께서 시온과 예루살렘에 대한 일을 마치신 뒤에 앗수르 왕을 벌하시는데, 그 이유로 드는 것은 그의 교만한 마음에서 맺힌 열매와 높은 눈의 자랑입니다.","s":228.78,"e":239.14,"p":false,"h":false},{"t":"이 본문이 앗수르의 죄로 지목하는 것은 보냄을 받았다는 사실이 아니라, 그 일을 하면서 품은 마음입니다.","s":239.76,"e":246.842,"p":true,"h":false},{"t":"도끼의 자랑","s":247.932,"e":249.088,"p":false,"h":true},{"t":"15절은 이 장에서 가장 날카로운 그림입니다.","s":250.236,"e":253.477,"p":false,"h":false},{"t":"도끼가 자기를 찍는 사람 앞에서 자랑하겠느냐, 톱이 자기를 켜는 사람 앞에서 큰 체하겠느냐, 막대기가 자기를 든 사람을 휘두르려는 격이 아니냐는 것입니다.","s":254.124,"e":264.29,"p":false,"h":false},{"t":"도구는 쓰는 이의 손 안에서만 도구입니다.","s":264.888,"e":267.821,"p":true,"h":false},{"t":"이 그림이 앗수르를 꼭두각시로 만드는 것은 아닙니다.","s":268.92,"e":272.461,"p":false,"h":false},{"t":"7절은 앗수르에게 자기 뜻과 마음이 있었고 그 마음이 악했다고 분명히 말합니다.","s":272.808,"e":278.688,"p":false,"h":false},{"t":"15절이 말하는 것은 그의 힘이 파생된 것이라는 점입니다.","s":279.324,"e":283.293,"p":false,"h":false},{"t":"그가 이긴 것은 자기 지혜 때문이 아니라 쥐고 있는 손이 있었기 때문인데, 그 사실을 잊고 스스로 주인이라 믿은 것이 그의 죄입니다.","s":283.896,"e":292.986,"p":true,"h":false},{"t":"같은 사건, 두 개의 뜻","s":294.048,"e":296.511,"p":false,"h":true},{"t":"이런 구조는 성경에서 이 본문에만 나오지 않습니다.","s":297.504,"e":300.96,"p":false,"h":false},{"t":"요셉은 형들에게 당신들은 나를 해하려 했으나 하나님은 그것을 선으로 바꾸셨다고 말합니다(창 50:20).","s":301.572,"e":309.627,"p":false,"h":false},{"t":"한 사건에 형들의 악한 뜻과 하나님의 선한 뜻이 함께 있습니다.","s":310.248,"e":314.382,"p":false,"h":false},{"t":"가장 큰 사례는 십자가입니다.","s":315.036,"e":317.334,"p":false,"h":false},{"t":"사도행전 2장 23절은 예수께서 하나님의 정하신 계획과 미리 아심을 따라 넘겨지셨다고 하면서 동시에 \"너희가 법 없는 자들의 손을 빌려 못 박아 죽였다\"고 책임을 묻습니다.","s":317.952,"e":329.846,"p":false,"h":false},{"t":"4장 27절과 28절도 헤롯과 빌라도와 이방인과 이스라엘 백성이 모인 일을 하나님의 손과 뜻이 미리 정하신 일을 이루려는 것이었다고 말합니다.","s":330.516,"e":340.285,"p":true,"h":false},{"t":"개혁주의 전통은 이것을 섭리 교리로 정리해 왔습니다.","s":341.028,"e":344.734,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서 5장 4항은 하나님의 섭리가 죄에까지 미치되 단순한 허용이 아니라 지혜롭고 능력 있게 경계를 정하고 다스리는 방식이며, 그러면서도 죄악됨은 오직 피조물에게서 나오고 하나님은 죄의 조성자도 시인자도 아니시라고 말합니다.","s":345.348,"e":362.258,"p":true,"h":false},{"t":"여기서도 2번 글에서처럼 한계를 말씀드려야 합니다.","s":363.348,"e":366.951,"p":false,"h":false},{"t":"본문은 두 뜻이 한 사건 안에서 어떻게 만나는지를 설명하지 않습니다.","s":367.524,"e":372.268,"p":false,"h":false},{"t":"다만 한 가지는 분명히 합니다.","s":372.888,"e":375.129,"p":false,"h":false},{"t":"책임이 놓이는 자리입니다.","s":375.768,"e":377.683,"p":false,"h":false},{"t":"이 장에서 죄가 놓이는 곳은 하나님의 명령이 아니라 앗수르의 마음입니다.","s":378.288,"e":383.153,"p":false,"h":false},{"t":"또 본문은 하나님이 앗수르에게 교만을 불어넣으셨다고 말하지 않고, 이미 정복을 향하던 그의 걸음을 징계의 방향으로 돌려세우시는 모습으로 그립니다.","s":383.796,"e":393.349,"p":false,"h":false},{"t":"그 방향 지으심이 어디까지 미치는지는 본문이 정하지 않으므로, 거기서 더 나아가는 것은 신학적 추론의 몫입니다.","s":393.948,"e":401.623,"p":true,"h":false},{"t":"시한이 있는 몽둥이","s":402.696,"e":404.256,"p":false,"h":true},{"t":"이 몽둥이에는 시한이 있습니다.","s":405.324,"e":407.706,"p":false,"h":false},{"t":"12절은 하나님이 시온과 예루살렘에 대한 일을 다 이루신 뒤에 앗수르를 벌하신다고 하고, 25절은 조금만 있으면 분노가 그치고 진노가 앗수르를 멸하는 쪽으로 옮겨 간다고 말합니다.","s":408.348,"e":420.113,"p":false,"h":false},{"t":"9장에서 느낀 답답함이 여기서 한 줄기 빛을 받습니다.","s":420.66,"e":424.427,"p":false,"h":false},{"t":"펴진 손은 끝없이 펴져 있는 것이 아니라 징계의 목적이 이루어질 때까지 펴져 있다가 몽둥이를 내려놓습니다.","s":425.052,"e":432.155,"p":true,"h":false},{"t":"16절에서 19절은 앗수르의 심판을 불로 그립니다.","s":433.152,"e":436.918,"p":false,"h":false},{"t":"그런데 17절은 \"이스라엘의 빛이 불이 되고 그의 거룩한 이가 불꽃이 되어\"라고 합니다.","s":437.544,"e":443.488,"p":false,"h":false},{"t":"9장 2절에서 흑암에 행하던 백성에게 비친 그 큰 빛이 여기서는 교만한 자를 사르는 불입니다.","s":444.132,"e":450.45,"p":false,"h":false},{"t":"8장 14절에서 같은 하나님이 성소도 되시고 걸림돌도 되셨듯, 겸손한 자에게 빛인 분이 교만한 자에게는 불이 되십니다.","s":451.044,"e":459.291,"p":false,"h":false},{"t":"이 읽기는 제 연결이며, 같은 하나님이 사람의 자리에 따라 다르게 마주 서신다는 이사야서의 일관된 방식을 따른 것입니다.","s":459.936,"e":468.641,"p":true,"h":false},{"t":"19절은 앗수르의 숲에 남은 나무가 어린아이도 셀 수 있을 만큼 적으리라고 합니다.","s":469.764,"e":474.943,"p":false,"h":false},{"t":"바로 뒤 20절부터 23절은 이스라엘의 남은 자가 돌아오리라고 말합니다.","s":475.56,"e":480.966,"p":false,"h":false},{"t":"4번에서 본 남은 자와 앗수르의 남은 숲이 마주 놓인 것입니다.","s":481.536,"e":485.566,"p":false,"h":false},{"t":"장의 끝, 33절과 34절에서는 하나님이 쇠로 숲의 무성한 곳을 베시고, 이어지는 11장 1절은 이새의 그루터기에서 싹이 난다고 합니다.","s":486.216,"e":496.356,"p":false,"h":false},{"t":"도끼를 자랑하던 쪽이 베이고 다윗의 줄기에서 새 순이 돋는 대비입니다.","s":497.016,"e":502.126,"p":true,"h":false},{"t":"14장 24절부터 27절은 앗수르를 꺾으시는 계획을 말한 뒤, 이것이 온 땅에 대한 계획이며 모든 나라 위에 펴신 손이라고 맺습니다.","s":503.136,"e":513.179,"p":false,"h":false},{"t":"이 이야기는 6번 글로 이어집니다.","s":513.792,"e":516.402,"p":true,"h":false},{"t":"역사가 보여 준 것","s":517.464,"e":518.91,"p":false,"h":true},{"t":"주전 701년 산헤립이 유다를 침공했을 때 일어난 일은 8번 글에서 자세히 읽겠습니다.","s":519.876,"e":526.448,"p":false,"h":false},{"t":"여기서는 한 가지만 짚어 둡니다.","s":527.076,"e":529.511,"p":false,"h":false},{"t":"37장 26절부터 29절에서 하나님은 앗수르의 오만을 두고 갈고리로 코를 꿰고 재갈을 물려 온 길로 돌려보내리라고 하십니다.","s":530.1,"e":538.956,"p":false,"h":false},{"t":"10장 15절의 도끼가 어떻게 되는지를 역사 속에서 보여 주는 장면입니다.","s":539.532,"e":544.338,"p":true,"h":false},{"t":"같은 물음을 던진 하박국","s":545.4,"e":547.431,"p":false,"h":true},{"t":"이 물음을 정면으로 묻고 따진 사람이 성경 안에도 있습니다.","s":548.532,"e":552.462,"p":false,"h":false},{"t":"하박국은 유다의 죄를 벌하러 바벨론을 일으키신다는 말씀을 듣고 항의합니다.","s":553.032,"e":558.085,"p":false,"h":false},{"t":"눈이 너무 정결하여 악을 보지 못하시는 분이 어찌 악인이 의인을 삼키는데 잠잠하시냐는 것입니다(합 1:13).","s":558.72,"e":567.289,"p":false,"h":false},{"t":"응답은 설명이 아니라 바벨론에게 내려질 다섯 번의 화(2장)와 \"의인은 믿음으로 말미암아 살리라\"(2:4)는 말씀입니다.","s":567.864,"e":578.054,"p":false,"h":false},{"t":"예레미야도 칠십 년이 차면 바벨론을 벌하신다고 말합니다(렘 25:12).","s":578.664,"e":584.809,"p":false,"h":false},{"t":"답하는 방식이 같습니다.","s":585.396,"e":587.266,"p":false,"h":false},{"t":"도구는 반드시 심판받고, 그동안 의인은 기다립니다.","s":587.952,"e":592.204,"p":true,"h":false},{"t":"이 본문이 말하는 것","s":593.208,"e":594.654,"p":false,"h":true},{"t":"이 본문은 읽는 사람의 자리에 따라 다르게 말합니다.","s":595.692,"e":599.284,"p":false,"h":false},{"t":"압제 아래 있는 사람에게는 위로입니다.","s":599.904,"e":602.619,"p":false,"h":false},{"t":"제국의 승리가 마지막 말이 아니고, 그들이 쥔 칼에도 시한이 있습니다.","s":603.252,"e":608.055,"p":false,"h":false},{"t":"징계를 받는 사람에게는 그 징계에 목적과 끝이 있고, 몽둥이를 쥔 손이 하나님의 손이라는 위로입니다.","s":608.688,"e":615.957,"p":true,"h":false},{"t":"힘을 가진 사람에게는 경고입니다.","s":617.04,"e":619.4,"p":false,"h":false},{"t":"쓰임받는다는 사실은 의롭다는 증명서가 아닙니다.","s":619.992,"e":623.862,"p":false,"h":false},{"t":"앗수르는 하나님의 계획에 정확히 들어맞는 일을 하고도 그 일로 심판받았습니다.","s":624.492,"e":629.614,"p":false,"h":false},{"t":"성공과 영향력을 하나님의 인정으로 읽는 순간이 도끼가 자랑하는 순간입니다.","s":630.252,"e":635.458,"p":false,"h":false},{"t":"이것은 나라와 지도자에게만이 아니라 \"하나님이 나를 쓰셨다\"고 말하는 모든 사역자에게 해당합니다.","s":636.084,"e":642.35,"p":false,"h":false},{"t":"쓰시는 일은 은혜이고, 그 은혜를 자기 능력으로 바꿔 읽는 것이 죄입니다.","s":642.96,"e":648.183,"p":true,"h":false},{"t":"마지막으로 주의할 점이 있습니다.","s":649.26,"e":651.54,"p":false,"h":false},{"t":"이사야에게는 앗수르가 하나님의 막대라는 계시의 말씀이 있었습니다.","s":651.816,"e":656.343,"p":false,"h":false},{"t":"우리에게는 그런 말씀이 없습니다.","s":656.928,"e":659.493,"p":false,"h":false},{"t":"이 본문으로 오늘의 어느 나라가 하나님의 몽둥이이고 어느 나라가 그의 대적인지 가려내려 해서는 안 됩니다.","s":660.132,"e":667.067,"p":false,"h":false},{"t":"이 본문은 역사를 해독하는 열쇠가 아니라, 내가 지금 쥐고 있는 힘이 누구의 손에서 온 것인지를 묻는 물음입니다.","s":667.656,"e":675.447,"p":true,"h":false}], NAV = {"prev":{"href":"doc04.html","title":"4. 남은 자는 왜 있으며 무엇을 위한 것인가"},"next":{"href":"doc06.html","title":"6. 이방 나라들의 심판이 왜 이스라엘의 책에 들어 있는가"},"list":"index.html"};

  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
