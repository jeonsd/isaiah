(function () {
  const TITLE = "isaiah_28", AUDIO_SRC = "isaiah_28_2610230230.mp3", DUR = 447, SEGS = [{"t":"이사야 28장","s":0,"e":1.774,"p":true,"h":false},{"t":"제목 술 취한 지도자들과 모퉁이돌, 시험을 거친 하나님의 기초","s":2.412,"e":7.439,"p":true,"h":false},{"t":"핵심 한 줄 말씀을 비웃는 지도자들은 무너지지만, 하나님이 시온에 놓으신 시험된 돌 위에 믿는 사람은 흔들리지 않습니다.","s":8.064,"e":16.408,"p":true,"h":false},{"t":"풀어 읽기","s":17.208,"e":18.278,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 24장에서 27장이 먼 미래의 큰 그림이었다면, 28장부터 33장까지는 다시 이사야 시대의 구체적인 현실로 돌아옵니다.","s":19.116,"e":30.265,"p":false,"h":false},{"t":"앗수르의 위협 속에서 유다 지도자들이 이집트와 동맹을 맺어 살길을 찾던 때입니다.","s":30.6,"e":36.201,"p":false,"h":false},{"t":"28장은 그 지도자들을 향한 첫 번째 \"화 있을진저\"입니다.","s":36.54,"e":41.294,"p":true,"h":false},{"t":"이 장에는 세 가지 장면이 있습니다.","s":41.94,"e":44.487,"p":false,"h":false},{"t":"먼저 북쪽 이스라엘의 수도 사마리아가 술에 취한 교만한 관 같은 모습으로 곧 무너진다는 경고입니다.","s":44.712,"e":51.491,"p":false,"h":false},{"t":"다음으로 유다의 제사장과 예언자들이 술에 취해 하나님의 말씀을 비웃는 장면입니다.","s":51.84,"e":57.624,"p":false,"h":false},{"t":"그리고 하나님이 시온에 놓으시는 시험된 모퉁이돌 이야기입니다.","s":57.996,"e":62.5,"p":false,"h":false},{"t":"말씀을 비웃은 사람의 거짓 피난처는 무너지고, 하나님이 놓으신 기초만 남는다는 것이 이 장의 줄기입니다.","s":62.712,"e":70.172,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":70.524,"e":73.8,"p":true,"h":false},{"t":"1절에서 4절, 술 취한 에브라임의 화려한 관 \"화 있을진저, 에브라임의 술 취한 자의 교만한 면류관이여.\"","s":74.448,"e":82.07,"p":false,"h":false},{"t":"에브라임은 북쪽 이스라엘이고, 그 수도 사마리아는 기름진 골짜기 위에 화려하게 서 있었습니다.","s":82.26,"e":88.998,"p":false,"h":false},{"t":"사마리아는 술 취한 사람들이 쓴 시들어 가는 꽃 면류관처럼 겉은 아름답지만 곧 시들어 버릴 운명입니다.","s":89.352,"e":96.438,"p":false,"h":false},{"t":"하나님이 강하고 힘 있는 자를 보내시니, 폭우와 홍수처럼 땅에 쏟아져 그 관을 발로 짓밟습니다.","s":96.804,"e":103.465,"p":false,"h":false},{"t":"4절은 그것이 여름 전에 익은 무화과 같다고 합니다.","s":103.824,"e":107.578,"p":false,"h":false},{"t":"사람이 보자마자 손에 따서 삼켜 버리는 것처럼 순식간에 사라진다는 뜻입니다.","s":107.784,"e":113.129,"p":true,"h":false},{"t":"5절에서 6절, 그날에 남은 자의 면류관이 되시는 하나님 그런데 같은 \"그날에\" 만군의 여호와께서 남은 백성에게 영광의 면류관과 아름다운 화관이 되십니다.","s":113.796,"e":124.964,"p":false,"h":false},{"t":"교만한 지도자들의 시들 관과는 정반대로, 하나님 자신이 백성의 영광이 되십니다.","s":125.316,"e":131.291,"p":false,"h":false},{"t":"재판하는 자에게는 공의의 영이 되시고, 성문에서 적을 물리치는 자에게는 힘이 되십니다.","s":131.508,"e":137.894,"p":false,"h":false},{"t":"하나님을 의지하는 남은 자는 사람이 만든 관이 아니라 하나님을 관으로 가집니다.","s":138.096,"e":143.33,"p":true,"h":false},{"t":"7절에서 13절, 말씀을 비웃는 제사장과 예언자 이제 시선이 유다로 옵니다.","s":144,"e":150.087,"p":false,"h":false},{"t":"유다의 제사장과 예언자들도 포도주와 독주에 취해 비틀거립니다.","s":150.3,"e":155.084,"p":false,"h":false},{"t":"예언자는 환상을 보다가 헛디디고 재판관은 판결에서 실수합니다.","s":155.304,"e":160.076,"p":false,"h":false},{"t":"상마다 토한 것이 가득하여 깨끗한 곳이 없다고 합니다.","s":160.272,"e":164.176,"p":false,"h":false},{"t":"이들은 하나님의 말씀을 가르쳐야 할 사람들인데, 이렇게 흐트러져 있습니다.","s":164.376,"e":169.61,"p":true,"h":false},{"t":"그러자 그들이 이사야를 비웃습니다.","s":170.28,"e":172.822,"p":false,"h":false},{"t":"\"그가 누구에게 지식을 가르치며 누구에게 소식을 전하느냐?","s":173.016,"e":176.845,"p":false,"h":false},{"t":"젖 떨어진 아이들이냐?\"","s":177.084,"e":178.71,"p":false,"h":false},{"t":"그러고는 이사야의 말을 흉내 냅니다.","s":178.992,"e":181.676,"p":false,"h":false},{"t":"\"명령에 명령, 명령에 명령, 규칙에 규칙, 규칙에 규칙, 여기도 조금, 저기도 조금.\"","s":181.908,"e":189.645,"p":false,"h":false},{"t":"아이에게 글자를 가르치듯 같은 말을 되풀이하는 이사야를 우습게 여긴 것입니다.","s":189.792,"e":195.009,"p":true,"h":false},{"t":"하나님은 이 조롱에 이렇게 답하십니다.","s":195.66,"e":198.558,"p":false,"h":false},{"t":"너희가 어눌한 입술과 다른 나라 말로 말씀을 들은 것이 앗수르 군대의 말을 듣는 것이라는 뜻입니다.","s":198.792,"e":205.298,"p":false,"h":false},{"t":"하나님이 쉼과 평안을 주시려 했는데 그들이 듣지 않았습니다.","s":205.632,"e":209.749,"p":false,"h":false},{"t":"그래서 하나님의 말씀이 정말로 그들에게 \"명령에 명령, 규칙에 규칙, 여기 조금, 저기 조금\"이 되어, 그들이 가다가 뒤로 넘어져 부서지고 올무에 걸리고 잡힐 것이라고 하십니다.","s":209.952,"e":223.34,"p":false,"h":false},{"t":"비웃은 바로 그 말이 심판의 말이 됩니다.","s":223.704,"e":226.726,"p":false,"h":false},{"t":"6장에서 \"들어도 깨닫지 못하게 하신다\"는 말씀의 한 모습입니다.","s":226.944,"e":231.903,"p":true,"h":false},{"t":"14절에서 15절, 사망과 맺은 언약 이제 예루살렘에서 이 백성을 다스리는 비웃는 자들에게 하나님이 말씀하십니다.","s":232.56,"e":240.934,"p":false,"h":false},{"t":"그들은 자랑합니다.","s":241.272,"e":242.906,"p":false,"h":false},{"t":"\"우리가 사망과 언약하고 스올과 맹약했으니, 넘치는 재앙이 지나갈 때에도 우리에게 미치지 못하리니.\"","s":243.18,"e":250.39,"p":false,"h":false},{"t":"사망과 스올은 죽음의 세계입니다.","s":250.596,"e":253.293,"p":false,"h":false},{"t":"곧 앗수르라는 재앙이 와도 우리는 안전하다고 자신하는 것입니다.","s":253.512,"e":257.754,"p":false,"h":false},{"t":"그들이 의지한 것은 거짓과 속임수였습니다.","s":257.976,"e":261.208,"p":false,"h":false},{"t":"이집트와 몰래 맺은 동맹을 가리키는 말로 읽습니다.","s":261.432,"e":265.006,"p":false,"h":false},{"t":"말로는 죽음을 피할 방법을 구했다고 자랑하지만, 사실은 죽음과 약속을 맺은 셈입니다.","s":265.212,"e":271.748,"p":true,"h":false},{"t":"16절에서 22절, 시온에 놓으신 시험된 모퉁이돌 그러므로 주 여호와께서 말씀하십니다.","s":272.556,"e":279.378,"p":false,"h":false},{"t":"\"보라, 내가 시온에 한 돌을 기초로 놓나니 곧 시험한 돌이요 귀한 모퉁이 돌이요 견고한 기초 돌이라.","s":279.72,"e":286.779,"p":false,"h":false},{"t":"그것을 믿는 이는 다급하지 아니하리로다.\"","s":286.992,"e":289.99,"p":false,"h":false},{"t":"모퉁이돌은 건물의 가장 중요한 첫 돌입니다.","s":290.232,"e":293.541,"p":false,"h":false},{"t":"이 돌 위에 건물 전체가 서서 모든 것이 이 돌에 맞춰집니다.","s":293.76,"e":298.223,"p":false,"h":false},{"t":"하나님이 이 돌을 놓으셨다는 것은, 사람이 거짓말로 쌓은 피난처가 아니라 하나님이 세우신 기초가 따로 있다는 말입니다.","s":298.44,"e":306.582,"p":false,"h":false},{"t":"그 돌을 믿는 사람은 허둥대지 않습니다.","s":306.936,"e":309.859,"p":false,"h":false},{"t":"이사야 시대에는 하나님이 시온에 세우신 구원의 약속을 가리켰지만, 이 돌은 마침내 예수 그리스도이십니다.","s":310.068,"e":317.569,"p":false,"h":false},{"t":"신약은 이 말씀을 그리스도에게 분명히 적용합니다.","s":317.916,"e":321.57,"p":false,"h":false},{"t":"이 돌 위에 서는 사람은 흔들리지 않습니다.","s":321.768,"e":324.881,"p":true,"h":false},{"t":"이 기초 위에 하나님은 공평을 줄로 삼고 정의를 저울추로 삼으십니다.","s":325.548,"e":330.657,"p":false,"h":false},{"t":"그러면 거짓의 피난처는 우박에 쓸려 가고 물이 숨은 곳을 덮습니다.","s":330.876,"e":335.523,"p":false,"h":false},{"t":"사망과 맺은 언약은 깨어지고 스올과의 맹약은 서지 못합니다.","s":335.736,"e":340.27,"p":false,"h":false},{"t":"넘치는 재앙이 지나갈 때 그들은 짓밟힙니다.","s":340.488,"e":343.935,"p":false,"h":false},{"t":"그것은 아침마다 지나가며 낮에도 밤에도 계속될 것이니, 이 소문만 들어도 두려움이 될 것이라고 합니다.","s":344.16,"e":351.523,"p":false,"h":false},{"t":"20절의 짧은 침대와 좁은 이불 비유처럼, 사람이 만든 피난처는 몸을 눕히기에도 덮기에도 너무 좁다는 말입니다.","s":351.72,"e":359.819,"p":false,"h":false},{"t":"하나님이 마땅한 일로 심판하시는데, 그 이     /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
