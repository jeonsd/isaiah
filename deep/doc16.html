(function () {
  const TITLE = "16. 하나의 줄기로 읽는 이사야서", AUDIO_SRC = "doc16_2610241127.mp3", DUR = 393, SEGS = [{"t":"마무리: 하나의 줄기로 읽는 이사야서","s":0,"e":3.107,"p":false,"h":true},{"t":"이 시리즈는 열다섯 가지 물음으로 이사야서를 따라왔습니다.","s":4.284,"e":8.54,"p":false,"h":false},{"t":"하나씩 읽을 때는 서로 다른 물음처럼 보이지만, 끝까지 오고 보면 한 줄기입니다.","s":9.216,"e":15.036,"p":false,"h":false},{"t":"마지막으로 그 줄기를 한 번에 돌아보고, 이 시리즈를 어떻게 읽으면 좋은지 말씀드리겠습니다.","s":15.66,"e":21.94,"p":true,"h":false},{"t":"처음 물음과 마지막 답","s":23.04,"e":24.806,"p":false,"h":true},{"t":"모든 것은 6장 11절의 한마디에서 시작되었습니다.","s":25.704,"e":29.497,"p":false,"h":false},{"t":"이사야는 전해도 깨닫지 못할 것이라는 선고를 듣고 이렇게 물었습니다.","s":30.06,"e":35.15,"p":false,"h":false},{"t":"\"주여 어느 때까지니이까.\"","s":35.784,"e":37.604,"p":false,"h":false},{"t":"하나님의 대답은 시간표가 아니었습니다.","s":38.232,"e":40.936,"p":false,"h":false},{"t":"나무가 베인 뒤에도 그루터기가 남고, 그루터기에 거룩한 씨가 있다는 말씀이었습니다.","s":41.544,"e":47.413,"p":false,"h":false},{"t":"이사야서 육십육 장은 그 그루터기가 어디까지 자라는지를 보여 주는 책입니다.","s":48.06,"e":53.312,"p":false,"h":false},{"t":"66장 22절에서 \"너희 자손과 너희 이름이 항상 있으리라\"는 약속에 이르면, 처음의 물음에 대한 답이 완성됩니다.","s":53.964,"e":61.935,"p":true,"h":false},{"t":"네 마디로 보는 줄기","s":63.036,"e":64.682,"p":false,"h":true},{"t":"첫째 마디는 사명과 완고함입니다.","s":65.844,"e":68.476,"p":false,"h":false},{"t":"이사야는 설득자가 아니라 증인으로 보내졌습니다.","s":69.084,"e":72.478,"p":false,"h":false},{"t":"백성의 굳어짐에는 하나님의 주권과 백성의 책임이 함께 놓여 있고, 성경은 그 둘을 하나로 설명하지 않은 채 나란히 세워 둡니다.","s":73.08,"e":81.46,"p":false,"h":false},{"t":"아하스 왕은 약속이 부족해서가 아니라 붙들고 있던 것을 내려놓지 못해서 돌이키지 않았습니다.","s":82.08,"e":88.134,"p":false,"h":false},{"t":"그래서 약속은 백성의 자격이 아니라 은혜로 남은 자를 통해 이어집니다.","s":88.812,"e":93.931,"p":true,"h":false},{"t":"둘째 마디는 심판과 열방입니다.","s":95.004,"e":97.585,"p":false,"h":false},{"t":"앗수르는 하나님의 몽둥이였으나 그 마음의 교만 때문에 심판받았고, 열방 신탁은 두려워하던 강대국들이 모두 하나님의 손 아래 있음을 보여 주었습니다.","s":98.244,"e":108.338,"p":false,"h":false},{"t":"심판과 회복이 번갈아 나오는 것은 어지러움이 아니라 한 하나님이 한 일을 두 번 말씀하시는 방식이었습니다.","s":108.972,"e":116.139,"p":false,"h":false},{"t":"그리고 가장 좋은 왕 히스기야도 마지막에 넘어지면서, 이 책은 왕이 아니라 하나님 자신이 오셔야 한다는 쪽으로 방향을 바꿉니다.","s":116.748,"e":125.244,"p":true,"h":false},{"t":"셋째 마디는 위로와 종입니다.","s":126.36,"e":128.629,"p":false,"h":false},{"t":"40장은 아직 오지 않은 귀환을 말씀 위에서 미리 위로했습니다.","s":129.276,"e":133.486,"p":false,"h":false},{"t":"이방 왕 고레스는 포로의 문을 열 수 있었지만, 완고한 마음의 문제는 풀지 못했습니다.","s":134.064,"e":140.361,"p":false,"h":false},{"t":"그 일은 눈먼 이스라엘을 대신해 사명을 이루는 한 종에게 맡겨졌고, 53장에서 우리는 고백합니다.","s":141.012,"e":148.156,"p":false,"h":false},{"t":"맞아야 할 쪽은 우리였다고.","s":148.788,"e":150.839,"p":true,"h":false},{"t":"넷째 마디는 회복과 새 창조입니다.","s":151.92,"e":154.551,"p":false,"h":false},{"t":"구원이 선포된 뒤에도 탄식은 계속되었습니다.","s":155.16,"e":158.529,"p":false,"h":false},{"t":"그러나 그 탄식은 실패의 흔적이 아니라, 고백하는 백성이 되었다는 증거이며, 마지막 기도의 형식이었습니다.","s":159.156,"e":167.15,"p":false,"h":false},{"t":"이스라엘의 불순종은 열방의 구원을 막지 못했고, 하나님이 실패한 사명을 직접 이루신다는 한 이야기의 두 면이었습니다.","s":167.796,"e":175.77,"p":false,"h":false},{"t":"그리고 책은 새 하늘과 새 땅이라는 방향을 가리키며 끝나되, 아직 돌이키지 않은 이들에 대한 엄중함도 지우지 않습니다.","s":176.436,"e":184.354,"p":true,"h":false},{"t":"한 문장으로 모으면","s":185.436,"e":187.106,"p":false,"h":true},{"t":"돌이키지 못하는 백성을 위해, 하나님이 직접 오시고, 직접 짊어지시고, 직접 마음을 여십니다.","s":187.92,"e":195.298,"p":false,"h":false},{"t":"이것이 이사야서가 육십육 장에 걸쳐 하는 말입니다.","s":195.84,"e":199.339,"p":false,"h":false},{"t":"9장을 읽고 답답하셨다면, 그 답답함은 틀리지 않았습니다.","s":199.98,"e":204.621,"p":false,"h":false},{"t":"이 책은 그 답답함을 지우지 않고, 그 끝에 오시는 분을 보여 줍니다.","s":205.272,"e":210.512,"p":true,"h":false},{"t":"해설서와 함께 읽는 법","s":211.572,"e":213.413,"p":false,"h":true},{"t":"이 시리즈는 해설서를 대신하지 않습니다.","s":214.668,"e":217.661,"p":false,"h":false},{"t":"해설서가 장마다 \"무슨 말씀인가\"를 풀어 준다면, 이 시리즈는 읽다가 마음에 걸리는 \"왜 그런가\"에 답하는 글입니다.","s":217.98,"e":226.277,"p":false,"h":false},{"t":"그래서 순서는 이렇게 권합니다.","s":226.944,"e":229.277,"p":false,"h":false},{"t":"먼저 해설서로 그 장의 흐름을 잡으십시오.","s":229.572,"e":232.553,"p":false,"h":false},{"t":"그러다 걸리는 곳이 생기면 해당하는 물음으로 오십시오.","s":233.1,"e":236.762,"p":true,"h":false},{"t":"6장을 읽다가 걸리면 1번과 2번으로, 7장부터 9장은 3번으로, 10장 앗수르는 5번으로, 13장부터 23장은 6번으로, 24장부터 35장은 7번으로, 36장부터 39장은 8번으로 가십시오.","s":237.528,"e":254.339,"p":false,"h":false},{"t":"40장은 9-1과 9-2, 44장과 45장은 10번, 종의 노래는 11번과 12번, 56장 이후는 13번에서 15번이 맞는 자리입니다.","s":254.844,"e":266.684,"p":false,"h":false},{"t":"남은 자는 4번이 전체를 묶습니다.","s":267.264,"e":269.899,"p":false,"h":false},{"t":"처음부터 끝까지 이어서 들으셔도 좋습니다.","s":270.54,"e":273.533,"p":false,"h":false},{"t":"이어듣기로 들으면 한 권의 책처럼 흘러갑니다.","s":274.068,"e":277.298,"p":true,"h":false},{"t":"이 시리즈를 읽는 마음가짐","s":278.388,"e":280.501,"p":false,"h":true},{"t":"한 가지는 분명히 해 두겠습니다.","s":281.592,"e":283.822,"p":false,"h":false},{"t":"이 글들에는 본문이 직접 말하는 것과, 글쓴이가 본문 사이의 낱말과 흐름을 보고 이어 읽은 것이 함께 들어 있습니다.","s":284.436,"e":292.403,"p":false,"h":false},{"t":"후자는 \"이것은 제 읽기입니다\"라고 구분해 두었고, 학자들 사이에서 의견이 갈리는 곳에서는 한쪽을 정하지 않았습니다.","s":293.04,"e":301.23,"p":false,"h":false},{"t":"그러니 이 글을 정답으로 받지 마시고, 성경 본문을 옆에 펴 놓고 확인하며 읽으십시오.","s":301.896,"e":308.11,"p":false,"h":false},{"t":"본문이 말하는 것과 다르다고 느껴지면, 본문이 이깁니다.","s":308.7,"e":312.917,"p":true,"h":false},{"t":"또 하나, 이 시리즈는 개혁주의 전통의 읽기를 기본으로 삼았습니다.","s":313.956,"e":318.875,"p":false,"h":false},{"t":"다른 전통에서 읽는 분들을 위해 다른 입장도 가장 좋은 논리로 소개하려 했습니다.","s":319.536,"e":325.102,"p":false,"h":false},{"t":"어느 입장이든 하나님의 말씀을 존중하는 사람들이 오랜 시간 성실하게 씨름해 온 결과라는 점을 기억해 주십시오.","s":325.764,"e":333.04,"p":true,"h":false},{"t":"읽는 사람이 서는 자리","s":333.936,"e":335.701,"p":false,"h":true},{"t":"이사야서는 읽는 사람을 구경꾼으로 두지 않습니다.","s":336.816,"e":340.435,"p":false,"h":false},{"t":"6장에서 이사야는 자기도 입술이 부정한 백성 가운데 산다고 고백한 뒤에야 말씀을 맡았습니다.","s":340.992,"e":347.552,"p":false,"h":false},{"t":"53장에서 백성은 맞은 이를 죄인으로 여겼다가 알고 보니 자기 죄였다고 깨닫습니다.","s":348.192,"e":354.086,"p":false,"h":false},{"t":"그리고 66장은 하나님이 돌아보시는 사람을 이렇게 말합니다.","s":354.672,"e":359.046,"p":false,"h":false},{"t":"\"가난하고 마음이 상하며 내 말을 두려워하며 떠는 자.\"","s":359.352,"e":363.128,"p":true,"h":false},{"t":"이 책을 다 읽은 사람이 서야 할 자리는 판단하는 자리가 아니라 그 자리입니다.","s":364.212,"e":369.464,"p":false,"h":false},{"t":"내 힘으로 다시 세우겠다고 버티던 손을 내려놓고, 말씀 앞에서 떠는 자리입니다.","s":370.116,"e":376.319,"p":false,"h":false},{"t":"그리고 그곳에서 이 책의 약속을 듣습니다.","s   /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
