  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  button:active { transform:scale(.96); }

  #nvnote button { background:var(--acc); color:#fff; padding:0 18px; margin-left:8px; font-size:17px; }

  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(63,174,106,.75); } 50% { box-shadow:0 0 0 10px rgba(63,174,106,0); } }
  #play.wait { animation:pulse 1.2s infinite; }
  #resume button { background:var(--acc); color:#fff; height:auto; padding:8px 14px; margin-left:8px; font-size:16px; }
  @media (max-width:640px) { header h1 { font-size:25px; } button { height:42px; padding:0 9px; } #play { min-width:84px; } }

<script>
(function () {
  const TITLE = "1. 결과를 아시면서 왜 보내시는가", AUDIO_SRC = "doc01_2610241127.mp3", DUR = 709, SEGS = [{"t":"결과를 아시면서 왜 보내시는가: 이사야의 소명과 사명의 성격","s":0,"e":4.921,"p":false,"h":true},{"t":"본문: 이사야 6장 (함께 읽을 본문: 마 13:10-17, 요 12:37-41, 행 28:25-28)","s":6.048,"e":19.964,"p":true,"h":false},{"t":"선지자의 소명 기사는 보통 격려로 끝납니다.","s":20.772,"e":24.016,"p":false,"h":false},{"t":"모세에게는 \"내가 너와 함께 있으리라\"(출 3:12)고 하셨고, 예레미야에게는 \"내가 너와 함께하여 너를 구원하리라\"(렘 1:8)고 하셨습니다.","s":24.66,"e":38.045,"p":false,"h":false},{"t":"그런데 이사야 6장은 다릅니다.","s":38.7,"e":41.196,"p":false,"h":false},{"t":"사명을 맡기시는 말씀이 곧 실패의 예고입니다.","s":41.76,"e":45.179,"p":false,"h":false},{"t":"백성은 듣기는 들어도 깨닫지 못하고 보기는 보아도 알지 못하리라는 것입니다.","s":45.828,"e":51.075,"p":false,"h":false},{"t":"이 장면이 이사야서 전체를 읽는 열쇠인 동시에 가장 큰 걸림돌입니다.","s":51.732,"e":56.751,"p":true,"h":false},{"t":"소명은 왜 여섯 번째 장에 나오는가","s":57.852,"e":60.435,"p":false,"h":true},{"t":"이사야서를 처음 읽는 사람은 소명 기사가 1장이 아니라 6장에 나오는 것에 놀랍니다.","s":61.56,"e":67.336,"p":false,"h":false},{"t":"1장에서 5장까지는 이미 고소장입니다.","s":67.968,"e":70.911,"p":false,"h":false},{"t":"하나님은 자녀를 키웠으나 자녀가 반역했다고 하시고(1:2), 5장에서는 포도원 노래로 판결을 내리십니다.","s":71.532,"e":79.275,"p":false,"h":false},{"t":"좋은 포도를 기대하며 정성을 다했으나 들포도가 열렸으니, 그 이상 \"무엇을 더 할 것이 있느냐\"(5:4)는 말씀입니다.","s":79.884,"e":89.285,"p":true,"h":false},{"t":"이 순서가 중요합니다.","s":90.36,"e":92.102,"p":false,"h":false},{"t":"백성의 완고함은 6장의 소명에서 비로소 시작된 것이 아닙니다.","s":92.736,"e":97.059,"p":false,"h":false},{"t":"이미 있는 완고함을 6장이 하나님의 선고로 확정하는 것입니다.","s":97.704,"e":101.714,"p":false,"h":false},{"t":"6장을 읽을 때는 5장의 포도원을 뒤에 업고 읽어야 합니다.","s":102.384,"e":106.431,"p":false,"h":false},{"t":"그렇지 않으면 하나님이 멀쩡한 백성을 일부러 눈멀게 하시는 것처럼 오해하기 쉽습니다.","s":107.064,"e":112.857,"p":true,"h":false},{"t":"사명 앞에 속죄가 있었다","s":113.94,"e":115.857,"p":false,"h":true},{"t":"장면은 웃시야 왕이 죽던 해, 곧 나라의 한 시대가 저물던 때에 시작됩니다.","s":117,"e":122.778,"p":false,"h":false},{"t":"이사야는 높이 들린 보좌에 앉으신 주님을 봅니다.","s":123.444,"e":126.855,"p":false,"h":false},{"t":"스랍들은 \"거룩, 거룩, 거룩\"을 외치고, 성전은 연기로 가득 찹니다.","s":127.476,"e":134.754,"p":false,"h":false},{"t":"이사야의 반응은 감격이 아니라 파멸의 비명입니다.","s":135.36,"e":138.927,"p":false,"h":false},{"t":"\"화로다 나여, 망하게 되었도다.","s":139.536,"e":142.361,"p":false,"h":false},{"t":"나는 입술이 부정한 사람이요, 입술이 부정한 백성 중에 거주하면서 왕이신 만군의 여호와를 뵈었음이로다\"(6:5).","s":143.028,"e":151.608,"p":true,"h":false},{"t":"이 고백에서 눈여겨볼 대목은 \"입술이 부정한 백성 중에 거주하면서\"입니다.","s":152.604,"e":157.846,"p":false,"h":false},{"t":"이사야는 백성 위에 서서 그들을 정죄하는 재판관이 아닙니다.","s":158.508,"e":162.721,"p":false,"h":false},{"t":"자신도 같은 백성의 일부이고 같은 입술을 가졌습니다.","s":163.332,"e":167.038,"p":false,"h":false},{"t":"그런 그에게 스랍이 제단의 숯불을 입에 대며 \"네 악이 제거되고 네 죄가 사해졌느니라\"고 선언합니다.","s":167.652,"e":174.383,"p":false,"h":false},{"t":"사명은 속죄 뒤에 옵니다.","s":175.032,"e":176.944,"p":false,"h":false},{"t":"전하는 사람은 자기가 먼저 용서받은 죄인으로 서야 합니다.","s":177.588,"e":181.582,"p":false,"h":false},{"t":"이 순서가 이후에 나오는 어두운 사명을 감당할 수 있게 하는 바탕입니다.","s":182.196,"e":186.856,"p":true,"h":false},{"t":"주님이 \"내가 누구를 보내며 누가 우리를 위하여 가겠느냐\" 물으실 때, 이사야는 \"내가 여기 있나이다, 나를 보내소서\" 하고 나섭니다.","s":187.956,"e":197.685,"p":false,"h":false},{"t":"여기서 놓치기 쉬운 사실이 있습니다.","s":198.324,"e":200.866,"p":false,"h":false},{"t":"그는 사명의 내용을 듣기 전에 자원했습니다.","s":201.528,"e":204.557,"p":false,"h":false},{"t":"결과가 어떨지 모르는 채로 보내 달라고 한 것입니다.","s":204.876,"e":208.361,"p":false,"h":false},{"t":"9절의 말씀은 그 뒤에 나옵니다.","s":208.98,"e":211.399,"p":true,"h":false},{"t":"말씀의 내용: 전하되, 그 전함이 굳힘이 된다","s":212.472,"e":216.875,"p":false,"h":true},{"t":"\"가서 이 백성에게 이르기를, 너희가 듣기는 들어도 깨닫지 못하며 보기는 보아도 알지 못하리라 하라.","s":218.052,"e":225.568,"p":false,"h":false},{"t":"너는 이 백성의 마음이 둔하여지며 그 귀가 막히고 눈이 감기게 하라\"(6:9-10).","s":226.224,"e":233.164,"p":false,"h":false},{"t":"이 말씀은 쉽게 풀리지 않습니다.","s":233.712,"e":236.231,"p":false,"h":false},{"t":"히브리어 본문은 \"듣고 또 들으라, 그러나 깨닫지 말라\"처럼 명령형으로 되어 있고, 10절에서 이사야에게 마음을 둔하게 하라고 명하는 동사도 명령형입니다.","s":236.88,"e":247.268,"p":false,"h":false},{"t":"그래서 학자들은 이 구절을 몇 가지로 이해해 왔습니다.","s":247.896,"e":251.502,"p":false,"h":false},{"t":"하나님의 목적으로 보는 이해, 선포가 낳을 결과를 가리킨다고 보는 이해, 이미 굳은 마음을 하나님이 심판으로 더 굳히신다고 보는 이해입니다.","s":252.144,"e":261.441,"p":true,"h":false},{"t":"개혁주의 전통은 대체로 마지막 이해, 곧 심판적 강퍅 쪽에 서 왔습니다.","s":262.476,"e":267.929,"p":false,"h":false},{"t":"5장에서 하나님이 모든 것을 다 하셨는데도 거부한 백성에게, 이제 그 거부를 확정하는 방식으로 말씀이 작용한다는 것입니다.","s":268.488,"e":276.914,"p":false,"h":false},{"t":"출애굽기의 바로가 비슷한 사례입니다.","s":277.56,"e":280.332,"p":false,"h":false},{"t":"하나님이 바로의 마음을 강퍅하게 하시겠다고 미리 말씀하셨고(출 4:21), 본문은 바로가 스스로 마음을 완악하게 했다는 말도 여러 번 합니다(출 8:15, 32).","s":280.98,"e":295.133,"p":false,"h":false},{"t":"주권과 책임이 한 이야기 안에 나란히 놓여 있습니다.","s":295.488,"e":298.817,"p":false,"h":false},{"t":"이 긴장은 다음 물음에서 본문이 어디까지 말하고 어디서 멈추는지를 살피며 따로 다루겠습니다.","s":299.448,"e":305.98,"p":false,"h":false},{"t":"이 자리에서는 하나님이 변덕스럽게 눈을 멀게 하시는 분이 아니라, 이미 닫힌 마음을 심판 가운데 닫아 두시는 분으로 그려진다는 점만 붙들고 가겠습니다.","s":306.612,"e":316.793,"p":true,"h":false},{"t":"그런데 왜 그래도 보내시는가","s":317.88,"e":320.067,"p":false,"h":true},{"t":"이제 처음의 물음으로 돌아옵니다.","s":321.228,"e":323.531,"p":false,"h":false},{"t":"결과가 정해져 있다면 선지자를 보내시는 일은 헛수고가 아닙니까.","s":324.144,"e":328.23,"p":false,"h":false},{"t":"이사야서는 이 물음에 하나의 답이 아니라 여러 겹의 답을 줍니다.","s":328.86,"e":333.355,"p":true,"h":false},{"t":"먼저, 말씀은 설득 기술이 아니라 빛입니다.","s":334.44,"e":338.121,"p":false,"h":false},{"t":"빛은 비치는 것만으로 일을 합니다.","s":338.724,"e":341.346,"p":false,"h":false},{"t":"어둠에 익숙한 눈은 빛 앞에서 눈을 감고, 그것이 바로 그 눈의 상태를 드러냅니다.","s":341.964,"e":348.042,"p":false,"h":false},{"t":"요한은 빛이 세상에 왔으나 사람들이 자기 행위가 악하므로 빛보다 어둠을 더 사랑했다고 말합니다(요 3:19).","s":348.696,"e":357.613,"p":false,"h":false},{"t":"바울도 복음이 구원받는 자에게는 생명의 향기가 되고 망하는 자에게는 사망의 냄새가 된다고 말합니다(고후 2:15-16).","s":358.164,"e":367.791,"p":false,"h":false},{"t":"같은 말씀이 사람의 상태를 따라 다르게 작용합니다.","s":368.388,"e":371.944,"p":false,"h":false},{"t":"선포의 열매는 회개만이 아니라 사람의 실상을 드러내는 것이기도 합니다.","s":372.564,"e":377.404,"p":true,"h":false},{"t":"다음으로, 이사야는 설득자가 아니라 증인입니다.","s":378.468,"e":382.095,"p":false,"h":false},{"t":"에스겔도 같은 처지에서 이런 말씀을 받았습니다.","s":382.716,"e":386.132,"p":false,"h":false},{"t":"그들이 듣든지 아니 듣든지 그들 가운데 선지자가 있음을 알게 하라는 것입니다(겔 2:5).","s":386.784,"e":394.137,"p":false,"h":false},{"t":"말씀이 먼저 선포되어야 백성은 \"몰랐다\"고 말할 수 없고, 심판은 정당해집니다.","s":394.704,"e":400.572,"p":false,"h":false},{"t":"하나님은 아무 예고 없이 치시는 분이 아니라, 수십 년 동안 한 사람을 세워 경고하게 하신 뒤에 치시는 분입니다.","s":401.184,"e":408.35,"p":false,"h":false},{"t":"그 집요함은 비효율이 아니라 심판의 정당성을 쌓는 인내입니다.","s":408.996,"e":413.636,"p":true,"h":false},{"t":"그리고 말씀은 보존됩니다.","s":414.612,"e":416.714,"p":false,"h":false},{"t":"8장 16절에서 이사야는 \"증거의 말씀을 싸매며 율법을 내 제자들 가운데에서 봉함하라\"고 합니다.","s":417.24,"e":423.889,"p":false,"h":false},{"t":"당대에 받아들여지지 않아도 말씀은 제자들 손에 맡겨져 남습니다.","s":424.548,"e":428.928,"p":false,"h":false},{"t":"예언대로 심판이 이루어졌을 때 그 말씀은 하나님이 참으로 말씀하셨다는 증거가 됩니다.","s":429.588,"e":435.821,"p":false,"h":false},{"t":"다니엘이 포로기에 예레미야의 책을 읽고 때를 깨달았다는 기록(단 9:2)은, 선지자가 살아 있을 때 외면당한 말씀이 후대에 다시 읽히며 힘을 얻는 방식을 보여 줍니다.","s":436.464,"e":448.556,"p":false,"h":false},{"t":"이사야서 자체가 그 증거입니다.","s":449.208,"e":451.691,"p":false,"h":false},{"t":"그의 사역은 당대의 눈으로는 실패였으나, 그 말씀이 지금 우리 손에 있습니다.","s":452.34,"e":457.865,"p":true,"h":false},{"t":"또한 이사야서는 55장에서 스스로 이렇게 답합니다.","s":458.964,"e":462.991,"p":false,"h":false},{"t":"비와 눈이 땅을 적셔 싹을 나게 하고 돌아가지 않듯이, 하나님의 입에서 나간 말씀도 헛되이 돌아오지 않고 하나님이 기뻐하시는 바를 이룬다는 것입니다(55:10-11).","s":463.644,"e":476.21,"p":false,"h":false},{"t":"말씀이 이루는 바가 이사야의 기대나 백성의 반응과 같을 필요는 없습니다.","s":476.712,"e":481.577,"p":false,"h":false},{"t":"말씀은 하나님이 보내신 목적을 이룹니다.","s":482.22,"e":485.204,"p":true,"h":false},{"t":"마지막으로, 하나님은 이 사명을 이사야 혼자 지게 하지 않으셨습니다.","s":486.288,"e":491.08,"p":false,"h":false},{"t":"이사야는 판결을 듣고 조용히 받아들이지 않았습니다.","s":491.688,"e":495.52,"p":false,"h":false},{"t":"\"주여 어느 때까지니이까\"(6:11) 하고 되묻습니다.","s":496.152,"e":500.895,"p":false,"h":false},{"t":"선지자는 냉정한 전달자가 아니라 탄식하는 중보자였습니다.","s":501.552,"e":506.012,"p":false,"h":false},{"t":"하나님의 대답은 설명이 아니라 시간표입니다.","s":506.664,"e":509.744,"p":false,"h":false},{"t":"성읍이 황폐하여 사람이 없을 때까지라는 것입니다.","s":510.048,"e":513.615,"p":false,"h":false},{"t":"그러나 이어서 한 줄기 희망이 붙습니다.","s":514.26,"e":516.969,"p":false,"h":false},{"t":"베임을 당한 나무의 그루터기처럼, 남은 것이 있으리라는 약속입니다(6:13).","s":517.572,"e":523.828,"p":false,"h":false},{"t":"이 그루터기가 남은 자의 첫 모습입니다.","s":524.052,"e":527.027,"p":false,"h":false},{"t":"남은 자는 왜 있고 무엇을 위한 것인지는 네 번째 물음에서 따로 다루겠습니다.","s":527.58,"e":533.096,"p":true,"h":false},{"t":"신약은 이 본문을 어떻게 읽는가","s":534.204,"e":536.713,"p":false,"h":true},{"t":"신약에서 이사야 6장 9~10절은 복음서 네 권과 사도행전에 모두 인용됩니다.","s":537.876,"e":543.66,"p":false,"h":false},{"t":"이 본문이 그만큼 중요한 해석의 열쇠였다는 뜻입니다.","s":544.32,"e":548.148,"p":false,"h":false},{"t":"마태복음 13장에서 예수님은 비유로 말씀하시는 이유를 설명하시며 이 구절을 인용하십니다.","s":548.784,"e":555.277,"p":false,"h":false},{"t":"같은 이야기를 듣고도 어떤 사람은 열매를 맺고 어떤 사람은 더 닫힙니다.","s":555.912,"e":561.542,"p":true,"h":false},{"t":"요한복음 12장은 더 깊이 들어갑니다.","s":562.644,"e":565.576,"p":false,"h":false},{"t":"예수님이 많은 표적을 보이셨는데도 사람들이 믿지 않았다고 하며, 요한은 이것을 이사야 53장 1절(\"우리가 전한 것을 누가 믿었느냐\")과 6장 10절로 함께 설명합니다.","s":566.208,"e":578.914,"p":false,"h":false},{"t":"그리고 요한은 놀라운 해석을 덧붙입니다.","s":579.564,"e":582.365,"p":false,"h":false},{"t":"\"이사야가 그의 영광을 보았으므로 그에 대하여 말한 것\"(12:41).","s":582.948,"e":588.215,"p":false,"h":false},{"t":"이사야가 6장에서 본 보좌의 주님이 곧 그리스도라는 말입니다.","s":588.816,"e":593.391,"p":false,"h":false},{"t":"이 해석을 따르면 이사야서는 처음부터 그리스도의 영광을 보고 시작한 책이고, 그를 거부하는 일 또한 이미 본문이 내다본 일입니다.","s":594.036,"e":603.043,"p":false,"h":false},{"t":"그렇다고 책임이 사라지는 것은 아닙니다.","s":603.684,"e":606.482,"p":false,"h":false},{"t":"요한은 같은 자리에서 \"그들이 믿지 아니하니\"라고 분명히 적습니다.","s":607.032,"e":611.585,"p":false,"h":false},{"t":"예언의 성취와 인간의 책임이 나란히 서 있습니다.","s":612.18,"e":615.492,"p":true,"h":false},{"t":"그리고 사도행전은 이 본문으로 끝납니다.","s":616.572,"e":619.55,"p":false,"h":false},{"t":"바울이 로마에서 유대인들에게 말씀을 전했으나 믿는 사람도 있고 믿지 않는 사람도 있었을 때, 그는 성령이 이사야를 통해 하신 말씀이 옳다며 6장 9~10절을 인용하고 이렇게 선언합니다.","s":620.136,"e":633.266,"p":false,"h":false},{"t":"\"이 하나님의 구원이 이방인에게 보내어진 줄을 알라.","s":633.852,"e":637.376,"p":false,"h":false},{"t":"그들은 달게 들으리라\"(행 28:28).","s":638.028,"e":642.256,"p":false,"h":false},{"t":"이사야의 사명이 실패로 끝난 곳에서 열방으로 문이 열립니다.","s":642.708,"e":646.91,"p":false,"h":false},{"t":"이 연결은 열네 번째 물음에서 다시 다루게 됩니다.","s":647.496,"e":651.247,"p":true,"h":false},{"t":"전하는 사람에게 남는 것","s":652.32,"e":654.119,"p":false,"h":true},{"t":"이사야의 소명을 오늘의 말로 옮기면 이렇습니다.","s":655.2,"e":658.548,"p":false,"h":false},{"t":"하나님이 맡기신 사명의 기준은 성공이 아니라 신실함입니다.","s":659.16,"e":663.228,"p":false,"h":false},{"t":"그러나 이 말을 체념으로 읽으면 안 됩니다.","s":663.84,"e":666.806,"p":false,"h":false},{"t":"이사야는 결과를 알고도 자원했고, 탄식했고, 수십 년을 말했고, 마지막까지 말씀을 지켜 후대에 넘겼습니다.","s":667.368,"e":676.144,"p":false,"h":false},{"t":"그는 포기한 사람이 아니라 하나님이 일하시는 방식을 신뢰한 사람입니다.","s":676.8,"e":681.588,"p":false,"h":false},{"t":"말씀은 빛으로, 증거로, 보존된 씨로 일하며, 열매의 때와 방식은 하나님께 있습니다.","s":682.236,"e":689.317,"p":true,"h":false},{"t":"다만 이 사실이 선포하는 사람을 면책해 주지는 않습니다.","s":690.372,"e":694.325,"p":false,"h":false},{"t":"이사야는 먼저 속죄를 받았고, 자기도 부정한 입술의 백성 가운데 산다고 고백한 사람이었습니다.","s":694.908,"e":701.715,"p":false,"h":false},{"t":"보냄을 받은 자는 백성보다 나은 사람이어서가 아니라 용서받은 사람이어서 보냄을 받습니다.","s":702.324,"e":708.179,"p":true,"h":false}], NAV = {"prev":null,"next":{"href":"doc02.html","title":"2. 하나님이 굳히시는가 백성이 굳어지는가"},"list":"index.html"};

    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
