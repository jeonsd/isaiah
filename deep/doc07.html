<style>

  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }

  button:active { transform:scale(.96); }

<script>
(function () {
  const TITLE = "7. 심판과 회복은 왜 번갈아 나오는가", AUDIO_SRC = "doc07_2610241127.mp3", DUR = 943, SEGS = [{"t":"심판과 회복은 왜 번갈아 나오는가: 이사야 24~35장을 읽는 법","s":0,"e":6.229,"p":false,"h":true},{"t":"본문: 이사야 24~35장 (함께 읽을 본문: 사 1:24-27; 4:2-6; 5:1-7; 6:9-13; 40:1-11; 고전 15:54-55; 벧전 2:4-8; 계 21:1-4)","s":7.452,"e":33.018,"p":true,"h":false},{"t":"앞 글에서 열방 신탁을 읽고 나면 독자는 24장에서 다시 한 번 흔들립니다.","s":33.984,"e":39.39,"p":false,"h":false},{"t":"땅이 텅 비고 황폐해지는 장면이 나오는가 싶으면 곧바로 만민을 위한 잔치가 열립니다.","s":40.032,"e":46,"p":false,"h":false},{"t":"28장에서 \"화 있을진저\"가 시작되어 선고가 이어지다가, 어느 틈에 광야에 꽃이 피고 눈먼 자의 눈이 열립니다.","s":46.656,"e":54.662,"p":false,"h":false},{"t":"심판과 구원이 이렇게 짧은 간격으로 오가면 독자는 이 책이 일관성이 있는지 의심하게 됩니다.","s":55.296,"e":61.95,"p":false,"h":false},{"t":"한 하나님이 진노하시다가 달래시다가 하는 것처럼 읽히기 때문입니다.","s":62.568,"e":67.212,"p":false,"h":false},{"t":"이번 물음은 그 오감이 어지러움이 아니라 의도라는 것을 보여 드리는 것입니다.","s":67.824,"e":72.852,"p":true,"h":false},{"t":"열두 장의 짜임","s":73.944,"e":75.452,"p":false,"h":true},{"t":"먼저 이 열두 장의 짜임을 봐 두면 길을 잃지 않습니다.","s":76.608,"e":80.712,"p":false,"h":false},{"t":"24장부터 27장은 땅 전체에 대한 심판과 그 뒤의 잔치, 사망의 소멸을 그립니다.","s":81.36,"e":88.333,"p":false,"h":false},{"t":"학자들은 이 단락을 흔히 \"이사야 소묵시록\"이라 부르는데, 이 이름은 후대 학자들이 붙인 것이고 이 단락이 묵시 문학이라 할 수 있는지에 대해서는 논쟁이 있습니다.","s":88.92,"e":99.913,"p":false,"h":false},{"t":"28장부터 33장까지는 \"화 있을진저\"로 시작하는 선고가 여섯 번 반복되고, 그 사이사이에 회복의 약속이 끼어 있습니다.","s":100.584,"e":109.849,"p":false,"h":false},{"t":"34장과 35장은 한 쌍입니다.","s":110.448,"e":113.304,"p":false,"h":false},{"t":"34장은 열방과 에돔에 대한 심판이고, 35장은 광야가 꽃피는 회복입니다.","s":113.796,"e":120.014,"p":true,"h":false},{"t":"이 가운데 가장 눈에 띄는 것은 28~33장의 되풀이되는 리듬입니다.","s":121.104,"e":126.631,"p":false,"h":false},{"t":"화를 선고하고, 심판을 말하고, 그러다 말씀의 방향이 돌아서서 회복을 말합니다.","s":127.296,"e":133.514,"p":false,"h":false},{"t":"29장은 아리엘, 곧 예루살렘이 포위되는 장면으로 시작해(29:1-14) 17절부터는 레바논이 기름진 밭이 되는 그림으로 넘어갑니다.","s":134.136,"e":145.122,"p":false,"h":false},{"t":"30장은 애굽을 의지하는 패역한 자식들을 책망하다가(30:1-17) 18절에서 돌아섭니다.","s":145.728,"e":153.696,"p":false,"h":false},{"t":"31장의 애굽 의존에 대한 화 다음에는 32장의 공의로운 왕이 옵니다.","s":154.368,"e":159.347,"p":false,"h":false},{"t":"같은 리듬이 세 번 되풀이됩니다.","s":159.984,"e":162.317,"p":true,"h":false},{"t":"돌아서는 자리에 놓인 낱말","s":163.332,"e":165.481,"p":false,"h":true},{"t":"이 되풀이에서 가장 놀라운 것은 돌아서는 자리입니다.","s":166.68,"e":170.447,"p":false,"h":false},{"t":"30장 15절에서 하나님은 \"돌이켜 조용히 하여야 구원을 얻을 것이요 잠잠하고 신뢰하여야 힘을 얻을 것이거늘\" 하셨는데, 곧바로 \"너희가 원하지 아니하였다\"고 하십니다.","s":171.036,"e":182.268,"p":false,"h":false},{"t":"백성은 말을 타고 도망하겠다고 했습니다(30:16).","s":182.916,"e":187.205,"p":false,"h":false},{"t":"여기까지는 심판의 이유입니다.","s":187.74,"e":190.086,"p":false,"h":false},{"t":"그런데 18절이 이렇게 시작합니다.","s":190.368,"e":193.033,"p":false,"h":false},{"t":"\"그러므로 여호와께서 너희에게 은혜 베풀기를 기다리시며.\"","s":193.608,"e":197.259,"p":true,"h":false},{"t":"\"그러므로\"라는 말에 주목하십시오.","s":198.396,"e":200.883,"p":false,"h":false},{"t":"사람의 논리라면 \"그러므로 벌하시리라\"가 와야 합니다.","s":201.528,"e":205.409,"p":false,"h":false},{"t":"그런데 본문은 거절한 백성 앞에서 하나님이 기다리시는 쪽을 택하십니다.","s":206.064,"e":210.97,"p":false,"h":false},{"t":"회복이 시작되는 이유가 백성의 회개에 있지 않고 하나님의 기다림에 있습니다.","s":211.608,"e":217.063,"p":false,"h":false},{"t":"9장의 후렴이 주던 무서움 옆에, 같은 하나님이 은혜 베풀기를 기다리신다는 말이 놓입니다.","s":217.656,"e":223.771,"p":true,"h":false},{"t":"낯선 일","s":224.856,"e":225.874,"p":false,"h":true},{"t":"그렇다면 심판은 하나님의 어떤 일입니까.","s":227.016,"e":229.947,"p":false,"h":false},{"t":"28장 21절에 이상한 표현이 나옵니다.","s":230.256,"e":233.5,"p":false,"h":false},{"t":"하나님이 \"자기의 일을 이루시리니 그의 일이 이상하며 자기의 일을 이루실 것이라 그의 일이 비상하도다\"라는 말씀입니다.","s":234.108,"e":241.805,"p":false,"h":false},{"t":"앞 구절을 보면 이 일이 일어나는 곳이 브라심 산과 기브온 골짜기입니다.","s":242.46,"e":247.485,"p":false,"h":false},{"t":"이 두 곳은 옛날 하나님이 이스라엘을 위해 원수와 싸우셨던 장소입니다(삼하 5:20, 수 10장).","s":248.076,"e":256.614,"p":false,"h":false},{"t":"그 하나님이 이번에는 같은 방식으로 이스라엘을 치시니, 하나님 자신에게도 낯선 일이라는 것입니다.","s":257.148,"e":263.891,"p":false,"h":false},{"t":"많은 학자가 이렇게 읽는데, 어느 쪽이든 심판이 하나님의 본성처럼 상시 일하시는 모습이 아니라 \"낯선 일\"로 불린다는 점은 분명합니다.","s":264.492,"e":273.669,"p":true,"h":false},{"t":"같은 장 뒤쪽의 농부 비유가 이 낯섦에 한계를 정해 줍니다.","s":274.752,"e":278.807,"p":false,"h":false},{"t":"밭 가는 사람이 씨 뿌리려고 종일 갈기만 하겠느냐는 것입니다(28:24).","s":279.468,"e":285.687,"p":false,"h":false},{"t":"농부는 흙을 갈아엎고 이랑을 만들지만 그것으로 끝내지 않고 소회향과 대회향을 심고 밀과 보리를 심습니다.","s":286.236,"e":294.251,"p":false,"h":false},{"t":"곡식도 도리깨와 바퀴로 타작하지만 가루가 되도록 부수지는 않습니다.","s":294.876,"e":299.682,"p":false,"h":false},{"t":"그리고 이 지혜를 농부에게 가르치신 분이 하나님이라고 합니다(28:26, 29).","s":300.24,"e":307.385,"p":false,"h":false},{"t":"갈아엎는 일은 심기 위한 일이고, 때려 부수는 일은 거두기 위한 일입니다.","s":307.944,"e":313.074,"p":false,"h":false},{"t":"이사야서 첫머리에서 하나님이 은 찌꺼기를 녹여 깨끗하게 하겠다고 하신 것(1:25)과 같은 방식입니다.","s":313.632,"e":321.834,"p":false,"h":false},{"t":"심판은 이사야서에서 대개 정화의 모양을 하고 있습니다.","s":322.488,"e":326.256,"p":true,"h":false},{"t":"눈과 귀가 열리는 방식","s":327.348,"e":329.339,"p":false,"h":true},{"t":"여기서 이 시리즈 전체를 지나온 우리가 놓치지 말아야 할 연결이 있습니다.","s":330.408,"e":335.099,"p":false,"h":false},{"t":"6장 9~10절의 눈멂과 귀막힘이 이 열두 장 안에서 풀리는 장면이 세 번 나옵니다.","s":335.7,"e":341.843,"p":false,"h":false},{"t":"29장 18절은 그날에 귀먹은 자가 책의 말씀을 듣고 맹인의 눈이 어둡고 캄캄한 데서 보리라고 합니다.","s":342.504,"e":350.022,"p":false,"h":false},{"t":"32장 3절은 보는 자의 눈이 감기지 않고 듣는 자의 귀가 기울여지리라고 합니다.","s":350.676,"e":356.179,"p":false,"h":false},{"t":"35장 5절은 맹인의 눈이 밝아지고 못 듣는 사람의 귀가 열리리라고 합니다.","s":356.796,"e":361.888,"p":false,"h":false},{"t":"6장의 단어들이 거꾸로 되돌려지는 것입니다.","s":362.52,"e":365.5,"p":false,"h":false},{"t":"이 연결은 제가 읽어 낸 문학적 연결이지만, 쓰인 낱말이 겹치는 점에서 우연으로 보기는 어렵다고 생각합니다.","s":366.12,"e":373.774,"p":true,"h":false},{"t":"이 개방이 누구의 일인지도 봐야 합니다.","s":374.868,"e":377.64,"p":false,"h":false},{"t":"29장 22절부터 24절은 아브라함을 속량하신 여호와께서 야곱의 집을 새롭게 하시고, 마음이 혼미하던 자들이 총명해진다고 합니다.","s":378.288,"e":387.806,"p":false,"h":false},{"t":"32장 15절은 \"마침내 위에서부터 성령을 우리에게 부어 주시리니\"라고 합니다.","s":388.404,"e":393.707,"p":false,"h":false},{"t":"닫힌 눈과 귀가 열리는 것은 백성의 결심 때문이 아니라 위에서 부어지는 영 때문입니다.","s":394.344,"e":400.346,"p":false,"h":false},{"t":"2번 글에서 63장 17절의 기도, 곧 \"우리가 스스로 돌이킬 수 없으니 주께서 돌이켜 주소서\"라는 호소를 보았습니다.","s":400.968,"e":409.471,"p":false,"h":false},{"t":"이 열두 장은 그 기도에 대한 약속의 형태로 답하고 있습니다.","s":410.112,"e":414.318,"p":false,"h":false},{"t":"눈멂은 심판이었으나 마지막은 아닙니다.","s":414.972,"e":417.899,"p":true,"h":false},{"t":"포도원 노래가 다시 불린다","s":418.968,"e":421.119,"p":false,"h":true},{"t":"27장 2절부터 6절은 이 책의 구조를 가장 잘 보여 주는 대목입니다.","s":422.244,"e":427.471,"p":false,"h":false},{"t":"\"그날에 아름다운 포도원이 있으리니 너희는 그것에 대하여 노래하라.\"","s":428.076,"e":432.506,"p":false,"h":false},{"t":"5장에서 들포도가 열려서 하나님이 담을 헐고 구름에게 비를 내리지 말라고 명하신 그 포도원이 여기서 다시 노래로 불립니다.","s":433.188,"e":441.273,"p":false,"h":false},{"t":"이번에는 주인이 때때로 물을 주고 밤낮으로 간수하며 아무도 해치지 못하게 하겠다고 하십니다.","s":441.9,"e":448.158,"p":false,"h":false},{"t":"그리고 이런 말씀이 나옵니다.","s":448.812,"e":450.957,"p":false,"h":false},{"t":"\"내게는 노가 없나니\"(27:4).","s":451.548,"e":454.73,"p":false,"h":false},{"t":"5장에서 포도원을 짓밟게 하신 하나님이 이제는 가시와 찔레와 맞서 싸우겠다고 나서시고, 결국 야곱이 뿌리를 박고 이스라엘이 싹이 나서 열매로 세계에 가득하게 되리라고 하십니다(27:6).","s":455.292,"e":468.995,"p":true,"h":false},{"t":"같은 비유가 심판의 노래로 한 번, 회복의 노래로 한 번 불립니다.","s":470.052,"e":474.721,"p":false,"h":false},{"t":"이사야서에서 심판과 회복은 두 개의 다른 이야기가 아니라 하나의 이야기를 두 번 말하는 방식입니다.","s":475.344,"e":482.261,"p":false,"h":false},{"t":"5장의 노래가 끝난 자리에서 27장의 노래가 시작됩니다.","s":482.904,"e":487.15,"p":true,"h":false},{"t":"돌 하나와 시온의 잔치","s":488.232,"e":490.191,"p":false,"h":true},{"t":"28장 16절은 심판의 선고 한가운데서 갑자기 말합니다.","s":491.436,"e":495.954,"p":false,"h":false},{"t":"\"보라 내가 한 돌을 시온에 두어 기초를 삼았노니 곧 시험한 돌이요 귀하고 견고한 기촛돌이라 그것을 믿는 이는 다급하지 아니하리로다.\"","s":496.512,"e":505.09,"p":false,"h":false},{"t":"앞 구절의 배경이 있습니다.","s":505.728,"e":507.793,"p":false,"h":false},{"t":"15절에서 지도자들은 \"우리가 사망과 언약을 맺고 스올과 맹약하였으니 넘치는 재앙이 지나갈 때에도 우리에게 미치지 못하리라\" 하고 거짓을 피난처로 삼았습니다.","s":508.356,"e":519.435,"p":false,"h":false},{"t":"그 거짓의 피난처와 대비해서 하나님이 놓으신 돌 하나가 있습니다.","s":520.092,"e":524.514,"p":false,"h":false},{"t":"8장에서 하나님이 걸림돌이 되신다고 했던 말씀(8:14)과 이 기촛돌의 말씀이 짝을 이룹니다.","s":525.132,"e":533.222,"p":false,"h":false},{"t":"믿는 사람에게는 기초이고 믿지 않는 사람에게는 걸림이 됩니다.","s":533.844,"e":538.178,"p":false,"h":false},{"t":"신약에서 베드로와 바울이 이 구절을 그리스도에게 적용한 것(벧전 2:6, 롬 9:33)도 이 두 얼굴의 돌에 근거합니다.","s":538.776,"e":549.582,"p":true,"h":false},{"t":"25장 6절부터 8절은 이 시온에서 일어날 일을 보여 줍니다.","s":550.692,"e":555.213,"p":false,"h":false},{"t":"만민을 위한 잔치가 열리고, 사망을 영원히 멸하시며, 모든 얼굴에서 눈물을 닦아 주신다는 약속입니다.","s":555.876,"e":563.382,"p":false,"h":false},{"t":"바울은 고린도전서 15장 54절에서 이 말씀을 부활의 소망으로 인용합니다.","s":564.012,"e":569.408,"p":false,"h":false},{"t":"26장 19절의 \"주의 죽은 자들은 살아나고 그들의 시체들은 일어나리이다\"는 해석이 갈립니다.","s":570.06,"e":576.513,"p":false,"h":false},{"t":"어떤 학자는 에스겔 37장처럼 민족의 회복을 부활의 그림으로 쓴 것이라 보고, 어떤 학자는 몸의 부활을 직접 말한 구절이라 봅니다.","s":577.152,"e":586.383,"p":false,"h":false},{"t":"이 문제는 개혁주의 안에서도 읽기가 갈리므로 한쪽으로 정하지 않겠습니다.","s":587.016,"e":592.226,"p":false,"h":false},{"t":"다만 25장 8절의 사망의 소멸은 신약이 분명히 부활과 연결해 읽었다는 점을 기억해 두십시오.","s":592.884,"e":599.58,"p":true,"h":false},{"t":"왜 이렇게 번갈아 쓰였는가","s":600.588,"e":602.584,"p":false,"h":true},{"t":"이제 처음의 물음으로 돌아가겠습니다.","s":603.756,"e":606.286,"p":false,"h":false},{"t":"이사야서가 심판과 회복을 이렇게 번갈아 쓴 이유를 본문에서 읽어 낼 수 있는 대로 말씀드리겠습니다.","s":606.924,"e":613.392,"p":true,"h":false},{"t":"먼저, 회복이 값싼 위로가 되지 않게 하려는 것으로 보입니다.","s":614.484,"e":618.887,"p":false,"h":false},{"t":"33장 14절에서 시온의 죄인들이 두려워하며 \"우리 중에 누가 능히 삼키는 불을 감당하며 누가 영영히 타는 것 가운데 거하리요\" 하고 묻습니다.","s":619.452,"e":629.244,"p":false,"h":false},{"t":"회복의 약속이 한창 이어지는 가운데에서도 이 두려움은 지워지지 않습니다.","s":629.82,"e":634.989,"p":false,"h":false},{"t":"이 물음에 대한 이 장의 답은 33장 22절입니다.","s":635.616,"e":639.546,"p":false,"h":false},{"t":"여호와는 우리의 재판장이시요 율법을 세우신 이시요 왕이시니 그가 우리를 구원하시리라는 것입니다.","s":640.188,"e":646.942,"p":false,"h":false},{"t":"삼키는 불 앞에서 설 수 있는 이유는 사람이 의로워서가 아니라 재판장이 직접 구원자가 되시기 때문입니다.","s":647.604,"e":654.629,"p":true,"h":false},{"t":"다음은 심판이 절망이 되지 않게 하려는 것입니다.","s":655.632,"e":658.961,"p":false,"h":false},{"t":"심판만 있는 책이라면 읽는 사람은 체념합니다.","s":659.592,"e":663.004,"p":false,"h":false},{"t":"하나님이 \"원하지 아니하였다\"는 대답에도 기다리신다는 사실이 심판의 말씀을 끝까지 읽어 낼 힘을 줍니다.","s":663.336,"e":670.293,"p":true,"h":false},{"t":"마지막으로 이 구조 자체가 가르침이기도 합니다.","s":671.4,"e":674.817,"p":false,"h":false},{"t":"읽는 사람은 두 말씀 사이를 오가면서 하나님이 두 모습을 가진 분이 아니라 한 모습으로 두 일을 하시는 분임을 배웁니다.","s":675.468,"e":683.635,"p":false,"h":false},{"t":"거룩하시기 때문에 죄를 두고 보지 않으시고, 그 같은 거룩하심이 기다리고 새롭게 하시는 사랑으로 나타납니다.","s":684.288,"e":691.314,"p":true,"h":false},{"t":"비평 학자들 가운데는 회복의 대목이 훗날 편집자들에 의해 심판의 말씀 사이에 끼워 넣어진 것이라 보는 이들이 많습니다.","s":692.352,"e":700.055,"p":false,"h":false},{"t":"이 책의 저자와 형성 과정에 대한 논쟁은 9번 글에서 다루겠습니다.","s":700.704,"e":705.435,"p":false,"h":false},{"t":"어느 쪽 입장이든 지금 우리 손에 있는 책의 최종 형태가 심판과 회복을 서로 얽어 놓았다는 점은 같고, 이 시리즈는 그 최종 형태를 읽고 있습니다.","s":706.068,"e":715.865,"p":true,"h":false},{"t":"34장과 35장: 마지막 한 쌍","s":716.976,"e":720.665,"p":false,"h":true},{"t":"이 열두 장은 34장과 35장으로 닫힙니다.","s":721.8,"e":725.509,"p":false,"h":false},{"t":"34장은 모든 나라를 향한 분노로 시작하여 에돔을 대표로 세워 땅이 유황과 역청으로 변하고 영원히 황폐해진다고 합니다.","s":726.156,"e":734.422,"p":false,"h":false},{"t":"34장 8절은 이것을 \"여호와의 보수일이요 시온의 송사를 위하여 갚아 주는 해\"라고 부릅니다.","s":735.048,"e":741.143,"p":false,"h":false},{"t":"현대 독자에게 이 보복의 언어는 불편합니다.","s":741.78,"e":745.155,"p":false,"h":false},{"t":"학자들은 이 장이 에돔 한 나라의 역사적 운명만이 아니라 열방 전체의 심판을 에돔이라는 이름 아래 그린 것이라고 흔히 읽습니다.","s":745.812,"e":754.092,"p":false,"h":false},{"t":"앞 글에서 본 열방 신탁의 연장입니다.","s":754.74,"e":757.681,"p":false,"h":false},{"t":"이 불편함을 매끈하게 풀어 버리려 하지 않겠습니다.","s":758.304,"e":761.508,"p":false,"h":false},{"t":"다만 책이 이 장에서 끝나지 않는다는 점이 중요합니다.","s":762.156,"e":765.826,"p":true,"h":false},{"t":"바로 뒤에 35장이 옵니다.","s":766.908,"e":769.056,"p":false,"h":false},{"t":"광야와 마른 땅이 즐거워하고 사프란처럼 꽃이 피며, 맹인의 눈이 밝아지고, 절뚝발이가 사슴처럼 뛰며, 광야에 물이 솟습니다.","s":769.68,"e":779.501,"p":false,"h":false},{"t":"그리고 거기에 대로가 있어 \"거룩한 길\"이라 불리고, 속량받은 자들이 그 길로 시온에 이르러 슬픔과 탄식이 달아난다고 합니다(35:8-10).","s":780.156,"e":790.722,"p":false,"h":false},{"t":"심판이 먼저 나오고 회복이 마지막에 나오는 이 순서가 이 단락의 결론입니다.","s":791.244,"e":796.662,"p":false,"h":false},{"t":"이 거룩한 길은 40장 3절의 \"광야에서 외치는 자의 소리, 여호와의 길을 예비하라\"로 이어집니다.","s":797.328,"e":804.306,"p":false,"h":false},{"t":"그 이야기는 9번 글에서 하겠습니다.","s":804.96,"e":807.69,"p":true,"h":false},{"t":"그런데 이 35장의 회복도 곧 현실로 돌아옵니다.","s":808.74,"e":812.68,"p":false,"h":false},{"t":"다음 장인 36장은 갑자기 히스기야 때의 산헤립 침공으로 시작합니다.","s":813.276,"e":818.223,"p":false,"h":false},{"t":"약속의 꽃이 핀 광야 바로 다음에 앗수르 군대가 성벽 앞에 서 있습니다.","s":818.82,"e":823.767,"p":false,"h":false},{"t":"왜 이야기가 이렇게 이어지는지는 8번 물음이 됩니다.","s":824.436,"e":828.256,"p":true,"h":false},{"t":"읽기 어려운 곳과 조심할 곳","s":829.368,"e":831.477,"p":false,"h":true},{"t":"이 열두 장을 읽으면서 두 가지를 조심해야 합니다.","s":832.608,"e":836.236,"p":false,"h":false},{"t":"하나는 24장 5절의 \"영원한 언약\"입니다.","s":836.892,"e":840.087,"p":false,"h":false},{"t":"땅이 그 거민 때문에 더러워졌고 그들이 율법을 범하고 영원한 언약을 깨뜨렸다는 말인데, 이 언약이 노아 언약인지 시내산 언약인지, 또는 인류 전체에게 주어진 창조 질서를 가리키는지 학자들이 갈립니다.","s":840.708,"e":855.067,"p":false,"h":false},{"t":"어느 쪽이든 이 심판이 이스라엘의 경계를 넘어 땅 전체에 미친다는 뜻입니다.","s":855.684,"e":861.121,"p":true,"h":false},{"t":"또 하나는 이 단락을 읽으며 현재 사건에서 \"그날\"을 찾아내려는 유혹입니다.","s":862.2,"e":867.71,"p":false,"h":false},{"t":"이사야서에서 \"그날\"은 여러 층으로 쓰입니다.","s":868.356,"e":871.702,"p":false,"h":false},{"t":"곧 닥칠 앗수르의 침공일 수도 있고, 바벨론에 의한 멸망일 수도 있고, 마지막 날일 수도 있습니다.","s":872.316,"e":879.447,"p":false,"h":false},{"t":"본문이 어느 층을 가리키는지는 구절마다 판단해야 하며, 한꺼번에 하나로 묶으면 본문이 말하지 않는 시간표를 만들게 됩니다.","s":880.092,"e":888.199,"p":true,"h":false},{"t":"이 단락이 오늘의 독자에게 말하는 것","s":889.2,"e":891.778,"p":false,"h":true},{"t":"이사야서가 이 열두 장에서 일관되게 요구한 것은 조용한 신뢰입니다.","s":892.908,"e":897.679,"p":false,"h":false},{"t":"30장 15절은 돌이켜 조용히 신뢰하는 것이 구원이라고 하는데, 백성은 말을 타고 도망하겠다고 했습니다.","s":898.308,"e":905.461,"p":false,"h":false},{"t":"심판의 날은 두려움의 날이고, 두려움은 사람을 서두르게 만듭니다.","s":906.084,"e":910.824,"p":false,"h":false},{"t":"이 책은 서두르는 사람에게 멈춰 서서 하나님을 기다리라고 말합니다.","s":911.448,"e":915.863,"p":true,"h":false},{"t":"그리고 이 기다림이 헛되지 않은 까닭을 30장 18절이 이렇게 말합니다.","s":916.92,"e":922.038,"p":false,"h":false},{"t":"기다리시는 분이 먼저 하나님이시라는 것입니다.","s":922.68,"e":925.973,"p":false,"h":false},{"t":"우리가 하나님을 기다리기 전에 하나님이 은혜 베풀기를 기다리고 계십니다.","s":926.568,"e":931.023,"p":false,"h":false},{"t":"심판의 말씀을 듣고 괴로운 사람에게, 이 열두 장은 그 말씀 뒤에 서 있는 분이 낯선 일을 하시다가 곧 본래의 일로 돌아오시는 분임을 알려 줍니다.","s":931.644,"e":941.623,"p":true,"h":false}], NAV = {"prev":{"href":"doc06.html","title":"6. 이방 나라들의 심판이 왜 이스라엘의 책에 들어 있는가"},"next":{"href":"doc08.html","title":"8. 히스기야 이야기는 왜 여기에 놓여 있는가"},"list":"index.html"};

  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
