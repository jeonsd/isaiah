<script>
(function () {
  const TITLE = "9-1. 이사야서는 누가 썼는가", AUDIO_SRC = "9-1_2610241127.mp3", DUR = 738, SEGS = [{"t":"이사야서는 누가 썼는가: 한 책의 경계를 묻다","s":0,"e":3.917,"p":false,"h":true},{"t":"본문: 이사야 1:1; 13:1; 39:5-8; 40:1-11; 44:24-45:13; 56:1-8 (함께 읽을 본문: 사 41:21-29; 46:8-11; 마 3:1-3; 요 12:37-41; 롬 10:16-21)","s":5.04,"e":36.56,"p":true,"h":false},{"t":"앞의 글들은 저자 문제를 세 번 미뤘습니다.","s":37.44,"e":40.593,"p":false,"h":false},{"t":"6번에서는 애굽의 회복을 말하는 19장 끝부분, 7번에서는 심판 사이에 놓인 회복의 대목들, 8번에서는 39장의 바벨론 예고가 그 대상이었습니다.","s":41.256,"e":52.469,"p":false,"h":false},{"t":"이제 피할 수 없습니다.","s":53.136,"e":54.879,"p":false,"h":false},{"t":"40장을 펴면 독자는 갑자기 포로 생활이 끝나가는 백성 앞에 서게 되기 때문입니다.","s":55.476,"e":61.02,"p":false,"h":false},{"t":"이 물음은 학문적 호기심에서 나온 것이 아닙니다.","s":61.524,"e":64.855,"p":false,"h":false},{"t":"40장 이후를 어느 시대의 말씀으로 읽느냐에 따라 \"위로하라\"는 말씀이 누구에게 하는 말인지가 달라집니다.","s":65.412,"e":72.254,"p":false,"h":false},{"t":"그래서 이번 글에서는 논쟁을 공정하게 정리하고, 다음 글(9-2)에서 40장의 위로를 읽겠습니다.","s":72.9,"e":81.616,"p":true,"h":false},{"t":"논쟁은 어떻게 시작되었는가","s":82.656,"e":84.885,"p":false,"h":true},{"t":"이사야서 전체를 8세기 선지자 이사야 한 사람의 작품으로 읽는 것이 오랫동안 유대교와 기독교의 공통된 전통이었습니다.","s":86.004,"e":94.148,"p":false,"h":false},{"t":"12세기 유대인 학자 이븐 에스라가 40장 이후의 시대 배경을 두고 의문을 암시했다고 알려져 있지만, 논쟁이 본격화된 것은 18세기 말 이후입니다.","s":94.716,"e":105.297,"p":false,"h":false},{"t":"40~66장이 이사야 뒤 시대의 다른 인물에게서 나왔다는 주장이 나왔고, 1892년 베른하르트 둠이 이 책을 셋으로 나누는 틀을 세웠습니다.","s":105.984,"e":116.397,"p":false,"h":false},{"t":"1~39장은 8세기 이사야, 40~55장은 바벨론 포로기, 56~66장은 귀환 이후라는 구분입니다.","s":117.036,"e":127.042,"p":false,"h":false},{"t":"이후 학계에서는 \"제1, 제2, 제3 이사야\"라는 이름이 널리 쓰였습니다.","s":127.692,"e":134.832,"p":true,"h":false},{"t":"그런데 이 구분은 경계가 40장에서 딱 끊어지지도 않습니다.","s":135.936,"e":140.389,"p":false,"h":false},{"t":"비평 학자들 가운데는 1~39장 안에서도 13~14장의 바벨론 선고, 24~27장, 34~35장이 후대 것이라고 보는 사람이 많습니다.","s":140.976,"e":153.414,"p":false,"h":false},{"t":"7번 글에서 말씀드린 \"회복의 대목이 훗날 끼워졌다\"는 견해가 이것입니다.","s":154.08,"e":159.06,"p":false,"h":false},{"t":"그래서 문제는 \"40장 이후만 다른 사람인가\"보다 넓습니다.","s":159.66,"e":164.186,"p":false,"h":false},{"t":"이 책이 한 사람에게서 나왔는가, 아니면 여러 세대에 걸쳐 자란 책인가 하는 물음입니다.","s":164.808,"e":171.008,"p":true,"h":false},{"t":"6번 글에서 본 19장 16~25절, 곧 애굽과 앗수르가 하나님의 백성이라 불리는 대목도 같은 논쟁에 들어 있습니다.","s":172.08,"e":180.962,"p":false,"h":false},{"t":"이 단락을 이사야 당대의 것으로 보는 학자도 있고, 열방에 대한 기대가 커진 후대의 것으로 보는 학자도 있습니다.","s":181.62,"e":188.98,"p":false,"h":false},{"t":"본문 안에 시대를 밝히는 표지가 분명하지 않아 읽기가 갈립니다.","s":189.612,"e":193.842,"p":false,"h":false},{"t":"이 시리즈는 어느 쪽이든, 이 단락이 책의 최종 형태 안에서 열방의 구원을 미리 보이는 일을 읽습니다.","s":194.472,"e":201.541,"p":true,"h":false},{"t":"나누어 보는 쪽이 드는 근거","s":202.644,"e":204.697,"p":false,"h":true},{"t":"첫째는 역사적 정황입니다.","s":205.884,"e":208.076,"p":false,"h":false},{"t":"1~39장의 배경은 앗수르입니다.","s":208.692,"e":211.723,"p":false,"h":false},{"t":"40장 이후에서는 앗수르가 거의 사라지고 바벨론이 무대에 있습니다(43:14; 47장; 48:20).","s":212.328,"e":222.169,"p":false,"h":false},{"t":"예루살렘은 폐허이고(44:26) 백성은 포로로서 해방을 기다립니다.","s":222.408,"e":228.598,"p":false,"h":false},{"t":"선지자는 대체로 자기 시대 청중에게 말씀한다는 원칙을 따르면, 이런 말씀은 포로기 사람에게 주어진 것으로 읽는 편이 자연스럽다는 것입니다.","s":229.212,"e":238.372,"p":true,"h":false},{"t":"둘째는 고레스라는 이름입니다.","s":239.4,"e":241.741,"p":false,"h":false},{"t":"44장 28절과 45장 1절은 이방 왕을 이름으로 부릅니다.","s":242.352,"e":247.083,"p":false,"h":false},{"t":"이사야는 주전 8세기 사람이고 고레스가 바벨론을 정복한 것은 주전 539년이니, 약 150년 앞서 이름을 불렀다는 말이 됩니다.","s":247.716,"e":257.709,"p":false,"h":false},{"t":"성경 선지서에서 이런 예는 드물다는 점이 근거로 쓰입니다.","s":258.336,"e":262.406,"p":true,"h":false},{"t":"셋째는 이름의 부재입니다.","s":263.484,"e":265.509,"p":false,"h":false},{"t":"1~39장에는 이사야의 이름이 여러 번 나오지만 40~66장에는 한 번도 나오지 않습니다.","s":266.04,"e":273.375,"p":false,"h":false},{"t":"넷째는 어휘와 문체, 신학 강조점의 차이입니다.","s":274.032,"e":278.134,"p":false,"h":false},{"t":"40장 이후는 창조와 우상 논쟁, 위로의 어조가 짙고, 1~39장의 선고 중심 어조와 다르다는 것입니다.","s":278.712,"e":287.415,"p":true,"h":false},{"t":"한 사람의 책으로 보는 쪽이 드는 근거","s":288.504,"e":291.148,"p":false,"h":true},{"t":"이 입장의 첫째 근거는 책 전체를 꿰는 연결입니다.","s":292.212,"e":296.019,"p":false,"h":false},{"t":"이 시리즈에서 우리가 이미 본 것만 해도 적지 않습니다.","s":296.568,"e":300.424,"p":false,"h":false},{"t":"하나님을 \"이스라엘의 거룩하신 이\"라 부르는 독특한 칭호는 이사야서 전체에 걸쳐 스무 번 넘게 나오고 다른 책에서는 드뭅니다.","s":300.96,"e":309.666,"p":false,"h":false},{"t":"눈멂과 귀막힘의 주제가 6장에서 시작해 29장, 32장, 35장을 거쳐 42장과 43장에서 이어집니다.","s":310.284,"e":319.628,"p":false,"h":false},{"t":"시온, 남은 자, 그루터기에서 난 싹, 만군의 여호와의 열심 같은 낱말들이 책의 양쪽에 모두 나옵니다.","s":320.256,"e":328.746,"p":false,"h":false},{"t":"5번 글과 7번 글에서 본 포도원 노래와 그 회복도 그런 사례입니다.","s":329.328,"e":334.01,"p":false,"h":false},{"t":"둘째 근거는 책의 구조입니다.","s":334.548,"e":336.867,"p":false,"h":false},{"t":"39장의 바벨론 예고가 40장의 위로를 부르도록 짜여 있다는 점은 8번에서 보았습니다.","s":337.5,"e":343.74,"p":true,"h":false},{"t":"셋째는 전승입니다.","s":344.844,"e":346.487,"p":false,"h":false},{"t":"사해 사본의 이사야 두루마리는 1~66장을 한 두루마리에 이어서 필사해 두었고, 외경 집회서 48장도 이사야를 시온의 슬퍼하는 자를 위로한 선지자로 기억합니다.","s":347.112,"e":358.66,"p":false,"h":false},{"t":"넷째는 신약입니다.","s":359.352,"e":360.924,"p":false,"h":false},{"t":"세례 요한을 40장 3절과 연결하는 마태복음 3장, 6장 10절과 53장 1절을 한자리에서 \"이사야\"의 말로 인용하는 요한복음 12장 37절부터 41절, 65장 1절을 \"이사야\"의 말로 인용하는 로마서 10장 20절이 있습니다.","s":361.512,"e":379.322,"p":false,"h":false},{"t":"그러니 신약 저자들은 책의 양쪽을 한 선지자의 이름으로 불렀다는 것입니다.","s":379.98,"e":384.897,"p":false,"h":false},{"t":"이에 대해 반대편은 신약의 \"이사야\"가 저자를 판정한 말이 아니라 책의 이름일 뿐이라고 답합니다.","s":385.524,"e":392.179,"p":true,"h":false},{"t":"다섯째는 40~48장의 논증 구조입니다.","s":393.3,"e":397.169,"p":false,"h":false},{"t":"이 단락에서 하나님은 우상과 자신을 구별하는 기준을 \"앞일을 미리 말씀하심\"에 두십니다(41:21-29; 44:7; 46:10; 48:3-5).","s":397.764,"e":412.16,"p":false,"h":false},{"t":"이 논증은 선포가 사건보다 앞섰다는 전제 위에 서 있다는 것입니다.","s":412.776,"e":417.444,"p":false,"h":false},{"t":"이에 대해 반대편은, 이 논증은 청중이 이미 시작된 고레스의 등장을 보고 있는 상황에서 오히려 더 강력해진다고 답합니다.","s":417.996,"e":426.186,"p":true,"h":false},{"t":"각 입장이 답해야 하는 것","s":427.284,"e":429.143,"p":false,"h":true},{"t":"공정하게 보려면 양쪽 모두 풀어야 할 숙제가 있음을 말해야 합니다.","s":430.236,"e":434.681,"p":false,"h":false},{"t":"나누어 보는 쪽은 책 전체를 꿰는 어휘와 주제의 연결이 왜 이렇게 촘촘한지를 설명해야 합니다.","s":435.348,"e":441.778,"p":false,"h":false},{"t":"보통 \"이사야의 제자들이 그의 전통 안에서 이어 썼다\"는 이사야 학파 가설로 답하는데, 그러면 한 사람의 저작이라는 말과 실제로 큰 차이가 없다는 반론이 따릅니다.","s":442.404,"e":453.301,"p":false,"h":false},{"t":"또 한 위대한 선지자의 이름이 전혀 남지 않은 채 이사야서에 섞였다는 점도 설명이 필요합니다.","s":453.96,"e":460.182,"p":true,"h":false},{"t":"한 사람으로 보는 쪽은 40장 이후의 말씀이 포로기 사람에게 하듯 쓰인 이유를 설명해야 합니다.","s":461.268,"e":467.198,"p":false,"h":false},{"t":"보통 이사야가 환상 가운데 미래의 백성 자리에 서서 말했다고 답합니다.","s":467.784,"e":472.737,"p":false,"h":false},{"t":"이 설명은 성경 안에서 가능하지만, 선지자가 일차 청중 없이 150년 뒤의 사람에게 말했다는 점이 걸리는 사람이 많습니다.","s":473.4,"e":481.713,"p":false,"h":false},{"t":"또 문체와 어휘 차이가 장르와 주제 차이만으로 충분히 설명되는지도 논쟁이 계속됩니다.","s":482.328,"e":488.357,"p":true,"h":false},{"t":"한편 이 문제에는 중간 입장도 있습니다.","s":489.456,"e":492.553,"p":false,"h":false},{"t":"편집 과정이 있었더라도 우리가 가진 최종 형태가 하나의 의도된 책이라는 점을 강조하는 읽기입니다.","s":493.2,"e":499.935,"p":false,"h":false},{"t":"정경적 접근이라 불리는 이 방식은 저자가 누구인가보다 이 책이 지금의 순서로 무엇을 말하는가를 묻습니다.","s":500.58,"e":507.908,"p":false,"h":false},{"t":"개혁주의 전통에서는 에드워드 영, 알렉 모티어, 존 오스왈트 같은 학자들이 단일 저자를 옹호해 온 것으로 압니다.","s":508.428,"e":516.757,"p":true,"h":false},{"t":"무엇이 달라지고 무엇이 달라지지 않는가","s":517.86,"e":520.93,"p":false,"h":true},{"t":"이 논쟁을 읽을 때는 달라지는 것과 달라지지 않는 것을 구분해야 합니다.","s":522.108,"e":526.913,"p":true,"h":false},{"t":"달라지지 않는 것이 많습니다.","s":528.012,"e":530.084,"p":false,"h":false},{"t":"우리가 손에 쥔 책이 하나님의 말씀이라는 확신은 저자가 몇 사람이든 같습니다.","s":530.712,"e":535.754,"p":false,"h":false},{"t":"이 시리즈가 읽고 있는 것은 최종 형태이고, 앞선 글들의 읽기(6장과 29장의 연결, 5장과 27장의 짝, 39장과 40장의 이음)는 어느 입장에서도 유지됩니다.","s":536.4,"e":550.303,"p":false,"h":false},{"t":"책 전체가 심판에서 위로로 가는 한 방향의 구조라는 점도 같습니다.","s":550.836,"e":555.141,"p":true,"h":false},{"t":"달라지는 것은 두 가지입니다.","s":556.2,"e":558.354,"p":false,"h":false},{"t":"하나는 40장 이후를 누구의 눈높이로 읽느냐입니다.","s":558.936,"e":562.533,"p":false,"h":false},{"t":"단일 저자로 읽으면 8세기의 이사야가 아직 오지 않은 포로기를 내다보고 미리 위로하는 것이고, 포로기 선지자로 읽으면 이미 포로로 사는 사람에게 위로를 전하는 것입니다.","s":563.148,"e":574.067,"p":false,"h":false},{"t":"이것이 9-2에서 다룰 \"아직 오지 않은 귀환을 왜 미리 위로하시는가\"의 물음에 직접 걸립니다.","s":574.74,"e":581.5,"p":false,"h":false},{"t":"다른 하나는 예언을 어떻게 이해하느냐입니다.","s":582.12,"e":585.039,"p":false,"h":false},{"t":"하나님이 이름까지 미리 불러 예언하실 수 있다고 보느냐, 선지자는 자기 시대의 사람에게 말한다는 원칙을 우선하느냐의 차이입니다.","s":585.612,"e":594.143,"p":false,"h":false},{"t":"이 문제는 문헌 증거만으로 결정되지 않고 성경 영감과 예언에 대한 신학적 전제가 함께 작용합니다.","s":594.756,"e":601.823,"p":false,"h":false},{"t":"양쪽 모두 이 점을 인정할 때 논쟁이 정직해집니다.","s":602.46,"e":606.388,"p":true,"h":false},{"t":"제 판단","s":607.428,"e":608.382,"p":false,"h":true},{"t":"여기서는 제 판단을 구분해서 말씀드리겠습니다.","s":609.516,"e":612.869,"p":false,"h":false},{"t":"문체와 어휘의 차이만으로 저자를 가르는 논증은 장르와 주제가 달라서 생긴 차이로도 설명될 수 있어 결정적이지 않다고 봅니다.","s":613.512,"e":621.828,"p":false,"h":false},{"t":"반대로 고레스의 이름 하나로 단일 저자를 증명하는 것도 충분하지 않습니다.","s":622.476,"e":627.548,"p":false,"h":false},{"t":"이름을 미리 부르는 일이 가능하다고 믿는 사람은 그것을 하나님의 주권으로 읽겠지만, 이는 증거에서 나온 결론이 아니라 전제에서 나온 결론이기 때문입니다.","s":628.164,"e":638.276,"p":true,"h":false},{"t":"제가 더 무겁게 보는 것은 책의 구성적 통일성입니다.","s":639.288,"e":643.086,"p":false,"h":false},{"t":"6장에서 닫힌 눈과 귀, 5장의 포도원, 8장의 걸림돌과 기촛돌, 7장의 아하스와 36장의 히스기야, 39장과 40장의 이음이 이렇게 촘촘히 맞물린다는 사실은, 한 사람의 작품이든 한 전통이 의도적으로 엮은 작품이든 이 책이 하나로 읽히기를 의도했다는 증거입니다.","s":643.716,"e":665.122,"p":false,"h":false},{"t":"그래서 이 앱은 개혁주의 전통의 단일 저자 입장을 기본 전제로 읽되, 다른 입장을 가진 독자도 같은 방식으로 읽을 수 있도록 40장 이후의 해설을 쓰겠습니다.","s":665.748,"e":676.619,"p":false,"h":false},{"t":"이것이 이 시리즈를 쓰는 방식에 대한 제 제안이며, 정설을 선언하는 것은 아닙니다.","s":677.268,"e":682.933,"p":true,"h":false},{"t":"읽는 사람에게 남는 것","s":684.036,"e":685.75,"p":false,"h":true},{"t":"저자 논쟁을 듣고 마음이 불편해지는 분이 있을 것입니다.","s":686.736,"e":690.943,"p":false,"h":false},{"t":"이 논쟁이 성경의 권위를 흔드는 것처럼 느껴지기 때문입니다.","s":691.56,"e":695.541,"p":false,"h":false},{"t":"그러나 이 논쟁의 어느 편에서도 이사야서가 하나님의 말씀이라는 고백을 부인하지 않는 학자가 많다는 점은 알아 두시길 권합니다.","s":696.096,"e":704.477,"p":false,"h":false},{"t":"문제는 하나님이 이 말씀을 어떤 방식으로 주셨는가에 있고, 그 방식을 둘러싼 견해 차이가 말씀 자체의 무게를 바꾸지는 않습니다.","s":705.096,"e":714.036,"p":true,"h":false},{"t":"그리고 이 논쟁을 겪으며 읽는 사람이 붙들 것은 오히려 이사야서가 스스로 하는 말입니다.","s":715.104,"e":721.297,"p":false,"h":false},{"t":"40장 8절은 풀은 마르고 꽃은 시들지만 우리 하나님의 말씀은 영원히 서리라고 합니다.","s":721.944,"e":728.168,"p":false,"h":false},{"t":"누가 어느 시대에 썼든, 이 말씀이 포로가 된 사람들을 일으켜 세운 말씀이었다는 사실이 이 책의 가장 단단한 증거입니다.","s":728.748,"e":736.963,"p":true,"h":false}], NAV = {"prev":{"href":"doc08.html","title":"8. 히스기야 이야기는 왜 여기에 놓여 있는가"},"next":{"href":"9-2.html","title":"9-2. 아직 오지 않은 귀환을 왜 미리 위로하시는가"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {

    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
