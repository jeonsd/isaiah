<script>
(function () {
  const TITLE = "14. 이스라엘의 불순종과 열방의 구원은 어떻게 이어지는가", AUDIO_SRC = "doc14_2610241127.mp3", DUR = 880, SEGS = [{"t":"이스라엘의 불순종과 열방의 구원은 어떻게 이어지는가: 이사야서가 그리는 만민의 길","s":0,"e":6.344,"p":false,"h":true},{"t":"본문: 이사야 2:2-4; 19:16-25; 25:6-9; 42:1-7; 45:14-25; 49:1-6; 56:1-8; 60:1-14; 65:1-2; 66:18-24 (함께 읽을 본문: 창 12:1-3; 왕상 8:41-43; 욘 4:10-11; 마 21:12-13; 행 13:44-48; 28:23-28; 롬 9:25-26; 10:19-21; 11:11-32; 엡 2:11-22)","s":7.164,"e":60.935,"p":true,"h":false},{"t":"앞 글들에서 이 물음은 두 번 미뤄졌습니다.","s":61.848,"e":65.017,"p":false,"h":false},{"t":"6번에서는 애굽을 \"나의 백성\"이라 부르는 장면을, 10번에서는 고레스 이후 열방이 이스라엘에게 와서 \"하나님이 너희 중에 계시다\"고 말하는 장면을 보았습니다.","s":65.664,"e":76.461,"p":false,"h":false},{"t":"13번은 책의 끝에서 이스라엘의 탄식이 계속되는 것을 보았고, 65장 1~2절의 부르는 손을 예고했습니다.","s":77.112,"e":85.093,"p":false,"h":false},{"t":"이제 이 물음을 정면으로 다룹니다.","s":85.752,"e":88.246,"p":false,"h":false},{"t":"이스라엘은 거듭 불순종했는데, 왜 이 책은 열방의 구원을 그렇게 크게 말하는가.","s":88.848,"e":94.786,"p":false,"h":false},{"t":"둘은 서로 이어지는가, 아니면 이스라엘이 밀려나고 열방이 그 자리를 차지하는가.","s":95.4,"e":101.27,"p":true,"h":false},{"t":"책의 처음과 끝에 놓인 같은 그림","s":102.312,"e":104.914,"p":false,"h":true},{"t":"이 주제는 곁가지가 아니라 책의 뼈대입니다.","s":106.056,"e":109.169,"p":false,"h":false},{"t":"2장 2절부터 4절은 \"말일에\" 모든 민족이 여호와의 산으로 몰려와 \"그의 길을 우리에게 가르치시리니\"라고 하고, 칼을 쳐서 보습을 만든다고 합니다.","s":109.8,"e":119.985,"p":false,"h":false},{"t":"66장 18절부터 21절은 같은 그림으로 책을 닫습니다.","s":120.636,"e":125.352,"p":false,"h":false},{"t":"하나님이 모든 나라와 언어의 사람들을 모으시고, 그들이 하나님의 영광을 보며, 열방 가운데서 일부를 제사장과 레위인으로 삼으시겠다고 합니다.","s":125.892,"e":135.363,"p":false,"h":false},{"t":"처음 비전과 마지막 비전이 같은 방향을 가리킵니다.","s":136.008,"e":139.45,"p":false,"h":false},{"t":"이 틀 사이에서 이스라엘의 실패와 종의 고난이 일어납니다.","s":140.112,"e":144.194,"p":false,"h":false},{"t":"열방의 구원은 이스라엘의 실패 뒤에 덧붙은 보상책이 아니라, 책이 처음부터 향하던 목적지로 읽힙니다.","s":144.828,"e":152.021,"p":true,"h":false},{"t":"이스라엘의 사명은 처음부터 열방을 향해 있었다","s":153.108,"e":156.523,"p":false,"h":true},{"t":"이 방향은 아브라함에게 하신 약속, 곧 \"땅의 모든 족속이 너로 말미암아 복을 얻을 것이라\"(창 12:3)와 이어집니다.","s":157.644,"e":167.337,"p":false,"h":false},{"t":"이사야서에서 이 사명은 종의 노래에서 가장 분명합니다.","s":168.012,"e":172.29,"p":false,"h":false},{"t":"42장 6절은 종을 \"백성의 언약과 이방의 빛\"으로 세운다고 하고, 49장 6절은 야곱의 지파를 일으키는 일은 \"오히려 가벼운 일\"이며 이방의 빛이 되어 땅 끝까지 구원을 이르게 하리라고 합니다.","s":172.872,"e":186.189,"p":false,"h":false},{"t":"11번 글에서 본 대로 이 사명은 이스라엘이 감당하지 못하고 한 종이 대신 이루는 일로 그려집니다.","s":186.876,"e":193.93,"p":true,"h":false},{"t":"여기서 이 글의 물음에 첫 답이 나옵니다.","s":195.012,"e":197.852,"p":false,"h":false},{"t":"이스라엘의 불순종은 열방 구원의 길을 막지 못했고, 오히려 그 길이 어떤 분을 통해 열리는지를 드러냈습니다.","s":198.468,"e":206.078,"p":false,"h":false},{"t":"이스라엘이 빛이 되지 못했기에 빛이 되실 분이 오십니다.","s":206.712,"e":210.272,"p":false,"h":false},{"t":"불순종과 열방의 구원은 대립이 아니라, 하나님이 실패한 사명을 직접 맡아 이루신다는 한 이야기의 두 면입니다.","s":210.888,"e":218.437,"p":false,"h":false},{"t":"이것은 책의 구조를 따라 읽은 제 종합입니다.","s":219.096,"e":222.387,"p":true,"h":false},{"t":"열방은 어떤 자리로 들어오는가","s":223.344,"e":225.562,"p":false,"h":true},{"t":"열방이 들어오는 모습이 책 안에서 한 가지로 그려지지는 않습니다.","s":226.728,"e":231.059,"p":false,"h":false},{"t":"몇 가지를 구분해서 보겠습니다.","s":231.696,"e":233.828,"p":true,"h":false},{"t":"먼저 굴복하고 찾아오는 열방의 그림이 있습니다.","s":234.936,"e":238.39,"p":false,"h":false},{"t":"45장 14절은 애굽과 구스의 재물이 이스라엘에게 오고 그들이 엎드려 \"하나님이 과연 너희 중에 계시다\"고 말한다고 하고, 60장은 열방이 빛을 향해 오며 그 재물을 가져온다고 합니다.","s":239.04,"e":251.896,"p":false,"h":false},{"t":"이 그림은 이스라엘 중심의 언어로 읽힙니다.","s":252.54,"e":255.728,"p":false,"h":false},{"t":"그러나 이것을 이스라엘의 우월로만 읽으면 45장 22절의 \"땅 끝의 모든 사람아 나를 앙망하라 그리하면 구원을 받으리라\"를 놓칩니다.","s":256.32,"e":265.787,"p":false,"h":false},{"t":"열방이 향하는 곳은 이스라엘이 아니라 이스라엘 중에 계신 하나님입니다.","s":266.436,"e":271.33,"p":true,"h":false},{"t":"다음으로 동등하게 이름을 받는 열방의 그림이 있습니다.","s":272.448,"e":276.051,"p":false,"h":false},{"t":"6번 글에서 본 19장 24절부터 25절이 가장 놀랍습니다.","s":276.696,"e":281.536,"p":false,"h":false},{"t":"애굽은 \"나의 백성\", 앗수르는 \"나의 손으로 지은\", 이스라엘은 \"나의 기업\"으로 불립니다.","s":282.168,"e":289.087,"p":false,"h":false},{"t":"56장 3절부터 8절은 이방인과 고자가 하나님의 집에서 \"아들과 딸보다 나은 이름\"을 받는다고 합니다.","s":289.728,"e":297.056,"p":false,"h":false},{"t":"혈통의 경계로 막혀 있던 사람들이 은혜로 들어옵니다.","s":297.72,"e":301.373,"p":false,"h":false},{"t":"4번 글에서 본 대로 남은 자의 선이 혈통에서 은혜로 옮겨 가는 모습과 같습니다.","s":301.968,"e":307.172,"p":true,"h":false},{"t":"마지막으로 섬기는 자리로 부름받는 열방의 그림이 있습니다.","s":308.268,"e":312.246,"p":false,"h":false},{"t":"66장 21절에서 열방 가운데서 제사장과 레위인이 나옵니다.","s":312.84,"e":317.51,"p":false,"h":false},{"t":"이 구절은 이스라엘 가운데서 나온다는 읽기도 있고 열방 가운데서 나온다는 읽기도 있어서, 학자들 사이에 갈립니다.","s":318.168,"e":326.171,"p":false,"h":false},{"t":"히브리어 문장이 둘 다 가능하다는 지적이 있는데, 저는 확인하지 못했으므로 원어 성경으로 대조하시길 권합니다.","s":326.808,"e":334.418,"p":false,"h":false},{"t":"어느 쪽이든 제사장직이 한 혈통에 닫혀 있지 않다는 방향은 분명하다고 봅니다.","s":335.088,"e":340.017,"p":false,"h":false},{"t":"이것은 제 판단입니다.","s":340.668,"e":342.566,"p":true,"h":false},{"t":"65장 1~2절: 부르는 손","s":343.62,"e":346.974,"p":false,"h":true},{"t":"13번 글에서 미룬 구절입니다.","s":348.048,"e":350.404,"p":false,"h":false},{"t":"65장 1절은 \"나는 내게 구하지 아니하던 자에게 물음을 받았으며 나를 찾지 아니하던 자에게 찾아냄을 입었노라 내 이름을 부르지 아니하던 나라에게 내가 여기 있노라 내가 여기 있노라 하였노라\"고 합니다.","s":350.712,"e":364.314,"p":false,"h":false},{"t":"2절은 이어서 \"순종하지 아니하고 자기 생각대로 옳지 않은 길을 걸어가는 패역한 백성\"에게 \"종일 내 손을 폈다\"고 합니다.","s":364.968,"e":373.147,"p":true,"h":false},{"t":"이 두 절의 배치가 중요합니다.","s":374.256,"e":376.538,"p":false,"h":false},{"t":"열방에게 \"내가 여기 있노라\"고 하시는 말씀과, 이스라엘에게 종일 손을 펴셨다는 말씀이 나란히 있습니다.","s":377.208,"e":384.505,"p":false,"h":false},{"t":"9장에서 네 번 반복된 후렴의 \"펴진 손\"이 심판의 손이었다면, 여기서 손은 부르는 손입니다.","s":385.164,"e":391.747,"p":false,"h":false},{"t":"같은 하나님이 같은 손으로 열방도 부르시고 이스라엘도 부르십니다.","s":392.328,"e":397.013,"p":false,"h":false},{"t":"바울은 로마서 10장 20절부터 21절에서 이 두 구절을 나누어 인용하며 앞 구절은 이방인에게, 뒤 구절은 이스라엘에게 적용합니다.","s":397.656,"e":407.478,"p":false,"h":false},{"t":"이 인용이 본문의 원래 대상, 곧 1절의 \"나를 찾지 아니하던 자\"가 누구를 가리키는가에 대한 해석과 맞는지는 학자들 사이에 논쟁이 있습니다.","s":408.132,"e":417.799,"p":false,"h":false},{"t":"일부는 1절도 이스라엘 가운데 불순종하는 자를 가리킨다고 읽습니다.","s":418.464,"e":423.169,"p":false,"h":false},{"t":"이 점은 정하지 않겠습니다.","s":423.828,"e":425.856,"p":false,"h":false},{"t":"어느 읽기든 2절의 \"종일 손을 폈다\"는 말이 이스라엘에게 하나님의 인내가 끝나지 않았음을 말한다는 점은 같습니다.","s":426.492,"e":433.547,"p":true,"h":false},{"t":"열방의 구원은 이스라엘이 버려졌다는 뜻인가","s":434.664,"e":437.983,"p":false,"h":true},{"t":"이 물음이 이 글에서 가장 무겁습니다.","s":439.2,"e":442.055,"p":false,"h":false},{"t":"이스라엘이 불순종하는 동안 열방이 들어온다면, 이스라엘은 자리를 내준 것인가.","s":442.656,"e":448.341,"p":false,"h":false},{"t":"사도행전 28장의 바울이 이 물음을 극적으로 보여 줍니다.","s":448.992,"e":453.234,"p":false,"h":false},{"t":"바울이 로마에서 유대인에게 말씀을 전했으나 믿는 사람도 있고 믿지 않는 사람도 있자, 이사야 6장 9~10절을 인용하며 \"이 하나님의 구원이 이방인에게 보내어진 줄을 알라\"(행 28:28)고 합니다.","s":453.816,"e":470.219,"p":false,"h":false},{"t":"1번 글에서 본 대로 이사야의 사명이 실패로 끝난 곳에서 열방으로 문이 열린 것입니다.","s":470.844,"e":476.762,"p":true,"h":false},{"t":"로마서 9장부터 11장은 이 물음에 대한 바울의 길고 신중한 답입니다.","s":477.828,"e":482.931,"p":false,"h":false},{"t":"11장 1절에서 바울은 \"하나님이 그의 백성을 버리셨느냐 그럴 수 없느니라\"고 하고, 자신이 이스라엘 사람임을 증거로 듭니다.","s":483.552,"e":491.983,"p":false,"h":false},{"t":"이어서 이스라엘의 일부가 우둔해진 것이 이방인의 충만한 수가 들어오기까지이고(11:25), 이방인이 들어오는 것이 이스라엘을 시기하게 하려는 것이라고 합니다(11:11).","s":492.624,"e":505.592,"p":false,"h":false},{"t":"그리고 11장 26절에서 \"온 이스라엘이 구원을 얻으리라\"고 하고 이사야 59장 20절부터 21절을 인용합니다.","s":506.124,"e":514.718,"p":false,"h":false},{"t":"13번 글에서 본 그 구절입니다.","s":515.304,"e":517.797,"p":false,"h":false},{"t":"이 \"온 이스라엘\"을 어떻게 읽을지는 4번 글에서 세 갈래로 소개했고, 개혁주의 안에서도 갈리는 문제여서 여기서도 정하지 않겠습니다.","s":518.076,"e":527.382,"p":false,"h":false},{"t":"다만 세 읽기 모두 바울이 이 논의를 하나님의 긍휼을 찬양하는 송영으로 맺었다는 점(11:33-36)을 존중합니다.","s":528.048,"e":537.354,"p":true,"h":false},{"t":"이사야서 안에서 이 물음에 대한 답의 방향은 분명하다고 봅니다.","s":538.452,"e":542.534,"p":false,"h":false},{"t":"열방이 들어오는 것은 이스라엘을 밀어내는 일로 그려지지 않고, 오히려 이스라엘이 회복되는 일과 함께 일어납니다.","s":543.132,"e":550.922,"p":false,"h":false},{"t":"49장 5절부터 6절에서 종은 야곱을 돌아오게 하는 일과 이방의 빛이 되는 일을 둘 다 맡고, 60장에서 열방이 오는 곳은 회복된 시온이며, 66장 20절은 열방이 이스라엘의 형제들을 하나님께 예물로 데려온다고 합니다.","s":551.556,"e":567.2,"p":false,"h":false},{"t":"이 구절들이 보여 주는 것은 교체가 아니라 확장입니다.","s":567.864,"e":571.649,"p":false,"h":false},{"t":"이것은 제 읽기이고, 이 확장이 민족 이스라엘의 장차 회복을 포함하는지는 앞서 말한 대로 갈리는 문제입니다.","s":572.328,"e":579.956,"p":true,"h":false},{"t":"신약이 이 줄기를 어떻게 이었는가","s":581.04,"e":583.684,"p":false,"h":true},{"t":"신약은 이 책의 비전이 성취되는 방식을 이렇게 증언합니다.","s":584.856,"e":588.791,"p":false,"h":false},{"t":"예수께서 성전을 정화하시며 56장 7절을 인용하여 \"내 집은 만민이 기도하는 집이라\"고 하신 것(마 21:13)은 이 책의 열린 문 비전을 성전에서 되살린 것입니다.","s":589.428,"e":602.768,"p":false,"h":false},{"t":"사도행전 13장 46절부터 47절에서 바울과 바나바는 유대인이 말씀을 거절하자 이방으로 향하면서 49장 6절을 자기들의 사명으로 인용합니다.","s":603.396,"e":613.648,"p":false,"h":false},{"t":"11번 글에서 본 \"종에서 종들로\"의 모양이 여기서 실현됩니다.","s":614.268,"e":618.535,"p":false,"h":false},{"t":"에베소서 2장 11절부터 22절은 멀리 있던 자들과 가까이 있던 자들이 하나가 되어 한 새사람이 되었다고 하며, 이것을 평화의 복음으로 말합니다.","s":619.128,"e":628.986,"p":false,"h":false},{"t":"57장 19절의 \"먼 데 있는 자에게든지 가까운 데 있는 자에게든지 평강이 있을지어다\"를 이 평화의 선포의 뿌리로 읽는 학자들이 많습니다.","s":629.604,"e":639.046,"p":false,"h":false},{"t":"바울이 이 구절을 인용한다고 직접 말하지는 않으므로, 이 연결은 학자들의 읽기로 소개합니다.","s":639.612,"e":646.079,"p":true,"h":false},{"t":"열방 신탁에서 만민의 비전으로","s":647.172,"e":649.583,"p":false,"h":true},{"t":"이 시리즈의 흐름을 돌아보면 6번 글에서 시작된 줄기가 여기서 한 바퀴를 돕니다.","s":650.772,"e":656.207,"p":false,"h":false},{"t":"13~23장에서 열방은 심판받는 나라들로 나왔습니다.","s":656.82,"e":661.426,"p":false,"h":false},{"t":"하나님이 그들의 교만을 낮추시는 것은 그들을 멸망시키려는 것만이 아니라 하나님 이름 아래 모일 수 있는 자리를 만들기 위해서였다고 읽었습니다.","s":662.076,"e":671.032,"p":false,"h":false},{"t":"5번 글의 앗수르는 도구이면서 심판받는 자였는데, 19장 25절에서는 \"나의 손으로 지은\"이라는 이름을 받습니다.","s":671.544,"e":679.524,"p":false,"h":false},{"t":"10번 글의 고레스는 이름을 모르는 채로 쓰임받은 자였고, 45장 22절에서는 모든 사람이 똑같이 초대받습니다.","s":680.184,"e":687.915,"p":false,"h":false},{"t":"심판받던 나라들, 도구로 쓰이던 나라들, 하나님을 알지 못하던 사람들이 모두 같은 초대 앞에 서게 되는 모양입니다.","s":688.5,"e":696.601,"p":true,"h":false},{"t":"불편한 대목들","s":697.68,"e":699.008,"p":false,"h":true},{"t":"솔직히 말씀드려야 할 곳이 있습니다.","s":700.128,"e":702.693,"p":false,"h":false},{"t":"열방의 구원을 말하는 같은 장들이 열방의 굴복과 심판도 말합니다.","s":703.332,"e":708.189,"p":false,"h":false},{"t":"60장 12절은 섬기지 않는 나라는 패망하리라고 하고, 66장 24절은 반역한 자들의 시체가 구더기와 불 속에 있다고 하면서 책을 맺습니다.","s":708.876,"e":718.606,"p":false,"h":false},{"t":"이 마지막 장면의 읽기가 갈립니다.","s":719.172,"e":721.693,"p":false,"h":false},{"t":"어떤 학자는 구원의 책이 구원받지 못한 자의 그림으로 끝나는 것이 이 책의 진지함이라고 보고, 어떤 학자는 최종 형태에서 이 구절이 독자를 향한 경고의 역할을 한다고 봅니다.","s":722.304,"e":733.9,"p":false,"h":false},{"t":"마가복음 9장 48절이 이 구절의 낱말을 쓰는 것으로 알려져 있지만, 이 연결과 의미는 15번 글에서 새 하늘과 새 땅과 함께 다루겠습니다.","s":734.184,"e":743.627,"p":true,"h":false},{"t":"또 하나는 열방이 들어오는 방식에 관한 불편입니다.","s":744.696,"e":748.302,"p":false,"h":false},{"t":"열방이 재물을 가져오고 왕들이 시중든다는 60장의 그림은 이스라엘 중심의 언어로 읽혀서, 오늘의 독자에게 불편하게 들릴 수 있습니다.","s":748.908,"e":758.314,"p":false,"h":false},{"t":"이 언어를 고대 근동의 위로의 문법으로 읽는 학자가 있고, 열방이 하나님 앞에 오는 모습의 시적 표현으로 읽는 학자가 있습니다.","s":758.952,"e":766.874,"p":false,"h":false},{"t":"어느 쪽이든 이 그림이 어떤 민족의 우월을 가르치는 것이 아니라는 점은 같은 책이 45장 22절, 56장 7절, 66장 21절에서 열방이 동등한 이름과 제사장직까지 받는다고 말하는 것으로 보강됩니다.","s":767.52,"e":783.153,"p":false,"h":false},{"t":"이 보강은 제 읽기입니다.","s":783.792,"e":785.901,"p":true,"h":false},{"t":"이 비전이 읽는 사람에게 묻는 것","s":786.996,"e":789.324,"p":false,"h":true},{"t":"이 장들은 두 가지 오해를 막아 줍니다.","s":790.308,"e":793.12,"p":false,"h":false},{"t":"하나는 교만의 오해입니다.","s":793.8,"e":795.806,"p":false,"h":false},{"t":"열방 구원의 비전은 하나님의 선택이 어떤 민족이나 집단의 특권이 아니라 복의 통로였음을 보여 줍니다.","s":796.392,"e":803.115,"p":false,"h":false},{"t":"교회가 이 책의 비전을 받았다면, 이스라엘이 사명을 놓쳤던 것과 같은 자리에 설 수 있다는 경고도 함께 받은 것입니다.","s":803.736,"e":811.408,"p":false,"h":false},{"t":"로마서 11장 20절부터 21절에서 바울이 접붙임 받은 이방인에게 \"높은 마음을 품지 말고 도리어 두려워하라\"고 한 것이 이 점입니다.","s":812.088,"e":821.455,"p":true,"h":false},{"t":"다른 하나는 포기의 오해입니다.","s":822.564,"e":824.786,"p":false,"h":false},{"t":"이스라엘이 거듭 불순종했는데도 하나님은 종일 손을 펴 부르셨습니다.","s":825.372,"e":830.038,"p":false,"h":false},{"t":"그 인내가 이스라엘에게 끝나지 않았다면, 우리가 누군가를 완고하다고 쉽게 포기하는 것도 이 책의 방식은 아닙니다.","s":830.664,"e":838.598,"p":false,"h":false},{"t":"그리고 열방을 부르시는 \"내가 여기 있노라\"는 말씀이 우리를 향해 있었다면, 우리의 몫은 그 부름을 다른 이에게 전하는 일입니다.","s":839.232,"e":847.838,"p":false,"h":false},{"t":"11번 글에서 본 것처럼 단수의 종 뒤에는 복수의 종들이 있고, 그 종들에게 맡겨진 일은 눈을 여는 일입니다.","s":848.484,"e":856.349,"p":true,"h":false},{"t":"이 글의 물음에 한 줄로 답하면 이렇습니다.","s":857.376,"e":860.282,"p":false,"h":false},{"t":"이스라엘의 불순종과 열방의 구원은 서로 엇갈리는 두 이야기가 아니라, 실패한 사명을 하나님이 직접 이루시는 한 이야기입니다.","s":860.868,"e":869.523,"p":false,"h":false},{"t":"그리고 그 이야기의 마지막은 아직 열려 있어서, 읽는 사람은 구경꾼이 아니라 그 이야기 안의 한 사람으로 서게 됩니다.","s":870.192,"e":878.523,"p":true,"h":false}], NAV = {"prev":{"href":"doc13.html","title":"13. 회복이 약속된 뒤에도 왜 죄의 탄식이 계속되는가"},"next":{"href":"doc15.html","title":"15. 새 하늘과 새 땅은 어떻게 읽어야 하는가"},"list":"index.html"};

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }

  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;

  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }

  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
