(function () {
  const TITLE = "2. 하나님이 굳히시는가 백성이 굳어지는가", AUDIO_SRC = "doc02_2610241127.mp3", DUR = 658, SEGS = [{"t":"하나님이 굳히시는가, 백성이 굳어지는가: 완고함의 주체를 묻다","s":0,"e":5.469,"p":false,"h":true},{"t":"본문: 이사야 6:9-10; 63:17 (함께 읽을 본문: 출 4~14장, 사 29:9-14, 30:9-15, 롬 9:14-24, 11:7-10, 25-32)","s":6.516,"e":27.663,"p":true,"h":false},{"t":"앞의 글에서 우리는 이사야에게 맡겨진 사명이 설득이 아니라 증언이라는 데까지 왔습니다.","s":28.656,"e":34.11,"p":false,"h":false},{"t":"그런데 거기서 풀지 못한 물음이 하나 남았습니다.","s":34.74,"e":38.006,"p":false,"h":false},{"t":"백성의 마음이 둔해지고 귀가 막히는 일을 누가 하는가 하는 것입니다.","s":38.52,"e":42.955,"p":false,"h":false},{"t":"6장 10절은 하나님의 명령으로 읽힙니다.","s":43.596,"e":46.699,"p":false,"h":false},{"t":"그렇다면 백성은 하나님이 굳혀 놓으신 대로 굳어진 것이고, 그들을 책망하시는 일이 공정한가 하는 물음이 따라옵니다.","s":47.268,"e":54.92,"p":false,"h":false},{"t":"이 물음은 신학교 강의실에서 시작된 것이 아닙니다.","s":55.512,"e":59.093,"p":false,"h":false},{"t":"이사야서를 처음 읽는 사람 대부분이 이 대목에서 걸립니다.","s":59.688,"e":63.864,"p":true,"h":false},{"t":"이사야서 안에서 두 말이 함께 나옵니다","s":64.98,"e":67.723,"p":false,"h":true},{"t":"먼저 본문이 한쪽으로만 말하지 않는다는 점을 확인해야 합니다.","s":68.94,"e":72.985,"p":false,"h":false},{"t":"6장 10절에서 마음을 둔하게 하는 동사는 사역형 명령입니다.","s":73.62,"e":77.839,"p":false,"h":false},{"t":"하나님의 뜻 안에 이 굳어짐이 있다는 말입니다.","s":78.48,"e":81.533,"p":false,"h":false},{"t":"29장 10절도 여호와께서 깊이 잠들게 하는 영을 부어 주셨다고 말합니다.","s":82.152,"e":87.155,"p":false,"h":false},{"t":"하나님이 주체이신 것입니다.","s":87.804,"e":89.872,"p":true,"h":false},{"t":"그러나 같은 책이 정반대 방향으로도 말합니다.","s":90.828,"e":93.969,"p":false,"h":false},{"t":"29장 13절은 이 백성이 입으로는 가까이하나 마음은 멀리 떠나 있다고 책망합니다.","s":94.464,"e":100.483,"p":false,"h":false},{"t":"30장 9절부터 15절은 더 분명합니다.","s":101.124,"e":104.505,"p":false,"h":false},{"t":"이 백성은 패역한 자식이어서 선지자에게 \"바른 것을 보지 말라, 부드러운 말을 하라\"고 합니다.","s":105.084,"e":111.692,"p":false,"h":false},{"t":"하나님은 돌이켜 조용히 있으면 구원을 얻을 것이라고 하셨으나 \"너희가 원하지 아니하였다\"(30:15)고 하십니다.","s":112.32,"e":121.262,"p":false,"h":false},{"t":"65장 12절도 내가 불러도 대답하지 않았고 내가 기뻐하지 않는 것을 택하였다고 말합니다.","s":121.896,"e":128.151,"p":false,"h":false},{"t":"여기서 주체는 백성입니다.","s":128.772,"e":130.817,"p":true,"h":false},{"t":"6장 10절 자체에도 눈여겨볼 대목이 있습니다.","s":131.904,"e":135.282,"p":false,"h":false},{"t":"그 구절은 굳어지는 목적을 \"그들이 보고 듣고 깨닫고 돌이켜 고침을 받을까 하노라\"로 밝힙니다.","s":135.792,"e":142.536,"p":false,"h":false},{"t":"이 말은 돌이킴과 치유가 본래 열려 있던 길임을 전제합니다.","s":143.208,"e":147.251,"p":false,"h":false},{"t":"하나님이 그 길을 막는 방식으로 일하신다는 것이 이 구절의 무게이지만, 막히는 길이 원래 있었다는 사실도 함께 남습니다.","s":147.852,"e":156.174,"p":true,"h":false},{"t":"바로의 이야기가 보여 주는 방식","s":157.248,"e":159.566,"p":false,"h":true},{"t":"이 긴장은 출애굽기에서 가장 분명하게 나타납니다.","s":160.668,"e":164.215,"p":false,"h":false},{"t":"하나님은 모세를 보내시기 전에 \"내가 그의 마음을 완악하게 하리니\"(출 4:21)라고 미리 말씀하십니다.","s":164.844,"e":173.436,"p":false,"h":false},{"t":"그런데 재앙 이야기가 진행되면 본문은 바로의 마음이 완악해졌다고 말하고, 바로가 스스로 마음을 완악하게 했다고도 말하며(8:15, 32; 9:34), 하나님이 그의 마음을 완악하게 하셨다고도 말합니다(9:12; 10:1).","s":174.096,"e":193.312,"p":false,"h":false},{"t":"대체로 서사 앞부분에서는 바로 쪽의 완악함이 먼저 나오고, 뒤로 갈수록 하나님이 하신 일로 서술되는 비중이 커집니다.","s":193.896,"e":201.847,"p":false,"h":false},{"t":"이 순서를 두고 학자들은 하나님의 굳히심이 바로의 거부를 확정하는 방식으로 이루어졌다고 읽어 왔습니다.","s":202.5,"e":209.354,"p":false,"h":false},{"t":"다만 본문은 이 관계를 철학적으로 설명하지 않습니다.","s":210.024,"e":213.78,"p":false,"h":false},{"t":"두 문장을 나란히 놓고 이야기를 계속할 뿐입니다.","s":214.416,"e":217.819,"p":true,"h":false},{"t":"세 가지 이해","s":218.916,"e":219.979,"p":false,"h":true},{"t":"전통은 이 긴장을 몇 가지로 풀어 왔습니다.","s":221.076,"e":224.08,"p":false,"h":false},{"t":"공정하게 소개하겠습니다.","s":224.676,"e":226.583,"p":true,"h":false},{"t":"개혁주의 전통은 하나님의 굳히심을 실제로 하나님이 하시는 일로 인정하면서, 그것을 심판적인 행위로 이해합니다.","s":227.664,"e":235.382,"p":false,"h":false},{"t":"이미 거부하는 죄인에게 하나님이 은혜를 거두시고 그 마음이 스스로 향하던 방향으로 더 굳어지게 두시는 것입니다.","s":236.016,"e":243.584,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서는 하나님이 죄의 조성자가 아니시고 피조물의 의지에 폭력이 가해지는 것도 아니라고 하면서(3장), 의로운 재판관이신 하나님이 이전의 죄 때문에 눈을 멀게 하시고 마음을 완고하게 하신다고 말합니다(5장).","s":244.188,"e":260.89,"p":false,"h":false},{"t":"칼뱅도 이 일을 단순한 허용으로만 설명하는 것은 부족하다고 보면서도, 죄책은 어디까지나 죄인에게 있다고 했습니다.","s":261.432,"e":269.186,"p":false,"h":false},{"t":"이 입장의 강점은 하나님의 주권을 본문이 말하는 만큼 진지하게 받는다는 점이고, 약점은 주권과 죄책의 접점을 끝내 설명하지 못한다는 점입니다.","s":269.82,"e":279.822,"p":true,"h":false},{"t":"다른 입장은 완고함이 먼저 사람 쪽에서 시작되고 하나님의 굳히심은 그 거부에 대한 응답이라고 봅니다.","s":280.836,"e":287.802,"p":false,"h":false},{"t":"하나님이 미리 아신 거부에 따라 일하신다는 이해입니다.","s":288.468,"e":292.238,"p":false,"h":false},{"t":"이 입장은 하나님의 공정성과 사람의 책임을 분명히 지키지만, 출애굽기 4장 21절처럼 하나님이 먼저 말씀하시는 본문과 부딪히고, 굳어짐이 하나님의 목적 안에 있다는 로마서 9장의 논지를 약하게 만든다는 비판을 받습니다.","s":292.86,"e":308.314,"p":true,"h":false},{"t":"세 번째는 이 일을 개인의 구원 문제보다 구속사의 흐름 안에서 읽습니다.","s":309.42,"e":314.567,"p":false,"h":false},{"t":"이스라엘의 굳어짐은 하나님의 계획 안에서 일정한 기간 동안 일어나는 일이며 목적이 있다고 봅니다.","s":315.108,"e":321.7,"p":false,"h":false},{"t":"바울이 로마서 11장에서 이스라엘의 일부가 우둔하게 된 것이 이방인의 충만한 수가 들어오기까지라고 한 것이 대표적입니다.","s":322.344,"e":330.373,"p":false,"h":false},{"t":"이 이해는 앞의 두 입장과 배타적이지 않아서 개혁주의 쪽에서도 함께 받아들이는 경우가 많습니다.","s":331.02,"e":338.006,"p":true,"h":false},{"t":"신약은 두 말을 그대로 둡니다","s":339.084,"e":341.321,"p":false,"h":true},{"t":"흥미롭게도 신약 저자들 자신이 이 긴장을 정리하지 않고 그대로 인용합니다.","s":342.54,"e":348.073,"p":false,"h":false},{"t":"마태복음 13장 15절은 70인역 이사야를 따라 \"이 백성의 마음이 둔해졌다\"는 형태로 인용합니다.","s":348.372,"e":355.375,"p":false,"h":false},{"t":"백성의 상태를 기술하는 문장입니다.","s":356.004,"e":358.646,"p":false,"h":false},{"t":"반면 요한복음 12장 40절은 \"그가 그들의 눈을 멀게 하시고 그 마음을 굳게 하셨다\"는 형태로 하나님을 주체로 세웁니다.","s":359.28,"e":367.574,"p":false,"h":false},{"t":"같은 구절이 한쪽에서는 상태로, 다른 쪽에서는 하나님의 행하심으로 읽힌 것입니다.","s":368.172,"e":373.965,"p":false,"h":false},{"t":"그리고 요한은 바로 앞 절에서 \"그들이 믿지 아니하니\"(12:37)라고 책임도 적습니다.","s":374.58,"e":381.611,"p":true,"h":false},{"t":"바울은 로마서 9장에서 이 문제의 정면에 섭니다.","s":382.716,"e":386.187,"p":false,"h":false},{"t":"하나님이 하고자 하시는 자를 긍휼히 여기시고 하고자 하시는 자를 완악하게 하신다고 말한 뒤(9:18), 곧바로 \"그러면 어찌하여 여전히 허물하시느냐 누가 그 뜻을 대적하느냐\"(9:19) 하는 반문을 스스로 꺼냅니다.","s":386.784,"e":403.026,"p":false,"h":false},{"t":"그리고 그 물음에 논리로 답하지 않고 \"이 사람아 네가 누구기에 하나님께 반문하느냐\"(9:20)로 응수합니다.","s":403.704,"e":412.292,"p":false,"h":false},{"t":"이것을 회피로 읽는 사람도 있으나, 바울은 반문 자체를 받아들이면서 이 물음이 서 있는 자리가 피조물의 자리임을 상기시키는 것으로 읽는 편이 낫습니다.","s":412.92,"e":423.124,"p":false,"h":false},{"t":"그리고 11장 32절에서 방향을 돌립니다.","s":423.396,"e":426.786,"p":false,"h":false},{"t":"하나님이 모든 사람을 순종하지 않는 가운데 가두어 두신 것은 모든 사람에게 긍휼을 베풀려 하심이라는 것입니다.","s":427.32,"e":434.314,"p":false,"h":false},{"t":"굳힘의 끝에 긍휼이 있다는 선언입니다.","s":434.952,"e":437.595,"p":true,"h":false},{"t":"63장 17절: 이 말을 하는 사람은 누구인가","s":438.624,"e":442.689,"p":false,"h":true},{"t":"이제 처음에 함께 놓은 또 하나의 본문으로 돌아가겠습니다.","s":443.88,"e":447.534,"p":false,"h":false},{"t":"이사야 63장 17절은 이렇게 기도합니다.","s":448.164,"e":451.64,"p":false,"h":false},{"t":"\"여호와여 어찌하여 우리로 주의 길에서 떠나게 하시며 우리 마음을 완고하게 하사 주를 경외하지 아니하게 하시나이까 주의 종들 곧 주의 기업의 지파들을 위하여 돌아오소서.\"","s":452.304,"e":463.01,"p":true,"h":false},{"t":"이 구절은 6장 10절과 짝을 이루는 것처럼 보입니다.","s":464.076,"e":467.745,"p":false,"h":false},{"t":"하나님이 마음을 완고하게 하신다는 말이 여기서는 백성의 입에서 나옵니다.","s":468.396,"e":473.056,"p":false,"h":false},{"t":"그런데 말하는 방식이 중요합니다.","s":473.724,"e":476.071,"p":false,"h":false},{"t":"이것은 책임을 하나님께 돌리며 자신을 변호하는 말이 아닙니다.","s":476.604,"e":480.803,"p":false,"h":false},{"t":"같은 기도의 64장 5절부터 7절은 우리가 범죄하였고 주의 이름을 부르는 자가 없으며 우리 죄악이 우리를 바람같이 몰아갔다고 고백합니다.","s":481.356,"e":491.284,"p":false,"h":false},{"t":"이 백성은 자신의 죄를 인정하면서, 동시에 자기 힘으로는 돌이킬 수 없다는 무력함을 하나님 앞에 내놓습니다.","s":491.904,"e":499.422,"p":false,"h":false},{"t":"그리고 그 무력함을 근거로 \"돌아오소서\" 하고 구합니다.","s":500.04,"e":503.831,"p":true,"h":false},{"t":"여기서 이 교리가 어떤 자리에서 말해지는지가 드러납니다.","s":504.9,"e":508.655,"p":false,"h":false},{"t":"하나님이 마음을 굳히신다는 말은 이사야서에서 한 번도 백성이 자기 변명으로 쓰는 말로 나오지 않습니다.","s":509.292,"e":515.809,"p":false,"h":false},{"t":"그것은 선지자에게 맡겨진 선고이고, 회개하는 자가 무력함을 고백하며 드리는 기도입니다.","s":516.42,"e":522.739,"p":false,"h":false},{"t":"책임을 피하려는 사람은 \"하나님이 굳히셨으니 어쩔 수 없다\"고 말하지만, 이사야서의 이 말은 오히려 \"우리는 스스로 돌이킬 수 없으니 주께서 돌이켜 주소서\"라고 말하는 쪽에 쓰입니다.","s":523.368,"e":535.328,"p":true,"h":false},{"t":"본문이 멈추는 곳","s":536.4,"e":537.906,"p":false,"h":true},{"t":"정리하겠습니다.","s":538.956,"e":540.26,"p":false,"h":false},{"t":"이사야서는 완고함의 주체가 하나님이시라고 말하고, 백성이라고도 말합니다.","s":540.864,"e":546.221,"p":false,"h":false},{"t":"어느 한쪽을 지워서 다른 쪽을 매끄럽게 만들지 않습니다.","s":546.876,"e":550.811,"p":false,"h":false},{"t":"본문이 분명히 하는 것은 몇 가지입니다.","s":551.412,"e":554.023,"p":false,"h":false},{"t":"굳히심은 이미 거부하는 백성에게 내려지는 심판의 성격을 띱니다.","s":554.652,"e":559.144,"p":false,"h":false},{"t":"그 굳어짐은 영원한 것이 아니라 \"어느 때까지니이까\"(6:11)에 답이 있는 시한과 그루터기를 가진 것입니다.","s":559.728,"e":567.847,"p":false,"h":false},{"t":"그리고 사람의 책임은 그 어디에서도 면제되지 않습니다.","s":568.512,"e":572.47,"p":true,"h":false},{"t":"본문이 하지 않는 일도 분명합니다.","s":573.228,"e":575.649,"p":false,"h":false},{"t":"하나님의 주권과 사람의 책임이 어떤 방식으로 하나가 되는지를 설명하지 않습니다.","s":576.252,"e":581.522,"p":false,"h":false},{"t":"저는 이 침묵이 본문의 미완이 아니라 의도라고 읽습니다.","s":582.156,"e":586.024,"p":false,"h":false},{"t":"설명하는 순간 둘 중 하나를 깎아야 하기 때문입니다.","s":586.656,"e":590.211,"p":false,"h":false},{"t":"주권을 깎으면 하나님이 역사의 주인이 아니게 되고, 책임을 깎으면 백성의 죄가 변명거리가 됩니다.","s":590.832,"e":597.677,"p":false,"h":false},{"t":"성경은 둘 다 세워 둔 채로 우리에게 이 자리에서 무엇을 하라고 말합니다.","s":598.32,"e":603.298,"p":false,"h":false},{"t":"바로 앞의 63장 17절처럼 부르짖으라는 것입니다.","s":603.936,"e":607.909,"p":true,"h":false},{"t":"이것은 판단의 문제이므로 구분해 두겠습니다.","s":609.012,"e":612.088,"p":false,"h":false},{"t":"위에서 소개한 세 이해 가운데 어느 것이 옳은지는 신학 전통마다 다르게 답해 왔고, 저는 개혁주의의 심판적 굳힘 이해가 본문 전체와 가장 잘 어울린다고 보지만 이것이 유일한 읽기는 아닙니다.","s":612.72,"e":626.01,"p":true,"h":false},{"t":"한 가지 실천적 주의도 덧붙이겠습니다.","s":627.12,"e":629.989,"p":false,"h":false},{"t":"이 교리는 남을 진단하는 데 쓰는 도구가 아닙니다.","s":630.54,"e":633.95,"p":false,"h":false},{"t":"6장에서 이사야는 자기도 부정한 입술을 가진 백성 가운데 산다고 고백한 뒤에야 이 말을 맡았습니다.","s":634.572,"e":641.482,"p":false,"h":false},{"t":"누가 굳어졌고 누가 그렇지 않은지를 가려내는 일은 선지자에게도 맡겨지지 않았습니다.","s":642.132,"e":648.01,"p":false,"h":false},{"t":"이 본문이 읽는 사람에게 던지는 것은 \"저들은 왜 저러는가\"가 아니라 \"내 마음은 지금 어디에 있는가\"라는 물음입니다.","s":648.576,"e":656.957,"p":true,"h":false}], NAV = {"prev":{"href":"doc01.html","title":"1. 결과를 아시면서 왜 보내시는가"},"next":{"href":"doc03.html","title":"3. 약속을 듣고도 왜 돌이키지 않는가"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
