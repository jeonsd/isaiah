<script>
(function () {
  const TITLE = "15. 새 하늘과 새 땅은 어떻게 읽어야 하는가", AUDIO_SRC = "doc15_2610241127.mp3", DUR = 787, SEGS = [{"t":"새 하늘과 새 땅은 어떻게 읽어야 하는가: 이사야서의 마지막 두 장","s":0,"e":5.033,"p":false,"h":true},{"t":"본문: 이사야 65:1-66:24 (함께 읽을 본문: 사 6:11-13; 11:6-9; 40:1-2; 43:18-19; 51:6; 55:12-13; 행 7:48-50; 롬 8:18-23; 벧후 3:10-13; 계 21:1-5; 막 9:42-48)","s":6.228,"e":41.835,"p":true,"h":false},{"t":"이 시리즈의 첫 물음은 \"전해도 깨닫지 못할 것을 아시면서 왜 이사야를 보내시는가\"였고, 이사야는 6장 11절에서 \"주여 어느 때까지니이까\" 하고 물었습니다.","s":42.768,"e":53.748,"p":false,"h":false},{"t":"마지막 두 장은 그 물음에 대한 이 책의 최종 답입니다.","s":54.432,"e":58.213,"p":false,"h":false},{"t":"다만 이 답은 읽기가 가장 크게 갈리는 말로 주어집니다.","s":58.86,"e":63.004,"p":false,"h":false},{"t":"새 하늘과 새 땅을 문자 그대로 읽을지 상징으로 읽을지, 66장 24절의 마지막 장면을 어떻게 이해할지가 그렇습니다.","s":63.684,"e":72.201,"p":false,"h":false},{"t":"이 글은 각 입장의 가장 좋은 논리를 공정하게 소개하고, 제 판단은 구분해서 말씀드리겠습니다.","s":72.828,"e":79.459,"p":true,"h":false},{"t":"마지막 두 장의 짜임","s":80.532,"e":82.299,"p":false,"h":true},{"t":"두 장은 크게 여섯 대목으로 읽힙니다.","s":83.448,"e":86.216,"p":false,"h":false},{"t":"65장 1~7절은 13번 글에서 본 대로 종일 손을 펴 부르셨는데도 돌이키지 않는 백성을 다룹니다.","s":86.796,"e":93.912,"p":false,"h":false},{"t":"8~16절은 공동체 안을 나눕니다.","s":94.572,"e":97.689,"p":false,"h":false},{"t":"하나님의 종들은 먹고 마시고 기뻐하지만 하나님을 버린 자들은 주리고 부끄러움을 당합니다.","s":98.316,"e":104.319,"p":false,"h":false},{"t":"17~25절이 새 창조의 선언입니다.","s":104.94,"e":108.159,"p":false,"h":false},{"t":"66장 1~6절은 성전을 다루고, 7~14절은 시온이 아이를 낳고 어머니가 위로하듯 하나님이 위로하신다고 말합니다.","s":108.792,"e":117.908,"p":false,"h":false},{"t":"15~24절은 심판과 열방의 모임, 그리고 책의 마지막 장면입니다.","s":118.548,"e":124.505,"p":false,"h":false},{"t":"이 순서에서 눈여겨볼 점이 있습니다.","s":125.172,"e":127.713,"p":false,"h":false},{"t":"새 창조는 공동체가 둘로 갈리는 장면 바로 뒤에 옵니다.","s":128.304,"e":132.037,"p":false,"h":false},{"t":"새 하늘과 새 땅은 모두가 자동으로 들어가는 곳으로 그려지지 않습니다.","s":132.66,"e":137.107,"p":true,"h":false},{"t":"약속들이 모이는 자리","s":138.204,"e":139.973,"p":false,"h":true},{"t":"65장 17절은 \"보라 내가 새 하늘과 새 땅을 창조하나니 이전 것은 기억되거나 마음에 생각나지 아니할 것이라\"고 합니다.","s":141.12,"e":149.312,"p":false,"h":false},{"t":"\"창조하다\"는 이 책에서 이스라엘과 하나님의 새 일에 반복해서 쓰이던 낱말입니다.","s":149.976,"e":155.518,"p":false,"h":false},{"t":"43장 18절부터 19절의 \"새 일\"과 이어진다고 보는 학자들이 많습니다.","s":156.168,"e":161.874,"p":true,"h":false},{"t":"이 단락을 읽으면 앞에서 만난 약속들이 한곳에 모이는 것이 보입니다.","s":162.936,"e":167.796,"p":false,"h":false},{"t":"25절의 \"이리와 어린양이 함께 먹을 것이며\"는 11장 6절부터 9절의 그림입니다.","s":168.408,"e":174.518,"p":false,"h":false},{"t":"11장에서 이새의 싹이 다스리는 나라로 약속되었던 평화가 여기서 새 창조의 모습으로 나옵니다.","s":175.176,"e":181.249,"p":false,"h":false},{"t":"19절의 \"울음소리와 부르짖는 소리가 다시 들리지 아니할 것\"은 25장 8절의 눈물을 닦아 주시는 약속과 겹칩니다.","s":181.872,"e":189.776,"p":false,"h":false},{"t":"24절의 \"그들이 부르기 전에 내가 응답하겠고\"는 64장 1절의 \"하늘을 찢고 강림하사\"라는 간구에 대한 답으로 읽을 수 있습니다.","s":190.44,"e":199.483,"p":false,"h":false},{"t":"이 연결들은 제가 읽어 낸 것입니다.","s":200.052,"e":202.793,"p":false,"h":false},{"t":"본문이 서로를 가리킨다고 직접 말하지는 않습니다.","s":203.112,"e":206.6,"p":true,"h":false},{"t":"어떻게 읽을 것인가: 세 갈래","s":207.648,"e":210.224,"p":false,"h":true},{"t":"첫째는 물리적인 새 창조로 읽는 입장입니다.","s":211.392,"e":214.552,"p":false,"h":false},{"t":"이 입장은 하나님이 실제로 하늘과 땅을 새롭게 하신다고 봅니다.","s":215.136,"e":219.565,"p":false,"h":false},{"t":"이사야의 그림에 집과 포도원과 수고의 열매(65:21-23)가 나오는 점을 근거로 들고, 신약의 로마서 8장 19~23절이 피조물도 썩어짐의 종노릇에서 해방되리라고 한 것과 연결합니다.","s":220.176,"e":236.258,"p":false,"h":false},{"t":"이 입장의 강점은 구원을 영혼만의 일로 좁히지 않는다는 점입니다.","s":236.88,"e":241.587,"p":false,"h":false},{"t":"약점은 65장 20절입니다.","s":242.208,"e":244.721,"p":false,"h":false},{"t":"이 구절은 수명이 차지 못하고 죽는 영아와 노인이 다시는 없을 것이며, 백 세에 죽는 자도 젊은이로 여겨지고 백 세 전에 죽는 자는 저주받은 자라고 합니다.","s":245.34,"e":255.696,"p":false,"h":false},{"t":"죽음이 여전히 있고 죄인도 있는 땅입니다.","s":256.356,"e":259.484,"p":true,"h":false},{"t":"둘째는 귀환 이후 예루살렘의 갱신을 시적 언어로 그렸다고 읽는 입장입니다.","s":260.568,"e":265.627,"p":false,"h":false},{"t":"새 하늘과 새 땅은 하나님이 돌보시는 공동체의 완전한 회복을 가리키는 과장된 표현이고, 65장 20절은 그 풍요가 당대의 수명과 안전 같은 익숙한 범주로 그려진 것이라고 봅니다.","s":266.256,"e":278.973,"p":false,"h":false},{"t":"이 입장은 65장 20절의 죽음 언급을 가장 자연스럽게 설명하고, 이사야서가 다른 곳에서 비슷한 우주적 언어로 역사적 사건을 그린다는 점(13:10; 34:4)을 근거로 듭니다.","s":279.648,"e":294.547,"p":false,"h":false},{"t":"약점은 이 약속이 귀환 이후 역사 속에서 이루어졌다고 보기 어렵다는 점과, 신약이 이 구절을 역사적 사건으로 읽지 않는다는 점입니다.","s":295.128,"e":304.538,"p":true,"h":false},{"t":"셋째는 구약의 범주로 그려진 마지막 완성의 그림으로 읽는 입장입니다.","s":305.64,"e":310.25,"p":false,"h":false},{"t":"베드로후서 3장 13절은 \"우리는 그의 약속대로 의가 거하는 새 하늘과 새 땅을 바라보도다\"라고 하고, 요한계시록 21장 1절부터 4절은 새 하늘과 새 땅을 보며 다시는 사망이 없다고 말합니다.","s":310.896,"e":324.63,"p":false,"h":false},{"t":"신약이 이사야 65~66장의 낱말을 가져다 마지막 완성으로 적용했다고 보는 읽기입니다.","s":325.296,"e":331.951,"p":false,"h":false},{"t":"이 입장에서 65장 20절은 구약 독자가 알아들을 수 있는 말, 곧 수명과 안전의 언어로 완전한 생명을 그린 것으로 이해합니다.","s":332.604,"e":341.72,"p":false,"h":false},{"t":"이 입장의 약점은 본문이 죽음의 폐지를 말하지 않는데 요한계시록의 내용을 이사야에게 읽어 넣게 될 위험이 있다는 점입니다.","s":342.396,"e":350.781,"p":true,"h":false},{"t":"이 세 갈래는 개혁주의 안에서도 갈립니다.","s":351.9,"e":354.881,"p":false,"h":false},{"t":"무천년, 역사적 전천년, 후천년 같은 종말론의 입장에 따라 같은 구절을 다르게 배치하기 때문입니다.","s":355.5,"e":363.262,"p":false,"h":false},{"t":"이 구절 하나로 종말의 시간표가 결정되지는 않으며, 시간표는 요한계시록을 어떻게 읽느냐에 달려 있습니다.","s":363.816,"e":371.158,"p":true,"h":false},{"t":"제 판단을 구분해서 말씀드리겠습니다.","s":372.24,"e":374.831,"p":false,"h":false},{"t":"저는 셋째 읽기가 책의 구조와 신약의 인용에 가장 잘 맞는다고 봅니다.","s":375.48,"e":380.274,"p":false,"h":false},{"t":"다만 65장 20절이 남기는 긴장을 매끄럽게 해소하지는 못한다고 생각합니다.","s":380.916,"e":386.447,"p":false,"h":false},{"t":"이 긴장은 첫째 읽기와 셋째 읽기가 함께 안고 가야 할 숙제입니다.","s":387.108,"e":391.714,"p":false,"h":false},{"t":"입장과 상관없이 지킬 선이 두 가지 있습니다.","s":392.364,"e":395.821,"p":false,"h":false},{"t":"하나는 이 약속이 영혼이 육체를 떠나 가는 곳에 대한 말씀이 아니라는 점입니다.","s":396.468,"e":401.447,"p":false,"h":false},{"t":"집을 짓고 포도원을 가꾸는 삶, 수고가 헛되지 않은 땅이 이사야의 그림입니다.","s":402.084,"e":407.703,"p":false,"h":false},{"t":"다른 하나는 이 본문으로 날짜나 순서를 계산하지 않는 것입니다.","s":408.348,"e":412.692,"p":false,"h":false},{"t":"7번 글에서 \"그날\"을 한꺼번에 하나로 묶지 말라고 했던 경고가 여기서도 같습니다.","s":413.352,"e":418.708,"p":true,"h":false},{"t":"66장: 성전을 짓겠다는 백성에게","s":419.796,"e":423.319,"p":false,"h":true},{"t":"66장 1절은 놀라운 말씀으로 시작합니다.","s":424.332,"e":427.788,"p":false,"h":false},{"t":"\"하늘은 나의 보좌요 땅은 나의 발판이니 너희가 나를 위하여 어떤 집을 지을 수 있으며.\"","s":428.472,"e":434.019,"p":false,"h":false},{"t":"그리고 2절은 하나님이 돌아보시는 사람이 \"가난하고 마음이 상하며 내 말을 두려워하며 떠는 자\"라고 합니다.","s":434.628,"e":442.063,"p":false,"h":false},{"t":"이 구절은 스데반이 사도행전 7장 49절부터 50절에서 인용한 구절입니다.","s":442.692,"e":448.536,"p":false,"h":false},{"t":"이 말씀은 성전을 부정하는 것이 아니라, 하나님이 건물에 갇히지 않으시며 겸손한 사람과 함께하신다는 선언으로 읽힙니다.","s":449.1,"e":457.221,"p":false,"h":false},{"t":"같은 장 20절부터 21절에서 열방이 예물을 가져와 성전에서 섬기는 그림이 나오기 때문입니다.","s":457.848,"e":464.663,"p":false,"h":false},{"t":"1절과 20절의 긴장을 학자들은 서로 다르게 읽는데, 저는 둘 다 하나님의 집이 건물이 아니라 사람들의 겸손과 만남에 있다는 방향을 가리킨다고 봅니다.","s":465.3,"e":475.354,"p":false,"h":false},{"t":"이것은 제 읽기입니다.","s":475.92,"e":477.9,"p":true,"h":false},{"t":"3절부터 4절은 제사를 사람을 죽이는 일, 개의 목을 꺾는 일에 견주는 어려운 구절입니다.","s":478.98,"e":485.587,"p":false,"h":false},{"t":"제사 제도 자체를 거부하는 말로 읽는 학자도 있고, 악을 선택한 사람의 제사를 책망하는 말로 읽는 학자도 있습니다.","s":486.216,"e":493.488,"p":false,"h":false},{"t":"어느 쪽이든 형식이 마음을 대신할 수 없다는 점은 58장의 금식과 같은 맥락입니다.","s":494.136,"e":500.106,"p":true,"h":false},{"t":"66장 7~14절: 어머니의 위로","s":501.228,"e":505.071,"p":false,"h":true},{"t":"이 대목은 시온이 진통이 오기 전에 아들을 낳는다는 놀라운 그림으로 시작해 13절로 이어집니다.","s":506.16,"e":512.757,"p":false,"h":false},{"t":"\"어미가 자식을 위로함같이 내가 너희를 위로할 것인즉.\"","s":513.396,"e":517.261,"p":false,"h":false},{"t":"이 책은 40장 1절의 \"위로하라 내 백성을 위로하라\"로 후반부를 열었고, 여기서 그 위로가 어머니의 품이라는 그림으로 마무리됩니다.","s":517.86,"e":527.004,"p":false,"h":false},{"t":"40장에서는 팔로 다스리시는 분이 목자로 안으셨는데, 66장에서는 어머니로 안으십니다.","s":527.616,"e":534.144,"p":false,"h":false},{"t":"이 수미상관은 제 읽기입니다.","s":534.78,"e":537.285,"p":true,"h":false},{"t":"66장 24절: 책이 이렇게 끝나는 이유","s":538.38,"e":542.075,"p":false,"h":true},{"t":"이제 가장 어려운 대목입니다.","s":543.24,"e":545.422,"p":false,"h":false},{"t":"22절부터 23절은 새 하늘과 새 땅이 항상 있을 것이고, 너희 자손과 이름도 그와 같이 있으리라고 하며, 모든 육체가 안식일마다 와서 경배하리라고 합니다.","s":546.084,"e":557.478,"p":false,"h":false},{"t":"그런데 바로 24절은 이렇게 끝납니다.","s":558.072,"e":561.15,"p":false,"h":false},{"t":"사람들이 나가서 하나님께 반역한 자들의 시체를 보게 되는데, 그들을 먹는 벌레가 죽지 아니하고 그들을 사르는 불이 꺼지지 아니할 것이며, 모든 육체에게 가증이 되리라는 것입니다.","s":561.78,"e":573.698,"p":true,"h":false},{"t":"세 가지 읽기가 있습니다.","s":574.812,"e":576.737,"p":false,"h":false},{"t":"첫째 읽기는 이 구절을 최종적이고 영원한 형벌의 그림으로 봅니다.","s":577.404,"e":581.951,"p":false,"h":false},{"t":"예수께서 마가복음 9장 48절에서 \"거기에서는 구더기도 죽지 않고 불도 꺼지지 않느니라\"고 하신 것이 이 구절의 낱말을 쓴 것이라는 근거입니다.","s":582.624,"e":592.78,"p":false,"h":false},{"t":"둘째 읽기는 본문이 살아 있는 사람이 아니라 \"시체\"를 말하고 불과 벌레가 그것을 삼킨다는 점에 주목합니다.","s":593.424,"e":600.59,"p":false,"h":false},{"t":"불과 벌레가 꺼지지 않는다는 말은 완전하고 최종적인 멸절을 뜻한다는 읽기입니다.","s":601.236,"e":606.706,"p":false,"h":false},{"t":"이 읽기를 따르는 학자들이 있고, 개혁주의 전통의 다수는 첫째 읽기를 따라 왔습니다.","s":607.392,"e":613.334,"p":false,"h":false},{"t":"셋째 읽기는 이 구절을 구체적인 사건, 곧 예루살렘 밖 골짜기에서 일어나는 심판의 현장으로 읽으면서 최종 형태에서는 독자를 향한 경고의 기능을 한다고 봅니다.","s":613.98,"e":625.222,"p":false,"h":false},{"t":"저는 예수께서 이 낱말을 쓰셨다는 점이 첫째 읽기에 무게를 준다고 보지만, 이 구절 하나가 영원한 형벌의 성격을 결정해 주지는 않는다고 생각합니다.","s":625.896,"e":635.525,"p":false,"h":false},{"t":"본문은 형벌의 지속 방식을 설명하지 않고 그 가증함이 독자에게 보인다는 것만 말합니다.","s":636.192,"e":642.469,"p":true,"h":false},{"t":"주목할 만한 전승이 있습니다.","s":643.536,"e":645.597,"p":false,"h":false},{"t":"유대교 회당에서는 이사야서를 낭독할 때 이 어두운 구절로 끝나지 않도록 23절을 한 번 더 읽는 관습이 있는 것으로 알려져 있습니다.","s":646.164,"e":655.411,"p":false,"h":false},{"t":"이 관습의 정확한 기원은 제가 확인하지 못했지만, 이 책의 마지막 장면이 얼마나 무겁게 읽혀 왔는지 보여 줍니다.","s":656.064,"e":663.931,"p":false,"h":false},{"t":"이 책은 정말로 심판의 장면으로 끝납니다.","s":664.596,"e":667.786,"p":false,"h":false},{"t":"하나님의 인내가 끝이 없다는 것과 마지막에 가름이 있다는 것이 함께 놓여 있습니다.","s":668.412,"e":673.772,"p":false,"h":false},{"t":"이것을 매끄럽게 풀려 하지 않겠습니다.","s":674.352,"e":676.981,"p":false,"h":false},{"t":"다만 이 장면을 보는 사람이 \"모든 육체\"라는 것, 곧 그 앞에서 구경만 하는 자리가 아니라 그 가증함 앞에서 자기 자리를 묻게 되는 자리에 놓인다는 점은 지적해 둡니다.","s":677.592,"e":688.923,"p":true,"h":false},{"t":"처음 물음으로 돌아가며","s":690.012,"e":691.618,"p":false,"h":true},{"t":"이제 이 시리즈의 처음 물음으로 돌아가겠습니다.","s":692.748,"e":695.866,"p":false,"h":false},{"t":"6장 11절의 \"어느 때까지니이까\"에 하나님은 시간표 대신 그루터기로 답하셨고, 이 책은 그 그루터기가 66장 22절의 \"너희 자손과 너희 이름이 항상 있으리라\"에 이르는 것으로 끝납니다.","s":696.492,"e":709.67,"p":false,"h":false},{"t":"베어진 나무의 밑동에서 새 하늘과 새 땅까지가 이 책이 그려 온 길입니다.","s":710.244,"e":715.1,"p":true,"h":false},{"t":"그리고 9장의 답답함은 이 책의 끝에서 어떻게 되었는가를 물을 수 있습니다.","s":716.22,"e":721.477,"p":false,"h":false},{"t":"돌이키지 않는 백성은 66장에서도 완전히 사라지지 않고, 24절의 시체들로 남아 있습니다.","s":722.088,"e":728.819,"p":false,"h":false},{"t":"그러나 책은 거기에 하나를 더합니다.","s":729.468,"e":732.021,"p":false,"h":false},{"t":"돌이키지 못하는 사람들을 위해 하나님이 직접 오시고, 그들의 죄를 짊어질 종을 세우시고, 닫힌 마음을 여시는 영을 부어 주신다는 약속입니다.","s":732.672,"e":742.174,"p":false,"h":false},{"t":"이사야서는 죄 문제가 풀렸다고 말하지 않고, 풀어 주시는 분이 계시다고 말합니다.","s":742.752,"e":748.681,"p":false,"h":false},{"t":"그 약속의 한쪽 끝에는 새 창조가 있고, 다른 쪽 끝에는 아직 돌이키지 않은 이들에 대한 엄중함이 있습니다.","s":749.34,"e":756.499,"p":true,"h":false},{"t":"그러므로 이 마지막 장들을 읽는 사람에게 남는 것은 시간표가 아니라 방향입니다.","s":757.548,"e":762.966,"p":false,"h":false},{"t":"하나님의 일은 눈물이 닦이고, 수고가 열매를 맺고, 이리와 어린양이 함께 먹는 곳을 향합니다.","s":763.596,"e":770.401,"p":false,"h":false},{"t":"그리고 이 약속을 믿는 사람은 지금 이 땅에서 가난하고 마음이 상하며 말씀 앞에 떠는 자의 자리에 서도록 부름받습니다.","s":771.012,"e":779.39,"p":false,"h":false},{"t":"66장 2절이 하나님이 돌아보시는 사람으로 꼽은 사람이 그런 사람이기 때문입니다.","s":780.048,"e":785.741,"p":true,"h":false}], NAV = {"prev":{"href":"doc14.html","title":"14. 이스라엘의 불순종과 열방의 구원은 어떻게 이어지는가"},"next":{"href":"doc16.html","title":"16. 하나의 줄기로 읽는 이사야서"},"list":"index.html"};

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }

  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');

  }

  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {

    cancelAnimationFrame(tickId); if (p) { loop(); }
  }

  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */

  /* 단추 */

  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };

    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
