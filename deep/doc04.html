<script>
(function () {
  const TITLE = "4. 남은 자는 왜 있으며 무엇을 위한 것인가", AUDIO_SRC = "doc04_2610241127.mp3", DUR = 658, SEGS = [{"t":"남은 자는 왜 있으며, 무엇을 위한 것인가: 약속이 살아서 이어지는 방식","s":0,"e":6.143,"p":false,"h":true},{"t":"본문: 이사야 1:9; 4:2-6; 6:13; 7:3; 10:20-23; 11:11, 16; 37:30-32 (함께 읽을 본문: 창 6~9장, 왕상 19:14-18, 롬 9:27-29, 11:1-6)","s":7.272,"e":34.376,"p":true,"h":false},{"t":"앞의 세 글에서 우리는 이사야의 사명이 증언이라는 것, 완고함에 주권과 책임이 함께 놓여 있다는 것, 왕이 약속을 거절한 자리에서도 임마누엘이 확정된다는 것을 보았습니다.","s":35.208,"e":46.985,"p":false,"h":false},{"t":"이제 남은 물음이 하나 있습니다.","s":47.556,"e":49.734,"p":false,"h":false},{"t":"나라가 무너지고 백성이 돌이키지 않는다면, 약속은 도대체 누구에게 이어지는가 하는 것입니다.","s":50.364,"e":56.696,"p":false,"h":false},{"t":"이사야서의 대답이 \"남은 자\"입니다.","s":57.312,"e":60.243,"p":false,"h":false},{"t":"이 말은 이사야서를 읽는 사람에게 위로로 들리기도 하고, 선택에서 빠진 사람들을 생각하면 불편하게도 들립니다.","s":60.912,"e":68.505,"p":false,"h":false},{"t":"둘 다 정직하게 다루어야 합니다.","s":69.156,"e":71.495,"p":true,"h":false},{"t":"말이 처음 나오는 자리들","s":72.612,"e":74.526,"p":false,"h":true},{"t":"\"남은 자\"는 이사야가 만든 말이 아닙니다.","s":75.6,"e":78.603,"p":false,"h":false},{"t":"노아의 홍수 때 방주에 든 사람들, 엘리야 시대에 바알에게 무릎 꿇지 않은 칠천 명(왕상 19:18)처럼, 성경은 심판이 닥칠 때마다 남겨진 사람들을 말해 왔습니다.","s":79.236,"e":92.441,"p":false,"h":false},{"t":"이사야는 이 오래된 생각을 책 전체의 뼈대로 끌어올립니다.","s":93.06,"e":97.35,"p":true,"h":false},{"t":"이사야서에서 이 주제는 처음부터 끝까지 깔려 있습니다.","s":98.424,"e":102.276,"p":false,"h":false},{"t":"1장 9절은 만군의 여호와께서 생존자를 조금 남겨 두지 않으셨더라면 우리가 소돔 같고 고모라 같았으리라고 말합니다.","s":102.888,"e":110.891,"p":false,"h":false},{"t":"6장 13절은 소명 기사의 마지막에서 베임을 당한 나무의 그루터기를 말하고, 그것을 \"거룩한 씨\"라고 부릅니다.","s":111.528,"e":119.259,"p":false,"h":false},{"t":"7장에서는 이사야가 아하스를 만나러 가며 아들 스알야숩을 데려갑니다.","s":119.916,"e":125.122,"p":false,"h":false},{"t":"앞에서 보았듯 그 이름이 \"남은 자가 돌아오리라\"입니다.","s":125.784,"e":129.612,"p":false,"h":false},{"t":"이 이름에는 날카로운 양면이 있습니다.","s":130.248,"e":132.938,"p":false,"h":false},{"t":"돌아오는 자가 있다는 것은 위로이지만, 남은 자만 돌아온다는 것은 나머지는 돌아오지 못한다는 경고입니다.","s":133.272,"e":140.339,"p":false,"h":false},{"t":"이사야는 한 아들의 이름 속에 심판과 희망을 함께 담아 걸어 다닌 셈입니다.","s":141.012,"e":146.021,"p":true,"h":false},{"t":"남은 자는 누구인가","s":147.096,"e":148.763,"p":false,"h":true},{"t":"가장 먼저 짚어야 할 것은, 남은 자가 자격을 갖춘 소수가 아니라는 점입니다.","s":149.94,"e":155.356,"p":false,"h":false},{"t":"10장 20절부터 23절은 남은 자가 \"이스라엘의 남은 자와 야곱 족속 중 피난한 자\"이며 그들이 \"진실하게 여호와를 의지\"하리라고 말합니다.","s":156.024,"e":165.891,"p":false,"h":false},{"t":"그러나 같은 대목에서 이스라엘 백성이 바다의 모래 같을지라도 돌아오는 자는 남은 자뿐이라고 하며, 멸망이 작정되었다고 합니다.","s":166.464,"e":174.936,"p":false,"h":false},{"t":"여기서 중요한 것은 순서입니다.","s":175.608,"e":177.898,"p":false,"h":false},{"t":"남은 자는 의로워서 살아남은 사람들이 아니라, 심판을 통과해 \"피난한 자\"가 된 사람들입니다.","s":178.452,"e":185.208,"p":false,"h":false},{"t":"1장 9절도 이 생존을 사람의 공로가 아니라 하나님이 남겨 두신 결과로 말합니다.","s":185.868,"e":191.171,"p":false,"h":false},{"t":"하나님이 남기셨기에 남았다는 것입니다.","s":191.736,"e":194.479,"p":true,"h":false},{"t":"바울이 로마서 11장 1절부터 6절에서 같은 이해를 확인합니다.","s":195.516,"e":200.093,"p":false,"h":false},{"t":"엘리야는 자기만 남았다고 탄식했으나 하나님은 칠천 명을 남겨 두셨다고 하시며, 바울은 이 남은 자가 \"은혜로 택하심을 따라\" 있다고 말합니다.","s":200.736,"e":209.967,"p":false,"h":false},{"t":"행위로 되면 은혜가 아니라는 것입니다.","s":210.528,"e":213.125,"p":false,"h":false},{"t":"남은 자는 상을 받은 사람들이 아니라 은혜의 증거입니다.","s":213.768,"e":217.758,"p":true,"h":false},{"t":"남은 자는 무엇을 위해 있는가","s":218.808,"e":221.028,"p":false,"h":true},{"t":"이 질문에 이사야서는 적어도 네 가지로 답합니다.","s":222.156,"e":225.659,"p":true,"h":false},{"t":"첫째, 심판이 철저하되 끝이 아님을 보이기 위해서입니다.","s":226.728,"e":230.863,"p":false,"h":false},{"t":"하나님의 심판은 가벼운 경고가 아닙니다.","s":231.444,"e":234.327,"p":false,"h":false},{"t":"6장은 성읍이 황폐하여 사람이 없을 때까지라고 하고, 10장 23절은 멸망이 \"작정되었다\"고 합니다.","s":234.9,"e":242.27,"p":false,"h":false},{"t":"그러나 그루터기가 있다는 사실이 이 심판을 진노의 폭발이 아니라 목적이 있는 정화로 읽게 합니다.","s":242.928,"e":249.306,"p":false,"h":false},{"t":"이사야 4장 2절부터 4절은 그 정화의 끝을 그립니다.","s":249.948,"e":253.937,"p":false,"h":false},{"t":"여호와의 싹이 아름답고 영화로우며, 시온에 남은 자가 거룩하다 일컬음을 받을 것인데, 이는 주께서 심판의 영과 소멸의 영으로 예루살렘의 피를 씻어 내신 뒤라고 합니다.","s":254.52,"e":266.177,"p":true,"h":false},{"t":"둘째, 약속이 끊기지 않게 하기 위해서입니다.","s":267.3,"e":270.835,"p":false,"h":false},{"t":"하나님이 다윗에게 하신 약속, 아브라함에게 하신 약속은 백성 전체가 무너져도 소멸되지 않아야 합니다.","s":271.476,"e":278.385,"p":false,"h":false},{"t":"그 약속을 맡아 이어 가는 통로가 남은 자입니다.","s":279.036,"e":282.176,"p":false,"h":false},{"t":"이사야서의 가장 아름다운 장면 하나가 여기에 있습니다.","s":282.708,"e":286.375,"p":false,"h":false},{"t":"11장 1절은 이새의 줄기에서 한 싹이 나온다고 합니다.","s":287.028,"e":290.975,"p":false,"h":false},{"t":"나무가 베인 뒤에 줄기가 아니라 그루터기에서 싹이 난다는 그림입니다.","s":291.6,"e":296.184,"p":false,"h":false},{"t":"6장의 그루터기와 9장의 아기와 11장의 싹이 이어집니다.","s":296.856,"e":300.989,"p":false,"h":false},{"t":"남은 자의 이야기는 결국 한 사람, 곧 약속의 중심인 왕에게로 모이는 이야기입니다.","s":301.608,"e":308.227,"p":true,"h":false},{"t":"셋째, 말씀이 보존되게 하기 위해서입니다.","s":309.348,"e":312.821,"p":false,"h":false},{"t":"1번 글에서 보았듯 8장 16절에서 이사야는 증거의 말씀을 제자들 가운데 봉합니다.","s":313.452,"e":319.284,"p":false,"h":false},{"t":"남은 자는 숫자로 세는 집단이기 전에 말씀을 받아 간직한 공동체입니다.","s":319.86,"e":324.853,"p":false,"h":false},{"t":"이사야서가 지금 우리 손에 있다는 사실 자체가 이 사람들이 있었다는 증거입니다.","s":325.512,"e":331.069,"p":true,"h":false},{"t":"넷째, 새로운 시작의 씨앗이 되기 위해서입니다.","s":332.208,"e":335.88,"p":false,"h":false},{"t":"37장 31절과 32절은 앗수르의 위기 속에서 유다 족속 가운데 피난하여 남은 자가 아래로 뿌리를 박고 위로 열매를 맺으리라고 하며, 이를 \"만군의 여호와의 열심이 이루시리라\"로 맺습니다.","s":336.456,"e":350.446,"p":false,"h":false},{"t":"남은 자는 끝의 이름이 아니라 시작의 이름입니다.","s":351.036,"e":354.427,"p":true,"h":false},{"t":"불편한 물음: 남지 못한 사람들은 어떻게 되는가","s":355.176,"e":359.104,"p":false,"h":true},{"t":"이제 앞서 말한 불편함을 마주해야 합니다.","s":360.252,"e":363.108,"p":false,"h":false},{"t":"남은 자가 은혜로 남겨진 사람이라면, 남겨지지 않은 사람들은 어떻게 되는가.","s":363.78,"e":369.123,"p":false,"h":false},{"t":"이 물음 앞에서 두 가지를 구분해 말씀드리겠습니다.","s":369.756,"e":373.223,"p":true,"h":false},{"t":"본문이 분명히 말하는 것이 있습니다.","s":374.328,"e":376.802,"p":false,"h":false},{"t":"심판받는 사람들에게 하나님은 책임을 면제하지 않으십니다.","s":377.388,"e":381.484,"p":false,"h":false},{"t":"이사야서에서 멸망은 변덕이 아니라 5장 포도원 노래가 보여 준 응답입니다.","s":382.104,"e":387.273,"p":false,"h":false},{"t":"기회는 주어졌고 거절되었습니다.","s":387.9,"e":390.532,"p":false,"h":false},{"t":"그리고 이사야서에서 남은 자의 숫자는 위협으로만  더 이상 줄어들 수 없을 만큼 줄어든 자리가 한 사람이라고 읽는 학자들이 있습니다.","s":538.38,"e":544.477,"p":false,"h":false},{"t":"하나님의 일이 소수를 통해 이어진다는 방식이 끝까지 가면 한 분에게 이른다는 것입니다.","s":545.112,"e":550.767,"p":false,"h":false},{"t":"이 해석은 이사야서의 구조에 대한 한 가지 읽기이며, 종의 정체는 11번 물음에서 따로 다루겠습니다.","s":551.376,"e":558.436,"p":true,"h":false},{"t":"그러면 이 구조가 신약에서 어떻게 이어지는지 보입니다.","s":559.512,"e":563.428,"p":false,"h":false},{"t":"그리스도는 그루터기에서 난 싹이며, 그분 안에서 남은 자의 개념이 다시 넓어집니다.","s":564.048,"e":569.976,"p":false,"h":false},{"t":"로마서 9장 24절부터 26절은 이 남은 자가 유대인 가운데서뿐 아니라 이방인 가운데서도 부름받는다고 말합니다.","s":570.6,"e":579.242,"p":false,"h":false},{"t":"하나님의 일이 소수를 통해 이어지다가, 한 분을 통해 모든 민족으로 열리는 모양입니다.","s":579.852,"e":585.644,"p":true,"h":false},{"t":"이 개념이 읽는 사람에게 묻는 것","s":586.728,"e":589.018,"p":false,"h":true},{"t":"남은 자 개념은 두 방향의 오해를 막아 줍니다.","s":590.04,"e":593.407,"p":false,"h":false},{"t":"하나는 교만의 오해입니다.","s":594.072,"e":596.078,"p":false,"h":false},{"t":"내가 남은 자에 속한다고 생각하는 사람은 자기 자격이 아니라 은혜로 남겨진 것임을 기억해야 합니다.","s":596.664,"e":602.718,"p":false,"h":false},{"t":"엘리야처럼 \"나만 남았다\"고 생각하는 사람에게 하나님은 칠천 명을 보여 주셨습니다.","s":603.36,"e":608.814,"p":false,"h":false},{"t":"하나님의 일은 내가 아는 것보다 넓고, 내가 그 일을 혼자 지고 있는 것이 아닙니다.","s":609.48,"e":615.097,"p":true,"h":false},{"t":"다른 하나는 절망의 오해입니다.","s":616.176,"e":618.511,"p":false,"h":false},{"t":"교회가 작아지고 말씀이 외면당하는 시대에 \"아무것도 남지 않았다\"고 느끼는 사람에게, 이사야서는 그루터기를 보여 줍니다.","s":619.092,"e":627.234,"p":false,"h":false},{"t":"눈에 보이는 것이 베어 낸 밑동뿐일 때에도, 하나님은 그 안에 거룩한 씨를 두셨다고 말씀하십니다(6:13).","s":627.876,"e":636.047,"p":false,"h":false},{"t":"숫자가 약속의 척도가 아닙니다.","s":636.552,"e":638.969,"p":true,"h":false},{"t":"그러므로 남은 자는 우월한 집단의 이름이 아니라, 은혜로 붙들려 말씀을 간직하고 다음 세대에 넘기는 자들의 이름입니다.","s":640.044,"e":648.371,"p":false,"h":false},{"t":"이사야가 아들의 이름을 걸고 걸어 다녔듯, 그들은 자기 존재 자체가 하나님이 아직 포기하지 않으셨다는 증거가 됩니다.","s":648.936,"e":656.909,"p":true,"h":false}], NAV = {"prev":{"href":"doc03.html","title":"3. 약속을 듣고도 왜 돌이키지 않는가"},"next":{"href":"doc05.html","title":"5. 도구로 쓰셨는데 왜 벌하시는가"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);

  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;

  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
