<script>
(function () {
  const TITLE = "13. 회복이 약속된 뒤에도 왜 죄의 탄식이 계속되는가", AUDIO_SRC = "doc13_2610241127.mp3", DUR = 1134, SEGS = [{"t":"회복이 약속된 뒤에도 왜 죄의 탄식이 계속되는가: 이사야 56~59장, 63~64장을 읽다","s":0,"e":9.015,"p":false,"h":true},{"t":"본문: 이사야 56:1-12; 57:14-21; 58:1-14; 59:1-21; 63:7-64:12 (함께 읽을 본문: 사 6:9-10; 9:7; 32:15; 40:1-2; 44:3; 50:2; 53:1-12; 55:1-13; 60:1-3; 61:1-3; 65:1-2; 롬 11:26-27; 눅 4:16-21; 요일 1:8-9)","s":10.188,"e":58.366,"p":true,"h":false},{"t":"12번 글은 53장에서 끝났고, 이어지는 54~55장에서 책의 분위기는 확 달라집니다.","s":59.292,"e":66.727,"p":false,"h":false},{"t":"54장은 \"노래하라\"로 시작하고 55장은 \"오라\"로 시작합니다.","s":67.32,"e":72.261,"p":false,"h":false},{"t":"독자는 이제 이 책의 문제가 풀렸다고 느낍니다.","s":72.9,"e":76.328,"p":false,"h":false},{"t":"그런데 56장을 펴면 다시 책망이 나옵니다.","s":76.968,"e":80.464,"p":false,"h":false},{"t":"눈먼 파수꾼, 우상숭배, 공의 없는 금식, 그리고 \"우리의 죄악이 우리를 쳐서 증언합니다\"라는 백성의 고백이 이어집니다.","s":80.748,"e":90.759,"p":false,"h":false},{"t":"9장을 읽고 느낀 답답함이 책의 맨 끝에서 다시 돌아오는 것입니다.","s":91.44,"e":96.05,"p":false,"h":false},{"t":"이번 물음은 그것입니다.","s":96.696,"e":98.567,"p":false,"h":false},{"t":"대속이 이루어지고 초대가 선포되었는데, 왜 죄의 탄식이 끝나지 않는가.","s":99.108,"e":104.145,"p":true,"h":false},{"t":"먼저 이 장들이 어떤 자리에 서 있는가","s":105.228,"e":107.918,"p":false,"h":true},{"t":"56~66장의 배경에 대해서는 9번 글에서 본 입장 차이가 그대로 있습니다.","s":109.08,"e":115.24,"p":false,"h":false},{"t":"귀환 이후의 공동체에게 주어진 말씀으로 읽는 학자가 많고, 단일 저자 입장에서는 이사야가 환상 가운데 본 미래의 백성에게 한 말씀으로 읽습니다.","s":115.884,"e":125.87,"p":false,"h":false},{"t":"귀환한 백성이 약속하신 영광 대신 가난과 불의와 갈등을 만났다고 보는 읽기는 학개, 스가랴, 말라기가 그리는 귀환 후 현실과 잘 맞는다고 흔히 지적됩니다.","s":126.54,"e":138.26,"p":false,"h":false},{"t":"이것은 일반적으로 제시되는 해석이고 본문이 직접 시대를 밝히는 것은 아닙니다.","s":138.924,"e":144.428,"p":false,"h":false},{"t":"어느 입장에서든 최종 형태의 책을 읽는 우리에게 이 장들은 같은 일을 합니다.","s":145.008,"e":150.286,"p":false,"h":false},{"t":"선포된 구원과 아직 이루어지지 않은 현실이 한 공동체 안에 겹쳐 있음을 보여 줍니다.","s":150.912,"e":156.329,"p":true,"h":false},{"t":"열린 문과 눈먼 파수꾼","s":157.428,"e":159.474,"p":false,"h":true},{"t":"56장은 놀라운 말로 시작합니다.","s":160.344,"e":163.004,"p":false,"h":false},{"t":"이방인과 고자에게 문이 열립니다(56:3-8).","s":163.656,"e":168.376,"p":false,"h":false},{"t":"신명기 23장 1절부터 3절의 규정으로는 회중에 들어올 수 없던 사람들이 하나님의 집에서 이스라엘의 이름보다 나은 이름을 받습니다.","s":168.912,"e":177.863,"p":false,"h":false},{"t":"그리고 7절은 \"내 집은 만민이 기도하는 집이라 일컬음이 되리라\"고 합니다.","s":178.524,"e":183.792,"p":false,"h":false},{"t":"예수께서 성전을 정화하실 때 이 구절을 인용하셨습니다.","s":184.392,"e":188.49,"p":false,"h":false},{"t":"이 열림은 14번 글에서 따로 다루겠습니다.","s":189.108,"e":192.35,"p":true,"h":false},{"t":"그런데 바로 9절부터 분위기가 바뀝니다.","s":193.464,"e":196.407,"p":false,"h":false},{"t":"문이 열렸는데 문을 지키는 사람이 문제입니다.","s":196.992,"e":200.29,"p":false,"h":false},{"t":"\"그의 파수꾼들은 맹인이요 다 무지하며 다 벙어리 개라 짖지 못하며\"(56:10).","s":200.916,"e":207.517,"p":false,"h":false},{"t":"파수꾼은 위험을 보고 경고하는 일을 맡은 사람인데, 보지 못하고 짖지 못합니다.","s":208.08,"e":213.652,"p":false,"h":false},{"t":"지도자들은 각기 제 길로 돌아가 자기 이익만 구합니다(56:11).","s":214.236,"e":219.769,"p":false,"h":false},{"t":"53장 6절의 \"각기 제 길로 갔거늘\"이 속죄를 말한 장 뒤에서 다시 나타나는 점이 눈에 띕니다.","s":220.176,"e":226.881,"p":false,"h":false},{"t":"이것은 제 읽기입니다.","s":227.556,"e":229.536,"p":true,"h":false},{"t":"고치시겠다는 약속, 그리고 공의 없는 금식","s":230.616,"e":234.5,"p":false,"h":true},{"t":"57장은 우상숭배를 다시 책망합니다.","s":235.584,"e":238.781,"p":false,"h":false},{"t":"그러나 이 장에서 가장 눈에 들어오는 것은 15절입니다.","s":239.436,"e":243.214,"p":false,"h":false},{"t":"\"지극히 높고 영원히 거하시며 거룩하다 이름하는 이가 이와 같이 말씀하시되 내가 높고 거룩한 곳에 있으며 또한 통회하고 마음이 겸손한 자와 함께 있나니.\"","s":243.828,"e":254.065,"p":false,"h":false},{"t":"높은 곳과 낮은 마음이 한 분 안에서 만납니다.","s":254.664,"e":257.879,"p":false,"h":false},{"t":"그리고 17절부터 19절은 6장 10절의 말씀을 뒤집는 것처럼 읽힙니다.","s":258.48,"e":263.925,"p":false,"h":false},{"t":"6장 10절은 \"돌이켜 고침을 받을까 하노라\"고 했는데, 57장 18절은 이렇게 말합니다.","s":264.528,"e":271.194,"p":false,"h":false},{"t":"\"내가 그의 길을 보았은즉 그를 고쳐 주며 그를 인도하며.\"","s":271.872,"e":275.754,"p":false,"h":false},{"t":"돌이킬 수 없던 백성에게 하나님이 먼저 고치시겠다고 나서십니다.","s":276.192,"e":280.552,"p":false,"h":false},{"t":"2번 글에서 6장 10절의 목적절에 주목했던 것을 기억하시면, 그 막혀 있던 길이 여기서 하나님 쪽에서 열리는 것으로 읽을 수 있습니다.","s":281.196,"e":290.24,"p":false,"h":false},{"t":"이것도 제 문학적 읽기입니다.","s":290.844,"e":293.11,"p":true,"h":false},{"t":"58장은 같은 공동체의 다른 문제를 보여 줍니다.","s":294.156,"e":297.91,"p":false,"h":false},{"t":"이 백성은 금식합니다.","s":298.476,"e":300.416,"p":false,"h":false},{"t":"그것도 열심히 합니다.","s":300.996,"e":302.726,"p":false,"h":false},{"t":"그런데 3절에서 항의합니다.","s":303.264,"e":305.41,"p":false,"h":false},{"t":"\"우리가 금식하되 주께서 보지 아니하심은 어찌함이니이까.\"","s":305.712,"e":309.32,"p":false,"h":false},{"t":"대답은 날카롭습니다.","s":309.924,"e":311.66,"p":false,"h":false},{"t":"금식하는 날에도 자기 이익을 구하고 일꾼을 압제하며 다투고 싸운다는 것입니다(58:3-4).","s":312.3,"e":319.867,"p":false,"h":false},{"t":"하나님이 기뻐하시는 금식은 흉악의 결박을 풀어 주고, 주린 자에게 양식을 나누며, 유리하는 빈민을 집에 들이는 일입니다(58:6-7).","s":320.364,"e":331.404,"p":false,"h":false},{"t":"그러면 \"네 빛이 아침같이 비칠 것이며\"(58:8)라고 합니다.","s":331.884,"e":338.185,"p":false,"h":false},{"t":"9장에서 흑암에 행하던 백성에게 비친 큰 빛이, 여기서는 공의를 행하는 공동체 안에서 비치는 빛으로 말해집니다.","s":338.796,"e":346.806,"p":false,"h":false},{"t":"회복된 공동체에게도 예배의 형식은 있으나 삶의 정의가 비어 있을 수 있다는 경고입니다.","s":347.472,"e":353.332,"p":true,"h":false},{"t":"59장: 손이 짧은 것이 아니다","s":354.42,"e":357.386,"p":false,"h":true},{"t":"이 단락의 중심은 59장입니다.","s":358.524,"e":361.227,"p":false,"h":false},{"t":"1절과 2절은 이 시리즈가 계속 물어 온 물음에 정면으로 답합니다.","s":361.872,"e":366.243,"p":false,"h":false},{"t":"\"여호와의 손이 짧아 구원하지 못하심도 아니요 귀가 둔하여 듣지 못하심도 아니라 오직 너희 죄악이 너희와 너희 하나님 사이를 갈라놓았고.\"","s":366.876,"e":375.713,"p":false,"h":false},{"t":"구원이 오지 않는 이유가 하나님의 능력 부족이 아니라는 선언입니다.","s":375.984,"e":380.303,"p":false,"h":false},{"t":"9장 후렴의 \"그의 손이 여전히 펴져 있도다\"를 읽고 느낀 답답함의 한 답이 여기 있다고 저는 봅니다.","s":380.916,"e":387.774,"p":false,"h":false},{"t":"손은 짧아진 적이 없고, 문제는 사이를 막은 죄입니다.","s":388.44,"e":392.755,"p":true,"h":false},{"t":"3절부터 8절은 백성의 죄를 열거하고, 9절부터 15절에서 말하는 이가 \"우리\"로 바뀝니다.","s":393.84,"e":400.787,"p":false,"h":false},{"t":"\"그러므로 공평이 우리에게서 멀고 의가 우리에게 미치지 못한다.","s":401.436,"e":405.788,"p":false,"h":false},{"t":"우리가 빛을 바라나 어둠뿐이요...","s":406.404,"e":408.616,"p":false,"h":false},{"t":"우리가 소경같이 담을 더듬으며\"(59:9-10).","s":409.248,"e":413.808,"p":false,"h":false},{"t":"그리고 12절은 이렇게 고백합니다.","s":414.36,"e":416.905,"p":false,"h":false},{"t":"\"우리의 허물이 주 앞에 많고 우리의 죄가 우리에게 대하여 증언하오니.\"","s":417.42,"e":421.977,"p":false,"h":false},{"t":"이 대목이 중요합니다.","s":422.604,"e":424.314,"p":false,"h":false},{"t":"1~39장에서 이 백성은 고소당하는 쪽이었고 책망을 듣고도 돌이키지 않았습니다.","s":424.98,"e":431.322,"p":false,"h":false},{"t":"그런데 이제 처음으로 백성 자신이 자기 죄를 자기 입으로 말합니다.","s":431.928,"e":436.32,"p":false,"h":false},{"t":"53장 4절에서 \"우리\"가 처음으로 알아본 것과 같은 형식입니다.","s":436.932,"e":441.759,"p":false,"h":false},{"t":"탄식이 계속된다는 것은 이 책의 후반부에서 백성이 달라졌다는 증거이기도 합니다.","s":442.404,"e":448.163,"p":false,"h":false},{"t":"고소를 부인하던 백성이 고백하는 백성이 되었습니다.","s":448.776,"e":452.52,"p":true,"h":false},{"t":"그리고 15절 끝부터 16절이 이어집니다.","s":453.6,"e":456.771,"p":false,"h":false},{"t":"하나님이 공의가 없는 것을 보시고 \"사람이 없음을 보시며 중보자가 없음을 이상히 여기셨으므로 자기 팔로 구원을 베푸시고 자기의 공의를 스스로 의지하사.\"","s":457.056,"e":467.162,"p":false,"h":false},{"t":"12번 글에서 이 구절을 본 적이 있습니다.","s":467.748,"e":470.627,"p":false,"h":false},{"t":"53장 1절의 \"여호와의 팔이 누구에게 나타났느냐\"와 같은 \"팔\"입니다.","s":470.952,"e":475.862,"p":false,"h":false},{"t":"53장의 대속이 이미 이루어졌다면 왜 여기서 다시 \"중보자가 없다\"고 말하는가 하는 의문이 생길 수 있습니다.","s":476.532,"e":483.917,"p":false,"h":false},{"t":"이 점은 읽기가 갈립니다.","s":484.596,"e":486.526,"p":false,"h":false},{"t":"한 읽기는 59장이 53장 이전의 상태를 회고하는 말이라 하고, 다른 읽기는 53장의 구원이 선포되었어도 그 구원이 온 공동체에서 완성되려면 하나님이 다시 일하셔야 한다는 말이라 합니다.","s":487.188,"e":500.592,"p":false,"h":false},{"t":"저는 후자 쪽으로 읽는 것이 이 장의 흐름과 맞는다고 보지만, 본문이 이 문제를 직접 설명하지는 않으므로 제 판단일 뿐입니다.","s":501.192,"e":509.585,"p":true,"h":false},{"t":"구속자가 오시고, 영이 머문다","s":510.66,"e":513.504,"p":false,"h":true},{"t":"20절과 21절은 이 장의 답입니다.","s":514.692,"e":517.733,"p":false,"h":false},{"t":"\"구속자가 시온에 이르며 야곱 가운데에서 죄과를 떠나는 자에게 이르리라.\"","s":518.328,"e":523.072,"p":false,"h":false},{"t":"바울은 로마서 11장 26절에서 이 구절을 인용합니다.","s":523.656,"e":527.846,"p":false,"h":false},{"t":"4번 글에서 \"온 이스라엘이 구원을 얻으리라\"의 읽기가 갈린다고 말씀드린 그 대목입니다.","s":528.444,"e":534.409,"p":true,"h":false},{"t":"이어서 21절은 언약을 말합니다.","s":535.5,"e":538.12,"p":false,"h":false},{"t":"\"내가 그들과 세운 언약이 이러하니 곧 네 위에 있는 나의 영과 네 입에 두는 나의 말이 이제부터 영원까지 네 입에서나 네 후손의 입에서나 네 후손의 후손의 입에서 떠나지 아니하리라.\"","s":538.812,"e":550.584,"p":false,"h":false},{"t":"여기서 이 책의 두 줄기가 만납니다.","s":551.16,"e":553.916,"p":false,"h":false},{"t":"하나는 말씀입니다.","s":554.58,"e":556.121,"p":false,"h":false},{"t":"40장 8절의 \"우리 하나님의 말씀은 영원히 서리라\"와 55장 11절의 \"헛되이 돌아오지 아니하고\"가 이 줄기입니다.","s":556.74,"e":565.12,"p":false,"h":false},{"t":"다른 하나는 영입니다.","s":565.74,"e":567.383,"p":false,"h":false},{"t":"32장 15절의 \"위에서부터 성령을 우리에게 부어 주시리니\"와 44장 3절의 \"내 영을 네 자손에게 부어 주리니\"가 이 줄기입니다.","s":567.972,"e":576.891,"p":false,"h":false},{"t":"이 두 줄기가 한 언약 안에서 후손에게 이어진다고 합니다.","s":577.512,"e":581.521,"p":true,"h":false},{"t":"이 구절은 이 글의 물음에 가장 직접적인 답을 줍니다.","s":582.624,"e":586.408,"p":false,"h":false},{"t":"53장은 죄의 문제를 해결합니다.","s":587.052,"e":589.761,"p":false,"h":false},{"t":"그러나 이 책이 처음부터 물어 온 것은 죄책만이 아니라 닫힌 눈과 완고한 마음이었습니다.","s":590.364,"e":596.715,"p":false,"h":false},{"t":"닫힌 마음이 열리는 일은 영이 부어지는 일이며, 이는 사죄와 같은 순간에 완성되는 일이 아니라 세대를 이어 가는 일로 그려집니다.","s":597.312,"e":605.947,"p":false,"h":false},{"t":"사함과 변화는 연결되어 있으되 같은 것이 아니라는 이해가 책 안에서 가능합니다.","s":606.6,"e":611.735,"p":false,"h":false},{"t":"이것은 제 종합입니다.","s":612.36,"e":614.264,"p":false,"h":false},{"t":"개혁주의 전통이 칭의와 성화를 구별하되 나누지 않는 것과 이 구조가 어울린다고 저는 봅니다.","s":614.88,"e":621.037,"p":false,"h":false},{"t":"다만 이사야서 자체가 이 교리를 정리한 것은 아니며, 이 연결은 신학적 해석입니다.","s":621.684,"e":627.719,"p":true,"h":false},{"t":"60~62장: 약속은 줄어들지 않는다","s":628.812,"e":632.954,"p":false,"h":true},{"t":"59장 뒤에 오는 60장부터 62장은 영광의 약속입니다.","s":634.14,"e":638.831,"p":false,"h":false},{"t":"60장 1절은 \"일어나 빛을 발하라 이는 네 빛이 이르렀고\"라고 하고, 61장 1절부터 3절은 기름 부음 받은 이가 가난한 자에게 복음을 전하고 마음이 상한 자를 고치며 갇힌 자에게 놓임을 선포한다고 말합니다.","s":639.468,"e":654.147,"p":false,"h":false},{"t":"예수께서 나사렛 회당에서 이 구절을 읽으시고 \"이 글이 오늘 너희 귀에 응하였느니라\"고 하셨습니다(눅 4:21).","s":654.768,"e":663.688,"p":false,"h":false},{"t":"이 장들은 탄식으로 책이 끝나지 않도록 약속을 두텁게 쌓습니다.","s":664.2,"e":668.781,"p":false,"h":false},{"t":"59장의 고백 바로 뒤에 이 약속이 오는 순서가 중요합니다.","s":669.384,"e":673.489,"p":false,"h":false},{"t":"고백이 먼저 있고, 약속이 이어집니다.","s":674.136,"e":677.416,"p":true,"h":false},{"t":"63~64장: 마지막 기도","s":678.528,"e":682.194,"p":false,"h":true},{"t":"그리고 63장 7절부터 64장 12절에 이 책에서 가장 긴 공동체의 기도가 있습니다.","s":683.352,"e":689.946,"p":false,"h":false},{"t":"구조가 분명합니다.","s":690.552,"e":692.107,"p":false,"h":false},{"t":"먼저 은혜를 회상합니다(63:7-14).","s":692.676,"e":697.031,"p":false,"h":false},{"t":"하나님이 출애굽에서 그들과 함께하시고 \"그들의 모든 고난에 동참하사\"(63:9) 안아 주셨다는 것입니다.","s":697.536,"e":705.746,"p":false,"h":false},{"t":"그런데 10절은 곧바로 말합니다.","s":706.392,"e":708.899,"p":false,"h":false},{"t":"\"그러나 그들이 반역하여 주의 성령을 근심하게 하셨으므로.\"","s":709.452,"e":713.246,"p":false,"h":false},{"t":"은혜의 기억이 곧 죄의 기억으로 이어집니다.","s":713.736,"e":716.791,"p":true,"h":false},{"t":"그다음 탄원입니다.","s":717.876,"e":719.318,"p":false,"h":false},{"t":"15절에서 백성이 묻습니다.","s":719.784,"e":721.964,"p":false,"h":false},{"t":"\"주의 열성과 주의 능력이 어디 있나이까.\"","s":722.484,"e":725.262,"p":false,"h":false},{"t":"이 \"열성\"은 앞에서 따라온 \"만군의 여호와의 열심이 이를 이루시리라\"(9:7; 37:32)와 이어 읽을 수 있습니다.","s":725.616,"e":735.563,"p":false,"h":false},{"t":"약속받은 백성이 그 열심이 어디 있느냐고 묻는 것입니다.","s":736.2,"e":740.181,"p":false,"h":false},{"t":"이 물음은 불신이라기보다 약속을 붙들고 하는 물음입니다.","s":740.808,"e":745.023,"p":true,"h":false},{"t":"16절의 고백도 눈에 띕니다.","s":746.136,"e":748.402,"p":false,"h":false},{"t":"\"아브라함은 우리를 모르고 이스라엘은 우리를 인정하지 아니할지라도 주는 우리 아버지시라.\"","s":748.944,"e":754.673,"p":false,"h":false},{"t":"조상의 공로에 기대지 않고 직접 \"아버지\"를 부릅니다.","s":755.316,"e":759.407,"p":false,"h":false},{"t":"이 부름은 1장 2절의 \"자식을 양육하였거늘 그들이 나를 거역하였느니라\"로 시작한 책의 첫 장면과 이어집니다.","s":760.068,"e":767.741,"p":false,"h":false},{"t":"하나님이 아버지로서 탄식하며 시작한 책이, 백성이 하나님을 \"우리 아버지\"라 부르는 기도로 맺어지는 것입니다.","s":768.384,"e":775.938,"p":false,"h":false},{"t":"이 수미상관은 제 읽기입니다.","s":776.592,"e":779.097,"p":true,"h":false},{"t":"17절은 2번 글에서 다룬 구절입니다.","s":780.192,"e":783.113,"p":false,"h":false},{"t":"\"어찌하여 우리로 주의 길에서 떠나게 하시며 우리 마음을 완고하게 하사.\"","s":783.432,"e":788.239,"p":false,"h":false},{"t":"그때 이 기도가 책임을 피하려는 말이 아니라 무력함의 고백이라는 점을 보았습니다.","s":788.832,"e":794.327,"p":false,"h":false},{"t":"이제 이 책의 마지막 부분에서 그 기도가 다시 나옵니다.","s":794.988,"e":798.979,"p":false,"h":false},{"t":"6장에서 선고된 완고함이 책의 맨 끝에서 기도로 올려지는 것입니다.","s":799.632,"e":804.326,"p":true,"h":false},{"t":"그리고 64장 1절의 간구가 이 기도의 중심입니다.","s":805.392,"e":809.445,"p":false,"h":false},{"t":"\"원하건대 주는 하늘을 찢고 강림하사.\"","s":810.072,"e":812.741,"p":false,"h":false},{"t":"40장 3절의 \"여호와의 길을 예비하라\"에서 하나님이 오시는 그림이 시작되었는데, 이제 백성이 직접 \"오소서\" 하고 부릅니다.","s":813.384,"e":821.788,"p":false,"h":false},{"t":"이 간구는 초대의 말씀을 받은 백성의 응답이라고 읽을 수 있습니다.","s":822.42,"e":826.926,"p":false,"h":false},{"t":"마가복음 1장 10절이 예수의 세례에서 \"하늘이 갈라지심\"을 말하는 것이 이 구절과 이어진다고 보는 학자들이 있으나, 이 연결은 제가 확인하지 못했으므로 책으로 내실 때 대조가 필요합니다.","s":827.568,"e":840.273,"p":true,"h":false},{"t":"5절부터 7절은 고백입니다.","s":841.356,"e":843.787,"p":false,"h":false},{"t":"\"우리는 다 부정한 자 같아서 우리의 의는 다 더러운 옷 같으며.\"","s":844.056,"e":848.394,"p":false,"h":false},{"t":"여기서 \"더러운 옷\"은 의식적으로 부정한 옷을 가리키는 표현으로 읽는 것이 일반적이라고 알고 있습니다.","s":849.024,"e":855.816,"p":false,"h":false},{"t":"정확한 용법은 원어 사전으로 확인해 주십시오.","s":856.476,"e":859.506,"p":false,"h":false},{"t":"이 구절의 요점은 분명합니다.","s":859.968,"e":862.212,"p":false,"h":false},{"t":"이 백성이 가진 의로는 하나님 앞에 설 수 없다는 고백입니다.","s":862.812,"e":866.931,"p":false,"h":false},{"t":"그리고 8절이 이어집니다.","s":867.564,"e":869.492,"p":false,"h":false},{"t":"\"그러나 여호와여 이제나 주는 우리 아버지시니이다 우리는 진흙이요 주는 토기장이시니.\"","s":870.012,"e":876.031,"p":false,"h":false},{"t":"45장 9절에서 토기장이와 다투지 말라고 경고받았던 토기가, 여기서는 토기장이의 손에 자신을 맡기며 부르짖습니다.","s":876.636,"e":884.955,"p":false,"h":false},{"t":"같은 비유가 반발의 자리에서 한 번, 항복의 자리에서 한 번 쓰이는 것입니다.","s":885.6,"e":890.931,"p":true,"h":false},{"t":"왜 탄식이 계속되는가","s":892.008,"e":893.892,"p":false,"h":true},{"t":"이제 처음의 물음에 본문에서 읽을 수 있는 만큼 답하겠습니다.","s":895.068,"e":899.224,"p":true,"h":false},{"t":"우선, 선포된 구원과 이루어진 구원 사이에 시간이 있습니다.","s":900.324,"e":904.7,"p":false,"h":false},{"t":"40장 1절의 \"위로하라\"는 선언이고, 60~62장의 영광은 약속입니다.","s":905.292,"e":911.273,"p":false,"h":false},{"t":"이 책은 처음부터 말씀을 먼저 주시고 사건을 뒤따르게 하는 방식으로 일해 왔습니다.","s":911.916,"e":917.445,"p":false,"h":false},{"t":"위로가 사건에 앞서는 것(9번 글에서 본 대로)은 탄식이 그 사건 이후에도 남는 것과 같은 구조의 다른 면입니다.","s":918.072,"e":926.299,"p":false,"h":false},{"t":"약속은 확실하지만 아직 이루어지는 중에 있습니다.","s":926.964,"e":930.305,"p":true,"h":false},{"t":"다음으로, 죄책이 해결되는 일과 마음이 새로워지는 일은 같은 일이 아닙니다.","s":931.392,"e":936.587,"p":false,"h":false},{"t":"53장은 앞의 일을 다루고, 59장 21절의 영과 말씀의 언약은 뒤의 일을 약속합니다.","s":937.224,"e":944.029,"p":false,"h":false},{"t":"그 사이의 시간에 공동체는 여전히 자기 죄를 봅니다.","s":944.388,"e":948.147,"p":false,"h":false},{"t":"고백이 계속되는 것은 새로워지는 중에 있는 공동체의 모습이라고 읽을 수 있습니다.","s":948.78,"e":954.173,"p":true,"h":false},{"t":"그리고 이 책은 회복된 공동체의 불순함을 감추지 않습니다.","s":955.26,"e":959.495,"p":false,"h":false},{"t":"56장의 눈먼 파수꾼, 58장의 공의 없는 금식, 65장에서 종들과 배반자를 가르는 선(65:8-15)이 그것입니다.","s":960.048,"e":971.517,"p":false,"h":false},{"t":"4번 글에서 본 대로 남은 자는 선택된 우월한 집단이 아니라 은혜로 붙들린 사람들입니다.","s":972.18,"e":978.109,"p":false,"h":false},{"t":"회복된 공동체가 완전하다는 말은 어디에도 없고, 오히려 그 안에서도 종과 배반자를 구별하시는 하나님이 그려집니다.","s":978.768,"e":987.05,"p":true,"h":false},{"t":"끝으로, 탄식은 실패의 흔적이 아니라 믿음의 형식으로 책에 남겨져 있습니다.","s":988.164,"e":993.793,"p":false,"h":false},{"t":"이 마지막 기도는 은혜의 회상으로 시작하고 아버지 호칭으로 이어지며, \"오소서\"로 간구합니다.","s":994.428,"e":1001.059,"p":false,"h":false},{"t":"하나님이 이 기도를 지우지 않고 정경에 두셨다는 것이 중요합니다.","s":1001.664,"e":1006.316,"p":false,"h":false},{"t":"탄식하는 백성을 향해 65장 1절과 2절의 응답이 이어집니다.","s":1006.884,"e":1011.602,"p":false,"h":false},{"t":"\"나는 내 이름을 부르지 아니하던 나라에게 말하기를 내가 여기 있노라 내가 여기 있노라 하였으며 나는 패역하는 백성 곧 ...","s":1012.212,"e":1019.971,"p":false,"h":false},{"t":"종일 손을 펴서 불렀나니.\"","s":1020.492,"e":1022.503,"p":false,"h":false},{"t":"이 부르는 손은 14번 글에서 이어 읽겠습니다.","s":1023.12,"e":1026.512,"p":true,"h":false},{"t":"이미와 아직","s":1027.584,"e":1028.693,"p":false,"h":true},{"t":"신약은 같은 구조를 그대로 가지고 있습니다.","s":1029.852,"e":1032.899,"p":false,"h":false},{"t":"그리스도 안에서 죄가 사해졌다고 선언하면서도, 요한일서 1장 8절부터 9절은 \"만일 우리가 죄가 없다고 하면 스스로 속이는 것이니\", \"우리가 우리 죄를 자백하면 그는 미쁘시고 의로우사 우리 죄를 사하시고\"라고 합니다.","s":1033.488,"e":1048.577,"p":false,"h":false},{"t":"개혁주의 전통은 이것을 성화의 문제로 설명해 왔습니다.","s":1049.22,"e":1053.08,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서는 이 생에서 성도 안에 부패의 잔재가 남아 있어서 영과 육의 싸움이 계속된다고 말하는 것으로 알고 있습니다.","s":1053.72,"e":1062.514,"p":false,"h":false},{"t":"조항 번호와 정확한 문구는 확인하지 못했으므로, 책으로 내실 때는 원문을 대조해 주십시오.","s":1063.188,"e":1069.264,"p":false,"h":false},{"t":"이사야서의 탄식과 이 교리는 같은 현실의 구약과 신약 쪽 표현으로 읽을 수 있습니다.","s":1069.848,"e":1075.98,"p":false,"h":false},{"t":"이것은 제 연결입니다.","s":1076.616,"e":1078.489,"p":true,"h":false},{"t":"읽는 사람에게 남는 것","s":1079.532,"e":1081.246,"p":false,"h":true},{"t":"이 장들은 구원을 받은 사람이 겪는 곤혹에 이름을 붙여 줍니다.","s":1082.232,"e":1086.39,"p":false,"h":false},{"t":"용서를 믿는데도 같은 죄를 다시 짓고, 위로를 받았는데도 마음이 여전히 굳어 있다고 느끼는 경험입니다.","s":1086.948,"e":1094.157,"p":false,"h":false},{"t":"이사야서는 그 경험이 믿음의 부족을 증명한다고 말하지 않고, 그 경험을 하나님 앞에 그대로 올려 드리는 기도의 길을 보여 줍니다.","s":1094.796,"e":1103.372,"p":false,"h":false},{"t":"회상하고, 고백하고, 아버지를 부르고, \"오소서\" 하는 것입니다.","s":1104.012,"e":1109.538,"p":true,"h":false},{"t":"그리고 이 기도가 기도로 끝나지 않는다는 점을 기억해야 합니다.","s":1110.636,"e":1115.019,"p":false,"h":false},{"t":"59장은 하나님의 손이 짧지 않다고 했고, 구속자가 오시리라고 했으며, 영과 말씀이 후손에게 이어지리라고 했습니다.","s":1115.568,"e":1124.236,"p":false,"h":false},{"t":"탄식하는 백성에게 이 책이 주는 것은 고백을 거두라는 말이 아니라, 고백하는 자리로 오시는 분에 대한 약속입니다.","s":1124.856,"e":1132.625,"p":true,"h":false}], NAV = {"prev":{"href":"doc12.html","title":"12. 의로운 분이 왜 대신 짊어져야 하는가"},"next":{"href":"doc14.html","title":"14. 이스라엘의 불순종과 열방의 구원은 어떻게 이어지는가"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];

  const audio = new Audio(AUDIO_SRC);

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;

    $('tot').textContent = fmt(DUR);

  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }

  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {

    $('cur').textContent = fmt(t);

    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });

    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
