<script>
(function () {
  const TITLE = "10. 이방 왕 고레스를 왜 기름 부은 자라 부르시는가", AUDIO_SRC = "doc10_2610241127.mp3", DUR = 616, SEGS = [{"t":"이방 왕 고레스를 왜 \"기름 부은 자\"라 부르시는가: 하나님이 이방 권력을 쓰시는 방식","s":0,"e":6.381,"p":false,"h":true},{"t":"본문: 이사야 44:24-45:25 (함께 읽을 본문: 사 41:1-4, 25; 46:9-13; 48:12-16; 42:6-7; 55:3-5; 스 1:1-4; 대하 36:22-23; 롬 9:19-21; 빌 2:9-11)","s":7.488,"e":38.759,"p":true,"h":false},{"t":"9번 글에서 고레스의 이름이 미리 불렸다는 점이 저자 논쟁의 한 근거라는 것을 보았습니다.","s":39.636,"e":45.477,"p":false,"h":false},{"t":"이번에는 논쟁을 떠나 본문이 고레스를 어떻게 부르는지를 읽겠습니다.","s":46.152,"e":50.687,"p":false,"h":false},{"t":"45장 1절은 이렇게 시작합니다.","s":51.336,"e":54.079,"p":false,"h":false},{"t":"\"여호와께서 그의 기름 부으신 자 고레스에게 이르시되.\"","s":54.684,"e":58.445,"p":false,"h":false},{"t":"히브리어로 \"기름 부은 자\"는 마쉬아흐, 곧 메시아와 같은 낱말입니다.","s":59.004,"e":64.218,"p":false,"h":false},{"t":"이스라엘의 왕과 제사장에게 쓰이던 이 칭호가 이방 왕에게 주어진 것입니다.","s":64.836,"e":70.028,"p":false,"h":false},{"t":"구약에서 이방 왕에게 이 칭호가 쓰인 곳은 여기뿐이라고 흔히 말합니다.","s":70.704,"e":75.614,"p":false,"h":false},{"t":"이 물음이 이번 글의 주제입니다.","s":76.284,"e":78.687,"p":true,"h":false},{"t":"누가 이 자리에 서는가","s":79.452,"e":81.21,"p":false,"h":true},{"t":"앞 글들의 흐름에서 읽으면 이 자리의 의미가 보입니다.","s":82.368,"e":86.117,"p":false,"h":false},{"t":"7장의 아하스는 약속을 거절했고, 37장의 히스기야는 하나님을 신뢰했으나 39장에서 무너졌습니다.","s":86.76,"e":94.339,"p":false,"h":false},{"t":"이스라엘의 왕들은 이 책에서 끝내 약속된 왕이 되지 못했습니다.","s":95.004,"e":99.485,"p":false,"h":false},{"t":"그런데 40장 이후에서 다윗의 후손은 거의 나오지 않고, 하나님은 직접 오시며 먼저 이방 왕을 부르십니다.","s":100.116,"e":107.67,"p":false,"h":false},{"t":"44장 28절에서 고레스는 \"나의 목자\"라 불리는데, 40장 11절에서 목자같이 양 떼를 먹이시겠다고 하신 분이 그 이름을 이방 왕에게 빌려 주신 셈입니다.","s":108.324,"e":119.493,"p":false,"h":false},{"t":"이 대비는 제가 읽어 낸 연결입니다.","s":120.132,"e":122.839,"p":true,"h":false},{"t":"고레스에게 맡겨진 일과 그가 모르는 것","s":123.912,"e":126.684,"p":false,"h":true},{"t":"44장 28절과 45장 1절부터 4절은 일을 구체적으로 적습니다.","s":127.692,"e":133.111,"p":false,"h":false},{"t":"예루살렘이 건축될 것이고 성전의 기초가 놓일 것이며, 하나님이 그의 오른손을 잡아 나라들을 그 앞에 항복시키고 성문을 닫히지 않게 하실 것이라고 합니다.","s":133.74,"e":143.759,"p":false,"h":false},{"t":"목적은 4절에 있습니다.","s":144.396,"e":146.331,"p":false,"h":false},{"t":"\"내 종 야곱, 내가 택한 이스라엘을 위하여.\"","s":146.628,"e":149.911,"p":false,"h":false},{"t":"45장 13절은 그가 값이나 상을 바라지 않고 사로잡힌 백성을 놓아 줄 것이라고 합니다.","s":150.48,"e":156.747,"p":true,"h":false},{"t":"그런데 이 선언에서 눈에 띄는 것은 고레스가 하나님을 모른다는 점입니다.","s":157.824,"e":162.731,"p":false,"h":false},{"t":"45장 4절과 5절은 \"너는 나를 알지 못하였으나\"라고 두 번 말합니다.","s":163.368,"e":168.746,"p":false,"h":false},{"t":"하나님은 알지 못하는 자의 띠를 동여 주시고, 이름을 부르고, 칭호까지 주십니다.","s":169.38,"e":175.177,"p":false,"h":false},{"t":"이 점은 역사 기록과도 맞아떨어집니다.","s":175.824,"e":178.715,"p":false,"h":false},{"t":"고레스 원통이라는 유물은 바벨론의 마르둑 신이 고레스를 택했다고 기록하고, 그가 포로로 끌려온 신들과 백성이 제 처소로 돌아가게 했다고 전하는 것으로 알려져 있습니다.","s":179.352,"e":189.945,"p":false,"h":false},{"t":"이 유물에는 유다 사람이 직접 언급되지 않는 것으로 압니다.","s":190.584,"e":194.628,"p":false,"h":false},{"t":"에스라 1장 1절은 같은 사건을 \"여호와께서 바사 왕 고레스의 마음을 감동시키시매\"라고 쓰고, 고레스의 조서가 \"하늘의 하나님 여호와\"를 말했다고 적습니다.","s":195.264,"e":205.744,"p":false,"h":false},{"t":"같은 사건이 한쪽에서는 마르둑의 일이고 다른 쪽에서는 여호와의 일입니다.","s":206.316,"e":211.244,"p":false,"h":false},{"t":"5번 글에서 본 한 사건의 두 뜻이 여기서도 나타납니다.","s":211.788,"e":215.741,"p":false,"h":false},{"t":"이 연결은 제 해석입니다.","s":216.36,"e":218.508,"p":true,"h":false},{"t":"앗수르와 고레스: 같은 구조, 다른 결","s":219.6,"e":223.842,"p":false,"h":true},{"t":"이 점에서 5번의 앗수르와 짝이 됩니다.","s":224.928,"e":227.713,"p":false,"h":false},{"t":"두 왕 모두 하나님을 알지 못하고 하나님의 계획 안에서 쓰입니다.","s":228.276,"e":232.48,"p":false,"h":false},{"t":"앗수르는 \"내 노의 막대기\"로 심판의 도구였고, 고레스는 \"나의 목자\"로 구원의 도구입니다.","s":233.136,"e":239.826,"p":false,"h":false},{"t":"앗수르는 그 일을 자기 힘으로 이룬 줄 알고 교만하여 심판을 받았습니다.","s":240.48,"e":245.258,"p":false,"h":false},{"t":"고레스에 대해서는 본문이 그가 하나님을 알게 되었다고도, 심판을 받는다고도 말하지 않습니다.","s":245.88,"e":252.138,"p":false,"h":false},{"t":"45장 3절은 \"너로 너를 지명하여 부른 자가 나 여호와 이스라엘의 하나님인 줄을 알게 하리라\"고 하지만, 이것이 고레스 개인의 회심을 뜻하는지, 하나님의 일이 드러나 알려진다는 뜻인지는 본문이 정하지 않습니다.","s":252.756,"e":267.541,"p":false,"h":false},{"t":"학자들도 갈립니다.","s":268.092,"e":269.695,"p":false,"h":false},{"t":"본문이 말하는 선까지만 읽겠습니다.","s":270.216,"e":272.771,"p":false,"h":false},{"t":"고레스는 믿는 사람이어서가 아니라 맡겨진 일 때문에 이 칭호를 받았습니다.","s":273.384,"e":278.406,"p":true,"h":false},{"t":"그러므로 여기서 \"기름 부은 자\"는 직무의 이름으로 읽는 것이 본문에 가깝습니다.","s":279.504,"e":284.87,"p":false,"h":false},{"t":"하나님이 보내신 자라는 뜻이지, 고레스가 메시아 그 자체라는 뜻은 아닙니다.","s":285.48,"e":291.271,"p":false,"h":false},{"t":"그는 포로의 문을 열 수 있으나 죄의 문제는 풀지 못합니다.","s":291.924,"e":296.202,"p":true,"h":false},{"t":"반발하는 목소리","s":297.18,"e":298.589,"p":false,"h":true},{"t":"이스라엘 가운데서 이 말씀을 듣고 불편해한 사람들이 있었던 것이 본문에서 보입니다.","s":299.736,"e":305.703,"p":false,"h":false},{"t":"45장 9절부터 11절은 \"화 있을진저 자기를 지으신 이와 다투는 자여\"라고 합니다.","s":306.324,"e":312.658,"p":false,"h":false},{"t":"토기가 토기장이에게 \"무엇을 만드느냐\" 하고, 자식이 부모에게 \"무엇을 낳았느냐\" 하는 격이라는 것입니다.","s":313.272,"e":320.694,"p":false,"h":false},{"t":"하나님이 해방자를 이방인 가운데서 일으키시는 것을 받아들이지 못하는 목소리를 전제한 말씀입니다.","s":321.336,"e":327.603,"p":true,"h":false},{"t":"우리는 이 토기장이 비유가 로마서 9장 20절과 21절에서 다시 쓰인 것을 압니다.","s":328.68,"e":334.687,"p":false,"h":false},{"t":"2번 글에서 본 \"네가 누구기에 하나님께 반문하느냐\"가 이 자리에서 나온 것입니다.","s":335.34,"e":340.982,"p":false,"h":false},{"t":"하나님이 누구를 쓰시는지에 대한 이의가 있을 때 이사야서가 내놓는 답은 논리가 아니라 창조주와 피조물의 자리입니다.","s":341.604,"e":349.41,"p":false,"h":false},{"t":"그러나 11절에서 하나님은 이 반발자들을 쫓아내지 않으시고 \"내 아들들에 관하여 내게 물으라\"고 하십니다.","s":350.028,"e":357.46,"p":false,"h":false},{"t":"따져 묻는 백성에게도 물으라는 초대가 열려 있습니다.","s":358.128,"e":361.75,"p":true,"h":false},{"t":"45장 7절의 선언","s":362.844,"e":364.619,"p":false,"h":true},{"t":"6절과 7절은 이 장의 중심 선언입니다.","s":365.724,"e":368.865,"p":false,"h":false},{"t":"해 뜨는 곳에서 해 지는 곳까지 하나님 외에 다른 이가 없다고 하시고, \"나는 빛도 짓고 어둠도 창조하며 평안도 짓고 환난도 창조하나니\"라고 하십니다.","s":369.504,"e":379.432,"p":false,"h":false},{"t":"학자들은 이 말이 빛과 어둠을 두 신의 영역으로 나누는 이원론적 생각, 곧 페르시아 종교를 배경으로 한 이해에 맞선 것이라고 자주 읽습니다.","s":380.016,"e":389.284,"p":false,"h":false},{"t":"다만 이 배경은 제시된 견해이고 본문이 직접 밝히는 것은 아닙니다.","s":389.916,"e":394.991,"p":true,"h":false},{"t":"어느 쪽이든 의미는 분명합니다.","s":396.036,"e":398.35,"p":false,"h":false},{"t":"빛이 오는 것도 어둠이 오는 것도 한 분의 손 안에 있다는 것입니다.","s":398.988,"e":403.523,"p":false,"h":false},{"t":"이 선언은 심판을 일으키신 분과 구원을 일으키시는 분이 같은 하나님이라는 이 책의 일관된 말씀입니다.","s":404.172,"e":410.928,"p":false,"h":false},{"t":"7번 글에서 본 \"낯선 일\"과 본래의 일이 한 분에게서 나온다는 점입니다.","s":411.588,"e":416.644,"p":false,"h":false},{"t":"환난을 지으신다는 말은 가볍게 읽을 수 없는 말이지만, 이사야서는 이것을 설명하지 않고 하나님의 주권으로 선포합니다.","s":417.24,"e":425.593,"p":true,"h":false},{"t":"숨어 계신 하나님, 그리고 열방","s":426.636,"e":429.513,"p":false,"h":true},{"t":"45장 14절부터 25절은 이 장의 방향을 바꿉니다.","s":430.668,"e":435.187,"p":false,"h":false},{"t":"고레스 이야기가 끝나자 열방이 이스라엘에게 와서 \"하나님이 과연 너희 중에 계시고 그 외에는 다른 신이 없다\"고 말합니다(14절).","s":435.816,"e":444.932,"p":false,"h":false},{"t":"그리고 15절은 이상한 고백을 합니다.","s":445.5,"e":448.278,"p":false,"h":false},{"t":"\"진실로 주는 스스로 숨어 계신 하나님이시라.\"","s":448.56,"e":451.652,"p":false,"h":false},{"t":"이 말을 한 사람이 열방인지는 학자들 사이에서 읽기가 갈립니다.","s":452.304,"e":456.823,"p":false,"h":false},{"t":"하나님이 고레스 같은 방식으로 일하실 때, 그 일은 사건 뒤에 숨은 손으로 이루어지기 때문에 이 고백이 어울립니다.","s":457.452,"e":465.27,"p":false,"h":false},{"t":"그러나 19절에서 하나님은 \"내가 은밀한 데서나 어두운 곳에서 말하지 아니하였다\"고 하십니다.","s":465.804,"e":471.991,"p":false,"h":false},{"t":"숨은 손과 드러난 말씀이 함께 있습니다.","s":472.68,"e":475.535,"p":false,"h":false},{"t":"하나님의 일은 역사 속에서 보이지 않는 방식으로 이루어지되 말씀으로는 미리 밝혀진다는 것입니다.","s":476.172,"e":482.393,"p":true,"h":false},{"t":"장은 이렇게 끝납니다.","s":483.48,"e":485.185,"p":false,"h":false},{"t":"\"땅 끝의 모든 사람아 나를 앙망하라 그리하면 구원을 받으리라\"(22절).","s":485.712,"e":490.866,"p":false,"h":false},{"t":"그리고 23절은 모든 무릎이 꿇고 모든 혀가 맹세하리라고 합니다.","s":491.472,"e":496.291,"p":false,"h":false},{"t":"바울은 빌립보서 2장 10절과 11절에서 이 말씀을 그리스도께 적용했습니다.","s":496.908,"e":502.024,"p":false,"h":false},{"t":"고레스가 열어 준 문으로 이스라엘이 돌아가는 이야기가, 열방 전체가 하나님께 돌이키는 이야기로 이어집니다.","s":502.668,"e":509.903,"p":false,"h":false},{"t":"이 두 방향의 연결은 14번 글에서 따로 다루겠습니다.","s":510.552,"e":514.367,"p":true,"h":false},{"t":"문을 여는 자와 눈을 여는 자","s":515.448,"e":517.7,"p":false,"h":true},{"t":"여기서 다음 글과의 이음새를 하나 보여 드리겠습니다.","s":518.94,"e":522.368,"p":false,"h":false},{"t":"45장 1절에서 하나님은 고레스 앞에 성문을 열어 닫히지 않게 하겠다고 하셨습니다.","s":523.008,"e":528.45,"p":false,"h":false},{"t":"그런데 42장 7절에서 \"맹인의 눈을 밝히며 갇힌 자를 감옥에서 나오게\" 하는 일을 맡은 이는 종입니다.","s":529.092,"e":536.047,"p":false,"h":false},{"t":"고레스는 포로의 문을 열 수 있어도, 이 책이 처음부터 물어 온 완고한 마음의 문제는 풀 수 없습니다.","s":536.688,"e":543.71,"p":false,"h":false},{"t":"그 일을 맡은 이가 누구인가가 다음 글, 11번의 물음입니다.","s":544.356,"e":548.877,"p":true,"h":false},{"t":"이 본문을 읽는 조심스러운 방법","s":549.972,"e":552.343,"p":false,"h":true},{"t":"두 가지를 말씀드립니다.","s":553.464,"e":555.277,"p":false,"h":false},{"t":"하나는 위로입니다.","s":555.912,"e":557.395,"p":false,"h":false},{"t":"하나님의 일은 눈에 보이는 믿는 사람들의 울타리 안에만 갇혀 있지 않습니다.","s":558,"e":562.859,"p":false,"h":false},{"t":"교회가 힘이 없고 사방이 막혀 있는 것처럼 보일 때에도, 하나님이 아무도 예상하지 못한 사람을 통해 문을 여실 수 있습니다.","s":563.4,"e":571.269,"p":false,"h":false},{"t":"이것이 40장 이후를 지탱하는 확신입니다.","s":571.896,"e":575.041,"p":true,"h":false},{"t":"다른 하나는 경고입니다.","s":576.072,"e":577.85,"p":false,"h":false},{"t":"5번 글에서 말씀드린 것과 같습니다.","s":578.16,"e":580.779,"p":false,"h":false},{"t":"이사야에게는 고레스를 가리키는 계시의 말씀이 있었으나 우리에게는 없습니다.","s":581.076,"e":586.444,"p":false,"h":false},{"t":"오늘의 어떤 지도자나 세력을 \"우리의 고레스\"라고 부르며 하나님의 뜻을 이루는 자로 단정하는 것은 이 본문을 오용하는 일입니다.","s":587.088,"e":595.591,"p":false,"h":false},{"t":"고레스를 이렇게 불렀다고 해서 그의 모든 행위가 의로웠다는 뜻도 아니고, 본문은 그의 도덕성을 평가하지 않습니다.","s":596.268,"e":604.436,"p":false,"h":false},{"t":"이 본문이 가르치는 것은 하나님이 쓰시는 자의 정체를 우리가 가려낼 수 있다는 것이 아니라, 하나님의 일이 우리의 짐작을 넘어선다는 것입니다.","s":605.088,"e":614.411,"p":true,"h":false}], NAV = {"prev":{"href":"9-2.html","title":"9-2. 아직 오지 않은 귀환을 왜 미리 위로하시는가"},"next":{"href":"doc11.html","title":"11. 고난받는 종은 누구인가"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];

  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });

  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }

  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
