<script>
(function () {
  const TITLE = "3. 약속을 듣고도 왜 돌이키지 않는가", AUDIO_SRC = "doc03_2610241127.mp3", DUR = 731, SEGS = [{"t":"약속을 듣고도 왜 돌이키지 않는가: 아하스의 불신과 임마누엘 징조","s":0,"e":5.203,"p":false,"h":true},{"t":"본문: 이사야 7:1-17; 8:1-22; 9:1-7 (함께 읽을 본문: 왕하 16:1-9, 대하 28:16-21, 마 1:18-25)","s":6.3,"e":24.491,"p":true,"h":false},{"t":"앞의 두 글은 물음의 틀을 다루었습니다.","s":25.416,"e":28.16,"p":false,"h":false},{"t":"이번에는 장면으로 들어갑니다.","s":28.8,"e":31.053,"p":false,"h":false},{"t":"이사야 7장은 한 사람의 선택이 나라의 운명을 가르는 역사의 현장입니다.","s":31.68,"e":36.728,"p":false,"h":false},{"t":"왕이 하나님의 약속 앞에 섰고, 그 약속을 받아들이지 않았습니다.","s":37.332,"e":42.187,"p":false,"h":false},{"t":"해설서의 9장에서 느끼셨던 답답함이 사실은 여기서 시작됩니다.","s":42.84,"e":47.302,"p":false,"h":false},{"t":"9장의 백성이 돌이키지 않는 것은 갑자기 생긴 일이 아니라, 7장에서 왕이 먼저 보인 모습이 백성 전체로 퍼진 결과입니다.","s":47.952,"e":55.996,"p":true,"h":false},{"t":"위기의 장면","s":57.096,"e":58.264,"p":false,"h":true},{"t":"때는 주전 735년경입니다.","s":59.112,"e":61.943,"p":false,"h":false},{"t":"북쪽에서는 앗수르가 세력을 넓히고 있었고, 이에 맞서려고 아람 왕 르신과 북이스라엘 왕 베가가 동맹을 맺었습니다.","s":62.424,"e":70.693,"p":false,"h":false},{"t":"두 나라는 남쪽 유다에도 동맹에 가담하라고 압박했고, 유다 왕 아하스가 거절하자 군대를 이끌고 쳐내려와 그를 폐위하고 다른 사람을 왕으로 세우려 했습니다(7:6).","s":71.316,"e":83.422,"p":false,"h":false},{"t":"본문은 이때 아하스와 백성의 마음이 \"수풀이 바람에 흔들림 같았다\"(7:2)고 적습니다.","s":83.736,"e":91.201,"p":true,"h":false},{"t":"그 한복판에서 하나님은 이사야를 보내십니다.","s":92.34,"e":95.568,"p":false,"h":false},{"t":"그리고 아들 스알야숩을 데려가라고 하십니다.","s":96.12,"e":99.107,"p":false,"h":false},{"t":"이름의 뜻이 \"남은 자가 돌아오리라\"입니다.","s":99.756,"e":102.959,"p":false,"h":false},{"t":"이사야는 아들의 이름을 앞세워 왕을 만나러 갑니다.","s":103.608,"e":107.064,"p":false,"h":false},{"t":"설교보다 먼저 그 이름이 메시지의 절반을 말하고 있었던 셈입니다.","s":107.64,"e":111.981,"p":false,"h":false},{"t":"장소도 눈여겨볼 만합니다.","s":112.644,"e":114.685,"p":false,"h":false},{"t":"윗못 수도 끝, 곧 성이 포위될 때를 대비해 물을 확보하려고 점검하던 자리입니다.","s":115.308,"e":121.502,"p":false,"h":false},{"t":"왕은 하나님을 의지하는 대신 물 걱정을 하고 있었습니다.","s":122.148,"e":125.853,"p":true,"h":false},{"t":"약속의 내용: 두려워하지 말라","s":126.936,"e":129.662,"p":false,"h":true},{"t":"이사야가 전한 말은 위로입니다.","s":130.824,"e":133.116,"p":false,"h":false},{"t":"\"삼가며 조용하라 두려워하지 말라 이 연기 나는 두 부지깽이 그루터기 때문에 낙심하지 말라\"(7:4).","s":133.74,"e":140.734,"p":false,"h":false},{"t":"르신과 베가를 하나님은 다 타고 연기만 나는 부지깽이 토막이라고 부르십니다.","s":141.3,"e":146.359,"p":false,"h":false},{"t":"위협처럼 보이지만 이미 끝난 세력이라는 말입니다.","s":146.988,"e":150.578,"p":false,"h":false},{"t":"그들의 계획은 서지 못할 것이라는 약속이 이어집니다(7:7).","s":151.164,"e":156.219,"p":true,"h":false},{"t":"이 약속에는 조건이 하나 붙어 있습니다.","s":157.212,"e":160.003,"p":false,"h":false},{"t":"9절 끝입니다.","s":160.668,"e":161.967,"p":false,"h":false},{"t":"\"너희가 굳게 믿지 아니하면 정녕 굳게 서지 못하리라.\"","s":162.576,"e":166.142,"p":false,"h":false},{"t":"히브리어로 이 구절은 말놀이입니다.","s":166.752,"e":169.457,"p":false,"h":false},{"t":"\"믿다\"와 \"굳게 서다\"가 같은 어근에서 나온 말이어서, 우리말로 하면 \"믿음에 굳게 서지 않으면 굳게 서지 못한다\"에 가깝습니다.","s":169.992,"e":178.852,"p":false,"h":false},{"t":"나라가 서는가는 군사력이나 동맹이 아니라 하나님을 믿는가에 달려 있다는 선언입니다.","s":179.532,"e":185.087,"p":true,"h":false},{"t":"징조를 구하라는 초대와 거절","s":186.156,"e":188.376,"p":false,"h":true},{"t":"여기서 가장 이상한 장면이 나옵니다.","s":189.468,"e":192.085,"p":false,"h":false},{"t":"하나님은 아하스에게 직접 말씀하십니다.","s":192.744,"e":195.711,"p":false,"h":false},{"t":"\"너는 너의 하나님 여호와께 징조를 구하되 깊은 데서든지 높은 데서든지 구하라\"(7:11).","s":196.344,"e":203.072,"p":false,"h":false},{"t":"무엇이든 구하라는 백지 위임입니다.","s":203.616,"e":206.4,"p":false,"h":false},{"t":"믿기 어려운 왕에게 하나님이 믿음을 도울 수단까지 먼저 내미신 것입니다.","s":207.072,"e":211.881,"p":true,"h":false},{"t":"아하스는 이렇게 답합니다.","s":213.012,"e":215.015,"p":false,"h":false},{"t":"\"나는 구하지 아니하겠나이다 나는 여호와를 시험하지 아니하겠나이다\"(7:12).","s":215.64,"e":221.57,"p":false,"h":false},{"t":"겉으로는 신앙 깊은 말입니다.","s":222.156,"e":224.409,"p":false,"h":false},{"t":"신명기 6장 16절의 \"시험하지 말라\"를 인용한 듯 들립니다.","s":224.712,"e":228.899,"p":false,"h":false},{"t":"그러나 하나님이 먼저 구하라고 하신 것을 거절하면서 그 말을 쓰는 것은 경건이 아니라 불순종입니다.","s":229.572,"e":236.153,"p":false,"h":false},{"t":"이사야가 곧바로 \"너희가 사람을 괴롭게 하는 것을 작은 일로 여겨서 내 하나님도 괴롭게 하려느냐\"(7:13)고 책망하는 이유가 여기 있습니다.","s":236.772,"e":247.203,"p":false,"h":false},{"t":"앞 장에서 다룬 물음이 여기서 장면으로 나타납니다.","s":247.824,"e":251.227,"p":false,"h":false},{"t":"하나님의 편에서 길은 열려 있었고, 왕의 마음이 그 길을 거절했습니다.","s":251.856,"e":256.981,"p":true,"h":false},{"t":"왜 거절했을까요.","s":258.084,"e":259.608,"p":false,"h":false},{"t":"본문이 직접 이유를 말하지는 않지만, 역사서가 단서를 줍니다.","s":260.244,"e":264.772,"p":false,"h":false},{"t":"열왕기하 16장 7절부터 9절과 역대하 28장 16절 이하에 따르면 아하스는 이미 앗수르 왕 디글랏빌레셀에게 사람을 보내 도움을 청하기로 마음을 정했고, 성전과 왕궁의 은금을 예물로 바쳤습니다.","s":265.392,"e":279.722,"p":false,"h":false},{"t":"하나님의 징조를 받아들이면 이미 세워 둔 정치 계획을 접어야 합니다.","s":280.368,"e":285.051,"p":false,"h":false},{"t":"그는 하나님의 약속이 필요 없어서가 아니라, 약속을 받으면 자기 계획을 포기해야 해서 거절한 것입니다.","s":285.336,"e":292.301,"p":false,"h":false},{"t":"이는 어디까지나 본문 정황에서 읽어 낸 추론이지만, 7장과 8장이 앗수르를 의지하는 일을 강하게 책망하는 점(7:17-20; 8:5-8)과도 맞아떨어집니다.","s":292.968,"e":306.399,"p":true,"h":false},{"t":"임마누엘 징조","s":307.512,"e":308.787,"p":false,"h":true},{"t":"아하스가 구하지 않자 하나님은 스스로 징조를 주십니다.","s":309.888,"e":313.763,"p":false,"h":false},{"t":"\"보라 처녀가 잉태하여 아들을 낳을 것이요 그 이름을 임마누엘이라 하리라\"(7:14).","s":314.388,"e":320.469,"p":false,"h":false},{"t":"이 구절은 이사야서에서 가장 많이 논의된 본문 가운데 하나여서, 읽는 방식을 정직하게 나누어 소개해야 합니다.","s":321.12,"e":328.65,"p":true,"h":false},{"t":"첫째 쟁점은 \"처녀\"로 옮긴 히브리어 알마입니다.","s":329.76,"e":333.229,"p":false,"h":false},{"t":"이 말은 결혼하지 않은 젊은 여성을 가리키는 말로, 성적 순결을 뜻하는 베툴라와 구별된다는 점이 자주 지적됩니다.","s":333.864,"e":341.758,"p":false,"h":false},{"t":"그러나 구약에서 알마가 쓰인 곳은 리브가(창 24:43)처럼 문맥상 처녀인 경우가 많아서, 이 말이 처녀를 배제한다고 단정하기도 어렵습니다.","s":342.396,"e":354.101,"p":false,"h":false},{"t":"70인역은 이 말을 파르테노스(처녀)로 옮겼고, 마태는 이 번역을 따라 예수님의 탄생에 적용했습니다(마 1:23).","s":354.672,"e":366.182,"p":true,"h":false},{"t":"둘째 쟁점은 이 징조가 누구를 가리키는가입니다.","s":367.2,"e":370.729,"p":false,"h":false},{"t":"크게 세 가지 읽기가 있습니다.","s":371.376,"e":373.557,"p":true,"h":false},{"t":"하나는 당대의 인물, 곧 아하스의 아내나 이사야의 아내가 낳을 아이로 보는 읽기입니다.","s":374.616,"e":380.968,"p":false,"h":false},{"t":"이 해석은 8장 3절에서 이사야의 아들 마헬살랄하스바스가 태어나는 것과 이어 보고, 이 아이가 자라 선악을 알기 전에 아람과 이스라엘이 멸망한다는 7장 16절의 시한과 잘 맞는다는 점을 강점으로 삼습니다.","s":381.6,"e":395.43,"p":true,"h":false},{"t":"다른 하나는 오직 예수 그리스도만을 가리킨다고 보는 읽기입니다.","s":396.54,"e":400.76,"p":false,"h":false},{"t":"이 해석은 마태복음의 인용과 \"처녀\"라는 표현의 무게를 강점으로 삼고, 당대의 아하스에게 이 징조가 어떤 의미였는지를 설명하기 어렵다는 점이 약점으로 지적됩니다.","s":401.4,"e":412.82,"p":true,"h":false},{"t":"세 번째는 이중 성취 혹은 모형론적 읽기입니다.","s":413.892,"e":417.497,"p":false,"h":false},{"t":"이사야 당대에 한 아이가 태어나는 것이 실제 징조였고, 그것은 더 큰 임마누엘, 곧 하나님이 참으로 우리와 함께 계신 사건을 미리 보여 주는 그림이었다고 봅니다.","s":418.068,"e":429.396,"p":false,"h":false},{"t":"많은 개혁주의 학자들이 이 입장을 취하며, 저도 본문의 구조와 신약의 인용을 가장 균형 있게 설명한다고 봅니다.","s":430.056,"e":437.816,"p":false,"h":false},{"t":"다만 이는 제 판단이고, 학자들 사이에서 합의된 것은 아닙니다.","s":438.444,"e":443.226,"p":true,"h":false},{"t":"어느 읽기를 택하든 흔들리지 않는 것이 있습니다.","s":444.348,"e":447.413,"p":false,"h":false},{"t":"이름의 뜻입니다.","s":447.984,"e":449.264,"p":false,"h":false},{"t":"임마누엘, 곧 \"하나님이 우리와 함께 계신다\"는 말은 이 위기에서 아하스가 가장 필요로 한 것이었고, 그가 거절한 것이 바로 이것이었습니다.","s":449.892,"e":459.887,"p":false,"h":false},{"t":"징조의 내용은 곧 \"너는 앗수르와 함께 있으려 하지만, 내가 너와 함께 있다\"는 선언입니다.","s":460.548,"e":466.839,"p":true,"h":false},{"t":"거절의 결과: 물은 이쪽으로 흘러옵니다","s":467.964,"e":471.481,"p":false,"h":true},{"t":"하나님의 약속을 거절한 결과는 7장 17절부터 20절에 나옵니다.","s":472.644,"e":477.504,"p":false,"h":false},{"t":"아하스가 의지한 앗수르가 도리어 유다에 임하는 심판의 도구가 된다는 것입니다.","s":478.116,"e":483.185,"p":false,"h":false},{"t":"8장 6절과 7절은 이 일을 물에 비유합니다.","s":483.84,"e":487.335,"p":false,"h":false},{"t":"백성이 실로아의 잔잔히 흐르는 물, 곧 하나님이 주신 조용한 도움을 싫어하고 르신과 베가를 기뻐하였으므로, 주께서 앗수르 왕의 강하고 큰 물을 그들 위에 넘치게 하시리라는 것입니다.","s":487.98,"e":500.615,"p":false,"h":false},{"t":"이 물이 \"임마누엘이여, 그 펼친 날개가 네 땅에 가득하리라\"는 말로 끝나는 점이 인상적입니다.","s":501.3,"e":507.956,"p":false,"h":false},{"t":"심판의 물결 속에서도 땅은 여전히 임마누엘의 땅입니다.","s":508.572,"e":512.737,"p":true,"h":false},{"t":"8장: 두려움의 두 방향","s":513.72,"e":516.358,"p":false,"h":true},{"t":"왕이 거절한 뒤 백성은 어떻게 반응했을까요.","s":517.5,"e":520.788,"p":false,"h":false},{"t":"8장 11절부터 15절이 이를 보여 줍니다.","s":521.424,"e":524.702,"p":false,"h":false},{"t":"하나님은 이사야에게 이 백성이 두려워하는 것을 두려워하지 말고 만군의 여호와만을 거룩하게 여기라고 하십니다.","s":525.348,"e":532.22,"p":false,"h":false},{"t":"그러면 그분이 성소가 되실 것이나, 이스라엘 두 집에게는 걸려 넘어지는 돌과 걸림 바위가 되실 것이라고 합니다.","s":532.872,"e":540.382,"p":false,"h":false},{"t":"같은 하나님이 믿는 자에게는 피난처이고 믿지 않는 자에게는 장애물이 됩니다.","s":541.008,"e":545.976,"p":true,"h":false},{"t":"이어서 백성은 문제 앞에서 신접한 자와 박수에게 가서 묻습니다(8:19).","s":547.02,"e":552.866,"p":false,"h":false},{"t":"이사야는 이에 대해 \"백성이 자기 하나님께 구할 것이 아니냐\"고 되묻고, 율법과 증거의 말씀으로 가라고 합니다(8:19-20).","s":553.464,"e":563.242,"p":false,"h":false},{"t":"그 말씀을 따르지 않는 자에게는 새벽빛이 없다고 합니다.","s":563.832,"e":567.649,"p":false,"h":false},{"t":"6장에서 닫힌 마음이 7장에서 왕의 선택으로 나타났고, 8장에서 백성의 생활 방식이 되었습니다.","s":568.224,"e":574.996,"p":false,"h":false},{"t":"해설서의 9장은 그 끝에 서 있습니다.","s":575.64,"e":578.375,"p":true,"h":false},{"t":"빛은 바로 그 어둠 속으로 옵니다","s":579.384,"e":581.997,"p":false,"h":true},{"t":"이제 질문의 답에 가까워집니다.","s":583.164,"e":585.47,"p":false,"h":false},{"t":"이 약속을 듣고도 왜 돌이키지 않는가.","s":586.152,"e":588.907,"p":false,"h":false},{"t":"본문이 보여 주는 이유는 세 가지입니다.","s":589.536,"e":592.218,"p":true,"h":false},{"t":"하나는 약속을 받아들이면 포기해야 할 것이 있기 때문입니다.","s":593.316,"e":597.197,"p":false,"h":false},{"t":"아하스에게 약속은 위로이기 전에 요구였습니다.","s":597.744,"e":601.097,"p":false,"h":false},{"t":"자기 계획과 동맹과 계산을 내려놓으라는 요구입니다.","s":601.74,"e":605.319,"p":false,"h":false},{"t":"하나님의 약속을 믿는 일은 언제나 다른 안전장치를 내려놓는 일을 포함합니다.","s":605.952,"e":611.274,"p":true,"h":false},{"t":"다음은 하나님의 도움이 너무 조용해 보이기 때문입니다.","s":612.324,"e":615.934,"p":false,"h":false},{"t":"실로아의 잔잔한 물은 앗수르의 큰 강 앞에서 초라하게 보였습니다.","s":616.572,"e":620.879,"p":false,"h":false},{"t":"하나님의 약속은 대개 군사 동맹처럼 눈에 보이는 힘으로 오지 않습니다.","s":621.54,"e":626.407,"p":false,"h":false},{"t":"한 아기의 모습으로 옵니다.","s":627.012,"e":628.952,"p":false,"h":false},{"t":"두려움에 사로잡힌 사람에게는 이것이 터무니없이 약해 보입니다.","s":629.28,"e":633.608,"p":true,"h":false},{"t":"마지막은 두려움이 믿음의 자리를 대신 차지하기 때문입니다.","s":634.68,"e":638.753,"p":false,"h":false},{"t":"\"수풀이 바람에 흔들림 같았다\"는 묘사는 한 번의 불신이 아니라 상태를 말합니다.","s":639.36,"e":644.745,"p":false,"h":false},{"t":"두려움이 마음을 채우면 약속이 들어올 자리가 없어집니다.","s":645.372,"e":649.204,"p":true,"h":false},{"t":"그런데 이 어둠의 기록 끝에 9장이 옵니다.","s":650.304,"e":653.295,"p":false,"h":false},{"t":"8장 22절은 환난과 흑암과 우거진 어둠으로 끝나는데, 9장 1절은 \"그러나\"로 시작합니다.","s":653.94,"e":660.908,"p":false,"h":false},{"t":"하나님이 아하스에게 주려 하셨던 임마누엘이 이제는 왕의 거절과 상관없이 약속으로 확정됩니다.","s":661.572,"e":667.839,"p":false,"h":false},{"t":"하나님은 구하지 않은 자에게도 징조를 주셨고, 받지 않으려는 자에게도 아기를 주십니다.","s":668.448,"e":674.351,"p":false,"h":false},{"t":"약속을 붙드는 일이 사람의 믿음에 달려 있다면 7장에서 끝났을 것입니다.","s":675,"e":679.91,"p":false,"h":false},{"t":"약속이 이어지는 것은 그것이 하나님의 열심에 달려 있기 때문입니다(9:7).","s":680.544,"e":686.503,"p":true,"h":false},{"t":"이 장면이 오늘에 남기는 것","s":687.528,"e":689.474,"p":false,"h":true},{"t":"아하스의 이야기는 불신앙을 가르치는 이야기라기보다, 믿음이 어디서 갈리는지를 보여 주는 이야기입니다.","s":690.516,"e":697.863,"p":false,"h":false},{"t":"그는 하나님을 모르지 않았고, 이사야를 만났고, 말씀을 들었으며, 징조까지 제안받았습니다.","s":698.508,"e":705.939,"p":false,"h":false},{"t":"부족했던 것은 정보가 아니라 내려놓음이었습니다.","s":706.572,"e":710.078,"p":true,"h":false},{"t":"신앙이 흔들릴 때 우리는 대개 하나님이 충분히 말씀하지 않으셨다고 느끼지만, 본문은 오히려 말씀은 충분했고 붙들던 것을 놓기가 어려웠음을 보여 줍니다.","s":711.216,"e":721.563,"p":false,"h":false},{"t":"그리고 그 자리에서도 하나님이 함께하시겠다는 선언을 거두지 않으신다는 것이 이 이야기의 가장 깊은 위로입니다.","s":722.196,"e":729.647,"p":true,"h":false}], NAV = {"prev":{"href":"doc02.html","title":"2. 하나님이 굳히시는가 백성이 굳어지는가"},"next":{"href":"doc04.html","title":"4. 남은 자는 왜 있으며 무엇을 위한 것인가"},"list":"index.html"};

  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
