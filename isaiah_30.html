(function () {
  const TITLE = "isaiah_30", AUDIO_SRC = "isaiah_30_2610230230.mp3", DUR = 426, SEGS = [{"t":"이사야 30장","s":0,"e":1.536,"p":true,"h":false},{"t":"제목 이집트로 내려가지 말고 돌아와 조용히 의지하십시오","s":2.196,"e":6.135,"p":true,"h":false},{"t":"핵심 한 줄 돌아와 잠잠히 하나님을 의지하면 구원받지만, 이집트의 말을 의지하면 수치가 됩니다.","s":6.768,"e":13.704,"p":false,"h":false},{"t":"그래도 하나님은 은혜를 베풀려고 기다리십니다.","s":13.896,"e":17.143,"p":true,"h":false},{"t":"풀어 읽기","s":17.82,"e":18.89,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 28장과 29장에서 지도자들이 이집트와 몰래 동맹을 맺는 모습이 계속 암시되었는데, 30장은 그 일을 정면으로 다룹니다.","s":19.728,"e":30.447,"p":false,"h":false},{"t":"유다 사신들이 이집트에 선물을 싣고 내려가는 장면으로 시작합니다.","s":30.78,"e":35.314,"p":false,"h":false},{"t":"앗수르의 위협을 막으려고 이집트의 말과 병거를 빌리려는 것입니다.","s":35.532,"e":40.023,"p":true,"h":false},{"t":"하나님은 이 일이 하나님의 뜻을 묻지 않은 반역이라고 말씀하십니다.","s":40.68,"e":45.264,"p":false,"h":false},{"t":"그래서 이집트는 그들을 도울 수 없고 오히려 수치가 될 것입니다.","s":45.468,"e":49.912,"p":false,"h":false},{"t":"그러나 이 장은 심판만으로 끝나지 않습니다.","s":50.112,"e":53.273,"p":false,"h":false},{"t":"중간에 하나님이 은혜를 베풀기 위해 기다리신다는 말씀이 나오고, 마지막에는 하나님이 앗수르를 직접 치시는 장면이 이어집니다.","s":53.46,"e":61.948,"p":false,"h":false},{"t":"이 장의 전체 질문은 한 가지입니다.","s":62.316,"e":65.05,"p":false,"h":false},{"t":"위기 앞에서 어디로 돌아갈 것인가입니다.","s":65.268,"e":68.29,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":68.508,"e":71.784,"p":true,"h":false},{"t":"1절에서 5절, 하나님께 묻지 않고 이집트로 가는 사람들 \"화 있을진저, 패역한 자식들이여.","s":72.432,"e":79.42,"p":false,"h":false},{"t":"그들이 계획을 베푸나 내게서 나지 아니하며.\"","s":79.596,"e":82.615,"p":false,"h":false},{"t":"하나님께 묻지 않고 자기 꾀로 이집트의 보호를 구하는 사람들입니다.","s":82.8,"e":87.456,"p":false,"h":false},{"t":"하나님은 죄에 죄를 더한다고 하십니다.","s":87.66,"e":90.569,"p":false,"h":false},{"t":"그들은 이집트의 바로의 힘 안에 피하고 이집트의 그늘 안에 숨으려고 합니다.","s":90.792,"e":95.634,"p":false,"h":false},{"t":"그러나 그 보호가 수치가 되고 그늘이 치욕이 될 것이라고 하십니다.","s":95.832,"e":100.266,"p":false,"h":false},{"t":"이집트에 도움을 구하러 가는 사신들은 소안과 하네스까지 갔지만, 쓸모없는 백성 때문에 부끄러움만 얻습니다.","s":100.476,"e":108.097,"p":true,"h":false},{"t":"6절에서 7절, 위험한 길을 가는 짐승들 이 구절 9.892,"p":false,"h":false},{"t":"그것이 구원이고 힘입니다.","s":240.264,"e":242.419,"p":false,"h":false},{"t":"그런데 그들은 \"아니라, 우리가 말을 타고 도망하겠다\"고 했습니다.","s":242.64,"e":248.032,"p":false,"h":false},{"t":"그래서 하나님은 그들이 정말로 도망하게 하시겠다고 하십니다.","s":248.256,"e":252.49,"p":false,"h":false},{"t":"그들을 쫓는 자들이 빠를 것이라고 하십니다.","s":252.72,"e":255.654,"p":false,"h":false},{"t":"천 명이 한 사람의 위협에 도망하고, 다섯 사람의 위협에 도망하여 산꼭대기의 깃대와 산 위의 깃발처럼 외롭게 남게 됩니다.","s":255.888,"e":264.585,"p":false,"h":false},{"t":"사람의 꾀로 도망치려던 자가 정말 도망치는 신세가 됩니다.","s":264.924,"e":269.171,"p":true,"h":false},{"t":"18절에서 26절, 그래도 은혜를 베풀려고 기다리신다 그런데 하나님은 심판 한가운데서 놀라운 말씀을 하십니다.","s":269.82,"e":278.268,"p":false,"h":false},{"t":"\"그러므로 여호와께서 너희에게 은혜를 베풀기 위하여 기다리시며 일어나서 너희를 긍휼히 여기시리니 이는 여호와는 정의의 하나님이시며 그를 기다리는 자는 다 복이 있도다.\"","s":278.604,"e":289.113,"p":false,"h":false},{"t":"하나님은 심판을 서두르시는 분이 아니라, 은혜를 베풀 때를 기다리고 계신 분입니다.","s":289.44,"e":295.157,"p":false,"h":false},{"t":"이것이 지금까지 읽은 진노의 엄중함과 함께 붙들어야 할 하나님의 다른 얼굴입니다.","s":295.38,"e":300.9,"p":false,"h":false},{"t":"하나님은 백성이 부르짖으면 응답하십니다.","s":301.104,"e":304.277,"p":false,"h":false},{"t":"환난의 떡과 고생의 물을 주시지만 스승이 더 이상 숨지 않고 눈으로 스승을 보게 되며, 귀로 뒤에서 \"이것이 바른 길이니 이리로 가라\" 하는 소리를 듣게 됩니다.","s":304.488,"e":315.419,"p":false,"h":false},{"t":"우상은 더러운 물건처럼 던져 버리게 됩니다.","s":315.756,"e":318.961,"p":false,"h":false},{"t":"땅에 비를 주시고 곡식이 풍성하며, 가축이 넓은 초장에서 먹고 달빛이 햇빛 같아지고 햇빛이 일곱 배로 밝아집니다.","s":319.176,"e":327.505,"p":false,"h":false},{"t":"하나님이 백성의 상처를 싸매시고 맞은 자리를 고쳐 주시는 날에 이렇게 됩니다.","s":327.852,"e":333.161,"p":true,"h":false},{"t":"27절에서 33절, 하나님이 앗수르를 직접 치신다 이제 하나님이 멀리서 오시는 모습이 그려집니다.","s":333.972,"e":341.207,"p":false,"h":false},{"t":"그분의 이름이 불타는 분노와 빽빽한 연기와 함께 오시고, 입술에는 분노가 가득하며 혀는 삼키는 불 같습니다.","s":341.568,"e":349.004,"p":false,"h":false},{"t":"그분의 숨은 넘치는 강 같아서 목에까지 이르러 나라들을 멸망의 체로 치시고 백성의 입에 그릇된 길로 이끄는 재갈을 물리십니다.","s":349.344,"e":357.953,"p":false,"h":false},{"t":"한편 하나님의 백성은 절기 때 밤에 거룩한 노래를 부르는 것처럼, 피리를 불고 여호와의 산으로 가는 것처럼 즐거워하게 됩니다.","s":358.308,"e":366.856,"p":false,"h":false},{"t":"하나님의 영광스러운 음성이     document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
