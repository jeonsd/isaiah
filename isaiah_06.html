(function () {
  const TITLE = "isaiah_06", AUDIO_SRC = "isaiah_06_2610230230.mp3", DUR = 448, SEGS = [{"t":"이사야 6장","s":0,"e":1.51,"p":true,"h":false},{"t":"제목 하나님을 뵌 이사야, 예언자로 부르심을 받다","s":2.16,"e":6.094,"p":true,"h":false},{"t":"핵심 한 줄 거룩하신 하나님 앞에서 죄를 깨달은 사람을, 하나님이 먼저 깨끗하게 하시고 보내십니다.","s":6.732,"e":13.625,"p":true,"h":false},{"t":"풀어 읽기","s":14.436,"e":15.506,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 5장이 어둠과 환난으로 끝났는데, 6장은 바로 그 어둠 한가운데서 이사야가 예언자로 부르심을 받던 날을 들려줍니다.","s":16.344,"e":26.466,"p":false,"h":false},{"t":"이사야는 환상, 곧 하나님이 보여 주시는 장면 속에서 하늘의 왕이신 하나님을 뵙습니다.","s":26.82,"e":32.938,"p":false,"h":false},{"t":"그분의 거룩함 앞에서 이사야는 감격하기보다 \"나는 망했다\" 하고 자기 죄부터 깨닫습니다.","s":33.3,"e":39.749,"p":false,"h":false},{"t":"그런 그를 하나님이 먼저 깨끗하게 하시고, 그다음에 \"누가 갈까?\"","s":39.924,"e":44.533,"p":false,"h":false},{"t":"하고 물으십니다.","s":44.712,"e":46.148,"p":true,"h":false},{"t":"그런데 맡기신 일은 쉽지 않습니다.","s":46.836,"e":49.499,"p":false,"h":false},{"t":"백성은 말씀을 들어도 깨닫지 못할 것이고, 그 상태는 오래갑니다.","s":49.716,"e":54.688,"p":false,"h":false},{"t":"하나님의 진노는 가볍지 않고, 기다림은 우리 생각보다 깁니다.","s":54.9,"e":59.692,"p":false,"h":false},{"t":"그러나 장의 맨 끝에는 베어진 나무의 그루터기가 남아 있습니다.","s":59.904,"e":64.242,"p":false,"h":false},{"t":"거룩하신 하나님, 깨끗하게 하시는 은혜, 무거운 사명, 남겨 두신 소망.","s":64.44,"e":70.434,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":70.632,"e":73.908,"p":true,"h":false},{"t":"1절, 왕이 죽은 해에 \"웃시야 왕이 죽던 해\"라는 말로 시작합니다.","s":74.556,"e":79.729,"p":false,"h":false},{"t":"웃시야는 52년이나 나라를 다스린 왕이었습니다.","s":79.956,"e":83.605,"p":false,"h":false},{"t":"요즘으로 치면 평생 한 분의 대통령 밑에서 살다가 그분이 갑자기 세상을 떠난 것과 같습니다.","s":83.808,"e":90.25,"p":false,"h":false},{"t":"나라가 불안하고 마음이 허전했을 때입니다.","s":90.612,"e":93.686,"p":false,"h":false},{"t":"바로 그때 이사야는 성전에서 하늘의 진짜 왕을 봅니다.","s":93.888,"e":97.836,"p":false,"h":false},{"t":"땅의 왕은 죽었지만, 높이 앉아 계신 하나님의 보좌는 그대로라는 것입니다.","s":98.064,"e":103.631,"p":false,"h":false},{"t":"그분의 옷자락만으로도 성전이 가득 찼다고 합니다.","s":103.824,"e":107.297,"p":false,"h":false},{"t":"옷자락이 이 정도이니 그분 자신은 얼마나 크신가를 말해 주는 표현입니다.","s":107.496,"e":112.563,"p":true,"h":false},{"t":"2절에서 4절, 거룩, 거룩, 거룩 하나님 곁에는 스랍들이 서 있습니다.","s":113.22,"e":118.958,"p":false,"h":false},{"t":"스랍은 하나님을 모시고 섬기는 천사 같은 존재입니다.","s":119.16,"e":123.219,"p":false,"h":false},{"t":"날개가 여섯 개인데, 둘로는 얼굴을 가리고 둘로는 발을 가리고 둘로는 날아다닙니다.","s":123.444,"e":129.516,"p":false,"h":false},{"t":"하나님의 빛이 너무 눈부셔서 감히 쳐다보지 못하고 몸을 낮춘 모습입니다.","s":129.708,"e":134.792,"p":false,"h":false},{"t":"하늘의 존재들도 이렇게 하나님 앞에 조심스럽습니다.","s":135.144,"e":138.853,"p":true,"h":false},{"t":"그들이 서로 외칩니다.","s":139.5,"e":141.324,"p":false,"h":false},{"t":"\"거룩하다, 거룩하다, 거룩하다.\"","s":141.552,"e":144.708,"p":false,"h":false},{"t":"거룩이란 나와는 완전히 다르다는 뜻입니다.","s":144.9,"e":147.973,"p":false,"h":false},{"t":"더러움이 조금도 없고 누구와도 비교할 수 없이 높고 깨끗하다는 말입니다.","s":148.176,"e":153.325,"p":false,"h":false},{"t":"같은 말을 세 번 겹친 것은 가장 강하게 말하려는 표현입니다.","s":153.684,"e":158.006,"p":false,"h":false},{"t":"이 외침 소리에 성전 문지방이 흔들리고 건물이 연기로 가득 찹니다.","s":158.22,"e":163.045,"p":false,"h":false},{"t":"하나님이 계신 곳은 이렇게 두려운 곳입니다.","s":163.26,"e":166.427,"p":true,"h":false},{"t":"5절, \"나는 망했다\" 이 장면을 본 이사야는 기뻐하거나 감격하지 않습니다.","s":167.076,"e":172.974,"p":false,"h":false},{"t":"뜻밖에도 이렇게 외칩니다.","s":173.196,"e":175.295,"p":false,"h":false},{"t":"\"화로다, 나는 망했다.\"","s":175.5,"e":177.725,"p":false,"h":false},{"t":"그는 자기 입술이 더럽고, 자기가 사는 백성도 입술이 더러운 사람들이라고 고백합니다.","s":177.984,"e":184.159,"p":false,"h":false},{"t":"입술이 더럽다는 말은 말과 삶이 깨끗하지 못하다는 뜻입니다.","s":184.356,"e":188.666,"p":true,"h":false},{"t":"왜 이렇게 말할까요?","s":189.324,"e":190.988,"p":false,"h":false},{"t":"아주 깨끗한 흰 천 옆에 서면 내 옷의 얼룩이 갑자기 선명하게 보입니다.","s":191.232,"e":196.265,"p":false,"h":false},{"t":"이사야도 그랬습니다.","s":196.632,"e":198.432,"p":false,"h":false},{"t":"완전히 깨끗하신 하나님을 보니, 그동안 안 보이던 자기 모습이 그제야 보인 것입니다.","s":198.648,"e":204.665,"p":false,"h":false},{"t":"그는 \"만군의 여호와\", 곧 하늘의 모든 군대를 거느리신 왕을 직접 보았으니 죽게 되었다고 두려워합니다.","s":205.02,"e":212.229,"p":true,"h":false},{"t":"6절에서 7절, 하나님이 먼저 깨끗하게 하신다 이때 스랍 하나가 날아와, 제단에서 불타는 숯을 집게로 집어 이사야의 입에 댑니다.","s":213.048,"e":222.272,"p":false,"h":false},     audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
