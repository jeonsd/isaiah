(function () {
  const TITLE = "isaiah_37", AUDIO_SRC = "isaiah_37_2610230230.mp3", DUR = 433, SEGS = [{"t":"이사야 37장","s":0,"e":1.786,"p":true,"h":false},{"t":"제목 편지를 펴 놓고 기도하는 왕, 하룻밤에 쓰러진 앗수르 군대","s":2.448,"e":7.249,"p":true,"h":false},{"t":"핵심 한 줄 히스기야가 앗수르의 협박 편지를 성전에서 하나님 앞에 펴 놓고 기도하자, 하나님이 직접 예루살렘을 지키십니다.","s":7.92,"e":16.354,"p":true,"h":false},{"t":"풀어 읽기","s":17.136,"e":18.206,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 36장에서 앗수르가 하나님을 비웃었습니다.","s":19.044,"e":24.082,"p":false,"h":false},{"t":"37장은 히스기야가 어떻게 응답하는지, 그리고 하나님이 어떻게 응답하시는지를 보여 줍니다.","s":24.3,"e":31.119,"p":false,"h":false},{"t":"히스기야는 옷을 찢고 베옷을 입고 성전에 들어가 이사야에게 기도를 부탁하고, 이사야는 \"두려워하지 말라\"는 하나님의 말씀을 전합니다.","s":31.464,"e":41.05,"p":true,"h":false},{"t":"그런데 앗수르 왕은 한 번 더 협박 편지를 보냅니다.","s":41.832,"e":45.529,"p":false,"h":false},{"t":"히스기야는 이 편지를 성전에서 하나님 앞에 펴 놓고 기도합니다.","s":45.756,"e":50.165,"p":false,"h":false},{"t":"그러자 하나님이 이사야를 통해 앗수르 왕에게 직접 말씀하시고, 하룻밤 사이에 앗수르 군대가 쓰러집니다.","s":50.364,"e":57.362,"p":false,"h":false},{"t":"이 장의 줄기는 이렇습니다.","s":57.708,"e":59.881,"p":false,"h":false},{"t":"하나님을 비웃은 교만은 하나님이 직접 꺾으시고, 하나님을 의지한 기도는 응답받는다는 것입니다.","s":60.12,"e":66.856,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":67.212,"e":70.488,"p":true,"h":false},{"t":"1절에서 7절, 성전으로 들어간 히스기야 히스기야는 36장의 보고를 듣고 옷을 찢고 베옷을 입고 여호와의 성전으로 갑니다.","s":71.136,"e":80.123,"p":false,"h":false},{"t":"그리고 신하들을 이사야에게 보내 말합니다.","s":80.46,"e":83.346,"p":false,"h":false},{"t":"\"오늘은 환난과 책망과 모욕의 날이라.","s":83.556,"e":86.45,"p":false,"h":false},{"t":"아이를 낳으려 하나 해산할 힘이 없는 것 같다.\"","s":86.652,"e":89.7,"p":false,"h":false},{"t":"힘이 다했다는 고백입니다.","s":89.964,"e":92.018,"p":false,"h":false},{"t":"그러면서 이사야에게 \"남아 있는 자를 위하여 기도하라\"고 청합니다.","s":92.232,"e":97.224,"p":false,"h":false},{"t":"이 \"남은 자\"라는 말이 6장에서 약속하신 그 단어입니다.","s":97.452,"e":102.236,"p":false,"h":false},{"t":"이사야는 답합니다.","s":102.456,"e":104.15,"p":false,"h":false},{"t":"\"두려워하지 말라.","s":104.364,"e":105.808,"p":false,"h":false},{"t":"앗수르 왕의 종들이 나를 모욕한 말을 두려워하지 말라.","s":106.272,"e":109.86,"p":fals ":false,"h":false},{"t":"시온의 처녀 딸이 너를 멸시하고 비웃는다고 하십니다.","s":216.828,"e":220.489,"p":false,"h":false},{"t":"그리고 앗수르 왕에게 직접 묻습니다.","s":220.716,"e":223.265,"p":false,"h":false},{"t":"\"네가 누구를 훼방하고 비방하였느냐?","s":223.452,"e":225.984,"p":false,"h":false},{"t":"누구를 향하여 소리를 높이고 눈을 높이 떴느냐?","s":226.188,"e":229.283,"p":false,"h":false},{"t":"이스라엘의 거룩하신 이를 향함이로다.\"","s":229.5,"e":232.074,"p":false,"h":false},{"t":"앗수르 왕은 \"내 병거의 많음으로 높은 산 레바논 깊은 곳에 올랐고, 내 발바닥으로 이집트의 모든 강을 말렸다\"고 자랑했습니다.","s":232.308,"e":241.987,"p":false,"h":false},{"t":"하나님은 대답하십니다.","s":242.352,"e":244.294,"p":false,"h":false},{"t":"\"네가 이 일을 한 것이 아니라 내가 옛적부터 정하고 태초부터 계획한 것이 이제 이루어진 것이다.\"","s":244.512,"e":250.823,"p":false,"h":false},{"t":"앗수르가 이긴 것은 하나님이 쓰신 막대기였기 때문입니다.","s":251.028,"e":255.087,"p":false,"h":false},{"t":"10장에서 도끼가 자기를 휘두른 이보다 크다고 자랑할 수 있느냐고 하신 그 말씀이 실현됩니다.","s":255.276,"e":261.553,"p":false,"h":false},{"t":"그래서 하나님은 앗수르 왕의 코에 갈고리를, 입에 재갈을 물려 왔던 길로 돌려보내겠다고 하십니다.","s":261.9,"e":268.696,"p":true,"h":false},{"t":"30절에서 32절, 히스기야에게 주신 징표 하나님이 히스기야에게 징표를 주십니다.","s":269.352,"e":275.482,"p":false,"h":false},{"t":"올해는 스스로 난 것을 먹고, 이듬해에는 또 거기서 난 것을 먹고, 삼 년째에는 심고 거두며 포도원을 가꾸고 열매를 먹게 된다는 것입니다.","s":275.832,"e":285.529,"p":false,"h":false},{"t":"전쟁으로 농사를 못 지어도 하나님이 먹이시고, 삼 년이 지나면 완전히 회복된다는 약속입니다.","s":285.876,"e":292.574,"p":false,"h":false},{"t":"그리고 31절에서 32절은 이렇게 선언합니다.","s":292.932,"e":296.629,"p":false,"h":false},{"t":"\"유다 족속의 피난하여 남은 자들은 다시 아래로 뿌리를 내리고 위로 열매를 맺으리라.","s":296.856,"e":302.394,"p":false,"h":false},{"t":"이는 남은 자가 예루살렘에서부터 나오며 피하는 자가 시온 산에서부터 나올 것임이라.","s":302.616,"e":308.392,"p":false,"h":false},{"t":"만군의 여호와의 열심이 이를 이루시리라.\"","s":308.592,"e":311.448,"p":false,"h":false},{"t":"6장의 그루터기, 10장의 남은 자가 여기서 실제로 이루어집니다.","s":311.652,"e":316.711,"p":false,"h":false},{"t":"9장 7절에서 \"만군의 여호와의 열심이 이를 이루시리라\"고 하신 그 말씀과 같은 표현이 이 장에서도 반복됩니다.","s":316.908,"e":324.959,"p":true,"h":false},{"t":"33절에서 35절, 이 성에는 들어오지 못한다 하나님이 앗수르 왕에 대해 선언하십니다.","s":325.764,"e":332.206,"p":false,"h":false},{"t":"\"그가 이     const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
