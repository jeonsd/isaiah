(function () {
  const TITLE = "isaiah_40", AUDIO_SRC = "isaiah_40_2610230230.mp3", DUR = 467, SEGS = [{"t":"이사야 40장","s":0,"e":1.636,"p":true,"h":false},{"t":"제목 \"위로하라, 내 백성을 위로하라\"","s":2.304,"e":5.796,"p":true,"h":false},{"t":"핵심 한 줄 하나님이 직접 오셔서 목자처럼 양 떼를 품으시고, 하나님을 기다리는 자에게 새 힘을 주십니다.","s":6.444,"e":13.605,"p":true,"h":false},{"t":"풀어 읽기","s":14.4,"e":15.47,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 40장은 이사야서의 큰 분기점입니다.","s":16.308,"e":21.2,"p":false,"h":false},{"t":"1장에서 39장은 심판과 경고가 중심이었고, 40장부터 66장까지는 위로와 회복이 중심입니다.","s":21.42,"e":29.142,"p":false,"h":false},{"t":"39장 끝에서 바벨론 포로를 예고했는데, 40장은 그 포로 생활에서 절망한 백성에게 주어지는 위로의 말씀입니다.","s":29.484,"e":37.958,"p":false,"h":false},{"t":"이사야 시대보다 약 150년 뒤의 사람들을 향한 말씀으로 읽습니다.","s":38.304,"e":43.079,"p":false,"h":false},{"t":"앞서 53장 풀이에서 말씀드린 것과 같은 시대입니다.","s":43.272,"e":47.439,"p":true,"h":false},{"t":"장의 흐름은 네 장면입니다.","s":48.096,"e":50.33,"p":false,"h":false},{"t":"먼저 하나님이 \"위로하라\"고 명령하시고, 다음으로 광야에서 한 소리가 \"여호와의 길을 예비하라\"고 외칩니다.","s":50.544,"e":58.55,"p":false,"h":false},{"t":"그다음 시온에 하나님이 목자로 오신다는 기쁜 소식이 있고, 마지막으로 하나님의 크심과 지치지 않는 힘에 대한 긴 선언으로 끝납니다.","s":58.896,"e":67.793,"p":false,"h":false},{"t":"사람은 풀처럼 시들지만 하나님의 말씀은 영원하다는 것이 이 장 전체를 꿰뚫는 중심입니다.","s":68.148,"e":74.427,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":74.772,"e":78.048,"p":true,"h":false},{"t":"1절에서 2절, 위로하라는 명령 \"너희는 위로하라 내 백성을 위로하라 너희 하나님이 말씀하시니라.\"","s":78.696,"e":85.834,"p":false,"h":false},{"t":"하나님이 누군가에게 위로를 전하라고 명하십니다.","s":86.04,"e":89.426,"p":false,"h":false},{"t":"예루살렘의 마음에 닿도록 말하라고 하십니다.","s":89.64,"e":92.724,"p":false,"h":false},{"t":"그 내용이 세 가지입니다.","s":92.952,"e":94.996,"p":false,"h":false},{"t":"복역할 기간이 끝났고, 죄악이 사함을 받았고, 모든 죄에 대해 두 배의 벌을 받았다는 것입니다.","s":95.22,"e":102.199,"p":false,"h":false},{"t":"하나님의 진노가 가볍지 않다는 것을 1장에서 39장에서 보았습니다.","s":102.564,"e":107.519,"p":false,"h":false},{"t":"그 진노의 시간이 이제 끝나고 하나님이 직접 말씀하십니다.","s":107.712,"e":111.735,"p":false,"h":false},{"t":"진노를 지나온 사람에게 이 위로가 얼마나 깊은지 느끼며 읽으시기 바랍니다.","s":111.924,"e":117.173,"p":true,"h":false},{"t":"3절에서 5절, 광야에 길을 내라 한 소리가 외칩니다.","s":117.828,"e":121.937,"p":false,"h":false},{"t":"\"너희는 광야에서 여호와의 길을 예비하라.","s":122.148,"e":125.12,"p":false,"h":false},{"t":"사막에서 우리 하나님을 위하여 대로를 평탄하게 하라.\"","s":125.316,"e":129.213,"p":false,"h":false},{"t":"옛날 왕이 행차할 때 앞서서 길을 닦던 것처럼, 하나님이 오시는 길을 준비하라는 것입니다.","s":129.42,"e":135.829,"p":false,"h":false},{"t":"골짜기는 메워지고 산과 언덕은 낮아지며 굽은 것은 곧게 되고 험한 곳은 평탄하게 됩니다.","s":136.188,"e":142.322,"p":false,"h":false},{"t":"그러면 \"여호와의 영광이 나타나고 모든 육체가 함께 보리라\"고 합니다.","s":142.668,"e":148.165,"p":false,"h":false},{"t":"이 말씀은 신약에서 세례 요한이 예수님을 소개하며 인용합니다.","s":148.356,"e":152.865,"p":false,"h":false},{"t":"하나님이 직접 오시는 길을 닦는 소리가 이때 시작되어 요한까지 이어진 것입니다.","s":153.072,"e":158.658,"p":true,"h":false},{"t":"6절에서 8절, 풀은 마르고 꽃은 시들어도 또 한 소리가 \"외치라\" 하자 선지자가 \"무엇이라고 외치리이까\" 묻습니다.","s":159.48,"e":168.089,"p":false,"h":false},{"t":"대답은 이렇습니다.","s":168.444,"e":170.007,"p":false,"h":false},{"t":"\"모든 육체는 풀이요 그 모든 아름다움은 들의 꽃과 같으니 여호와의 기운이 그 위에 불면 풀은 마르고 꽃은 시드나니 이는 백성이 풀이로다.","s":170.352,"e":179.502,"p":false,"h":false},{"t":"풀은 마르고 꽃은 시드나 오직 우리 하나님의 말씀은 영원히 서리라.\"","s":179.676,"e":184.262,"p":false,"h":false},{"t":"사람이 얼마나 연약한지, 그리고 하나님의 말씀이 얼마나 확실한지를 대비합니다.","s":184.464,"e":190.45,"p":false,"h":false},{"t":"포로가 된 백성은 \"우리 같은 풀 같은 존재가 어떻게 회복되겠는가\" 하고 절망했을 것입니다.","s":190.656,"e":197.292,"p":false,"h":false},{"t":"하나님의 말씀은 사람의 힘에 달려 있지 않기 때문에 영원합니다.","s":197.64,"e":201.936,"p":true,"h":false},{"t":"9절에서 11절, 보라, 너희 하나님이 오신다 이제 좋은 소식을 전하는 자가 높은 산에 올라가 소리를 높입니다.","s":202.572,"e":210.753,"p":false,"h":false},{"t":"\"너희 하나님을 보라.\"","s":211.104,"e":212.709,"p":false,"h":false},{"t":"이 소식은 두려워하지 말고 크게 전하라고 합니다.","s":213.012,"e":216.409,"p":false,"h":false},{"t":"주 여호와께서 능력으로 임하시고 그의 팔로 다스리십니다.","s":216.612,"e":220.766,"p":false,"h":false},{"t":"그런데 그 모습이 11절에서 갑자기 부드러워집니다.","s":220.968,"e":224.879,"p":false,"h":false},{"t":"\"그는 목자같이 양 떼를 먹이시며 어린양을 그 팔로 모아 품에 안으시고 젖먹이를 가진 암컷들을 온순히 인도하시리로다.\"","s":225.072,"e":232.851,"p":false,"h":false},{"t":"강한 팔로 다스리시는 하나님이 동   if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
