(function () {
  const TITLE = "isaiah_66", AUDIO_SRC = "isaiah_66_2610230230.mp3", DUR = 513, SEGS = [{"t":"이사야 66장","s":0,"e":1.832,"p":true,"h":false},{"t":"제목 겸손하고 통회하며 말씀을 떠는 자를 보시는 하나님","s":2.484,"e":6.483,"p":true,"h":false},{"t":"핵심 한 줄 하나님은 성전이라는 건물보다 겸손하고 통회하며 말씀을 두려워하는 사람을 찾으시고, 마침내 새 예루살렘에서 온 세상이 하나님을 예배하게 하십니다.","s":7.128,"e":17.752,"p":true,"h":false},{"t":"풀어 읽기","s":18.54,"e":19.61,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 이사야서의 마지막 장입니다.","s":20.448,"e":24.371,"p":false,"h":false},{"t":"이 장은 1장과 짝을 이룹니다.","s":24.588,"e":27.149,"p":false,"h":false},{"t":"1장에서 하나님은 성전에서 제사를 열심히 드리는 백성을 향해 \"너희 제물이 지겹다\"고 하셨습니다.","s":27.36,"e":34.339,"p":false,"h":false},{"t":"66장은 같은 문제를 다시 말씀하십니다.","s":34.704,"e":38.04,"p":false,"h":false},{"t":"하나님이 사람이 지은 집에 갇히시는 분이 아니며, 사람이 바치는 제물보다 마음이 겸손하고 말씀을 두려워하는 사람을 보신다는 것입니다.","s":38.268,"e":47.127,"p":true,"h":false},{"t":"이 장은 세 부분입니다.","s":47.916,"e":49.858,"p":false,"h":false},{"t":"참된 예배자와 거짓 예배자의 구분, 시온이 해산하는 것처럼 한꺼번에 새 백성을 낳는 기쁨, 그리고 모든 민족이 하나님의 영광을 보고 새 하늘과 새 땅에서 예배하는 마지막 장면입니다.","s":50.076,"e":62.96,"p":false,"h":false},{"t":"그런데 이사야서의 마지막 절은 의외로 심판의 모습으로 끝납니다.","s":63.288,"e":67.972,"p":false,"h":false},{"t":"이사야서가 심판과 회복이 번갈아 나오는 책이라는 것이 마지막까지 이어집니다.","s":68.184,"e":73.609,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":73.8,"e":77.076,"p":true,"h":false},{"t":"1절에서 4절, 하늘은 내 보좌요 땅은 내 발등상이다 \"여호와께서 이같이 말씀하시되 하늘은 내 보좌요 땅은 내 발판이니 너희가 나를 위하여 짓겠다는 집이 어디 있으며 나의 쉴 곳이 어디 있겠느냐?\"","s":77.724,"e":91.119,"p":false,"h":false},{"t":"하나님은 하늘과 땅을 다 가지신 분인데, 사람이 지은 성전이 그분을 담을 수 없다는 말씀입니다.","s":91.332,"e":98.105,"p":false,"h":false},{"t":"그리고 하나님이 찾으시는 사람은 2절에 있습니다.","s":98.46,"e":101.669,"p":false,"h":false},{"t":"\"내가 볼 사람은 곧 가난하고 마음이 상하여 내 말을 떨며 두려워하는 자니라.\"","s":101.88,"e":107.049,"p":false,"h":false},{"t":"가난하고 마음이 상하고 말씀을 두려워하는 사람이 하나님이 눈여겨보시는 사람입니다.","s":107.244,"e":112.68,"p":false,"h":false},{"t":"6장에서 \"나는 망했다\"고 했던 이사야와 57장에서 통회하는 자와 함께하신다는 약속이 이 구절에 모입니다.","s":112.896,"e":120.968,"p":false,"h":false},{"t":"그런데 그와 반대로 소를 잡아 제물로 바치는 자가 사람을 죽이는 자 같고, 어린양을 바치는 자가 개의 목을 꺾는 자 같고, 소제를 드리는 자가 돼지의 피를 드리는 자 같고, 분향하는 자가 우상을 찬송하는 자 같다고 하십니다.","s":121.32,"e":136.55,"p":false,"h":false},{"t":"제사의 형식은 같은데 마음이 다르면 하나님이 받지 않으신다는 말입니다.","s":136.872,"e":141.852,"p":false,"h":false},{"t":"그들은 자기 길을 택하고 마음이 가증한 것을 기뻐하기 때문에, 하나님도 그들이 두려워하는 것을 택해 그들에게 임하게 하시겠다고 하십니다.","s":142.092,"e":151.204,"p":false,"h":false},{"t":"그 이유는 \"내가 불러도 대답하는 자가 없었고 내가 말하여도 듣지 아니하고 나의 눈에 악을 행하며 내가 기뻐하지 아니하는 것을 택하였음이니라\"는 것입니다.","s":151.56,"e":162.219,"p":false,"h":false},{"t":"65장 12절과 같은 말씀이 반복됩니다.","s":162.576,"e":166.049,"p":true,"h":false},{"t":"5절에서 6절, 형제들이 미워하고 쫓아낼 때 \"여호와의 말씀을 떨며 두려워하는 너희여 그의 말씀을 들으라.\"","s":166.716,"e":174.412,"p":false,"h":false},{"t":"하나님의 말씀 때문에 두려워하는 자들을 형제들이 미워하고 내쫓으며 \"여호와께서 영광을 나타내사 우리가 너희 기쁨을 보게 하라\" 하고 조롱합니다.","s":174.6,"e":184.244,"p":false,"h":false},{"t":"그러나 그들은 수치를 당할 것이라고 하십니다.","s":184.572,"e":187.702,"p":false,"h":false},{"t":"성읍에서 소리가 나고 성전에서 소리가 나며 하나님이 원수에게 갚으시는 소리가 들립니다.","s":187.92,"e":193.799,"p":false,"h":false},{"t":"말씀을 두려워하는 자가 조롱받는 일은 오늘도 일어납니다.","s":194.148,"e":198.121,"p":false,"h":false},{"t":"하나님은 그 조롱을 기억하시고 갚으십니다.","s":198.324,"e":201.497,"p":true,"h":false},{"t":"7절에서 14절, 한꺼번에 낳는 시온 이제 놀라운 그림이 나옵니다.","s":202.14,"e":207.174,"p":false,"h":false},{"t":"시온이 진통하기 전에 해산하고 고통을 당하기 전에 사내아이를 낳았다고 합니다.","s":207.396,"e":212.743,"p":false,"h":false},{"t":"한 나라가 하루에 태어날 수 있느냐고 하나님이 물으십니다.","s":212.94,"e":216.844,"p":false,"h":false},{"t":"시온이 진통하자마자 그 자녀를 낳았다고 하십니다.","s":217.044,"e":220.605,"p":false,"h":false},{"t":"해산하게 하시는 분이 하나님이십니다.","s":220.824,"e":223.447,"p":false,"h":false},{"t":"그러니 예루살렘을 사랑하는 너희는 다 그와 함께 기뻐하고 즐거워하라고 하십니다.","s":223.668,"e":229.222,"p":false,"h":false},{"t":"그 안에서 위로의 젖을 먹고 영광의 풍성함을 누리게 됩니다.","s":229.572,"e":233.855,"p":false,"h":false},{"t":"하나님이 평강을 강같이, 열방의 영광을 넘치는 시내같이 그에게 주시고, 어머니가 자식을 위로하는 것 같이 하나님이 너희를 위로하신다고 하십니다.","s":234.072,"e":244.389,"p":false,"h":false},{"t":"40장에서 \"위로하라\"고 시작된 이야기가 66장의 위로로 돌아옵니다.","s":244.764,"e":250.273,"p":false,"h":false},{"t":"그것을 보고 너희 마음이 즐거워하며 뼈가 풀같이 무성해지고, 여호와의 손이 그의 종들에게 알려지며 원수에게는 진노가 나타납니다.","s":250.488,"e":259.555,"p":true,"h":false},{"t":"15절에서 17절, 불로 임하시는 하나님 \"보라 여호와께서 불 가운데 강림하시리니 그의 수레들은 회오리바람 같으리로다.\"","s":260.352,"e":269.031,"p":false,"h":false},{"t":"불과 칼로 모든 육체를 심판하시며, 여호와께 죽임을 당하는 자가 많을 것입니다.","s":269.244,"e":275.016,"p":false,"h":false},{"t":"스스로 정결하게 하며 동산으로 들어가 우상을 따르는 자들, 돼지고기와 가증한 물건과 쥐를 먹는 자들이 함께 망할 것이라고 하십니다.","s":275.22,"e":284.129,"p":false,"h":false},{"t":"이것이 하나님의 진노가 가볍지 않다는 이사야서의 마지막 증언입니다.","s":284.472,"e":289.281,"p":true,"h":false},{"t":"18절에서 21절, 열방을 모으시고 그들 중에서 제사장을 삼으신다 이제 열방을 향한 놀라운 약속이 나옵니다.","s":289.944,"e":298.266,"p":false,"h":false},{"t":"\"내가 그들의 행위와 사상을 아노라.","s":298.62,"e":301.239,"p":false,"h":false},{"t":"때가 이르면 모든 나라와 족속을 모으리니 그들이 와서 내 영광을 볼 것이라.\"","s":301.428,"e":306.662,"p":false,"h":false},{"t":"하나님이 그들 가운데 표징을 두어 살아남은 자들을 열방으로 보내십니다.","s":306.864,"e":311.739,"p":false,"h":false},{"t":"다시스와 풀과 활을 당기는 룻과 두발과 야완, 곧 내 명성을 듣지 못하고 내 영광을 보지 못한 먼 섬들로 보내어, 그들이 내 영광을 열방에 선포하게 하십니다.","s":311.94,"e":323.462,"p":false,"h":false},{"t":"그리고 그들이 모든 나라에서 너희 형제를 말과 수레와 가마와 노새와 낙타에 태워 내 거룩한 산 예루살렘으로 데려오는데, 마치 이스라엘 자손이 깨끗한 그릇에 예물을 담아 여호와의 집에 가져오는 것 같다고 하십니다.","s":323.82,"e":337.895,"p":false,"h":false},{"t":"그리고 21절은 놀라운 말씀입니다.","s":338.22,"e":341.158,"p":false,"h":false},{"t":"\"나는 그들 중에서 또한 택하여 제사장과 레위인을 삼으리라.\"","s":341.388,"e":345.697,"p":false,"h":false},{"t":"이방 사람 가운데서도 제사장을 세우시겠다는 약속입니다.","s":345.888,"e":350.035,"p":false,"h":false},{"t":"제사장은 이스라엘 가운데 레위 지파만 되던 자리였는데, 이제 열방에서도 하나님이 제사장을 택하신다는 말입니다.","s":350.244,"e":358.298,"p":false,"h":false},{"t":"19장에서 이집트와 앗수르가 하나님의 백성이라 불린다고 했고, 56장에서 이방인이 기도하는 집에 들어온다고 했던 약속이 이 마지막 장에서 가장 멀리 나아갑니다.","s":358.668,"e":369.965,"p":false,"h":false},{"t":"하나님의 구원이 이방에까지 이른다는 이사야서의 방향이 여기서 완성됩니다.","s":370.296,"e":375.528,"p":true,"h":false},{"t":"22절에서 24절, 새 하늘과 새 땅, 그리고 마지막 경고 \"내가 지을 새 하늘과 새 땅이 내 앞에 있을 것같이 너희 자손과 너희 이름도 그와 같이 있으리라.\"","s":376.2,"e":387.798,"p":false,"h":false},{"t":"새 하늘과 새 땅이 영원한   });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
