:false,"h":true},{"t":"이 열두 장을 읽으면서 두 가지를 조심해야 합니다.","s":832.608,"e":836.236,"p":false,"h":false},{"t":"하나는 24장 5절의 \"영원한 언약\"입니다.","s":836.892,"e":840.087,"p":false,"h":false},{"t":"땅이 그 거민 때문에 더러워졌고 그들이 율법을 범하고 영원한 언약을 깨뜨렸다는 말인데, 이 언약이 노아 언약인지 시내산 언약인지, 또는 인류 전체에게 주어진 창조 질서를 가리키는지 학자들이 갈립니다.","s":840.708,"e":855.067,"p":false,"h":false},{"t":"어느 쪽이든 이 심판이 이스라엘의 경계를 넘어 땅 전체에 미친다는 뜻입니다.","s":855.684,"e":861.121,"p":true,"h":false},{"t":"또 하나는 이 단락을 읽으며 현재 사건에서 \"그날\"을 찾아내려는 유혹입니다.","s":862.2,"e":867.71,"p":false,"h":false},{"t":"이사야서에서 \"그날\"은 여러 층으로 쓰입니다.","s":868.356,"e":871.702,"p":false,"h":false},{"t":"곧 닥칠 앗수르의 침공일 수도 있고, 바벨론에 의한 멸망일 수도 있고, 마지막 날일 수도 있습니다.","s":872.316,"e":879.447,"p":false,"h":false},{"t":"본문이 어느 층을 가리키는지는 구절마다 판단해야 하며, 한꺼번에 하나로 묶으면 본문이 말하지 않는 시간표를 만들게 됩니다.","s":880.092,"e":888.199,"p":true,"h":false},{"t":"이 단락이 오늘의 독자에게 말하는 것","s":889.2,"e":891.778,"p":false,"h":true},{"t":"이사야서가 이 열두 장에서 일관되게 요구한 것은 조용한 신뢰입니다.","s":892.908,"e":897.679,"p":false,"h":false},{"t":"30장 15절은 돌이켜 조용히 신뢰하는 것이 구원이라고 하는데, 백성은 말을 타고 도망하겠다고 했습니다.","s":898.308,"e":905.461,"p":false,"h":false},{"t":"심판의 날은 두려움의 날이고, 두려움은 사람을 서두르게 만듭니다.","s":906.084,"e":910.824,"p":false,"h":false},{"t":"이 책은 서두르는 사람에게 멈춰 서서 하나님을 기다리라고 말합니다.","s":911.448,"e":915.863,"p":true,"h":false},{"t":"그리고 이 기다림이 헛되지 않은 까닭을 30장 18절이 이렇게 말합니다.","s":916.92,"e":922.038,"p":false,"h":false},{"t":"기다리시는 분이 먼저 하나님이시라는 것입니다.","s":922.68,"e":925.973,"p":false,"h":false},{"t":"우리가 하나님을 기다리기 전에 하나님이 은혜 베풀기를 기다리고 계십니다.","s":926.568,"e":931.023,"p":false,"h":false},{"t":"심판의 말씀을 듣고 괴로운 사람에게, 이 열두 장은 그 말씀 뒤에 서 있는 분이 낯선 일을 하시다가 곧 본래의 일로 돌아오시는 분임을 알려 줍니다.","s":931.644,"e":941.623,"p":true,"h":false}]},{"title":"8. 히스기야 이야기는 왜 여기에 놓여 있는가","audio":"doc08_2610241127.mp3","dur":1116.6,"segs":[{"t":"히스기야 이야기는 왜 여기에 놓여 있는가: 앗수르의 구원에서 바벨론의 예고로","s":0,"e":5.747,"p":false,"h":true},{"t":"본문: 이사야 36~39장 (함께 읽을 본문: 왕하 18:13~20:19; 대하 32장; 사 7:1-17; 40:1-11; 렘 26:17-19)","s":6.66,"e":26.23,"p":true,"h":false},{"t":"35장은 광야가 꽃피고 속량받은 자들이 시온으로 돌아오는 그림으로 끝납니다.","s":27.252,"e":32.761,"p":false,"h":false},{"t":"그런데 36장을 펴면 독자는 갑자기 역사의 한복판에 서게 됩니다.","s":33.372,"e":38.362,"p":false,"h":false},{"t":"\"히스기야 왕 십사 년에 앗수르 왕 산헤립이 올라와서\"(36:1).","s":38.952,"e":44.418,"p":false,"h":false},{"t":"선포와 환상의 언어로 쓰이던 책이 산문 이야기로 바뀌고, 이사야는 이야기 속 인물로 등장합니다.","s":45.072,"e":51.878,"p":false,"h":false},{"t":"이 네 장은 이사야서에서 가장 이질적인 부분이면서 책을 둘로 나누는 경첩입니다.","s":52.524,"e":58.004,"p":false,"h":false},{"t":"이번 물음은 이 이야기가 왜 하필 여기에 놓여 있는가입니다.","s":58.644,"e":62.538,"p":true,"h":false},{"t":"낯선 자리, 낯선 순서","s":63.648,"e":66.055,"p":false,"h":true},{"t":"먼저 사실부터 짚겠습니다.","s":67.212,"e":69.381,"p":false,"h":false},{"t":"36~39장은 열왕기하 18장 13절부터 20장 19절과 거의 같은 내용입니다.","s":69.984,"e":76.926,"p":false,"h":false},{"t":"두 본문 가운데 어느 쪽이 먼저인지는 학자들 사이에 논쟁이 있어서 여기서는 정하지 않겠습니다.","s":77.58,"e":83.833,"p":false,"h":false},{"t":"눈여겨볼 것은 차이입니다.","s":84.456,"e":86.446,"p":false,"h":false},{"t":"열왕기하에는 히스기야가 먼저 산헤립에게 항복하고 성전과 궁의 은금을 바친 기록이 있습니다(왕하 18:14-16).","s":87.012,"e":96.355,"p":false,"h":false},{"t":"이사야서에는 그 대목이 없습니다.","s":96.876,"e":99.545,"p":false,"h":false},{"t":"반대로 38장 9절부터 20절의 히스기야의 시는 이사야서에만 있습니다.","s":100.188,"e":105.557,"p":false,"h":false},{"t":"이사야서는 같은 이야기를 쓰되 초점을 신뢰와 구원에 맞추었다고 읽을 수 있습니다.","s":105.876,"e":111.386,"p":true,"h":false},{"t":"순서도 이상합니다.","s":112.464,"e":114.132,"p":false,"h":false},{"t":"이야기는 앗수르 침공(36~37장), 히스기야의 병(38장), 바벨론 사절(39장) 차례로 나옵니다.","s":114.768,"e":127.109,"p":false,"h":false},{"t":"그런데 38장 6절에서 하나님이 \"너와 이 성을 앗수르 왕의 손에서 구원하리라\" 하셨으니, 병과 바벨론 사절은 침공이 끝나기 전의 일로 보는 견해가 일반적입니다.","s":127.692,"e":138.139,"p":false,"h":false},{"t":"정확한 연대는 학자마다 다르지만, 이사야서가 연대순을 깨고 바벨론 이야기를 맨 끝에 두었다는 점은 분명합니다.","s":138.456,"e":146.235,"p":false,"h":false},{"t":"바벨론이 이 책의 다음 무대이기 때문입니다.","s":146.88,"e":150.121,"p":true,"h":false},{"t":"7장과 36장: 같은 자리, 다른 왕","s":151.236,"e":155.653,"p":false,"h":true},{"t":"36장 2절은 랍사게가 \"윗못 수도 곁 세탁자의 밭 큰길\"에 섰다고 적습니다.","s":156.78,"e":162.146,"p":false,"h":false},{"t":"7장 3절에서 이사야가 아하스를 만난 곳과 거의 같은 표현입니다.","s":162.792,"e":167.357,"p":false,"h":false},{"t":"삼십여 년을 사이에 둔 두 장면이 같은 길목에서 벌어지는 것은 의도된 짝으로 읽는 것이 일반적입니다.","s":168.012,"e":174.929,"p":true,"h":false},{"t":"대조는 분명합니다.","s":176.004,"e":177.657,"p":false,"h":false},{"t":"아하스에게는 \"삼가며 조용하라 두려워하지 말라\"는 말씀이 왔고, 그는 징조를 거절하고 성전의 은금을 앗수르에 보냈습니다(왕하 16:8).","s":178.272,"e":188.749,"p":false,"h":false},{"t":"히스기야에게도 \"두려워하지 말라\"는 말씀이 오고(37:6), 그는 앗수르의 협박 편지를 성전에 가지고 올라가 하나님 앞에 펴 놓았습니다(37:14).","s":189.324,"e":201.057,"p":false,"h":false},{"t":"아하스는 성전의 보물을 앗수르로 가져갔고, 히스기야는 앗수르의 편지를 성전으로 가져갔습니다.","s":201.6,"e":208.185,"p":false,"h":false},{"t":"앞서 말씀드렸듯 열왕기하는 히스기야에게도 깨끗하지 못한 장면이 있었음을 기록합니다.","s":208.8,"e":214.419,"p":false,"h":false},{"t":"이사야서는 그것을 생략해 히스기야를 아하스의 정반대 편에 세웁니다.","s":215.028,"e":219.931,"p":true,"h":false},{"t":"랍사게의 설교: 가장 위험한 말은 반쪽 진실입니다","s":221.004,"e":225.194,"p":false,"h":true},{"t":"랍사게의 연설은 이 책에서 가장 정교한 유혹의 말입니다.","s":226.404,"e":230.422,"p":false,"h":false},{"t":"그는 \"네가 무엇을 믿느냐\"(36:4)로 시작합니다.","s":231.084,"e":236.428,"p":false,"h":false},{"t":"7장 9절 이래 이 책이 던져 온 바로 그 물음입니다.","s":237.06,"e":240.913,"p":false,"h":false},{"t":"이어서 애굽을 \"상한 갈대 지팡이\"(36:6)라 부르는데, 이것은 이사야가 30~31장에서 한 말과 같은 뜻입니다.","s":241.524,"e":251.966,"p":false,"h":false},{"t":"그의 말 가운데 얼마는 맞습니다.","s":252.648,"e":254.99,"p":false,"h":false},{"t":"그래서 위험합니다.","s":255.6,"e":257.097,"p":true,"h":false},{"t":"그는 히스기야가 산당과 제단을 없앤 일을 하나님을 업신여긴 일처럼 말합니다(36:7).","s":258.12,"e":264.924,"p":false,"h":false},{"t":"히스기야의 개혁(왕하 18:4)을 모독으로 뒤집은 것입니다.","s":265.464,"e":271.416,"p":false,"h":false},{"t":"5번 글에서 본 대로 \"여호와께서 이 땅을 멸하라 하셨다\"(36:10)고 하나님의 이름까지 끌어옵니다.","s":272.052,"e":280.405,"p":false,"h":false},{"t":"반쯤 맞는 말이 거짓말보다 무서운 것은, 맞는 부분을 근거로 틀린 결론까지 받아들이게 되기 때문입니다.","s":280.98,"e":288.37,"p":true,"h":false},{"t":"그는 유다 말로 성벽 위의 백성에게 직접 외쳐(36:11-13) 지도자들을 건너뛰고 백성의 마음을 겨눕니다.","s":289.368,"e":298.686,"p":false,"h":false},{"t":"마지막 제안은 더 교묘합니다.","s":299.304,"e":301.563,"p":false,"h":false},{"t":"항복하면 각자 자기 포도와 무화과를 먹고 자기 우물물을 마시다가, 곡식과 새 포도주와 떡과 포도원이 있는 땅으로 옮겨 주겠다는 것입니다(36:16-17).","s":302.184,"e":314.324,"p":false,"h":false},{"t":"이스라엘이 들어갈 땅을 묘사한 신명기 8장 8절과 닮았다는 지적이 많습니다.","s":314.64,"e":319.844,"p":false,"h":false},{"t":"포로로 끌려가는 일을 새 땅의 약속처럼 포장한 말이라는 점에서, 하나님의 약속을 흉내 낸 제국의 약속으로 읽을 만합니다.","s":320.472,"e":328.541,"p":false,"h":false},{"t":"이것은 제 해석입니다.","s":329.184,"e":331.098,"p":false,"h":false},{"t":"약속과 협박이 구별되지 않을 때 사람이 무너집니다.","s":331.74,"e":335.496,"p":true,"h":false},{"t":"그 앞에서 백성은 한마디도 대답하지 않았습니다(36:21).","s":336.528,"e":341.885,"p":false,"h":false},{"t":"왕의 명령이었습니다.","s":342.396,"e":344.104,"p":false,"h":false},{"t":"앞 글에서 본 \"돌이켜 조용히 하여야 구원을 얻을 것\"(30:15)이 여기서 처음으로 실행된 셈입니다.","s":344.736,"e":352.63,"p":true,"h":false},{"t":"성전에 펴 놓은 편지","s":353.772,"e":355.53,"p":false,"h":true},{"t":"히스기야는 옷을 찢고 베옷을 입고 성전에 들어갑니다(37:1).","s":356.652,"e":362.119,"p":false,"h":false},{"t":"이사야에게 사람을 보내 기도를 부탁하는데 그의 말이 눈에 띕니다.","s":362.592,"e":366.998,"p":false,"h":false},{"t":"오늘은 환난과 책벌과 능욕의 날이고, 아이를 낳으려 하나 낳을 힘이 없는 때라는 것입니다(37:3).","s":367.632,"e":375.305,"p":false,"h":false},{"t":"그리고 \"남아 있는 자를 위하여 기도하소서\"(37:4).","s":375.732,"e":380.305,"p":false,"h":false},{"t":"왕이 스스로 \"남은 자\"라는 말을 입에 올립니다.","s":380.952,"e":384.507,"p":false,"h":false},{"t":"4번 글에서 본 스알야숩의 이름이 왕의 입으로 돌아온 것입니다.","s":385.164,"e":389.245,"p":true,"h":false},{"t":"두 번째 편지가 오자 그는 직접 성전에 올라가 편지를 펴 놓고 기도합니다(37:14-20).","s":390.312,"e":398.086,"p":false,"h":false},{"t":"기도는 \"그룹들 사이에 계신 만군의 여호와\"를 천하 만국의 유일한 하나님으로 부르는 데서 시작해 \"이제 우리를 그의 손에서 구원하사 천하 만국이 주만이 여호와이신 줄 알게 하옵소서\"로 끝납니다.","s":398.556,"e":411.002,"p":false,"h":false},{"t":"구원을 구하는 이유가 자기 목숨이 아니라 하나님이 누구이신지 알려지는 일에 있습니다.","s":411.66,"e":417.309,"p":false,"h":false},{"t":"랍사게가 열국의 신들과 한 줄에 세운 하나님을, 히스기야는 그 줄에서 끌어내어 하나님의 자리에 모십니다.","s":417.924,"e":424.766,"p":true,"h":false},{"t":"구원의 근거: 나를 위하며 내 종 다윗을 위하여","s":425.88,"e":429.849,"p":false,"h":true},{"t":"하나님의 응답은 이사야를 통해 옵니다.","s":430.992,"e":433.699,"p":false,"h":false},{"t":"37장 21절부터 35절까지 앗수르의 교만을 꾸짖는 부분은 10장의 도끼 이야기를 다시 풀어 쓴 것처럼 읽힙니다.","s":434.304,"e":442.839,"p":false,"h":false},{"t":"구원의 이유는 35절에 있습니다.","s":443.484,"e":446.114,"p":false,"h":false},{"t":"\"내가 나를 위하며 내 종 다윗을 위하여 이 성을 보호하여 구원하리라.\"","s":446.76,"e":451.523,"p":true,"h":false},{"t":"이 구원을 히스기야의 믿음 때문이라고만 읽으면 본문의 무게를 놓칩니다.","s":452.52,"e":457.354,"p":false,"h":false},{"t":"21절은 \"네가 기도하였으므로\"라고 하고, 35절은 하나님 자신과 다윗 때문이라고 합니다.","s":457.992,"e":464.851,"p":false,"h":false},{"t":"두 말이 나란히 있습니다.","s":465.516,"e":467.249,"p":false,"h":false},{"t":"히스기야의 기도는 구원이 오는 통로이고, 구원의 근거는 하나님의 이름과 다윗에게 하신 약속입니다.","s":467.856,"e":474.73,"p":false,"h":false},{"t":"32절의 \"만군의 여호와의 열심이 이를 이루시리라\"가 여기서도 반복됩니다.","s":475.38,"e":480.743,"p":false,"h":false},{"t":"9장 7절로 이어지는 이 책의 후렴입니다.","s":481.356,"e":484.412,"p":true,"h":false},{"t":"36절에서 여호와의 천사가 앗수르 진영의 십팔만 오천 명을 치고, 산헤립은 니느웨로 돌아가 훗날 아들들의 칼에 죽습니다(37:36-38).","s":485.496,"e":496.801,"p":false,"h":false},{"t":"본문은 곧 이어진 일처럼 쓰지만 산헤립의 죽음은 주전 681년경으로 알려져 있어 침공 후 약 이십 년 뒤입니다.","s":497.268,"e":505.886,"p":false,"h":false},{"t":"이사야서가 사건을 압축해 37장 7절의 말씀이 이루어졌음을 보인 것으로 읽힙니다.","s":506.52,"e":512.513,"p":false,"h":false},{"t":"앗수르 쪽 기록도 히스기야를 새장 속의 새처럼 가두었다고 자랑할 뿐 예루살렘을 함락했다고는 말하지 않는 것으로 알려져 있습니다.","s":513.144,"e":521.091,"p":true,"h":false},{"t":"38장: 거두어진 선고","s":522.144,"e":525.058,"p":false,"h":true},{"t":"이야기는 방향을 틀어 왕 자신의 죽음으로 향합니다.","s":526.248,"e":529.761,"p":false,"h":false},{"t":"이사야가 와서 말합니다.","s":530.388,"e":532.228,"p":false,"h":false},{"t":"\"너는 집을 정리하라 네가 죽고 살지 못하리라\"(38:1).","s":532.908,"e":537.634,"p":false,"h":false},{"t":"이 선고에는 조건이 붙어 있지 않습니다.","s":538.2,"e":541.068,"p":false,"h":false},{"t":"히스기야는 낯을 벽으로 돌리고 통곡하며 기도합니다.","s":541.692,"e":545.271,"p":false,"h":false},{"t":"그러자 하나님은 이사야에게 다시 말씀하십니다.","s":545.904,"e":549.385,"p":false,"h":false},{"t":"\"내가 네 기도를 듣고 네 눈물을 보았노라 내가 네 수한을 십오 년 더하고\"(38:5).","s":550.008,"e":556.604,"p":false,"h":false},{"t":"선지자의 선고가 같은 날 뒤집힌 것입니다.","s":557.208,"e":560.062,"p":true,"h":false},{"t":"하나님이 정하신 말씀을 바꾸시는가 하는 물음이 여기서 일어납니다.","s":561.096,"e":565.143,"p":false,"h":false},{"t":"개혁주의 전통은 대체로 두 가지로 답해 왔습니다.","s":565.74,"e":569.173,"p":false,"h":false},{"t":"하나는 선지자의 선고를 조건적 경고로 읽는 것입니다.","s":569.772,"e":573.391,"p":false,"h":false},{"t":"요나가 \"사십 일이 지나면 니느웨가 무너지리라\" 외치자 니느웨가 회개하고 재앙이 거두어졌고, 예레미야 18장 7절부터 10절은 하나님이 이런 방식으로 일하심을 직접 설명합니다.","s":573.66,"e":585.704,"p":false,"h":false},{"t":"다른 하나는 하나님이 목적과 수단을 함께 정하신다고 보는 것입니다.","s":586.296,"e":590.752,"p":false,"h":false},{"t":"십오 년을 주시기로 한 하나님이 그 수단으로 히스기야의 기도를 정하셨고, 성경이 \"뉘우치신다\"고 쓴 표현은 사람의 눈에 그렇게 보이는 방식의 말씀이라는 설명입니다.","s":591.264,"e":602.318,"p":false,"h":false},{"t":"두 설명은 서로를 배척하지 않습니다.","s":602.964,"e":605.633,"p":false,"h":false},{"t":"다만 38장은 그 원리를 설명하지 않고 하나님이 기도를 들으시고 눈물을 보셨다고만 말합니다.","s":606.132,"e":613.201,"p":false,"h":false},{"t":"저는 이 본문 하나로 어느 쪽을 택할지 정할 근거는 없다고 봅니다.","s":613.836,"e":618.333,"p":true,"h":false},{"t":"예레미야 26장 17절부터 19절이 같은 일을 확인해 줍니다.","s":619.38,"e":623.802,"p":false,"h":false},{"t":"미가가 히스기야 때 \"시온은 갈아엎은 밭이 되리라\"고 예언했을 때, 왕이 여호와를 경외하며 그 얼굴을 구하자 하나님이 선고하신 재앙을 거두셨다는 것입니다.","s":624.456,"e":634.823,"p":true,"h":false},{"t":"이 장에는 이사야서에서 가장 인간적인 시가 있습니다.","s":635.94,"e":639.684,"p":false,"h":false},{"t":"히스기야는 \"나는 중년에 스올의 문에 들어가고\"(38:10)라고 탄식하고, 스올이 주께 감사하지 못하고 사망이 주를 찬양하지 못한다(38:18)고 말합니다.","s":640.332,"e":654.039,"p":false,"h":false},{"t":"25장 8절의 \"사망을 영원히 멸하시리라\"는 약속에 비하면 아직 거기까지 가지 못한 자리입니다.","s":654.696,"e":661.281,"p":false,"h":false},{"t":"부활의 소망이 분명해지기 전, 죽음 앞에 선 구약 신앙의 어둠이 솔직히 드러난 시입니다.","s":661.932,"e":668.085,"p":false,"h":false},{"t":"이 시는 이렇게 끝납니다.","s":668.736,"e":670.639,"p":false,"h":false},{"t":"\"아비는 자녀에게 주의 신실을 알게 하리이다\"(38:19).","s":671.256,"e":676.029,"p":false,"h":false},{"t":"이 구절을 기억해 두십시오.","s":676.62,"e":678.598,"p":false,"h":false},{"t":"39장에서 다시 만납니다.","s":679.14,"e":681.371,"p":true,"h":false},{"t":"징조도 있습니다.","s":682.452,"e":683.833,"p":false,"h":false},{"t":"하나님은 해시계의 그림자를 열 도 뒤로 물러가게 하시는데(38:8), 그 해시계에 \"아하스의 일영표\"라는 이름이 붙어 있습니다.","s":684.36,"e":693.739,"p":false,"h":false},{"t":"아하스가 거절한 징조를 히스기야는 구하고(38:22) 받습니다.","s":694.368,"e":700.419,"p":false,"h":false},{"t":"이름이 우연일 수도 있지만 7장과의 대조를 한 번 더 잇는 것으로 읽을 수 있습니다.","s":701.064,"e":706.486,"p":true,"h":false},{"t":"연장된 십오 년","s":707.544,"e":709.056,"p":false,"h":true},{"t":"이 십오 년에는 불편한 뒷이야기가 있습니다.","s":710.172,"e":713.313,"p":false,"h":false},{"t":"열왕기하 21장 1절에 따르면 히스기야의 아들 므낫세는 열두 살에 왕이 되어 오십오 년을 다스렸고, 유다 역사에서 가장 악한 왕으로 기록됩니다(왕하 21:9-16; 24:3-4).","s":713.952,"e":729.259,"p":false,"h":false},{"t":"히스기야의 통치가 이십구 년이고 병든 해가 십사 년째라면 므낫세는 병이 나은 뒤에 태어난 셈입니다.","s":729.864,"e":736.544,"p":false,"h":false},{"t":"이것은 단순 계산이고 통치 연대를 헤아리는 방식에 따라 학자마다 다르게 봅니다.","s":737.172,"e":743.178,"p":false,"h":false},{"t":"그러나 이 계산이 맞다면, 하나님이 기도에 응답해 주신 십오 년 가운데 유다를 멸망으로 몰아간 왕이 태어난 것입니다.","s":743.76,"e":751.616,"p":true,"h":false},{"t":"본문은 이 연결을 말하지 않으므로 본문의 평가처럼 읽어서는 안 됩니다.","s":752.652,"e":757.761,"p":false,"h":false},{"t":"다만 이렇게 이어 읽으면 하나가 보입니다.","s":758.412,"e":761.327,"p":false,"h":false},{"t":"기도에 응답받은 생명의 연장이 모든 문제의 해결은 아니라는 것입니다.","s":761.868,"e":766.673,"p":false,"h":false},{"t":"주어진 시간은 은혜이지만 그 시간이 어떤 열매를 맺는지는 또 다른 물음입니다.","s":767.232,"e":772.576,"p":true,"h":false},{"t":"39장: 보여 준 보물, 침묵하는 본문","s":773.676,"e":777.795,"p":false,"h":true},{"t":"39장은 곧바로 바벨론의 사절로 이어집니다.","s":778.896,"e":782.352,"p":false,"h":false},{"t":"바벨론 왕 므로닥발라단이 병이 나았다는 소식을 듣고 편지와 예물을 보냅니다.","s":782.964,"e":788.505,"p":false,"h":false},{"t":"히스기야는 기뻐서 보물창고와 은금과 향품과 무기고를 보여 주는데, 본문은 \"자기 궁과 정부에 있는 것을 보이지 아니한 것이 없었다\"(39:2)고 적습니다.","s":789.156,"e":801.187,"p":true,"h":false},{"t":"이사야가 와서 묻습니다.","s":802.296,"e":804.079,"p":false,"h":false},{"t":"그들이 어디서 왔고 무엇을 보았느냐고.","s":804.744,"e":807.528,"p":false,"h":false},{"t":"대답은 \"내 창고에서 보이지 아니한 것이 없나이다\"(39:4)입니다.","s":808.092,"e":814.12,"p":false,"h":false},{"t":"선고가 이어집니다.","s":814.752,"e":816.268,"p":false,"h":false},{"t":"날이 이르리니 네 집의 모든 것과 네 조상들이 쌓아 둔 것이 바벨론으로 옮겨지고, 네 자손 가운데 환관이 되는 자가 있으리라(39:6-7).","s":816.804,"e":827.018,"p":false,"h":false},{"t":"그리고 이 네 장의 마지막 구절이 옵니다.","s":827.316,"e":830.17,"p":false,"h":false},{"t":"\"당신이 말씀하신 여호와의 말씀이 선하니이다 또 이르되 내 생전에는 평안과 진실이 있으리로다\"(39:8).","s":830.772,"e":838.698,"p":true,"h":false},{"t":"이 구절은 읽기가 갈립니다.","s":839.7,"e":841.829,"p":false,"h":false},{"t":"한 읽기는 겸손한 순종으로 봅니다.","s":842.472,"e":845.091,"p":false,"h":false},{"t":"왕이 선고를 받아들이고 \"선하다\"고 인정한 것이라는 읽기입니다.","s":845.64,"e":850.092,"p":false,"h":false},{"t":"다른 읽기는 안일한 반응으로 봅니다.","s":850.716,"e":853.28,"p":false,"h":false},{"t":"자손에게 닥칠 재앙 앞에서 내 생전의 평안으로 위안하는 말이라는 것입니다.","s":853.848,"e":858.754,"p":false,"h":false},{"t":"역대하 32장은 히스기야가 마음이 교만하였으나 뉘우쳐 그 생전에는 진노가 임하지 않았다고 하고(25-26절), 바벨론 사절의 일을 두고 하나님이 그를 떠나 시험하셨다고 말합니다(31절).","s":859.392,"e":874.11,"p":false,"h":false},{"t":"역대기는 이 사건을 부분적으로 실패한 시험으로 읽은 셈입니다.","s":874.692,"e":879.121,"p":false,"h":false},{"t":"이사야서는 평가를 쓰지 않습니다.","s":879.768,"e":882.271,"p":true,"h":false},{"t":"저는 두 읽기를 한 문장 안에 겹쳐 둔 것이 의도라고 봅니다.","s":883.368,"e":887.561,"p":false,"h":false},{"t":"\"선하니이다\"와 \"내 생전에는\"이 한 호흡으로 이어져 있기 때문입니다.","s":888.156,"e":892.979,"p":false,"h":false},{"t":"그리고 38장 19절을 기억하는 독자는 같은 왕의 입에서 나온 두 말의 거리를 느낍니다.","s":893.628,"e":899.627,"p":false,"h":false},{"t":"병상에서는 자녀에게 하나님의 신실을 알리는 아비가 되겠다고 했는데, 몇 장 뒤에는 자녀에게 닥칠 일 앞에서 자기 생전의 평안을 안도합니다.","s":900.18,"e":909.36,"p":false,"h":false},{"t":"이것은 제 문학적 읽기이고, 본문이 직접 대조하라고 쓴 것은 아닙니다.","s":910.008,"e":915.176,"p":true,"h":false},{"t":"왜 여기서 1~39장이 끝나는가","s":916.272,"e":919.43,"p":false,"h":true},{"t":"이제 처음의 물음에 본문에서 읽을 수 있는 만큼 답하겠습니다.","s":920.592,"e":924.748,"p":true,"h":false},{"t":"첫째, 앞부분을 닫기 위해서입니다.","s":925.848,"e":929.013,"p":false,"h":false},{"t":"1~35장은 앗수르의 위협 아래서 하나님을 신뢰하라는 호소였고, 36~37장은 그 호소가 실현된 한 장면입니다.","s":929.664,"e":938.936,"p":false,"h":false},{"t":"신뢰하는 왕이 있고, 하나님이 구원하십니다.","s":939.6,"e":942.922,"p":false,"h":false},{"t":"앞의 말씀이 헛된 약속이 아니었음을 역사 속에서 보여 줍니다.","s":943.56,"e":947.703,"p":true,"h":false},{"t":"둘째, 그러나 이 성공이 마지막 답이 아님을 보이기 위해서입니다.","s":948.816,"e":953.768,"p":false,"h":false},{"t":"38장은 가장 좋은 왕도 죽는다는 것을, 39장은 가장 좋은 왕도 안일함에 넘어진다는 것을 보여 줍니다.","s":954.36,"e":961.917,"p":false,"h":false},{"t":"이사야서는 7장의 아기, 9장의 평강의 왕, 11장의 싹을 말해 왔고, 히스기야는 그 기대에 가장 가까이 온 인물이었습니다.","s":962.568,"e":972.36,"p":false,"h":false},{"t":"히스기야를 임마누엘의 아기로 보려는 읽기가 오래전부터 있었습니다만, 39장의 마지막 모습이 그 기대를 접게 한다는 것이 제 판단입니다.","s":973.008,"e":982.293,"p":false,"h":false},{"t":"히스기야는 아하스보다 낫지만 약속된 왕은 아닙니다.","s":982.944,"e":986.774,"p":true,"h":false},{"t":"셋째, 다음 책을 열기 위해서입니다.","s":987.876,"e":991.086,"p":false,"h":false},{"t":"이야기의 순서를 뒤집은 것은 바벨론의 예고를 마지막에 두기 위해서였습니다.","s":991.692,"e":996.877,"p":false,"h":false},{"t":"39장 6절의 예고가 있어야 40장의 \"위로하라 내 백성을 위로하라\"가 이해됩니다.","s":997.56,"e":1003.692,"p":false,"h":false},{"t":"이 위로는 아직 오지 않은 포로 생활을 미리 내다본 위로입니다.","s":1004.328,"e":1008.475,"p":false,"h":false},{"t":"이 점은 이사야서의 저자 문제와 맞닿아 있어서 9번 글에서 따로 다루겠습니다.","s":1009.116,"e":1014.445,"p":true,"h":false},{"t":"넷째, 시온에 대한 오해를 막기 위해서일 수 있습니다.","s":1015.56,"e":1019.44,"p":false,"h":false},{"t":"37장의 구원은 후대 유다에게 \"시온은 무너지지 않는다\"는 믿음으로 굳어질 위험이 있었습니다.","s":1020.06,"e":1026.676,"p":false,"h":false},{"t":"예레미야 7장에서 백성이 \"이는 여호와의 성전이라\"를 되풀이하며 성전을 부적처럼 믿은 일이 그것입니다.","s":1027.332,"e":1034.286,"p":false,"h":false},{"t":"구원 이야기 바로 뒤에 바벨론 예고를 붙인 것이 그 오해를 미리 막는다고 읽을 수 있습니다.","s":1034.964,"e":1041.292,"p":false,"h":false},{"t":"이것은 제 해석입니다.","s":1041.948,"e":1043.855,"p":true,"h":false},{"t":"이 이야기가 오늘의 독자에게 묻는 것","s":1044.936,"e":1047.689,"p":false,"h":true},{"t":"히스기야의 이야기는 위기에 강한 사람이 안락에 약할 수 있음을 보여 줍니다.","s":1048.752,"e":1053.618,"p":false,"h":false},{"t":"그는 군대 앞에서는 성전으로 갔고, 죽음 앞에서는 벽을 향해 울었으나, 사절 앞에서는 보물을 자랑했습니다.","s":1054.26,"e":1061.95,"p":false,"h":false},{"t":"가장 큰 시험은 가장 큰 위기가 아니라 위기가 지나간 뒤에 옵니다.","s":1062.576,"e":1067.169,"p":false,"h":false},{"t":"\"무엇을 보았느냐\"는 이사야의 물음은 구원받은 사람에게 가장 필요한 물음일지 모릅니다.","s":1067.796,"e":1073.91,"p":false,"h":false},{"t":"구원받은 나는 지금 누구에게 무엇을 보이고 있는가.","s":1074.564,"e":1078.133,"p":true,"h":false},{"t":"또 하나는 \"내 생전에는\"이라는 말의 위험입니다.","s":1079.244,"e":1082.828,"p":false,"h":false},{"t":"이사야는 아들의 이름을 걸고 다음 세대에게 말씀을 넘기려 했고, 히스기야는 자기 시대의 평안으로 만족했습니다.","s":1083.492,"e":1091.23,"p":false,"h":false},{"t":"신앙이 내 생전의 평안으로 닫히는 순간 다음 세대는 광야에 남겨집니다.","s":1091.844,"e":1096.626,"p":true,"h":false},{"t":"마지막으로 이 이야기는 우리를 히스기야에게서 떠나 다음 장으로 가게 합니다.","s":1097.712,"e":1102.746,"p":false,"h":false},{"t":"가장 좋은 왕으로도 풀리지 않는 일이 있기에, 40장은 왕이 아니라 하나님 자신이 오신다는 말씀으로 시작합니다.","s":1103.4,"e":1110.717,"p":false,"h":false},{"t":"\"너희 하나님이 이르시되 너희는 위로하라 내 백성을 위로하라.\"","s":1111.356,"e":1115.553,"p":true,"h":false}]},{"title":"9-1. 이사야서는 누가 썼는가","audio":"9-1_2610241127.mp3","dur":738,"segs":[{"t":"이사야서는 누가 썼는가: 한 책의 경계를 묻다","s":0,"e":3.917,"p":false,"h":true},{"t":"본문: 이사야 1:1; 13:1; 39:5-8; 40:1-11; 44:24-45:13; 56:1-8 (함께 읽을 본문: 사 41:21-29; 46:8-11; 마 3:1-3; 요 12:37-41; 롬 10:16-21)","s":5.04,"e":36.56,"p":true,"h":false},{"t":"앞의 글들은 저자 문제를 세 번 미뤘습니다.","s":37.44,"e":40.593,"p":false,"h":false},{"t":"6번에서는 애굽의 회복을 말하는 19장 끝부분, 7번에서는 심판 사이에 놓인 회복의 대목들, 8번에서는 39장의 바벨론 예고가 그 대상이었습니다.","s":41.256,"e":52.469,"p":false,"h":false},{"t":"이제 피할 수 없습니다.","s":53.136,"e":54.879,"p":false,"h":false},{"t":"40장을 펴면 독자는 갑자기 포로 생활이 끝나가는 백성 앞에 서게 되기 때문입니다.","s":55.476,"e":61.02,"p":false,"h":false},{"t":"이 물음은 학문적 호기심에서 나온 것이 아닙니다.","s":61.524,"e":64.855,"p":false,"h":false},{"t":"40장 이후를 어느 시대의 말씀으로 읽느냐에 따라 \"위로하라\"는 말씀이 누구에게 하는 말인지가 달라집니다.","s":65.412,"e":72.254,"p":false,"h":false},{"t":"그래서 이번 글에서는 논쟁을 공정하게 정리하고, 다음 글(9-2)에서 40장의 위로를 읽겠습니다.","s":72.9,"e":81.616,"p":true,"h":false},{"t":"논쟁은 어떻게 시작되었는가","s":82.656,"e":84.885,"p":false,"h":true},{"t":"이사야서 전체를 8세기 선지자 이사야 한 사람의 작품으로 읽는 것이 오랫동안 유대교와 기독교의 공통된 전통이었습니다.","s":86.004,"e":94.148,"p":false,"h":false},{"t":"12세기 유대인 학자 이븐 에스라가 40장 이후의 시대 배경을 두고 의문을 암시했다고 알려져 있지만, 논쟁이 본격화된 것은 18세기 말 이후입니다.","s":94.716,"e":105.297,"p":false,"h":false},{"t":"40~66장이 이사야 뒤 시대의 다른 인물에게서 나왔다는 주장이 나왔고, 1892년 베른하르트 둠이 이 책을 셋으로 나누는 틀을 세웠습니다.","s":105.984,"e":116.397,"p":false,"h":false},{"t":"1~39장은 8세기 이사야, 40~55장은 바벨론 포로기, 56~66장은 귀환 이후라는 구분입니다.","s":117.036,"e":127.042,"p":false,"h":false},{"t":"이후 학계에서는 \"제1, 제2, 제3 이사야\"라는 이름이 널리 쓰였습니다.","s":127.692,"e":134.832,"p":true,"h":false},{"t":"그런데 이 구분은 경계가 40장에서 딱 끊어지지도 않습니다.","s":135.936,"e":140.389,"p":false,"h":false},{"t":"비평 학자들 가운데는 1~39장 안에서도 13~14장의 바벨론 선고, 24~27장, 34~35장이 후대 것이라고 보는 사람이 많습니다.","s":140.976,"e":153.414,"p":false,"h":false},{"t":"7번 글에서 말씀드린 \"회복의 대목이 훗날 끼워졌다\"는 견해가 이것입니다.","s":154.08,"e":159.06,"p":false,"h":false},{"t":"그래서 문제는 \"40장 이후만 다른 사람인가\"보다 넓습니다.","s":159.66,"e":164.186,"p":false,"h":false},{"t":"이 책이 한 사람에게서 나왔는가, 아니면 여러 세대에 걸쳐 자란 책인가 하는 물음입니다.","s":164.808,"e":171.008,"p":true,"h":false},{"t":"6번 글에서 본 19장 16~25절, 곧 애굽과 앗수르가 하나님의 백성이라 불리는 대목도 같은 논쟁에 들어 있습니다.","s":172.08,"e":180.962,"p":false,"h":false},{"t":"이 단락을 이사야 당대의 것으로 보는 학자도 있고, 열방에 대한 기대가 커진 후대의 것으로 보는 학자도 있습니다.","s":181.62,"e":188.98,"p":false,"h":false},{"t":"본문 안에 시대를 밝히는 표지가 분명하지 않아 읽기가 갈립니다.","s":189.612,"e":193.842,"p":false,"h":false},{"t":"이 시리즈는 어느 쪽이든, 이 단락이 책의 최종 형태 안에서 열방의 구원을 미리 보이는 일을 읽습니다.","s":194.472,"e":201.541,"p":true,"h":false},{"t":"나누어 보는 쪽이 드는 근거","s":202.644,"e":204.697,"p":false,"h":true},{"t":"첫째는 역사적 정황입니다.","s":205.884,"e":208.076,"p":false,"h":false},{"t":"1~39장의 배경은 앗수르입니다.","s":208.692,"e":211.723,"p":false,"h":false},{"t":"40장 이후에서는 앗수르가 거의 사라지고 바벨론이 무대에 있습니다(43:14; 47장; 48:20).","s":212.328,"e":222.169,"p":false,"h":false},{"t":"예루살렘은 폐허이고(44:26) 백성은 포로로서 해방을 기다립니다.","s":222.408,"e":228.598,"p":false,"h":false},{"t":"선지자는 대체로 자기 시대 청중에게 말씀한다는 원칙을 따르면, 이런 말씀은 포로기 사람에게 주어진 것으로 읽는 편이 자연스럽다는 것입니다.","s":229.212,"e":238.372,"p":true,"h":false},{"t":"둘째는 고레스라는 이름입니다.","s":239.4,"e":241.741,"p":false,"h":false},{"t":"44장 28절과 45장 1절은 이방 왕을 이름으로 부릅니다.","s":242.352,"e":247.083,"p":false,"h":false},{"t":"이사야는 주전 8세기 사람이고 고레스가 바벨론을 정복한 것은 주전 539년이니, 약 150년 앞서 이름을 불렀다는 말이 됩니다.","s":247.716,"e":257.709,"p":false,"h":false},{"t":"성경 선지서에서 이런 예는 드물다는 점이 근거로 쓰입니다.","s":258.336,"e":262.406,"p":true,"h":false},{"t":"셋째는 이름의 부재입니다.","s":263.484,"e":265.509,"p":false,"h":false},{"t":"1~39장에는 이사야의 이름이 여러 번 나오지만 40~66장에는 한 번도 나오지 않습니다.","s":266.04,"e":273.375,"p":false,"h":false},{"t":"넷째는 어휘와 문체, 신학 강조점의 차이입니다.","s":274.032,"e":278.134,"p":false,"h":false},{"t":"40장 이후는 창조와 우상 논쟁, 위로의 어조가 짙고, 1~39장의 선고 중심 어조와 다르다는 것입니다.","s":278.712,"e":287.415,"p":true,"h":false},{"t":"한 사람의 책으로 보는 쪽이 드는 근거","s":288.504,"e":291.148,"p":false,"h":true},{"t":"이 입장의 첫째 근거는 책 전체를 꿰는 연결입니다.","s":292.212,"e":296.019,"p":false,"h":false},{"t":"이 시리즈에서 우리가 이미 본 것만 해도 적지 않습니다.","s":296.568,"e":300.424,"p":false,"h":false},{"t":"하나님을 \"이스라엘의 거룩하신 이\"라 부르는 독특한 칭호는 이사야서 전체에 걸쳐 스무 번 넘게 나오고 다른 책에서는 드뭅니다.","s":300.96,"e":309.666,"p":false,"h":false},{"t":"눈멂과 귀막힘의 주제가 6장에서 시작해 29장, 32장, 35장을 거쳐 42장과 43장에서 이어집니다.","s":310.284,"e":319.628,"p":false,"h":false},{"t":"시온, 남은 자, 그루터기에서 난 싹, 만군의 여호와의 열심 같은 낱말들이 책의 양쪽에 모두 나옵니다.","s":320.256,"e":328.746,"p":false,"h":false},{"t":"5번 글과 7번 글에서 본 포도원 노래와 그 회복도 그런 사례입니다.","s":329.328,"e":334.01,"p":false,"h":false},{"t":"둘째 근거는 책의 구조입니다.","s":334.548,"e":336.867,"p":false,"h":false},{"t":"39장의 바벨론 예고가 40장의 위로를 부르도록 짜여 있다는 점은 8번에서 보았습니다.","s":337.5,"e":343.74,"p":true,"h":false},{"t":"셋째는 전승입니다.","s":344.844,"e":346.487,"p":false,"h":false},{"t":"사해 사본의 이사야 두루마리는 1~66장을 한 두루마리에 이어서 필사해 두었고, 외경 집회서 48장도 이사야를 시온의 슬퍼하는 자를 위로한 선지자로 기억합니다.","s":347.112,"e":358.66,"p":false,"h":false},{"t":"넷째는 신약입니다.","s":359.352,"e":360.924,"p":false,"h":false},{"t":"세례 요한을 40장 3절과 연결하는 마태복음 3장, 6장 10절과 53장 1절을 한자리에서 \"이사야\"의 말로 인용하는 요한복음 12장 37절부터 41절, 65장 1절을 \"이사야\"의 말로 인용하는 로마서 10장 20절이 있습니다.","s":361.512,"e":379.322,"p":false,"h":false},{"t":"그러니 신약 저자들은 책의 양쪽을 한 선지자의 이름으로 불렀다는 것입니다.","s":379.98,"e":384.897,"p":false,"h":false},{"t":"이에 대해 반대편은 신약의 \"이사야\"가 저자를 판정한 말이 아니라 책의 이름일 뿐이라고 답합니다.","s":385.524,"e":392.179,"p":true,"h":false},{"t":"다섯째는 40~48장의 논증 구조입니다.","s":393.3,"e":397.169,"p":false,"h":false},{"t":"이 단락에서 하나님은 우상과 자신을 구별하는 기준을 \"앞일을 미리 말씀하심\"에 두십니다(41:21-29; 44:7; 46:10; 48:3-5).","s":397.764,"e":412.16,"p":false,"h":false},{"t":"이 논증은 선포가 사건보다 앞섰다는 전제 위에 서 있다는 것입니다.","s":412.776,"e":417.444,"p":false,"h":false},{"t":"이에 대해 반대편은, 이 논증은 청중이 이미 시작된 고레스의 등장을 보고 있는 상황에서 오히려 더 강력해진다고 답합니다.","s":417.996,"e":426.186,"p":true,"h":false},{"t":"각 입장이 답해야 하는 것","s":427.284,"e":429.143,"p":false,"h":true},{"t":"공정하게 보려면 양쪽 모두 풀어야 할 숙제가 있음을 말해야 합니다.","s":430.236,"e":434.681,"p":false,"h":false},{"t":"나누어 보는 쪽은 책 전체를 꿰는 어휘와 주제의 연결이 왜 이렇게 촘촘한지를 설명해야 합니다.","s":435.348,"e":441.778,"p":false,"h":false},{"t":"보통 \"이사야의 제자들이 그의 전통 안에서 이어 썼다\"는 이사야 학파 가설로 답하는데, 그러면 한 사람의 저작이라는 말과 실제로 큰 차이가 없다는 반론이 따릅니다.","s":442.404,"e":453.301,"p":false,"h":false},{"t":"또 한 위대한 선지자의 이름이 전혀 남지 않은 채 이사야서에 섞였다는 점도 설명이 필요합니다.","s":453.96,"e":460.182,"p":true,"h":false},{"t":"한 사람으로 보는 쪽은 40장 이후의 말씀이 포로기 사람에게 하듯 쓰인 이유를 설명해야 합니다.","s":461.268,"e":467.198,"p":false,"h":false},{"t":"보통 이사야가 환상 가운데 미래의 백성 자리에 서서 말했다고 답합니다.","s":467.784,"e":472.737,"p":false,"h":false},{"t":"이 설명은 성경 안에서 가능하지만, 선지자가 일차 청중 없이 150년 뒤의 사람에게 말했다는 점이 걸리는 사람이 많습니다.","s":473.4,"e":481.713,"p":false,"h":false},{"t":"또 문체와 어휘 차이가 장르와 주제 차이만으로 충분히 설명되는지도 논쟁이 계속됩니다.","s":482.328,"e":488.357,"p":true,"h":false},{"t":"한편 이 문제에는 중간 입장도 있습니다.","s":489.456,"e":492.553,"p":false,"h":false},{"t":"편집 과정이 있었더라도 우리가 가진 최종 형태가 하나의 의도된 책이라는 점을 강조하는 읽기입니다.","s":493.2,"e":499.935,"p":false,"h":false},{"t":"정경적 접근이라 불리는 이 방식은 저자가 누구인가보다 이 책이 지금의 순서로 무엇을 말하는가를 묻습니다.","s":500.58,"e":507.908,"p":false,"h":false},{"t":"개혁주의 전통에서는 에드워드 영, 알렉 모티어, 존 오스왈트 같은 학자들이 단일 저자를 옹호해 온 것으로 압니다.","s":508.428,"e":516.757,"p":true,"h":false},{"t":"무엇이 달라지고 무엇이 달라지지 않는가","s":517.86,"e":520.93,"p":false,"h":true},{"t":"이 논쟁을 읽을 때는 달라지는 것과 달라지지 않는 것을 구분해야 합니다.","s":522.108,"e":526.913,"p":true,"h":false},{"t":"달라지지 않는 것이 많습니다.","s":528.012,"e":530.084,"p":false,"h":false},{"t":"우리가 손에 쥔 책이 하나님의 말씀이라는 확신은 저자가 몇 사람이든 같습니다.","s":530.712,"e":535.754,"p":false,"h":false},{"t":"이 시리즈가 읽고 있는 것은 최종 형태이고, 앞선 글들의 읽기(6장과 29장의 연결, 5장과 27장의 짝, 39장과 40장의 이음)는 어느 입장에서도 유지됩니다.","s":536.4,"e":550.303,"p":false,"h":false},{"t":"책 전체가 심판에서 위로로 가는 한 방향의 구조라는 점도 같습니다.","s":550.836,"e":555.141,"p":true,"h":false},{"t":"달라지는 것은 두 가지입니다.","s":556.2,"e":558.354,"p":false,"h":false},{"t":"하나는 40장 이후를 누구의 눈높이로 읽느냐입니다.","s":558.936,"e":562.533,"p":false,"h":false},{"t":"단일 저자로 읽으면 8세기의 이사야가 아직 오지 않은 포로기를 내다보고 미리 위로하는 것이고, 포로기 선지자로 읽으면 이미 포로로 사는 사람에게 위로를 전하는 것입니다.","s":563.148,"e":574.067,"p":false,"h":false},{"t":"이것이 9-2에서 다룰 \"아직 오지 않은 귀환을 왜 미리 위로하시는가\"의 물음에 직접 걸립니다.","s":574.74,"e":581.5,"p":false,"h":false},{"t":"다른 하나는 예언을 어떻게 이해하느냐입니다.","s":582.12,"e":585.039,"p":false,"h":false},{"t":"하나님이 이름까지 미리 불러 예언하실 수 있다고 보느냐, 선지자는 자기 시대의 사람에게 말한다는 원칙을 우선하느냐의 차이입니다.","s":585.612,"e":594.143,"p":false,"h":false},{"t":"이 문제는 문헌 증거만으로 결정되지 않고 성경 영감과 예언에 대한 신학적 전제가 함께 작용합니다.","s":594.756,"e":601.823,"p":false,"h":false},{"t":"양쪽 모두 이 점을 인정할 때 논쟁이 정직해집니다.","s":602.46,"e":606.388,"p":true,"h":false},{"t":"제 판단","s":607.428,"e":608.382,"p":false,"h":true},{"t":"여기서는 제 판단을 구분해서 말씀드리겠습니다.","s":609.516,"e":612.869,"p":false,"h":false},{"t":"문체와 어휘의 차이만으로 저자를 가르는 논증은 장르와 주제가 달라서 생긴 차이로도 설명될 수 있어 결정적이지 않다고 봅니다.","s":613.512,"e":621.828,"p":false,"h":false},{"t":"반대로 고레스의 이름 하나로 단일 저자를 증명하는 것도 충분하지 않습니다.","s":622.476,"e":627.548,"p":false,"h":false},{"t":"이름을 미리 부르는 일이 가능하다고 믿는 사람은 그것을 하나님의 주권으로 읽겠지만, 이는 증거에서 나온 결론이 아니라 전제에서 나온 결론이기 때문입니다.","s":628.164,"e":638.276,"p":true,"h":false},{"t":"제가 더 무겁게 보는 것은 책의 구성적 통일성입니다.","s":639.288,"e":643.086,"p":false,"h":false},{"t":"6장에서 닫힌 눈과 귀, 5장의 포도원, 8장의 걸림돌과 기촛돌, 7장의 아하스와 36장의 히스기야, 39장과 40장의 이음이 이렇게 촘촘히 맞물린다는 사실은, 한 사람의 작품이든 한 전통이 의도적으로 엮은 작품이든 이 책이 하나로 읽히기를 의도했다는 증거입니다.","s":643.716,"e":665.122,"p":false,"h":false},{"t":"그래서 이 앱은 개혁주의 전통의 단일 저자 입장을 기본 전제로 읽되, 다른 입장을 가진 독자도 같은 방식으로 읽을 수 있도록 40장 이후의 해설을 쓰겠습니다.","s":665.748,"e":676.619,"p":false,"h":false},{"t":"이것이 이 시리즈를 쓰는 방식에 대한 제 제안이며, 정설을 선언하는 것은 아닙니다.","s":677.268,"e":682.933,"p":true,"h":false},{"t":"읽는 사람에게 남는 것","s":684.036,"e":685.75,"p":false,"h":true},{"t":"저자 논쟁을 듣고 마음이 불편해지는 분이 있을 것입니다.","s":686.736,"e":690.943,"p":false,"h":false},{"t":"이 논쟁이 성경의 권위를 흔드는 것처럼 느껴지기 때문입니다.","s":691.56,"e":695.541,"p":false,"h":false},{"t":"그러나 이 논쟁의 어느 편에서도 이사야서가 하나님의 말씀이라는 고백을 부인하지 않는 학자가 많다는 점은 알아 두시길 권합니다.","s":696.096,"e":704.477,"p":false,"h":false},{"t":"문제는 하나님이 이 말씀을 어떤 방식으로 주셨는가에 있고, 그 방식을 둘러싼 견해 차이가 말씀 자체의 무게를 바꾸지는 않습니다.","s":705.096,"e":714.036,"p":true,"h":false},{"t":"그리고 이 논쟁을 겪으며 읽는 사람이 붙들 것은 오히려 이사야서가 스스로 하는 말입니다.","s":715.104,"e":721.297,"p":false,"h":false},{"t":"40장 8절은 풀은 마르고 꽃은 시들지만 우리 하나님의 말씀은 영원히 서리라고 합니다.","s":721.944,"e":728.168,"p":false,"h":false},{"t":"누가 어느 시대에 썼든, 이 말씀이 포로가 된 사람들을 일으켜 세운 말씀이었다는 사실이 이 책의 가장 단단한 증거입니다.","s":728.748,"e":736.963,"p":true,"h":false}]},{"title":"9-2. 아직 오지 않은 귀환을 왜 미리 위로하시는가","audio":"9-2_2610241127.mp3","dur":970.4,"segs":[{"t":"아직 오지 않은 귀환을 왜 미리 위로하시는가: 이사야 40장 1~11절을 읽다","s":0,"e":6.235,"p":false,"h":true},{"t":"본문: 이사야 40:1-31 (함께 읽을 본문: 사 1:3; 6:1-8; 30:15-18; 37:27; 39:5-8; 55:10-11; 마 3:1-3; 벧전 1:24-25)","s":7.416,"e":32,"p":true,"h":false},{"t":"앞 글에서 저자 논쟁의 틀을 세웠으니, 이제 40장 자체를 읽겠습니다.","s":32.976,"e":38.199,"p":false,"h":false},{"t":"39장은 \"네 자손이 바벨론으로 끌려가리라\"는 선고와 왕의 \"내 생전에는 평안하리로다\"로 끝났습니다.","s":38.808,"e":45.55,"p":false,"h":false},{"t":"그 바로 다음 구절이 \"너희는 위로하라 내 백성을 위로하라\"(40:1)입니다.","s":46.188,"e":52.979,"p":false,"h":false},{"t":"선고 직후에 위로가 오는 것은 이 책이 7번 글에서 본 리듬이지만, 여기서는 간격이 가장 큽니다.","s":53.64,"e":60.519,"p":false,"h":false},{"t":"아직 포로로 끌려가지도 않은 백성을 위로하는 것인지, 이미 포로가 된 백성을 위로하는 것인지에 따라 이 말씀이 서 있는 자리가 달라집니다.","s":61.128,"e":70.35,"p":false,"h":false},{"t":"그 물음에서 출발하여 이 장이 스스로 하는 답을 읽겠습니다.","s":70.956,"e":75.248,"p":true,"h":false},{"t":"누구의 목소리인가","s":76.356,"e":77.963,"p":false,"h":true},{"t":"1절의 \"위로하라\"는 복수 명령형입니다.","s":79.128,"e":81.871,"p":false,"h":false},{"t":"누구에게 하는 말인지 본문이 밝히지 않습니다.","s":82.512,"e":85.509,"p":false,"h":false},{"t":"이어지는 세 대목이 모두 \"소리\"로 시작하는 것이 이 장의 특징입니다.","s":86.112,"e":90.956,"p":false,"h":false},{"t":"1~2절에서 위로를 명하는 소리가 있고, 3절에서 \"광야에서 외치는 자의 소리\"가 길을 예비하라고 하며, 6절에서는 또 다른 소리가 \"외치라\" 하자 누군가 \"무엇이라 외치리이까\" 하고 되묻습니다.","s":91.584,"e":105.337,"p":false,"h":false},{"t":"그리고 9절에서는 시온을 향해 높은 산에 올라가 소식을 전하라는 명령이 나옵니다.","s":105.948,"e":111.345,"p":true,"h":false},{"t":"이 장면을 하늘의 회의 장면으로 읽는 학자가 많습니다.","s":112.428,"e":115.885,"p":false,"h":false},{"t":"6장에서 이사야가 \"누가 우리를 위하여 가겠느냐\"는 하늘의 물음을 들었던 것과 짝을 이룬다는 것입니다.","s":116.532,"e":124.004,"p":false,"h":false},{"t":"6장에서 사명은 \"백성이 듣지 못하리라\"는 선고였지만, 40장에서 사명은 \"위로하라\"입니다.","s":124.668,"e":131.134,"p":false,"h":false},{"t":"그리고 6장에서 이사야가 \"내가 여기 있나이다\" 하고 나선 데 비해 40장의 선지자는 \"무엇이라 외치리이까\" 하고 묻습니다.","s":131.796,"e":140.239,"p":false,"h":false},{"t":"이 짝은 제가 읽어 낸 문학적 연결이며, 본문이 직접 6장을 가리키는 것은 아닙니다.","s":140.868,"e":146.85,"p":false,"h":false},{"t":"다만 책의 앞부분을 읽은 독자에게는 같은 하늘 장면이 이번에는 다른 말씀을 내리는 것으로 들릴 것입니다.","s":147.456,"e":154.711,"p":true,"h":false},{"t":"\"내 백성\"이라는 말","s":155.808,"e":157.449,"p":false,"h":true},{"t":"1절에서 먼저 귀에 들어오는 것은 \"내 백성\"과 \"너희 하나님\"이라는 호칭입니다.","s":158.652,"e":164.05,"p":false,"h":false},{"t":"이사야서 첫 장 3절에서 하나님은 소도 주인을 알고 나귀도 주인의 구유를 아는데 \"이스라엘은 알지 못하고 나의 백성은 깨닫지 못하는도다\"라고 탄식하셨습니다.","s":164.7,"e":174.796,"p":false,"h":false},{"t":"같은 \"내 백성\"이 이제는 위로의 대상이 됩니다.","s":175.464,"e":178.892,"p":false,"h":false},{"t":"39장까지 이 책의 대부분은 이 백성을 고소하는 일이었는데도, 하나님은 이 호칭을 버리지 않으셨습니다.","s":179.496,"e":187.281,"p":false,"h":false},{"t":"앞서 6번 글에서 애굽을 \"나의 백성\"이라 부르는 장면을 본 독자라면, 이 호칭이 이스라엘에게 아직 남아 있다는 사실이 얼마나 무거운지를 느낄 것입니다.","s":187.92,"e":198.096,"p":true,"h":false},{"t":"2절은 위로하는 방법을 밝힙니다.","s":199.188,"e":201.592,"p":false,"h":false},{"t":"\"예루살렘의 마음에 닿도록 말하며\"입니다.","s":202.212,"e":205.453,"p":false,"h":false},{"t":"히브리어 본문은 \"마음에 대고 말하라\"는 표현인데, 이 말은 다른 곳에서 구혼이나 화해의 자리에 쓰입니다.","s":206.1,"e":213.209,"p":false,"h":false},{"t":"위로가 정보를 전하는 일이 아니라 관계를 회복하는 말이라는 암시입니다.","s":213.804,"e":218.688,"p":true,"h":false},{"t":"위로의 내용: 세 가지 선언","s":219.78,"e":222.323,"p":false,"h":true},{"t":"2절은 선포할 내용 세 가지를 말합니다.","s":223.308,"e":226.025,"p":false,"h":false},{"t":"노역의 때가 끝났고, 죄악이 사함을 받았고, 여호와의 손에서 죄에 대하여 \"배나\" 받았다는 것입니다.","s":226.584,"e":234.144,"p":true,"h":false},{"t":"\"배나\"라는 말이 어렵습니다.","s":235.26,"e":237.406,"p":false,"h":false},{"t":"하나님이 이미 지은 죄보다 두 배로 벌하셨다는 뜻인지가 논쟁입니다.","s":237.96,"e":242.491,"p":false,"h":false},{"t":"히브리어 낱말이 \"겹으로 접은 것\"에서 나온 말이어서, 어떤 학자는 \"충분히 받았다\"는 뜻으로 읽고, 어떤 학자는 \"죄의 짝이 되는 만큼\"이라는 법적 용어로 읽으며, 어떤 학자는 하나님이 징계하신 정도가 넘칠 만큼 크셨다는 뜻으로 읽습니다.","s":243.036,"e":259.917,"p":false,"h":false},{"t":"저는 어느 쪽인지 단정할 근거가 없다고 봅니다.","s":260.532,"e":263.916,"p":false,"h":false},{"t":"확실한 것은 방향입니다.","s":264.564,"e":266.534,"p":false,"h":false},{"t":"심판의 기간은 끝났다는 선언입니다.","s":267.084,"e":269.691,"p":true,"h":false},{"t":"그리고 \"죄악이 사함을 받았느니라\"에서 6장이 한 번 더 울립니다.","s":270.756,"e":275.395,"p":false,"h":false},{"t":"6장 7절에서 스랍이 이사야에게 \"네 죄가 사해졌느니라\"고 했을 때 사명이 시작되었습니다.","s":276.048,"e":282.549,"p":false,"h":false},{"t":"40장에서는 같은 선언이 한 선지자에게서 백성 전체로 넓어집니다.","s":283.212,"e":288.154,"p":false,"h":false},{"t":"이 연결도 제가 읽어 낸 것이고, 낱말이 완전히 같은 것은 아닙니다.","s":288.792,"e":293.948,"p":false,"h":false},{"t":"그러나 두 대목이 같은 순서를 따르는 점은 눈여겨볼 만합니다.","s":294.516,"e":298.532,"p":false,"h":false},{"t":"죄가 사해진 뒤에야 사명이 시작되고, 죄가 사해졌다는 선언 위에서 위로가 시작됩니다.","s":298.836,"e":304.945,"p":true,"h":false},{"t":"여기서 한 가지는 정직하게 말해 두어야 합니다.","s":306.036,"e":309.104,"p":false,"h":false},{"t":"40장의 이 선언은 백성이 회개했다는 말 뒤에 오지 않았습니다.","s":309.708,"e":314.189,"p":false,"h":false},{"t":"이 책에서 백성은 39장 끝까지 돌이키지 않았고, 40장은 그 사이에 회개의 장면이 없이 곧바로 사함을 말합니다.","s":314.82,"e":323.258,"p":false,"h":false},{"t":"앞 글에서 본 대로 하나님의 기다림이 먼저였고(30:18), 이제 그 기다림이 선언으로 이어집니다.","s":323.856,"e":331.432,"p":false,"h":false},{"t":"다만 40장의 사함이 죄 문제의 끝이라고 읽어서는 안 됩니다.","s":332.064,"e":336.633,"p":false,"h":false},{"t":"56장 이후에서도 죄의 탄식은 계속됩니다.","s":337.212,"e":340.743,"p":false,"h":false},{"t":"이 문제는 13번 물음에서 다루겠습니다.","s":341.388,"e":344.395,"p":true,"h":false},{"t":"왜 미리 위로하시는가","s":345.492,"e":347.2,"p":false,"h":true},{"t":"이제 이 글의 중심 물음에 본문에서 읽을 수 있는 만큼 답하겠습니다.","s":348.372,"e":353.029,"p":false,"h":false},{"t":"앞 글에서 본 두 입장에 따라 물음의 모양이 다릅니다.","s":353.664,"e":357.317,"p":false,"h":false},{"t":"단일 저자로 읽는 입장에서는 8세기의 이사야가 아직 오지 않은 포로기를 내다보고 위로했다는 것이고, 포로기 선지자로 읽는 입장에서는 이미 포로가 된 사람들에게 위로가 주어졌다는 것입니다.","s":357.984,"e":370.65,"p":false,"h":false},{"t":"어느 쪽이든 본문이 보여 주는 이유는 겹칩니다.","s":371.34,"e":374.614,"p":true,"h":false},{"t":"첫째, 이 위로는 사건이 아니라 말씀 위에 서 있습니다.","s":375.732,"e":380.123,"p":false,"h":false},{"t":"40장 8절은 풀은 마르고 꽃은 시들되 \"우리 하나님의 말씀은 영원히 서리라\"고 합니다.","s":380.736,"e":386.79,"p":false,"h":false},{"t":"위로의 근거가 상황이 나아졌다는 것이 아니라 하나님이 말씀하셨다는 것입니다.","s":387.396,"e":392.488,"p":false,"h":false},{"t":"7장 9절 이래 이 책이 요구해 온 것이 믿음이었고, 믿음은 사건이 일어난 뒤의 확인이 아니라 말씀을 들은 때의 응답입니다.","s":393.156,"e":401.722,"p":false,"h":false},{"t":"포로가 끝나기 전에 위로가 주어지는 것은 이 구조의 필연입니다.","s":402.372,"e":406.616,"p":false,"h":false},{"t":"위로가 사건 뒤에 온다면 그것은 믿음이 아니라 구경입니다.","s":407.16,"e":411.315,"p":true,"h":false},{"t":"둘째, 귀환의 주체가 백성이 아니라 하나님이기 때문입니다.","s":412.092,"e":416.324,"p":false,"h":false},{"t":"3절에서 길을 예비하는 것은 \"여호와의 길\"을 위해서입니다.","s":416.952,"e":420.999,"p":false,"h":false},{"t":"5절은 여호와의 영광이 나타나리라고 하고, 9절은 유다 성읍들에게 \"너희 하나님을 보라\"고 하며, 10절은 \"주 여호와께서 장차 강한 자로 임하실 것이요\"라고 합니다.","s":421.668,"e":432.821,"p":false,"h":false},{"t":"돌아오는 백성이 길을 닦는 것이 아니라 하나님이 먼저 오시고 백성이 그 뒤를 따르는 그림입니다.","s":433.512,"e":439.971,"p":false,"h":false},{"t":"이 그림은 출애굽의 반복이어서, 많은 학자가 40장 이후를 \"새 출애굽\"의 틀로 읽습니다.","s":440.604,"e":446.882,"p":false,"h":false},{"t":"광야에서 길을 내시는 하나님이 이스라엘을 이끌어 내시던 옛날처럼, 이번에는 바벨론에서 이끌어 내시리라는 약속입니다.","s":447.516,"e":455.729,"p":false,"h":false},{"t":"위로가 미리 주어지는 까닭은 오실 분이 이미 정해졌기 때문입니다.","s":456.408,"e":460.977,"p":true,"h":false},{"t":"셋째, 위로받아야 할 사람이 이미 지쳐 있기 때문입니다.","s":462.06,"e":466.216,"p":false,"h":false},{"t":"27절에서 야곱과 이스라엘은 \"내 길은 여호와께 숨겨졌으며 내 송사는 내 하나님에게서 간과되었다\"고 말합니다.","s":466.848,"e":475.076,"p":false,"h":false},{"t":"이 말은 백성이 심판 뒤에도 하나님께 버려졌다고 느꼈음을 보여 줍니다.","s":475.74,"e":480.496,"p":false,"h":false},{"t":"위로는 상황이 풀린 뒤가 아니라 이렇게 믿음이 닳은 때에 필요합니다.","s":481.032,"e":485.922,"p":false,"h":false},{"t":"이 말씀을 이사야 시대의 독자가 읽든 포로기의 독자가 읽든, 읽는 순간에 자신의 처지가 그렇다고 느끼는 사람에게 하는 말입니다.","s":486.54,"e":495.12,"p":true,"h":false},{"t":"넷째, 이 책의 구조가 그렇게 짜여 있기 때문입니다.","s":496.188,"e":500.106,"p":false,"h":false},{"t":"39장의 선고 바로 뒤에 40장의 위로가 있는 것은, 책의 후반부 전체가 \"심판은 끝이 아니다\"를 확인하기 위한 것임을 보입니다.","s":500.724,"e":509.298,"p":false,"h":false},{"t":"6장에서 \"어느 때까지니이까\"(6:11)로 물었던 선지자의 물음에 대한 대답이 40장에서 시작되는 셈입니다.","s":509.868,"e":517.987,"p":false,"h":false},{"t":"이 읽기는 책의 최종 형태를 읽는 방식이며 단일 저자 입장에서도, 편집 입장에서도 받아들일 수 있습니다.","s":518.616,"e":526.097,"p":true,"h":false},{"t":"광야에 길을 내라","s":527.076,"e":528.543,"p":false,"h":true},{"t":"3절을 더 보겠습니다.","s":529.704,"e":531.539,"p":false,"h":false},{"t":"이 구절은 번역과 구두점에서 읽기가 갈립니다.","s":531.828,"e":535.27,"p":false,"h":false},{"t":"개역개정은 \"광야에서 외치는 자의 소리가 있어 이르되 너희는 광야에서 여호와의 길을 예비하라\"고 옮겼는데, 히브리어 본문의 구두점은 \"광야에 / 여호와의 길을 예비하라\"로 읽어 \"광야\"를 길 쪽에 붙입니다.","s":535.932,"e":550.21,"p":false,"h":false},{"t":"반면 70인역과 복음서는 \"광야에서 외치는 자의 소리\"로 읽어 \"광야\"를 외치는 쪽에 붙입니다.","s":550.872,"e":557.475,"p":false,"h":false},{"t":"마태복음 3장 3절은 이 구절을 세례 요한에게 적용했는데, 그것은 후자의 읽기를 따른 것입니다.","s":558.036,"e":564.839,"p":false,"h":false},{"t":"사해 공동체도 이 구절을 자기들이 광야로 물러나 있는 이유로 인용했다고 알려져 있습니다.","s":565.488,"e":571.256,"p":false,"h":false},{"t":"어느 읽기든 핵심은 같습니다.","s":571.896,"e":574.029,"p":false,"h":false},{"t":"광야에 길이 열리는 것은 사람이 낸 길이 아니라 하나님이 오시는 길이라는 점입니다.","s":574.632,"e":580.281,"p":true,"h":false},{"t":"7번 글에서 본 35장 8절의 \"거룩한 길\"과 이 3절의 \"여호와의 길\"은 같은 길의 두 면으로 읽을 수 있습니다.","s":581.4,"e":589.097,"p":false,"h":false},{"t":"35장에서 속량받은 자들이 걷는 길을, 40장은 하나님이 오시는 길로 열어 보입니다.","s":589.716,"e":596.069,"p":false,"h":false},{"t":"이것은 제 연결입니다.","s":596.736,"e":598.609,"p":true,"h":false},{"t":"4절의 \"모든 골짜기는 돋우어지며 모든 산과 작은 산은 낮아지며\"에서, 낮아지는 산이 이 책에서 처음 나오는 것이 아님을 기억하십시오.","s":599.652,"e":609.597,"p":false,"h":false},{"t":"2장 12절부터 17절은 높은 산과 언덕이 낮아지고 사람의 교만이 낮아진다고 했습니다.","s":610.056,"e":616.224,"p":false,"h":false},{"t":"같은 이미지가 한 번은 심판으로, 한 번은 길을 내는 일로 쓰입니다.","s":616.824,"e":621.716,"p":false,"h":false},{"t":"5번과 6번에서 본 대로 교만이 낮아지는 일이 심판이면서 동시에 하나님이 오시는 길이라는 것입니다.","s":622.332,"e":629.548,"p":true,"h":false},{"t":"풀과 말씀","s":630.684,"e":631.827,"p":false,"h":true},{"t":"6절부터 8절은 이 장에서 가장 어두운 대목이 위로 한가운데 놓인 곳입니다.","s":632.988,"e":638.248,"p":false,"h":false},{"t":"\"모든 육체는 풀이요 그 모든 아름다움은 들의 꽃과 같으니\".","s":638.892,"e":643.047,"p":false,"h":false},{"t":"위로의 장면 한가운데서 선지자가 먼저 되묻는 것이 이 구절의 앞에 있습니다.","s":643.608,"e":648.918,"p":false,"h":false},{"t":"\"무엇이라 외치리이까.\"","s":649.584,"e":651.211,"p":true,"h":false},{"t":"이 대답은 위로를 부드럽게 하려는 것이 아니라 한 단계 더 어둡습니다.","s":652.284,"e":657.137,"p":false,"h":false},{"t":"사람은 풀이라는 것입니다.","s":657.756,"e":659.584,"p":false,"h":false},{"t":"앞 글에서 본 37장 27절에서 앗수르 사람들이 들의 풀 같고 지붕의 풀 같다고 했습니다.","s":660.168,"e":666.761,"p":false,"h":false},{"t":"이 낱말의 겹침은 제가 눈여겨본 연결이지만, 이사야서가 사람의 힘과 영화를 풀에 비유하는 방식이 책 전체에 일관되어 있다고는 말할 수 있습니다.","s":667.404,"e":677.284,"p":false,"h":false},{"t":"제국의 힘도, 왕의 영화도, 이스라엘의 아름다움도 풀입니다.","s":677.952,"e":682.848,"p":false,"h":false},{"t":"그런데 이 어두운 진단이 위로의 근거가 됩니다.","s":683.496,"e":686.962,"p":false,"h":false},{"t":"사람이 풀이라서 위로가 필요하고, 말씀이 영원하셔서 위로가 가능합니다.","s":687.6,"e":693.016,"p":true,"h":false},{"t":"7절의 \"여호와의 기운이 그 위에 불면\"이라는 표현에서, 풀을 시들게 하는 바람이 하나님의 숨이라는 점에 주목하십시오.","s":694.116,"e":702.015,"p":false,"h":false},{"t":"사람의 영화가 시드는 일이 우연이 아니라 하나님의 손 안에서 일어나는 일이라는 것입니다.","s":702.612,"e":708.629,"p":false,"h":false},{"t":"이 점은 심판이 하나님의 일이라는 이사야서의 일관된 주장이기도 합니다.","s":709.272,"e":713.847,"p":false,"h":false},{"t":"베드로전서 1장 24절과 25절이 이 구절을 인용하며 \"이것이 곧 너희에게 전한 복음의 말씀이니라\"고 한 것을 보면, 신약은 이 \"말씀\"을 복음과 이어 읽었습니다.","s":714.456,"e":726.086,"p":true,"h":false},{"t":"힘센 왕, 그리고 목자","s":727.164,"e":729.686,"p":false,"h":true},{"t":"9절부터 11절은 위로의 선포가 어디서 끝나는지를 보여 줍니다.","s":730.836,"e":735.351,"p":false,"h":false},{"t":"시온을 향해 \"높은 산에 오르라\" 하고, \"두려워하지 말고 소리를 높이라\" 하며, 유다 성읍들에게 \"너희 하나님을 보라\" 하십니다.","s":735.984,"e":744.881,"p":false,"h":false},{"t":"이 선포자가 누구인지에는 읽기가 갈립니다.","s":745.524,"e":748.687,"p":false,"h":false},{"t":"히브리어 \"소식을 전하는 시온\"이 시온이 소식을 전하는 자라는 뜻인지, 시온에게 소식을 전하는 자라는 뜻인지는 학자들 사이에 논쟁이 있으며, 어느 쪽인지 정하지 않겠습니다.","s":749.304,"e":760.833,"p":true,"h":false},{"t":"그 소식은 \"보라 주 여호와께서 장차 강한 자로 임하실 것이요 그의 팔로 다스리실 것이라\"(10절)입니다.","s":761.904,"e":769.86,"p":false,"h":false},{"t":"그런데 바로 이어지는 11절이 이 그림을 뒤집습니다.","s":770.508,"e":774.387,"p":false,"h":false},{"t":"\"그는 목자같이 양 떼를 먹이시며 어린양을 그 팔로 모아 품에 안으시며 젖먹이는 암컷들을 온순하게 인도하시리로다.\"","s":774.936,"e":782.789,"p":false,"h":false},{"t":"같은 \"팔\"이 한 번은 다스리는 팔로, 한 번은 안아 주는 팔로 쓰입니다.","s":783.432,"e":788.579,"p":false,"h":false},{"t":"9장에서 한 아기의 어깨에 정사가 있다고 했을 때처럼, 힘과 부드러움이 한 분 안에 함께 있는 것입니다.","s":789.228,"e":795.819,"p":false,"h":false},{"t":"이 책이 끝까지 붙들고 가는 그림이 여기서 시작됩니다.","s":796.5,"e":800.267,"p":true,"h":false},{"t":"위로의 근거: 누가 이 땅을 재었느냐","s":801.36,"e":804.693,"p":false,"h":true},{"t":"12절부터 31절은 위로의 선포가 무엇에 기대는지를 길게 보여 줍니다.","s":805.86,"e":810.942,"p":false,"h":false},{"t":"하나님이 바닷물을 손바닥으로 헤아리시고 하늘을 뼘으로 재시며(12절), 나라들은 통의 한 방울 물 같고(15절), 우상을 만드는 자들은 썩지 않는 나무를 택해 흔들리지 않을 신상을 만든다고 조롱합니다(19~20절).","s":811.548,"e":827.617,"p":false,"h":false},{"t":"위로가 감정의 말이 아니라 하나님이 누구이신가에 대한 논증으로 이어지는 점이 이 장의 특징입니다.","s":828.108,"e":834.369,"p":true,"h":false},{"t":"그리고 27절에서 백성의 불평이 나옵니다.","s":835.416,"e":838.766,"p":false,"h":false},{"t":"\"야곱아 어찌하여 말하며 이스라엘아 어찌하여 이르되 내 길은 여호와께 숨겨졌으며 내 송사는 내 하나님에게서 간과되었다 하느냐.\"","s":839.376,"e":848.216,"p":false,"h":false},{"t":"28절의 대답은 설명이 아니라 물음입니다.","s":848.844,"e":852.076,"p":false,"h":false},{"t":"알지 못하였느냐, 듣지 못하였느냐, 영원하신 하나님은 피곤하지 않으시며 명철이 한이 없으시다고 하십니다.","s":852.696,"e":860.487,"p":false,"h":false},{"t":"이 물음은 책망이면서 또 하나의 위로입니다.","s":861.084,"e":864.337,"p":false,"h":false},{"t":"불평하는 백성을 쫓아내지 않으시고 그 불평에 물음으로 답하시는 방식입니다.","s":864.936,"e":870.335,"p":true,"h":false},{"t":"그리고 이 장은 이렇게 끝납니다.","s":871.344,"e":873.8,"p":false,"h":false},{"t":"\"오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리가 날개 치며 올라감 같을 것이요 달음박질하여도 곤비하지 아니하겠고 걸어가도 피곤하지 아니하리로다\"(31절).","s":874.404,"e":886.305,"p":false,"h":false},{"t":"\"앙망하다\"는 기다린다는 뜻의 낱말입니다.","s":886.86,"e":889.835,"p":false,"h":false},{"t":"7번 글에서 본 30장 15절의 조용히 신뢰하는 것, 30장 18절의 \"기다리시는 하나님\"이 여기서 하나로 만납니다.","s":890.496,"e":898.714,"p":false,"h":false},{"t":"하나님이 기다리시고, 백성이 기다리고, 그 기다림이 힘이 됩니다.","s":899.028,"e":904.102,"p":false,"h":false},{"t":"말을 타고 도망하겠다던 백성(30:16)에게 주어진 길이 바로 이것입니다.","s":904.716,"e":911.329,"p":true,"h":false},{"t":"이 위로가 오늘의 독자에게 묻는 것","s":912.42,"e":915.046,"p":false,"h":true},{"t":"40장의 위로는 쉽게 읽히지만 가볍지 않습니다.","s":916.092,"e":919.709,"p":false,"h":false},{"t":"이 위로는 아직 오지 않은 일 앞에서 주어졌고, 그것은 믿음이 사건을 따라가지 않고 말씀을 따라간다는 뜻입니다.","s":920.268,"e":928.362,"p":false,"h":false},{"t":"이 위로의 근거는 우리의 형편이 나아졌다는 데 있지 않고 하나님이 누구이신지에 있습니다.","s":929.016,"e":935.435,"p":false,"h":false},{"t":"그래서 형편이 달라지지 않은 채로도 이 위로를 받을 수 있습니다.","s":936.108,"e":940.177,"p":true,"h":false},{"t":"동시에 이 위로는 사람이 풀이라는 진단을 건너뛰지 않습니다.","s":941.22,"e":945.451,"p":false,"h":false},{"t":"사람의 영화와 의지는 시들고, 그것을 인정하는 자리에서만 영원한 말씀 위에 설 수 있습니다.","s":946.08,"e":952.541,"p":false,"h":false},{"t":"9장에서 느낀 답답함, 곧 돌이키지 못하는 백성의 모습은 40장에서 지워지지 않습니다.","s":953.172,"e":959.875,"p":false,"h":false},{"t":"40장의 백성도 여전히 불평하고 지쳐 있습니다.","s":960.552,"e":964.008,"p":false,"h":false},{"t":"달라진 것은 백성이 아니라 말씀하시는 분이 먼저 오신다는 사실입니다.","s":964.656,"e":969.324,"p":true,"h":false}]},{"title":"10. 이방 왕 고레스를 왜 기름 부은 자라 부르시는가","audio":"doc10_2610241127.mp3","dur":615.5,"segs":[{"t":"이방 왕 고레스를 왜 \"기름 부은 자\"라 부르시는가: 하나님이 이방 권력을 쓰시는 방식","s":0,"e":6.381,"p":false,"h":true},{"t":"본문: 이사야 44:24-45:25 (함께 읽을 본문: 사 41:1-4, 25; 46:9-13; 48:12-16; 42:6-7; 55:3-5; 스 1:1-4; 대하 36:22-23; 롬 9:19-21; 빌 2:9-11)","s":7.488,"e":38.759,"p":true,"h":false},{"t":"9번 글에서 고레스의 이름이 미리 불렸다는 점이 저자 논쟁의 한 근거라는 것을 보았습니다.","s":39.636,"e":45.477,"p":false,"h":false},{"t":"이번에는 논쟁을 떠나 본문이 고레스를 어떻게 부르는지를 읽겠습니다.","s":46.152,"e":50.687,"p":false,"h":false},{"t":"45장 1절은 이렇게 시작합니다.","s":51.336,"e":54.079,"p":false,"h":false},{"t":"\"여호와께서 그의 기름 부으신 자 고레스에게 이르시되.\"","s":54.684,"e":58.445,"p":false,"h":false},{"t":"히브리어로 \"기름 부은 자\"는 마쉬아흐, 곧 메시아와 같은 낱말입니다.","s":59.004,"e":64.218,"p":false,"h":false},{"t":"이스라엘의 왕과 제사장에게 쓰이던 이 칭호가 이방 왕에게 주어진 것입니다.","s":64.836,"e":70.028,"p":false,"h":false},{"t":"구약에서 이방 왕에게 이 칭호가 쓰인 곳은 여기뿐이라고 흔히 말합니다.","s":70.704,"e":75.614,"p":false,"h":false},{"t":"이 물음이 이번 글의 주제입니다.","s":76.284,"e":78.687,"p":true,"h":false},{"t":"누가 이 자리에 서는가","s":79.452,"e":81.21,"p":false,"h":true},{"t":"앞 글들의 흐름에서 읽으면 이 자리의 의미가 보입니다.","s":82.368,"e":86.117,"p":false,"h":false},{"t":"7장의 아하스는 약속을 거절했고, 37장의 히스기야는 하나님을 신뢰했으나 39장에서 무너졌습니다.","s":86.76,"e":94.339,"p":false,"h":false},{"t":"이스라엘의 왕들은 이 책에서 끝내 약속된 왕이 되지 못했습니다.","s":95.004,"e":99.485,"p":false,"h":false},{"t":"그런데 40장 이후에서 다윗의 후손은 거의 나오지 않고, 하나님은 직접 오시며 먼저 이방 왕을 부르십니다.","s":100.116,"e":107.67,"p":false,"h":false},{"t":"44장 28절에서 고레스는 \"나의 목자\"라 불리는데, 40장 11절에서 목자같이 양 떼를 먹이시겠다고 하신 분이 그 이름을 이방 왕에게 빌려 주신 셈입니다.","s":108.324,"e":119.493,"p":false,"h":false},{"t":"이 대비는 제가 읽어 낸 연결입니다.","s":120.132,"e":122.839,"p":true,"h":false},{"t":"고레스에게 맡겨진 일과 그가 모르는 것","s":123.912,"e":126.684,"p":false,"h":true},{"t":"44장 28절과 45장 1절부터 4절은 일을 구체적으로 적습니다.","s":127.692,"e":133.111,"p":false,"h":false},{"t":"예루살렘이 건축될 것이고 성전의 기초가 놓일 것이며, 하나님이 그의 오른손을 잡아 나라들을 그 앞에 항복시키고 성문을 닫히지 않게 하실 것이라고 합니다.","s":133.74,"e":143.759,"p":false,"h":false},{"t":"목적은 4절에 있습니다.","s":144.396,"e":146.331,"p":false,"h":false},{"t":"\"내 종 야곱, 내가 택한 이스라엘을 위하여.\"","s":146.628,"e":149.911,"p":false,"h":false},{"t":"45장 13절은 그가 값이나 상을 바라지 않고 사로잡힌 백성을 놓아 줄 것이라고 합니다.","s":150.48,"e":156.747,"p":true,"h":false},{"t":"그런데 이 선언에서 눈에 띄는 것은 고레스가 하나님을 모른다는 점입니다.","s":157.824,"e":162.731,"p":false,"h":false},{"t":"45장 4절과 5절은 \"너는 나를 알지 못하였으나\"라고 두 번 말합니다.","s":163.368,"e":168.746,"p":false,"h":false},{"t":"하나님은 알지 못하는 자의 띠를 동여 주시고, 이름을 부르고, 칭호까지 주십니다.","s":169.38,"e":175.177,"p":false,"h":false},{"t":"이 점은 역사 기록과도 맞아떨어집니다.","s":175.824,"e":178.715,"p":false,"h":false},{"t":"고레스 원통이라는 유물은 바벨론의 마르둑 신이 고레스를 택했다고 기록하고, 그가 포로로 끌려온 신들과 백성이 제 처소로 돌아가게 했다고 전하는 것으로 알려져 있습니다.","s":179.352,"e":189.945,"p":false,"h":false},{"t":"이 유물에는 유다 사람이 직접 언급되지 않는 것으로 압니다.","s":190.584,"e":194.628,"p":false,"h":false},{"t":"에스라 1장 1절은 같은 사건을 \"여호와께서 바사 왕 고레스의 마음을 감동시키시매\"라고 쓰고, 고레스의 조서가 \"하늘의 하나님 여호와\"를 말했다고 적습니다.","s":195.264,"e":205.744,"p":false,"h":false},{"t":"같은 사건이 한쪽에서는 마르둑의 일이고 다른 쪽에서는 여호와의 일입니다.","s":206.316,"e":211.244,"p":false,"h":false},{"t":"5번 글에서 본 한 사건의 두 뜻이 여기서도 나타납니다.","s":211.788,"e":215.741,"p":false,"h":false},{"t":"이 연결은 제 해석입니다.","s":216.36,"e":218.508,"p":true,"h":false},{"t":"앗수르와 고레스: 같은 구조, 다른 결","s":219.6,"e":223.842,"p":false,"h":true},{"t":"이 점에서 5번의 앗수르와 짝이 됩니다.","s":224.928,"e":227.713,"p":false,"h":false},{"t":"두 왕 모두 하나님을 알지 못하고 하나님의 계획 안에서 쓰입니다.","s":228.276,"e":232.48,"p":false,"h":false},{"t":"앗수르는 \"내 노의 막대기\"로 심판의 도구였고, 고레스는 \"나의 목자\"로 구원의 도구입니다.","s":233.136,"e":239.826,"p":false,"h":false},{"t":"앗수르는 그 일을 자기 힘으로 이룬 줄 알고 교만하여 심판을 받았습니다.","s":240.48,"e":245.258,"p":false,"h":false},{"t":"고레스에 대해서는 본문이 그가 하나님을 알게 되었다고도, 심판을 받는다고도 말하지 않습니다.","s":245.88,"e":252.138,"p":false,"h":false},{"t":"45장 3절은 \"너로 너를 지명하여 부른 자가 나 여호와 이스라엘의 하나님인 줄을 알게 하리라\"고 하지만, 이것이 고레스 개인의 회심을 뜻하는지, 하나님의 일이 드러나 알려진다는 뜻인지는 본문이 정하지 않습니다.","s":252.756,"e":267.541,"p":false,"h":false},{"t":"학자들도 갈립니다.","s":268.092,"e":269.695,"p":false,"h":false},{"t":"본문이 말하는 선까지만 읽겠습니다.","s":270.216,"e":272.771,"p":false,"h":false},{"t":"고레스는 믿는 사람이어서가 아니라 맡겨진 일 때문에 이 칭호를 받았습니다.","s":273.384,"e":278.406,"p":true,"h":false},{"t":"그러므로 여기서 \"기름 부은 자\"는 직무의 이름으로 읽는 것이 본문에 가깝습니다.","s":279.504,"e":284.87,"p":false,"h":false},{"t":"하나님이 보내신 자라는 뜻이지, 고레스가 메시아 그 자체라는 뜻은 아닙니다.","s":285.48,"e":291.271,"p":false,"h":false},{"t":"그는 포로의 문을 열 수 있으나 죄의 문제는 풀지 못합니다.","s":291.924,"e":296.202,"p":true,"h":false},{"t":"반발하는 목소리","s":297.18,"e":298.589,"p":false,"h":true},{"t":"이스라엘 가운데서 이 말씀을 듣고 불편해한 사람들이 있었던 것이 본문에서 보입니다.","s":299.736,"e":305.703,"p":false,"h":false},{"t":"45장 9절부터 11절은 \"화 있을진저 자기를 지으신 이와 다투는 자여\"라고 합니다.","s":306.324,"e":312.658,"p":false,"h":false},{"t":"토기가 토기장이에게 \"무엇을 만드느냐\" 하고, 자식이 부모에게 \"무엇을 낳았느냐\" 하는 격이라는 것입니다.","s":313.272,"e":320.694,"p":false,"h":false},{"t":"하나님이 해방자를 이방인 가운데서 일으키시는 것을 받아들이지 못하는 목소리를 전제한 말씀입니다.","s":321.336,"e":327.603,"p":true,"h":false},{"t":"우리는 이 토기장이 비유가 로마서 9장 20절과 21절에서 다시 쓰인 것을 압니다.","s":328.68,"e":334.687,"p":false,"h":false},{"t":"2번 글에서 본 \"네가 누구기에 하나님께 반문하느냐\"가 이 자리에서 나온 것입니다.","s":335.34,"e":340.982,"p":false,"h":false},{"t":"하나님이 누구를 쓰시는지에 대한 이의가 있을 때 이사야서가 내놓는 답은 논리가 아니라 창조주와 피조물의 자리입니다.","s":341.604,"e":349.41,"p":false,"h":false},{"t":"그러나 11절에서 하나님은 이 반발자들을 쫓아내지 않으시고 \"내 아들들에 관하여 내게 물으라\"고 하십니다.","s":350.028,"e":357.46,"p":false,"h":false},{"t":"따져 묻는 백성에게도 물으라는 초대가 열려 있습니다.","s":358.128,"e":361.75,"p":true,"h":false},{"t":"45장 7절의 선언","s":362.844,"e":364.619,"p":false,"h":true},{"t":"6절과 7절은 이 장의 중심 선언입니다.","s":365.724,"e":368.865,"p":false,"h":false},{"t":"해 뜨는 곳에서 해 지는 곳까지 하나님 외에 다른 이가 없다고 하시고, \"나는 빛도 짓고 어둠도 창조하며 평안도 짓고 환난도 창조하나니\"라고 하십니다.","s":369.504,"e":379.432,"p":false,"h":false},{"t":"학자들은 이 말이 빛과 어둠을 두 신의 영역으로 나누는 이원론적 생각, 곧 페르시아 종교를 배경으로 한 이해에 맞선 것이라고 자주 읽습니다.","s":380.016,"e":389.284,"p":false,"h":false},{"t":"다만 이 배경은 제시된 견해이고 본문이 직접 밝히는 것은 아닙니다.","s":389.916,"e":394.991,"p":true,"h":false},{"t":"어느 쪽이든 의미는 분명합니다.","s":396.036,"e":398.35,"p":false,"h":false},{"t":"빛이 오는 것도 어둠이 오는 것도 한 분의 손 안에 있다는 것입니다.","s":398.988,"e":403.523,"p":false,"h":false},{"t":"이 선언은 심판을 일으키신 분과 구원을 일으키시는 분이 같은 하나님이라는 이 책의 일관된 말씀입니다.","s":404.172,"e":410.928,"p":false,"h":false},{"t":"7번 글에서 본 \"낯선 일\"과 본래의 일이 한 분에게서 나온다는 점입니다.","s":411.588,"e":416.644,"p":false,"h":false},{"t":"환난을 지으신다는 말은 가볍게 읽을 수 없는 말이지만, 이사야서는 이것을 설명하지 않고 하나님의 주권으로 선포합니다.","s":417.24,"e":425.593,"p":true,"h":false},{"t":"숨어 계신 하나님, 그리고 열방","s":426.636,"e":429.513,"p":false,"h":true},{"t":"45장 14절부터 25절은 이 장의 방향을 바꿉니다.","s":430.668,"e":435.187,"p":false,"h":false},{"t":"고레스 이야기가 끝나자 열방이 이스라엘에게 와서 \"하나님이 과연 너희 중에 계시고 그 외에는 다른 신이 없다\"고 말합니다(14절).","s":435.816,"e":444.932,"p":false,"h":false},{"t":"그리고 15절은 이상한 고백을 합니다.","s":445.5,"e":448.278,"p":false,"h":false},{"t":"\"진실로 주는 스스로 숨어 계신 하나님이시라.\"","s":448.56,"e":451.652,"p":false,"h":false},{"t":"이 말을 한 사람이 열방인지는 학자들 사이에서 읽기가 갈립니다.","s":452.304,"e":456.823,"p":false,"h":false},{"t":"하나님이 고레스 같은 방식으로 일하실 때, 그 일은 사건 뒤에 숨은 손으로 이루어지기 때문에 이 고백이 어울립니다.","s":457.452,"e":465.27,"p":false,"h":false},{"t":"그러나 19절에서 하나님은 \"내가 은밀한 데서나 어두운 곳에서 말하지 아니하였다\"고 하십니다.","s":465.804,"e":471.991,"p":false,"h":false},{"t":"숨은 손과 드러난 말씀이 함께 있습니다.","s":472.68,"e":475.535,"p":false,"h":false},{"t":"하나님의 일은 역사 속에서 보이지 않는 방식으로 이루어지되 말씀으로는 미리 밝혀진다는 것입니다.","s":476.172,"e":482.393,"p":true,"h":false},{"t":"장은 이렇게 끝납니다.","s":483.48,"e":485.185,"p":false,"h":false},{"t":"\"땅 끝의 모든 사람아 나를 앙망하라 그리하면 구원을 받으리라\"(22절).","s":485.712,"e":490.866,"p":false,"h":false},{"t":"그리고 23절은 모든 무릎이 꿇고 모든 혀가 맹세하리라고 합니다.","s":491.472,"e":496.291,"p":false,"h":false},{"t":"바울은 빌립보서 2장 10절과 11절에서 이 말씀을 그리스도께 적용했습니다.","s":496.908,"e":502.024,"p":false,"h":false},{"t":"고레스가 열어 준 문으로 이스라엘이 돌아가는 이야기가, 열방 전체가 하나님께 돌이키는 이야기로 이어집니다.","s":502.668,"e":509.903,"p":false,"h":false},{"t":"이 두 방향의 연결은 14번 글에서 따로 다루겠습니다.","s":510.552,"e":514.367,"p":true,"h":false},{"t":"문을 여는 자와 눈을 여는 자","s":515.448,"e":517.7,"p":false,"h":true},{"t":"여기서 다음 글과의 이음새를 하나 보여 드리겠습니다.","s":518.94,"e":522.368,"p":false,"h":false},{"t":"45장 1절에서 하나님은 고레스 앞에 성문을 열어 닫히지 않게 하겠다고 하셨습니다.","s":523.008,"e":528.45,"p":false,"h":false},{"t":"그런데 42장 7절에서 \"맹인의 눈을 밝히며 갇힌 자를 감옥에서 나오게\" 하는 일을 맡은 이는 종입니다.","s":529.092,"e":536.047,"p":false,"h":false},{"t":"고레스는 포로의 문을 열 수 있어도, 이 책이 처음부터 물어 온 완고한 마음의 문제는 풀 수 없습니다.","s":536.688,"e":543.71,"p":false,"h":false},{"t":"그 일을 맡은 이가 누구인가가 다음 글, 11번의 물음입니다.","s":544.356,"e":548.877,"p":true,"h":false},{"t":"이 본문을 읽는 조심스러운 방법","s":549.972,"e":552.343,"p":false,"h":true},{"t":"두 가지를 말씀드립니다.","s":553.464,"e":555.277,"p":false,"h":false},{"t":"하나는 위로입니다.","s":555.912,"e":557.395,"p":false,"h":false},{"t":"하나님의 일은 눈에 보이는 믿는 사람들의 울타리 안에만 갇혀 있지 않습니다.","s":558,"e":562.859,"p":false,"h":false},{"t":"교회가 힘이 없고 사방이 막혀 있는 것처럼 보일 때에도, 하나님이 아무도 예상하지 못한 사람을 통해 문을 여실 수 있습니다.","s":563.4,"e":571.269,"p":false,"h":false},{"t":"이것이 40장 이후를 지탱하는 확신입니다.","s":571.896,"e":575.041,"p":true,"h":false},{"t":"다른 하나는 경고입니다.","s":576.072,"e":577.85,"p":false,"h":false},{"t":"5번 글에서 말씀드린 것과 같습니다.","s":578.16,"e":580.779,"p":false,"h":false},{"t":"이사야에게는 고레스를 가리키는 계시의 말씀이 있었으나 우리에게는 없습니다.","s":581.076,"e":586.444,"p":false,"h":false},{"t":"오늘의 어떤 지도자나 세력을 \"우리의 고레스\"라고 부르며 하나님의 뜻을 이루는 자로 단정하는 것은 이 본문을 오용하는 일입니다.","s":587.088,"e":595.591,"p":false,"h":false},{"t":"고레스를 이렇게 불렀다고 해서 그의 모든 행위가 의로웠다는 뜻도 아니고, 본문은 그의 도덕성을 평가하지 않습니다.","s":596.268,"e":604.436,"p":false,"h":false},{"t":"이 본문이 가르치는 것은 하나님이 쓰시는 자의 정체를 우리가 가려낼 수 있다는 것이 아니라, 하나님의 일이 우리의 짐작을 넘어선다는 것입니다.","s":605.088,"e":614.411,"p":true,"h":false}]},{"title":"11. 고난받는 종은 누구인가","audio":"doc11_2610241127.mp3","dur":761.3,"segs":[{"t":"고난받는 종은 누구인가: 이스라엘인가, 한 개인인가","s":0,"e":4.629,"p":false,"h":true},{"t":"본문: 이사야 42:1-9; 49:1-13; 50:4-11; 52:13-53:12 (함께 읽을 본문: 사 41:8-10; 42:18-25; 43:8-10; 44:1-2; 45:4; 54:17; 마 12:15-21; 눅 22:37; 행 8:26-35; 13:47; 벧전 2:21-25)","s":5.832,"e":46.465,"p":true,"h":false},{"t":"10번 글의 끝에서 두 가지 일을 구분했습니다.","s":47.304,"e":50.284,"p":false,"h":false},{"t":"고레스는 포로의 성문을 열 수 있지만, 이 책이 처음부터 물어 온 완고한 마음의 문제는 풀 수 없습니다.","s":50.904,"e":58.021,"p":false,"h":false},{"t":"그 일을 맡은 이가 \"종\"입니다.","s":58.644,"e":60.886,"p":false,"h":false},{"t":"그런데 이 종이 누구인가를 두고는 이사야서 안에서도, 교회와 유대교의 해석사에서도 답이 갈립니다.","s":61.488,"e":68.475,"p":false,"h":false},{"t":"이 시리즈에서 읽기가 가장 크게 갈리는 물음이어서, 이번 글은 공정하게 정리하는 데 힘을 쓰겠습니다.","s":69.12,"e":76.263,"p":false,"h":false},{"t":"종이 왜 고난받고 그 고난이 무엇을 이루는지는 12번 글에서 53장을 중심으로 다루고, 여기서는 종이 누구인가에 집중합니다.","s":76.896,"e":86.277,"p":true,"h":false},{"t":"네 편의 노래","s":87.336,"e":88.464,"p":false,"h":true},{"t":"1892년 베른하르트 둠은 40~55장에서 \"종의 노래\" 네 편을 가려냈고, 이 분류는 지금도 널리 쓰입니다.","s":89.568,"e":98.383,"p":false,"h":false},{"t":"첫째는 42장 1~4절로, 공의를 베풀되 외치지 않고 상한 갈대도 꺾지 않는 종을 말합니다.","s":99,"e":106.58,"p":false,"h":false},{"t":"둘째는 49장 1~6절로, 모태에서 부름받은 종이 \"내가 헛되이 수고하였구나\" 하고 탄식하는데도 열방의 빛으로 세워집니다.","s":107.208,"e":116.712,"p":false,"h":false},{"t":"셋째는 50장 4~9절로, 귀가 열린 종이 맞고 수염을 뽑히면서도 물러서지 않습니다.","s":117.324,"e":124.171,"p":false,"h":false},{"t":"넷째는 52장 13절부터 53장 12절로, 멸시받다가 백성의 죄를 지고 죽고 마침내 높임을 받는 종입니다.","s":124.812,"e":133.194,"p":false,"h":false},{"t":"다만 이 분류에는 논쟁이 있습니다.","s":133.812,"e":136.478,"p":false,"h":false},{"t":"네 편이 따로 떨어진 독립된 노래인지, 앞뒤 문맥과 이어진 하나의 글인지, 각 노래가 어디서 끝나는지에 대해 학자들의 견해가 갈립니다.","s":137.088,"e":146.662,"p":false,"h":false},{"t":"이 글에서는 편의상 이 구분을 쓰되, 앞뒤 문맥도 함께 읽겠습니다.","s":147.24,"e":152.396,"p":true,"h":false},{"t":"책 안에서 먼저 보이는 것: 종은 이스라엘입니다","s":153.468,"e":157.149,"p":false,"h":true},{"t":"40장 이후를 읽으면 \"종\"이 가장 먼저 이스라엘 자신을 가리킵니다.","s":158.364,"e":163.211,"p":false,"h":false},{"t":"\"너 나의 종 이스라엘아 나의 택한 야곱아\"(41:8), \"나의 종 야곱, 내가 택한 이스라엘아 이제 들으라\"(44:1)가 그렇고, 44장 21절은 \"너는 내 종이니라\"고 이스라엘에게 직접 말합니다.","s":163.872,"e":181.629,"p":false,"h":false},{"t":"둘째 노래도 49장 3절에서 \"너는 나의 종 이스라엘이요\"라고 부릅니다.","s":182.268,"e":187.521,"p":false,"h":false},{"t":"그래서 종을 이스라엘 민족으로 읽는 해석은 본문에 근거가 분명합니다.","s":188.172,"e":193,"p":false,"h":false},{"t":"중세의 유대교 주석가 라시를 비롯해 유대교 전통에서 53장을 이스라엘 민족의 고난으로 읽어 온 것도 이 때문입니다.","s":193.608,"e":201.686,"p":true,"h":false},{"t":"그런데 책 안에서 풀리지 않는 것","s":202.788,"e":205.124,"p":false,"h":true},{"t":"문제는 같은 49장에서 시작됩니다.","s":206.136,"e":209.193,"p":false,"h":false},{"t":"3절은 종이 이스라엘이라고 하는데, 5절과 6절에서는 이 종이 \"야곱을 그에게로 돌아오게 하시고 이스라엘을 그에게로 모으시려고\" 부름받았다고 합니다.","s":209.808,"e":220.042,"p":false,"h":false},{"t":"이스라엘이 이스라엘을 모은다는 말이 됩니다.","s":220.68,"e":223.72,"p":false,"h":false},{"t":"6절은 더 분명합니다.","s":224.028,"e":225.962,"p":false,"h":false},{"t":"야곱의 지파들을 일으키는 일은 \"오히려 가벼운 일\"이고, 이 종은 이방의 빛이 되어 땅 끝까지 구원을 이르게 하리라고 합니다.","s":226.584,"e":234.725,"p":false,"h":false},{"t":"종이 이스라엘이면서 이스라엘과 구별되는 자리에 서 있는 것입니다.","s":235.368,"e":239.791,"p":true,"h":false},{"t":"53장에서 이 긴장은 더 커집니다.","s":240.912,"e":243.991,"p":false,"h":false},{"t":"이 노래는 \"그가\"와 \"우리\"를 철저히 구분합니다.","s":244.26,"e":247.673,"p":false,"h":false},{"t":"우리의 질고를 그가 졌고, 우리의 허물 때문에 그가 찔렸다고 합니다.","s":248.292,"e":253.174,"p":false,"h":false},{"t":"8절은 그가 \"내 백성의 허물 때문에\" 쳐 맞았다고 하는데, 종이 곧 백성이라면 자기 허물을 자기가 졌다는 말이 되어 문장이 어긋납니다.","s":253.8,"e":262.811,"p":false,"h":false},{"t":"또 53장은 종을 한 사람의 얼굴로 그립니다.","s":263.448,"e":266.901,"p":false,"h":false},{"t":"연한 순 같고 마른 땅의 뿌리 같으며, 입을 열지 않고 도살장에 끌려가는 어린양 같고, 부자의 무덤에 묻힌다고 합니다.","s":267.444,"e":276.196,"p":false,"h":false},{"t":"이 때문에 개인으로 읽는 해석이 힘을 얻습니다.","s":276.84,"e":280.019,"p":true,"h":false},{"t":"눈먼 종과 눈을 여는 종","s":281.124,"e":283.192,"p":false,"h":true},{"t":"이 긴장을 푸는 열쇠가 책 안에 있다고 저는 봅니다.","s":284.364,"e":288.218,"p":false,"h":false},{"t":"42장 18절부터 20절입니다.","s":288.864,"e":291.621,"p":false,"h":false},{"t":"첫째 노래 바로 뒤에서 하나님은 이렇게 묻습니다.","s":292.176,"e":295.467,"p":false,"h":false},{"t":"\"너희 귀먹은 자들아 들으라 너희 맹인들아 밝히 보라.","s":296.1,"e":299.819,"p":false,"h":false},{"t":"누가 내 종같이 눈이 멀겠느냐 내가 보내는 내 사자같이 귀먹은 자가 누구냐.\"","s":300.492,"e":305.649,"p":false,"h":false},{"t":"43장 8절도 \"눈이 있어도 소경이요 귀가 있어도 귀머거리인 백성\"을 말합니다.","s":306.252,"e":311.786,"p":false,"h":false},{"t":"6장에서 이사야가 받은 선고, 곧 보아도 알지 못하고 들어도 깨닫지 못하는 상태가 여기서는 종 이스라엘의 모습입니다.","s":312.444,"e":320.996,"p":true,"h":false},{"t":"그러면 두 인물이 보입니다.","s":322.128,"e":324.177,"p":false,"h":false},{"t":"하나는 종으로 부름받았으나 눈멀고 귀먹은 이스라엘입니다.","s":324.756,"e":329.049,"p":false,"h":false},{"t":"다른 하나는 그 이스라엘이 감당하지 못하는 종의 사명을 대신 지는 이입니다.","s":329.616,"e":334.595,"p":false,"h":false},{"t":"이 종에게 맡겨진 일은 42장 7절에서 \"맹인의 눈을 밝히며 갇힌 자를 옥에서 나오게 하는\" 것입니다.","s":335.196,"e":342.427,"p":false,"h":false},{"t":"이스라엘이 하지 못한 일, 곧 열방에 하나님을 알리고 닫힌 눈을 여는 일을 하는 종입니다.","s":343.044,"e":349.322,"p":false,"h":false},{"t":"이 대비는 제 읽기이지만, 낱말과 흐름이 맞물리는 점에서 본문 안에서 가장 설득력 있다고 생각합니다.","s":349.956,"e":357.148,"p":true,"h":false},{"t":"셋째 노래에서 이 대비가 한 번 더 나타납니다.","s":358.272,"e":361.603,"p":false,"h":false},{"t":"이스라엘은 \"귀가 열려 있어도 듣지 아니하는도다\"(42:20)라고 책망받는데, 종은 \"주 여호와께서 나의 귀를 여셨으므로 내가 거역하지 아니하며 물러가지도 아니하며\"(50:5)라고 말합니다.","s":362.232,"e":378.197,"p":false,"h":false},{"t":"두 구절의 히브리어 동사는 같지 않아서 낱말이 겹친다고까지 말할 수는 없습니다.","s":378.828,"e":384.526,"p":false,"h":false},{"t":"그래도 귀가 열리고도 듣지 않는 이스라엘 곁에, 귀가 열려 끝까지 순종하는 종이 서 있다는 대비는 분명합니다.","s":385.164,"e":392.555,"p":false,"h":false},{"t":"백성이 못 하는 순종을 한 분이 하십니다.","s":393.192,"e":395.911,"p":true,"h":false},{"t":"책 전체의 모양: 넓었다가 좁아지고, 다시 넓어집니다","s":397.008,"e":401.985,"p":false,"h":true},{"t":"종의 모습을 책의 흐름 속에서 보면 모양이 있습니다.","s":403.164,"e":406.584,"p":false,"h":false},{"t":"40~48장에서는 종이 주로 이스라엘 전체이고 실패한 모습으로 나옵니다.","s":407.196,"e":412.982,"p":false,"h":false},{"t":"49장에서는 종이 이스라엘 안에서 이스라엘을 향한 사명을 받은 이로 좁아집니다.","s":413.568,"e":419.06,"p":false,"h":false},{"t":"53장에서는 한 사람으로 좁아집니다.","s":419.688,"e":422.669,"p":false,"h":false},{"t":"이 흐름은 4번 글에서 본 남은 자의 길과 같은 모양입니다.","s":423.18,"e":427.12,"p":false,"h":false},{"t":"모든 백성이 실패한 자리에서 하나님의 일이 소수를 거쳐 한 분에게 모이는 방식입니다.","s":427.644,"e":433.272,"p":true,"h":false},{"t":"그런데 이 책은 거기서 끝나지 않습니다.","s":434.376,"e":437.293,"p":false,"h":false},{"t":"53장 10절에서 종은 \"씨를 보게 되며\"라고 하고, 곧 이어 54장 17절은 \"이는 여호와의 종들의 기업이라\"고 말합니다.","s":437.868,"e":446.89,"p":false,"h":false},{"t":"단수의 종이 복수의 종들로 바뀝니다.","s":447.552,"e":450.218,"p":false,"h":false},{"t":"이후 56~66장에서 \"종들\"이 반복해서 나옵니다(63:17; 65:8-15; 66:14).","s":450.864,"e":461.334,"p":false,"h":false},{"t":"56장 6절은 이방인도 여호와와 연합하여 \"그의 종이 되어\" 섬기는 모습을 그립니다.","s":461.808,"e":467.854,"p":false,"h":false},{"t":"많은 학자가 이 모양을 지적합니다.","s":468.504,"e":471.035,"p":false,"h":false},{"t":"이스라엘이라는 넓은 종에서 한 종으로 좁아지고, 그 한 종의 사역의 열매로 다시 많은 종이 생겨난다는 것입니다.","s":471.6,"e":479.332,"p":false,"h":false},{"t":"이는 종의 정체를 한 가지로 가두지 않는 읽기입니다.","s":479.988,"e":483.684,"p":true,"h":false},{"t":"신약은 이 물음을 어떻게 다루는가","s":484.74,"e":487.254,"p":false,"h":true},{"t":"이 물음은 신약에서도 그대로 던져집니다.","s":488.412,"e":491.477,"p":false,"h":false},{"t":"사도행전 8장의 에티오피아 내시는 이사야 53장을 읽다가 빌립에게 묻습니다.","s":492.048,"e":497.479,"p":false,"h":false},{"t":"\"선지자가 이 말 한 것이 누구를 가리킴이냐 자기를 가리킴이냐 다른 사람을 가리킴이냐\"(행 8:34).","s":498.06,"e":506.143,"p":false,"h":false},{"t":"이 질문은 지금 우리가 하는 질문과 같습니다.","s":506.664,"e":509.866,"p":false,"h":false},{"t":"빌립은 \"이 글에서 시작하여 예수를 전하니라\"고 합니다.","s":510.552,"e":514.28,"p":true,"h":false},{"t":"신약의 적용 방식에는 폭이 있습니다.","s":515.376,"e":517.961,"p":false,"h":false},{"t":"마태복음은 예수의 사역을 42장 1~4절의 성취로(마 12:17-21), 53장 4절을 병 고치심의 성취로(마 8:17) 인용합니다.","s":518.616,"e":531.901,"p":false,"h":false},{"t":"누가복음 22장 37절에서 예수 자신이 53장 12절을 자기 일로 말씀하십니다.","s":532.548,"e":538.52,"p":false,"h":false},{"t":"베드로전서 2장 21절부터 25절은 53장을 그리스도의 고난으로 풀어 줍니다.","s":539.172,"e":545.314,"p":false,"h":false},{"t":"그런데 사도행전 13장 47절에서 바울과 바나바는 49장 6절, 곧 \"이방의 빛이 되게 하여\"를 자기들의 사명으로 인용합니다.","s":545.94,"e":555.473,"p":false,"h":false},{"t":"신약은 종의 사명을 그리스도께 집중시키면서, 그분을 따르는 자들이 그 사명에 참여하는 것으로도 읽는 것입니다.","s":556.128,"e":563.647,"p":false,"h":false},{"t":"앞에서 본 단수에서 복수로 가는 모양과 맞습니다.","s":564.264,"e":567.79,"p":true,"h":false},{"t":"다른 후보들","s":568.836,"e":569.924,"p":false,"h":true},{"t":"이 외에도 학자들이 제안해 온 후보가 있습니다.","s":570.996,"e":574.218,"p":false,"h":false},{"t":"선지자 이사야 자신, 모세 같은 선지자, 포로기의 어느 의로운 개인이나 왕, 고레스 등입니다.","s":574.776,"e":582.589,"p":false,"h":false},{"t":"고레스는 본문 안에서 쉽게 배제됩니다.","s":583.236,"e":586.173,"p":false,"h":false},{"t":"이 책에서 고레스는 \"목자\"와 \"기름 부은 자\"로 불릴 뿐 \"종\"이라 불리지 않고, 하나님을 알지 못하는 자로 소개되며(45:4-5), 종의 사명인 고난과 대속과 열방의 빛이 되는 일은 그에게 맡겨지지 않았습니다.","s":586.728,"e":602.385,"p":false,"h":false},{"t":"나머지 후보들도 각각 한 노래의 일부를 설명하지만 네 노래를 한꺼번에 설명하지는 못한다는 약점이 있습니다.","s":603.036,"e":609.908,"p":true,"h":false},{"t":"읽기들의 정리와 제 판단","s":610.992,"e":612.919,"p":false,"h":true},{"t":"정리하겠습니다.","s":613.8,"e":615.104,"p":false,"h":false},{"t":"종을 이스라엘 민족으로 읽는 해석은 41~48장의 명시적인 호칭이 근거이고, 약점은 이스라엘이 자기 허물을 대신 지는 문장이 53장에서 어긋난다는 점입니다.","s":615.708,"e":627.555,"p":false,"h":false},{"t":"한 개인으로 읽는 해석은 49장 5~6절과 53장의 \"그와 우리\" 구분이 근거이고, 약점은 같은 책에서 종이 이스라엘로 불린다는 점입니다.","s":628.236,"e":638.432,"p":false,"h":false},{"t":"두 입장을 결합한 읽기는 이스라엘이 대표자 한 사람으로 모인다고 봅니다.","s":639.072,"e":644.18,"p":false,"h":false},{"t":"이 입장은 두 약점을 모두 피하지만, 어느 한쪽의 읽기를 약하게 만들 수 있다는 지적을 받습니다.","s":644.796,"e":651.39,"p":false,"h":false},{"t":"개혁주의 전통에서는 53장의 종을 메시아 한 개인으로 읽는 해석이 우세한 것으로 알고 있습니다.","s":652.032,"e":658.724,"p":true,"h":false},{"t":"제 판단은 이렇습니다.","s":659.808,"e":661.525,"p":false,"h":false},{"t":"이사야서 안의 증거만 모으면 \"실패한 종 이스라엘, 그 사명을 대신 이루는 한 종, 그 열매로 생기는 종들\"이라는 모양이 가장 많은 구절을 설명한다고 봅니다.","s":662.112,"e":673.316,"p":false,"h":false},{"t":"그리고 이 한 종의 성취를 신약은 그리스도에게서 보았고, 저는 그 읽기가 책의 구조와 어긋나지 않는다고 생각합니다.","s":673.956,"e":682.137,"p":false,"h":false},{"t":"다만 이것은 제 종합이며 학계의 합의가 아닙니다.","s":682.776,"e":686.591,"p":false,"h":false},{"t":"또 이사야서 저자가 이 한 종을 장차 올 메시아로 얼마나 분명히 알고 썼는지는 본문이 정해 주지 않습니다.","s":686.916,"e":694.009,"p":false,"h":false},{"t":"신약의 읽기는 책 전체가 그리스도를 가리킨다는 신앙에서 나온 해석이고, 그 해석이 본문의 방향과 어울린다는 것이 제가 말할 수 있는 선입니다.","s":694.656,"e":704.166,"p":true,"h":false},{"t":"이 물음이 읽는 사람에게 묻는 것","s":705.276,"e":707.58,"p":false,"h":true},{"t":"종의 정체를 풀고 나면 한 가지가 남습니다.","s":708.588,"e":711.66,"p":false,"h":false},{"t":"이스라엘이 하지 못한 일을 한 분이 대신하셨다면, 그 일의 열매에 참여하는 우리는 어떤 자리에 서는가 하는 것입니다.","s":712.296,"e":719.775,"p":false,"h":false},{"t":"이사야서가 단수의 종 다음에 복수의 종들을 두었다는 점이 이에 대한 답의 방향입니다.","s":720.396,"e":725.964,"p":false,"h":false},{"t":"종은 우리가 대신 짊어질 필요가 없는 일을 하셨으나, 그 뒤에 이어지는 종들이 되라는 부름은 남아 있습니다.","s":726.588,"e":733.748,"p":false,"h":false},{"t":"42장 7절에서 눈을 여는 일은 종의 일이었는데, 사도행전 13장 47절에서는 교회의 일이 됩니다.","s":734.364,"e":741.711,"p":true,"h":false},{"t":"그러므로 이 물음은 구경꾼의 호기심으로 끝나서는 안 됩니다.","s":742.788,"e":747.408,"p":false,"h":false},{"t":"이스라엘은 종으로 부름받았으나 눈멀었고, 우리도 같은 눈멂을 가진 사람들이며, 눈을 여시는 분이 먼저 오셨습니다.","s":748.008,"e":756.264,"p":false,"h":false},{"t":"그 사실을 아는 사람이 종들 가운데 서게 됩니다.","s":756.9,"e":760.209,"p":true,"h":false}]},{"title":"12. 의로운 분이 왜 대신 짊어져야 하는가","audio":"doc12_2610241127.mp3","dur":905.1,"segs":[{"t":"의로운 분이 왜 대신 짊어져야 하는가: 이사야 53장을 따라 읽다","s":0,"e":5.147,"p":false,"h":true},{"t":"본문: 이사야 52:13-53:12 (함께 읽을 본문: 레 16장; 레 5:14-6:7; 사 6:5-7; 43:22-25; 59:1-2, 16; 63:5; 마 20:28; 요 1:29; 행 8:30-35; 롬 4:25; 고후 5:21; 벧전 2:24-25)","s":6.336,"e":44.353,"p":true,"h":false},{"t":"11번 글에서 종이 누구인가를 다루었으니, 이번에는 정체 논쟁을 접어 두고 본문 자체를 읽겠습니다.","s":45.324,"e":52.384,"p":false,"h":false},{"t":"이 시리즈의 첫 물음은 \"왜 이사야를 보내시는가\"였고, 둘째는 \"완고함의 주체가 누구인가\"였습니다.","s":53.028,"e":60.334,"p":false,"h":false},{"t":"백성이 스스로 돌이킬 수 없다는 것이 책 전체의 문제였다면, 53장은 그 문제에 대한 이 책의 가장 깊은 답입니다.","s":60.948,"e":68.867,"p":false,"h":false},{"t":"다만 이 장은 답을 논증으로 내놓지 않고, 놀란 사람들의 고백으로 내놓습니다.","s":69.516,"e":75.46,"p":false,"h":false},{"t":"그래서 먼저 이 장이 어떤 목소리로 쓰였는지부터 보겠습니다.","s":76.104,"e":80.348,"p":true,"h":false},{"t":"세 겹의 목소리","s":81.36,"e":82.688,"p":false,"h":true},{"t":"이 노래는 52장 13절부터 53장 12절까지 세 부분으로 읽힙니다.","s":83.808,"e":89.531,"p":false,"h":false},{"t":"52장 13~15절은 하나님의 말씀으로, 종이 형편없이 상했으나 마침내 높아지리라는 선언입니다.","s":90.144,"e":97.4,"p":false,"h":false},{"t":"53장 1~10절 상반절은 \"우리\"의 고백입니다.","s":98.064,"e":102.055,"p":false,"h":false},{"t":"53장 10절 하반절~12절은 다시 하나님의 말씀으로, 종의 열매와 상급을 선언합니다.","s":102.42,"e":108.826,"p":false,"h":false},{"t":"이 구조에서 가장 눈여겨볼 것은 가운데 부분입니다.","s":109.476,"e":113.106,"p":false,"h":false},{"t":"대속의 의미를 설명하는 것은 하나님이 아니라, 이제야 깨달은 \"우리\"입니다.","s":113.688,"e":118.904,"p":false,"h":false},{"t":"\"우리가 생각하기에는 그가 징벌을 받아 하나님께 맞으며 고난을 당한다 하였노라\"(53:4).","s":119.556,"e":126.546,"p":false,"h":false},{"t":"처음에는 그를 하나님께 맞은 죄인으로 보았다가, 나중에야 그것이 우리 때문이었음을 알게 된 사람들의 말입니다.","s":127.116,"e":134.7,"p":true,"h":false},{"t":"이 점이 9장의 답답함과 이어집니다.","s":135.792,"e":138.569,"p":false,"h":false},{"t":"6장에서 \"보아도 알지 못하리라\"고 선고받은 백성이, 여기서 처음으로 알아봅니다.","s":139.176,"e":145.045,"p":false,"h":false},{"t":"1절의 \"우리가 전한 것을 누가 믿었느냐\"가 요한복음 12장 38절에서 6장 10절과 함께 인용되었던 것을 기억하십시오.","s":145.692,"e":154.153,"p":false,"h":false},{"t":"같은 장이 믿지 않음의 탄식으로 시작하여, 믿음의 고백으로 이어집니다.","s":154.656,"e":159.687,"p":false,"h":false},{"t":"이 연결은 제 문학적 읽기이지만, 6장의 눈멂이 풀리는 순간이 이 장에 있다고 보는 학자가 적지 않습니다.","s":160.308,"e":167.652,"p":true,"h":false},{"t":"종의 모습: 보기에 아름다운 것이 없다","s":168.768,"e":172.04,"p":false,"h":true},{"t":"2절부터 3절은 종을 이렇게 그립니다.","s":172.908,"e":175.815,"p":false,"h":false},{"t":"연한 순 같고 마른 땅에서 나온 뿌리 같아 풍채도 위엄도 없고, 사모할 만한 아름다움이 없으며, 멸시를 받아 사람들이 얼굴을 가릴 정도라고 합니다.","s":176.112,"e":186.14,"p":false,"h":false},{"t":"3절 끝은 \"우리도 그를 귀히 여기지 아니하였도다\"입니다.","s":186.768,"e":190.635,"p":true,"h":false},{"t":"이 그림은 11장과 이어집니다.","s":191.736,"e":194.253,"p":false,"h":false},{"t":"11장 1절의 싹은 그루터기에서 나오는데, 53장 2절의 종도 연한 순, 마른 땅의 뿌리로 나옵니다.","s":194.796,"e":202.592,"p":false,"h":false},{"t":"평강의 왕으로 약속된 분의 영광이 먼저 낮음의 모양으로 온다는 그림입니다.","s":203.256,"e":208.303,"p":false,"h":false},{"t":"이것은 제 연결입니다.","s":208.944,"e":210.817,"p":true,"h":false},{"t":"\"대신\"이라는 말을 본문에서 읽다","s":211.86,"e":214.341,"p":false,"h":true},{"t":"이 장에서 대속을 가리키는 표현이 모여 있는 곳이 4절부터 6절입니다.","s":215.172,"e":219.953,"p":false,"h":false},{"t":"낱말을 하나씩 보겠습니다.","s":220.572,"e":222.615,"p":true,"h":false},{"t":"4절에서 \"질고를 지며 슬픔을 당하였거늘\"의 \"지다\"는 짐을 어깨에 메고 나르는 동작을 가리키는 낱말입니다.","s":223.632,"e":230.763,"p":false,"h":false},{"t":"이 낱말은 11절과 12절에서 \"그들의 죄악을 친히 담당하리라\", \"많은 사람의 죄를 짊어지며\"로 다시 나옵니다.","s":231.372,"e":239.684,"p":false,"h":false},{"t":"낱말을 모으면 이 장이 말하는 대속의 내용이 보입니다.","s":240.3,"e":244.116,"p":false,"h":false},{"t":"우리가 져야 할 것을 그가 졌고, 그가 맞을 이유가 없는 것을 그가 맞았다는 것입니다.","s":244.44,"e":250.442,"p":true,"h":false},{"t":"5절은 이유를 밝힙니다.","s":251.532,"e":253.44,"p":false,"h":false},{"t":"\"그가 찔림은 우리의 허물 때문이요 그가 상함은 우리의 죄악 때문이라 그가 징계를 받으므로 우리는 평화를 누리고 그가 채찍에 맞으므로 우리는 나음을 입었도다.\"","s":254.016,"e":264.938,"p":false,"h":false},{"t":"이 구절의 문법에서 \"때문에\"로 옮긴 말은 원인이나 대신이라는 뜻으로도 읽을 수 있어서, 번역이 갈립니다.","s":265.608,"e":272.805,"p":false,"h":false},{"t":"학자들 사이에서 이 말의 정확한 뜻은 논의가 있으나, 어느 쪽으로 읽든 고난의 방향은 분명합니다.","s":273.42,"e":279.937,"p":false,"h":false},{"t":"그의 고난이 그 자신의 죄에서 나온 것이 아니라 우리의 죄에서 나왔다는 것입니다.","s":280.548,"e":285.866,"p":false,"h":false},{"t":"9절의 \"그는 강포를 행하지 아니하였고 그의 입에 궤사가 없었다\"가 이를 뒷받침합니다.","s":286.524,"e":292.847,"p":true,"h":false},{"t":"6절은 이 장의 중심입니다.","s":293.976,"e":296.222,"p":false,"h":false},{"t":"\"우리는 다 양같이 방황하여 각기 제 길로 갔거늘 여호와께서는 우리 모두의 죄악을 그에게 담당시키셨도다.\"","s":296.856,"e":304.141,"p":false,"h":false},{"t":"앞 구절 전체가 양과 길의 이미지로 읽힙니다.","s":304.74,"e":308.122,"p":false,"h":false},{"t":"40장 11절에서 하나님이 목자로 오셔서 어린양을 안으신다고 했는데, 여기서는 길 잃은 양들이 있고 그 죄가 한 분에게 지워집니다.","s":308.808,"e":318.164,"p":false,"h":false},{"t":"방황한 것은 우리이고, 맞은 것은 그분이라는 교환입니다.","s":318.78,"e":323.197,"p":false,"h":false},{"t":"이 점에서 본문의 \"교환\"은 사법적이라기보다 짐을 옮기는 그림이라는 읽기가 있고, 법정의 대리 형벌로 읽는 전통도 있습니다.","s":323.82,"e":332.193,"p":false,"h":false},{"t":"개혁주의 전통은 후자의 읽기, 곧 대리 형벌로 이 장을 읽어 왔습니다.","s":332.856,"e":338.55,"p":false,"h":false},{"t":"저는 본문의 낱말들이 그 읽기를 지지한다고 봅니다.","s":339.156,"e":342.735,"p":false,"h":false},{"t":"다만 본문이 \"형벌\"이라는 법정 용어를 쓰는지, 짐을 지는 이미지를 쓰는지에 대한 논쟁은 남아 있습니다.","s":343.296,"e":350.477,"p":true,"h":false},{"t":"속건제물","s":351.504,"e":352.555,"p":false,"h":true},{"t":"10절에 이 장의 가장 어려운 낱말이 나옵니다.","s":353.664,"e":356.717,"p":false,"h":false},{"t":"하나님이 종의 영혼을 \"속건제물\"로 삼으셨다는 것입니다.","s":357.336,"e":361.208,"p":false,"h":false},{"t":"히브리어 \"아샴\"은 레위기 5~6장에 나오는 속건제를 가리키는 낱말입니다.","s":361.836,"e":367.416,"p":false,"h":false},{"t":"이 제사는 하나님의 것이나 이웃의 것을 침해한 죄에 대해 배상과 함께 드리는 제사였습니다.","s":368.028,"e":373.946,"p":true,"h":false},{"t":"이 낱말이 이 장에서 가지는 무게는 큽니다.","s":375.048,"e":378.018,"p":false,"h":false},{"t":"종의 죽음이 단순한 억울한 죽음이나 순교가 아니라, 죄를 다루는 제사의 언어로 해석된다는 뜻이기 때문입니다.","s":378.648,"e":386.038,"p":false,"h":false},{"t":"레위기 16장의 속죄일에서 대제사장이 염소의 머리에 백성의 죄를 얹어 광야로 보내는 모습(레 16:21-22)과 53장 6절의 \"담당시키셨도다\"가 겹친다고 보는 학자들도 있습니다.","s":386.676,"e":401.76,"p":false,"h":false},{"t":"다만 이 구절의 낱말과 이미지가 레위기의 제사 제도를 얼마나 직접 가리키는지는 읽기가 갈립니다.","s":402.372,"e":408.943,"p":false,"h":false},{"t":"어떤 학자는 제사의 비유로 읽고, 어떤 학자는 제사 제도를 모형으로 삼아 더 큰 것을 말한다고 읽습니다.","s":409.572,"e":416.751,"p":false,"h":false},{"t":"저는 \"아샴\"이 이 노래의 한복판에 있다는 사실이 제사의 언어를 의도한 선택이라고 봅니다.","s":417.42,"e":423.789,"p":false,"h":false},{"t":"그러나 이 낱말 하나가 이 장의 모든 대속을 제사로 환원하지는 않습니다.","s":424.44,"e":429.546,"p":true,"h":false},{"t":"하나님이 하신 일","s":430.632,"e":432.032,"p":false,"h":true},{"t":"이 장에서 불편하면서도 중요한 점은 이 고난의 주체입니다.","s":433.188,"e":437.276,"p":false,"h":false},{"t":"4절은 \"하나님께 맞으며\"를 우리의 오해로 말했지만, 6절과 10절은 이것을 하나님의 일로 말합니다.","s":437.94,"e":445.082,"p":false,"h":false},{"t":"6절은 \"여호와께서 그에게 담당시키셨도다\"라고 하고, 10절은 \"여호와께서 그를 상하게 하심으로 병들게 하셨다\"고 합니다.","s":445.716,"e":453.813,"p":false,"h":false},{"t":"9장에서 \"펴진 손\"의 후렴이 이스라엘을 향한 심판의 손으로 나왔다면, 53장에서 그 손은 종 위에 놓입니다.","s":454.464,"e":462.145,"p":false,"h":false},{"t":"이 장의 대속이 가진 무게는 하나님의 진노가 피해진 것이 아니라 담당되었다는 점에 있습니다.","s":462.816,"e":468.633,"p":true,"h":false},{"t":"이 점에서 가장 쉬운 오해를 짚어 두어야 합니다.","s":469.764,"e":472.892,"p":false,"h":false},{"t":"이 구절을 성부가 무고한 성자를 학대하는 그림으로 읽는 것입니다.","s":473.544,"e":477.578,"p":false,"h":false},{"t":"본문은 그렇게 읽을 근거를 주지 않습니다.","s":478.224,"e":481.255,"p":false,"h":false},{"t":"10절은 \"여호와의 뜻을 따라\"라고 하고, 11절은 종이 \"자기 영혼의 수고한 것을 보고 만족하리라\"고 합니다.","s":481.788,"e":489.022,"p":false,"h":false},{"t":"종은 끌려가는 희생자가 아니라 사명을 감당하는 자로 그려집니다.","s":489.636,"e":494.106,"p":false,"h":false},{"t":"7절의 \"그가 곤욕을 당하여 괴로울 때에도 그의 입을 열지 아니하였음이여\"는 수동적인 체념보다 자발적인 순종으로 읽힙니다.","s":494.748,"e":503.454,"p":false,"h":false},{"t":"이 구분은 신약이 같은 일을 \"자기를 주셨다\"(갈 2:20)고 증언하는 방식과 맞습니다.","s":504.108,"e":512.379,"p":false,"h":false},{"t":"이 점은 신학적 해석이지 본문 낱말이 직접 말하는 것은 아닙니다.","s":513,"e":517.353,"p":true,"h":false},{"t":"왜 의로운 분이어야 하는가","s":518.436,"e":520.332,"p":false,"h":true},{"t":"처음의 물음으로 돌아가겠습니다.","s":521.46,"e":523.679,"p":false,"h":false},{"t":"의로운 분이 왜 대신 짊어져야 하는가.","s":524.34,"e":527.046,"p":false,"h":false},{"t":"이 물음에는 두 가지 층이 있습니다.","s":527.688,"e":530.218,"p":true,"h":false},{"t":"첫째는 왜 대신이 필요한가입니다.","s":531.288,"e":533.942,"p":false,"h":false},{"t":"이 책이 이미 답을 쌓아 왔습니다.","s":534.564,"e":536.943,"p":false,"h":false},{"t":"백성은 스스로 돌이킬 수 없고(2번), 약속을 받고도 거절하며(3번), 책임은 지우되 길은 열려 있어야 합니다.","s":537.588,"e":546.506,"p":false,"h":false},{"t":"59장 16절이 이것을 압축합니다.","s":547.128,"e":550.03,"p":false,"h":false},{"t":"하나님이 \"사람이 없음을 보시며 중보자가 없음을 이상히 여기셨으므로 자기 팔로 구원을 베푸시고\"라고 하십니다.","s":550.656,"e":557.56,"p":false,"h":false},{"t":"63장 5절도 같은 말을 합니다.","s":558.216,"e":560.862,"p":false,"h":false},{"t":"그러므로 죄의 문제는 백성이 풀 수 없는 문제이고, 풀 수 있는 이가 없다는 것이 이 책의 진단입니다.","s":561.492,"e":568.498,"p":false,"h":false},{"t":"앞서 본 40장 2절의 \"죄악이 사함을 받았느니라\"는 선언이 값없이 선포되었던 이유가 여기서 풀립니다.","s":569.052,"e":575.794,"p":false,"h":false},{"t":"사함은 값이 없는 것이 아니라, 값을 치를 분이 따로 계셨습니다.","s":576.432,"e":581.032,"p":true,"h":false},{"t":"둘째는 왜 의로운 분이어야 하는가입니다.","s":582.12,"e":585.066,"p":false,"h":false},{"t":"11절은 \"의로운 내 종이 자기 지식으로 많은 사람을 의롭게 하며 그들의 죄악을 친히 담당하리로다\"라고 합니다.","s":585.72,"e":593.051,"p":false,"h":false},{"t":"이 구절의 앞부분 \"자기 지식으로\"는 읽기가 갈려서, 종이 아는 것으로 인해 의롭게 한다는 뜻인지, 종을 아는 지식으로 인해 의롭게 된다는 뜻인지 학자들이 나뉩니다.","s":593.712,"e":605.093,"p":false,"h":false},{"t":"어느 쪽이든 이 노래는 의로움이 종에게서 사람들에게로 옮겨진다고 말합니다.","s":605.736,"e":610.769,"p":false,"h":false},{"t":"6장 5절에서 이사야가 \"나는 입술이 부정한 사람\"이라고 한 고백을 떠올려 보십시오.","s":611.424,"e":617.486,"p":false,"h":false},{"t":"자신이 부정한 사람은 남의 부정을 담당할 수 없습니다.","s":618.12,"e":621.826,"p":false,"h":false},{"t":"죄 있는 자가 죄 있는 자를 대신할 수 없다는 것은 레위기에서 제사장이 먼저 자신의 속죄를 하고서야 백성을 위해 나서야 했던 것(레 16:11)과 같은 원리입니다.","s":622.44,"e":635.16,"p":false,"h":false},{"t":"이 연결은 제 읽기입니다.","s":635.832,"e":638.065,"p":false,"h":false},{"t":"9절의 \"그의 입에 궤사가 없었다\"는 말은 이 조건을 말합니다.","s":638.676,"e":642.888,"p":true,"h":false},{"t":"높아지는 종","s":644.004,"e":645.279,"p":false,"h":true},{"t":"이 노래는 비극으로 끝나지 않습니다.","s":646.38,"e":649.011,"p":false,"h":false},{"t":"10절은 \"그가 씨를 보게 되며 그의 날은 길 것이요\"라고 하고, 11절은 \"자기 영혼의 수고한 것을 보고 만족하게 여기리라\", 12절은 \"그가 존귀한 자와 함께 몫을 받으며\"라고 합니다.","s":649.62,"e":662.175,"p":false,"h":false},{"t":"죽음 이후의 일이 이어지는 것입니다.","s":662.796,"e":665.322,"p":false,"h":false},{"t":"8절은 그가 \"산 자의 땅에서 끊어짐\"을 말하고, 9절은 무덤에 있음을 말하는데, 10절에서는 그가 날이 길다고 합니다.","s":665.964,"e":674.327,"p":false,"h":false},{"t":"이 불연속을 어떻게 읽을지는 학자들의 읽기가 갈립니다.","s":674.964,"e":678.934,"p":false,"h":false},{"t":"부활을 암시한다고 보는 읽기가 있고, 이스라엘의 회복을 죽음과 부활의 그림으로 쓴 것이라 보는 읽기가 있고, 죽음 이후의 신원을 말하는 정도로 보는 읽기가 있습니다.","s":679.572,"e":690.362,"p":false,"h":false},{"t":"25장 8절에서 사망이 삼켜지리라는 약속과 연결해 읽으면 부활 쪽 읽기가 자연스럽다고 저는 생각하지만, 본문이 이 구절에서 부활을 직접 말한다고 단정할 수는 없습니다.","s":690.984,"e":702.891,"p":true,"h":false},{"t":"\"씨를 보게 되며\"의 \"씨\"는 11번 글에서 본 대로 54장 17절의 \"종들\"로 이어집니다.","s":703.98,"e":710.702,"p":false,"h":false},{"t":"한 분의 고난 끝에 많은 종이 생기는 것입니다.","s":711.324,"e":714.455,"p":true,"h":false},{"t":"신약은 이 장을 어떻게 읽었는가","s":715.536,"e":718.026,"p":false,"h":true},{"t":"신약은 이 장을 가장 많이 인용한 구약 본문 가운데 하나로 알려져 있습니다.","s":719.208,"e":724.105,"p":false,"h":false},{"t":"마태복음 8장 17절은 병 고치심을 53장 4절의 성취로 읽고, 누가복음 22장 37절은 예수께서 12절의 \"불법자의 하나로 헤아림을 받았다\"를 자기 일로 말씀하신 것이며, 사도행전 8장에서는 에티오피아 내시가 이 장을 읽다가 \"이 글에서 시작하여 예수를 전함\"을 받습니다.","s":724.752,"e":744.795,"p":false,"h":false},{"t":"로마서 4장 25절은 \"예수는 우리가 범죄한 것 때문에 내줌이 되고\"라고 하여 53장 12절의 \"넘겨졌다\"는 낱말을 따르는 것으로 읽힙니다.","s":745.416,"e":755.459,"p":false,"h":false},{"t":"베드로전서 2장 24절은 \"친히 십자가에 달려 그 몸으로 우리 죄를 담당하셨으니\"라고 하고, 고린도후서 5장 21절은 \"죄를 알지도 못하신 이를 우리를 대신하여 죄로 삼으신 것은\"이라고 합니다.","s":755.784,"e":769.84,"p":false,"h":false},{"t":"이 인용들은 대속의 낱말을 53장에서 그대로 가져온 것으로 읽힙니다.","s":770.472,"e":775.724,"p":true,"h":false},{"t":"반면 53장이 유대교 해석에서는 어떻게 읽혔는지도 정직하게 말해야 합니다.","s":776.808,"e":782.289,"p":false,"h":false},{"t":"앞서 11번에서 본 대로 중세 이후 유대교의 주된 읽기는 이 종을 이스라엘 민족으로 읽습니다.","s":782.964,"e":789.583,"p":false,"h":false},{"t":"고난받는 이스라엘이 열방의 죄를 짊어졌고 그 열방이 52장 15절에서 놀라는 이들이라는 읽기입니다.","s":790.236,"e":797.96,"p":false,"h":false},{"t":"이 읽기는 53장 전체의 문법과 52장 15절의 \"열방\"을 연결한다는 강점이 있습니다.","s":798.624,"e":805.148,"p":false,"h":false},{"t":"기독교의 읽기와 겹치는 점은 이 고난이 남을 위한 것이라는 점이며, 갈리는 점은 그 대리자가 누구인가입니다.","s":805.788,"e":813.428,"p":false,"h":false},{"t":"이 차이는 저자가 정해 주지 않고, 신앙의 응답으로 갈립니다.","s":813.96,"e":818.486,"p":false,"h":false},{"t":"앞 글에서 정한 대로 이 앱은 개혁주의 전통의 읽기를 기본으로 하되, 다른 읽기가 있음을 숨기지 않겠습니다.","s":819.108,"e":826.63,"p":true,"h":false},{"t":"이 장을 읽는 사람에게","s":827.748,"e":829.422,"p":false,"h":true},{"t":"이 글의 첫머리에서 말씀드렸듯 53장의 대속을 설명하는 목소리는 \"우리\"입니다.","s":830.376,"e":836.282,"p":false,"h":false},{"t":"이사야서는 대속을 가르치지 않고 고백하게 합니다.","s":836.892,"e":840.549,"p":false,"h":false},{"t":"처음에 우리는 그를 맞은 자로 여겼으나, 알고 보니 맞아야 할 쪽은 우리였다는 이 놀람이 이 장의 신학입니다.","s":841.212,"e":848.534,"p":false,"h":false},{"t":"6장에서 닫혔던 눈이 이 놀람 속에서 열립니다.","s":849.168,"e":852.67,"p":true,"h":false},{"t":"이 장이 위로하는 방식도 정직합니다.","s":853.74,"e":856.408,"p":false,"h":false},{"t":"이 장은 우리가 의로워서 구원받았다고 말하지 않고, 양같이 방황하며 각기 제 길로 갔다고 말합니다.","s":856.98,"e":864.171,"p":false,"h":false},{"t":"그런데도 하나님이 우리를 찾아오셨고, 그 짐을 직접 지셨다는 것이 이 책이 도달한 가장 깊은 위로입니다.","s":864.792,"e":872.313,"p":false,"h":false},{"t":"9장의 펴진 손은 심판의 손으로 남지 않고, 그 손이 한 분 위에 놓이는 것으로 이 책은 대답합니다.","s":872.964,"e":880.033,"p":true,"h":false},{"t":"그리고 한 가지는 남습니다.","s":881.064,"e":883.131,"p":false,"h":false},{"t":"이 고난이 이미 이루어졌다는 말은, 이 앞에서 우리가 구경꾼으로 남아도 된다는 뜻이 아닙니다.","s":883.44,"e":889.671,"p":false,"h":false},{"t":"54장 1절은 곧바로 \"노래하라\"고 하고, 55장 1절은 \"오라\"고 합니다.","s":890.316,"e":896.048,"p":false,"h":false},{"t":"53장이 마친 곳에서 초대가 시작됩니다.","s":896.724,"e":899.907,"p":false,"h":false},{"t":"고난을 믿은 사람은 이 초대에 응하는 사람입니다.","s":900.54,"e":904.02,"p":true,"h":false}]},{"title":"13. 회복이 약속된 뒤에도 왜 죄의 탄식이 계속되는가","audio":"doc13_2610241127.mp3","dur":1133.7,"segs":[{"t":"회복이 약속된 뒤에도 왜 죄의 탄식이 계속되는가: 이사야 56~59장, 63~64장을 읽다","s":0,"e":9.015,"p":false,"h":true},{"t":"본문: 이사야 56:1-12; 57:14-21; 58:1-14; 59:1-21; 63:7-64:12 (함께 읽을 본문: 사 6:9-10; 9:7; 32:15; 40:1-2; 44:3; 50:2; 53:1-12; 55:1-13; 60:1-3; 61:1-3; 65:1-2; 롬 11:26-27; 눅 4:16-21; 요일 1:8-9)","s":10.188,"e":58.366,"p":true,"h":false},{"t":"12번 글은 53장에서 끝났고, 이어지는 54~55장에서 책의 분위기는 확 달라집니다.","s":59.292,"e":66.727,"p":false,"h":false},{"t":"54장은 \"노래하라\"로 시작하고 55장은 \"오라\"로 시작합니다.","s":67.32,"e":72.261,"p":false,"h":false},{"t":"독자는 이제 이 책의 문제가 풀렸다고 느낍니다.","s":72.9,"e":76.328,"p":false,"h":false},{"t":"그런데 56장을 펴면 다시 책망이 나옵니다.","s":76.968,"e":80.464,"p":false,"h":false},{"t":"눈먼 파수꾼, 우상숭배, 공의 없는 금식, 그리고 \"우리의 죄악이 우리를 쳐서 증언합니다\"라는 백성의 고백이 이어집니다.","s":80.748,"e":90.759,"p":false,"h":false},{"t":"9장을 읽고 느낀 답답함이 책의 맨 끝에서 다시 돌아오는 것입니다.","s":91.44,"e":96.05,"p":false,"h":false},{"t":"이번 물음은 그것입니다.","s":96.696,"e":98.567,"p":false,"h":false},{"t":"대속이 이루어지고 초대가 선포되었는데, 왜 죄의 탄식이 끝나지 않는가.","s":99.108,"e":104.145,"p":true,"h":false},{"t":"먼저 이 장들이 어떤 자리에 서 있는가","s":105.228,"e":107.918,"p":false,"h":true},{"t":"56~66장의 배경에 대해서는 9번 글에서 본 입장 차이가 그대로 있습니다.","s":109.08,"e":115.24,"p":false,"h":false},{"t":"귀환 이후의 공동체에게 주어진 말씀으로 읽는 학자가 많고, 단일 저자 입장에서는 이사야가 환상 가운데 본 미래의 백성에게 한 말씀으로 읽습니다.","s":115.884,"e":125.87,"p":false,"h":false},{"t":"귀환한 백성이 약속하신 영광 대신 가난과 불의와 갈등을 만났다고 보는 읽기는 학개, 스가랴, 말라기가 그리는 귀환 후 현실과 잘 맞는다고 흔히 지적됩니다.","s":126.54,"e":138.26,"p":false,"h":false},{"t":"이것은 일반적으로 제시되는 해석이고 본문이 직접 시대를 밝히는 것은 아닙니다.","s":138.924,"e":144.428,"p":false,"h":false},{"t":"어느 입장에서든 최종 형태의 책을 읽는 우리에게 이 장들은 같은 일을 합니다.","s":145.008,"e":150.286,"p":false,"h":false},{"t":"선포된 구원과 아직 이루어지지 않은 현실이 한 공동체 안에 겹쳐 있음을 보여 줍니다.","s":150.912,"e":156.329,"p":true,"h":false},{"t":"열린 문과 눈먼 파수꾼","s":157.428,"e":159.474,"p":false,"h":true},{"t":"56장은 놀라운 말로 시작합니다.","s":160.344,"e":163.004,"p":false,"h":false},{"t":"이방인과 고자에게 문이 열립니다(56:3-8).","s":163.656,"e":168.376,"p":false,"h":false},{"t":"신명기 23장 1절부터 3절의 규정으로는 회중에 들어올 수 없던 사람들이 하나님의 집에서 이스라엘의 이름보다 나은 이름을 받습니다.","s":168.912,"e":177.863,"p":false,"h":false},{"t":"그리고 7절은 \"내 집은 만민이 기도하는 집이라 일컬음이 되리라\"고 합니다.","s":178.524,"e":183.792,"p":false,"h":false},{"t":"예수께서 성전을 정화하실 때 이 구절을 인용하셨습니다.","s":184.392,"e":188.49,"p":false,"h":false},{"t":"이 열림은 14번 글에서 따로 다루겠습니다.","s":189.108,"e":192.35,"p":true,"h":false},{"t":"그런데 바로 9절부터 분위기가 바뀝니다.","s":193.464,"e":196.407,"p":false,"h":false},{"t":"문이 열렸는데 문을 지키는 사람이 문제입니다.","s":196.992,"e":200.29,"p":false,"h":false},{"t":"\"그의 파수꾼들은 맹인이요 다 무지하며 다 벙어리 개라 짖지 못하며\"(56:10).","s":200.916,"e":207.517,"p":false,"h":false},{"t":"파수꾼은 위험을 보고 경고하는 일을 맡은 사람인데, 보지 못하고 짖지 못합니다.","s":208.08,"e":213.652,"p":false,"h":false},{"t":"지도자들은 각기 제 길로 돌아가 자기 이익만 구합니다(56:11).","s":214.236,"e":219.769,"p":false,"h":false},{"t":"53장 6절의 \"각기 제 길로 갔거늘\"이 속죄를 말한 장 뒤에서 다시 나타나는 점이 눈에 띕니다.","s":220.176,"e":226.881,"p":false,"
