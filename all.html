<style>
  :root { --bg:#FAF8F3; --ink:#1F2A24; --mute:#5E6B63; --acc:#2E7D4F; --hl:#AEDDBF; --bar:#1F3A2B; --fs:22px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.95; word-break:keep-all; padding-bottom:120px; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 0; }
  header h1 { font-size:30px; font-weight:900; line-height:1.4; letter-spacing:-0.01em; }
  header .meta { color:var(--mute); font-size:16px; margin:6px 0 4px; }
  header .rule { height:4px; width:64px; background:var(--acc); border-radius:4px; margin:14px 0 22px; }
  #resume { display:none; background:#EAF3EC; border:2px solid #BFD9C7; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #resume button { background:var(--acc); color:#fff; border:0; border-radius:12px; font:inherit; font-weight:900; font-size:16px; padding:8px 14px; margin-left:8px; cursor:pointer; }

  button.auto { font:inherit; font-weight:900; font-size:19px; height:52px; padding:0 20px; border-radius:14px; cursor:pointer; background:#EEE; color:#555; border:2px solid #CCC; }
  button.auto.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .autohint { font-size:17px; line-height:1.6; margin:6px 0 16px; color:var(--mute); }
  .autohint.off { color:#9a4a00; font-weight:700; }
  #note { display:none; background:#FFF3DC; border:2px solid #F0D49A; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #note button { background:var(--acc); color:#fff; border:0; border-radius:12px; font:inherit; font-weight:900; font-size:16px; padding:8px 14px; margin-left:8px; cursor:pointer; }
  details#lst { background:#fff; border:2px solid #DCE6DF; border-radius:14px; padding:10px 16px; margin-bottom:20px; }
  details#lst summary { cursor:pointer; font-weight:900; font-size:18px; color:var(--acc); }
  #toc { margin:10px 0 4px 22px; font-size:19px; }
  #toc li { margin:6px 0; }
  #toc a { color:var(--ink); text-decoration:none; }
  #toc .d { color:var(--mute); font-size:15px; margin-left:6px; }
  section.trk { margin-top:34px; padding-top:6px; border-top:3px solid #DCE6DF; scroll-margin-top:12px; }
  section.trk:first-child { margin-top:0; border-top:0; }
  h2.tt { font-size:calc(var(--fs) + 8px); font-weight:900; margin:.6em 0 .6em; line-height:1.45; }
  #text p { font-size:var(--fs); margin-bottom:1.1em; }
  #text h3.hd { font-size:calc(var(--fs) + 4px); font-weight:900; margin:1.6em 0 .6em; color:var(--acc); line-height:1.5; }
  .seg { cursor:pointer; border-radius:8px; padding:1px 3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; scroll-margin-top:24px; transition:background .2s; }
  .seg.on { background:var(--hl); box-shadow:0 0 0 3px var(--hl); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bar); color:#fff; padding:0 12px calc(6px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(0,0,0,.25); z-index:50; }
  .now { text-align:center; font-size:14px; opacity:.9; padding:6px 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog { height:10px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden; margin:0 -12px 6px; }
  .prog i { display:block; height:100%; width:0; background:#8fe0a8; }
  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  .bar button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  .bar button:active { transform:scale(.96); }
  .bar button:focus-visible { outline:3px solid #FFE680; outline-offset:2px; }
  #play { background:#3FAE6A; font-size:18px; min-width:100px; }
  .bar button.o { font-size:14px; min-width:40px; padding:0 10px; background:rgba(255,255,255,.1); }
  @media (max-width:640px) { header h1 { font-size:25px; } .bar button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }
</style>

<script>
(function () {
  const TITLE = "아사야 깊이 들어가기", TRACKS = [{"title":"1. 결과를 아시면서 왜 보내시는가","audio":"doc01_2610241127.mp3","dur":709.3,"segs":[{"t":"결과를 아시면서 왜 보내시는가: 이사야의 소명과 사명의 성격","s":0,"e":4.921,"p":false,"h":true},{"t":"본문: 이사야 6장 (함께 읽을 본문: 마 13:10-17, 요 12:37-41, 행 28:25-28)","s":6.048,"e":19.964,"p":true,"h":false},{"t":"선지자의 소명 기사는 보통 격려로 끝납니다.","s":20.772,"e":24.016,"p":false,"h":false},{"t":"모세에게는 \"내가 너와 함께 있으리라\"(출 3:12)고 하셨고, 예레미야에게는 \"내가 너와 함께하여 너를 구원하리라\"(렘 1:8)고 하셨습니다.","s":24.66,"e":38.045,"p":false,"h":false},{"t":"그런데 이사야 6장은 다릅니다.","s":38.7,"e":41.196,"p":false,"h":false},{"t":"사명을 맡기시는 말씀이 곧 실패의 예고입니다.","s":41.76,"e":45.179,"p":false,"h":false},{"t":"백성은 듣기는 들어도 깨닫지 못하고 보기는 보아도 알지 못하리라는 것입니다.","s":45.828,"e":51.075,"p":false,"h":false},{"t":"이 장면이 이사야서 전체를 읽는 열쇠인 동시에 가장 큰 걸림돌입니다.","s":51.732,"e":56.751,"p":true,"h":false},{"t":"소명은 왜 여섯 번째 장에 나오는가","s":57.852,"e":60.435,"p":false,"h":true},{"t":"이사야서를 처음 읽는 사람은 소명 기사가 1장이 아니라 6장에 나오는 것에 놀랍니다.","s":61.56,"e":67.336,"p":false,"h":false},{"t":"1장에서 5장까지는 이미 고소장입니다.","s":67.968,"e":70.911,"p":false,"h":false},{"t":"하나님은 자녀를 키웠으나 자녀가 반역했다고 하시고(1:2), 5장에서는 포도원 노래로 판결을 내리십니다.","s":71.532,"e":79.275,"p":false,"h":false},{"t":"좋은 포도를 기대하며 정성을 다했으나 들포도가 열렸으니, 그 이상 \"무엇을 더 할 것이 있느냐\"(5:4)는 말씀입니다.","s":79.884,"e":89.285,"p":true,"h":false},{"t":"이 순서가 중요합니다.","s":90.36,"e":92.102,"p":false,"h":false},{"t":"백성의 완고함은 6장의 소명에서 비로소 시작된 것이 아닙니다.","s":92.736,"e":97.059,"p":false,"h":false},{"t":"이미 있는 완고함을 6장이 하나님의 선고로 확정하는 것입니다.","s":97.704,"e":101.714,"p":false,"h":false},{"t":"6장을 읽을 때는 5장의 포도원을 뒤에 업고 읽어야 합니다.","s":102.384,"e":106.431,"p":false,"h":false},{"t":"그렇지 않으면 하나님이 멀쩡한 백성을 일부러 눈멀게 하시는 것처럼 오해하기 쉽습니다.","s":107.064,"e":112.857,"p":true,"h":false},{"t":"사명 앞에 속죄가 있었다","s":113.94,"e":115.857,"p":false,"h":true},{"t":"장면은 웃시야 왕이 죽던 해, 곧 나라의 한 시대가 저물던 때에 시작됩니다.","s":117,"e":122.778,"p":false,"h":false},{"t":"이사야는 높이 들린 보좌에 앉으신 주님을 봅니다.","s":123.444,"e":126.855,"p":false,"h":false},{"t":"스랍들은 \"거룩, 거룩, 거룩\"을 외치고, 성전은 연기로 가득 찹니다.","s":127.476,"e":134.754,"p":false,"h":false},{"t":"이사야의 반응은 감격이 아니라 파멸의 비명입니다.","s":135.36,"e":138.927,"p":false,"h":false},{"t":"\"화로다 나여, 망하게 되었도다.","s":139.536,"e":142.361,"p":false,"h":false},{"t":"나는 입술이 부정한 사람이요, 입술이 부정한 백성 중에 거주하면서 왕이신 만군의 여호와를 뵈었음이로다\"(6:5).","s":143.028,"e":151.608,"p":true,"h":false},{"t":"이 고백에서 눈여겨볼 대목은 \"입술이 부정한 백성 중에 거주하면서\"입니다.","s":152.604,"e":157.846,"p":false,"h":false},{"t":"이사야는 백성 위에 서서 그들을 정죄하는 재판관이 아닙니다.","s":158.508,"e":162.721,"p":false,"h":false},{"t":"자신도 같은 백성의 일부이고 같은 입술을 가졌습니다.","s":163.332,"e":167.038,"p":false,"h":false},{"t":"그런 그에게 스랍이 제단의 숯불을 입에 대며 \"네 악이 제거되고 네 죄가 사해졌느니라\"고 선언합니다.","s":167.652,"e":174.383,"p":false,"h":false},{"t":"사명은 속죄 뒤에 옵니다.","s":175.032,"e":176.944,"p":false,"h":false},{"t":"전하는 사람은 자기가 먼저 용서받은 죄인으로 서야 합니다.","s":177.588,"e":181.582,"p":false,"h":false},{"t":"이 순서가 이후에 나오는 어두운 사명을 감당할 수 있게 하는 바탕입니다.","s":182.196,"e":186.856,"p":true,"h":false},{"t":"주님이 \"내가 누구를 보내며 누가 우리를 위하여 가겠느냐\" 물으실 때, 이사야는 \"내가 여기 있나이다, 나를 보내소서\" 하고 나섭니다.","s":187.956,"e":197.685,"p":false,"h":false},{"t":"여기서 놓치기 쉬운 사실이 있습니다.","s":198.324,"e":200.866,"p":false,"h":false},{"t":"그는 사명의 내용을 듣기 전에 자원했습니다.","s":201.528,"e":204.557,"p":false,"h":false},{"t":"결과가 어떨지 모르는 채로 보내 달라고 한 것입니다.","s":204.876,"e":208.361,"p":false,"h":false},{"t":"9절의 말씀은 그 뒤에 나옵니다.","s":208.98,"e":211.399,"p":true,"h":false},{"t":"말씀의 내용: 전하되, 그 전함이 굳힘이 된다","s":212.472,"e":216.875,"p":false,"h":true},{"t":"\"가서 이 백성에게 이르기를, 너희가 듣기는 들어도 깨닫지 못하며 보기는 보아도 알지 못하리라 하라.","s":218.052,"e":225.568,"p":false,"h":false},{"t":"너는 이 백성의 마음이 둔하여지며 그 귀가 막히고 눈이 감기게 하라\"(6:9-10).","s":226.224,"e":233.164,"p":false,"h":false},{"t":"이 말씀은 쉽게 풀리지 않습니다.","s":233.712,"e":236.231,"p":false,"h":false},{"t":"히브리어 본문은 \"듣고 또 들으라, 그러나 깨닫지 말라\"처럼 명령형으로 되어 있고, 10절에서 이사야에게 마음을 둔하게 하라고 명하는 동사도 명령형입니다.","s":236.88,"e":247.268,"p":false,"h":false},{"t":"그래서 학자들은 이 구절을 몇 가지로 이해해 왔습니다.","s":247.896,"e":251.502,"p":false,"h":false},{"t":"하나님의 목적으로 보는 이해, 선포가 낳을 결과를 가리킨다고 보는 이해, 이미 굳은 마음을 하나님이 심판으로 더 굳히신다고 보는 이해입니다.","s":252.144,"e":261.441,"p":true,"h":false},{"t":"개혁주의 전통은 대체로 마지막 이해, 곧 심판적 강퍅 쪽에 서 왔습니다.","s":262.476,"e":267.929,"p":false,"h":false},{"t":"5장에서 하나님이 모든 것을 다 하셨는데도 거부한 백성에게, 이제 그 거부를 확정하는 방식으로 말씀이 작용한다는 것입니다.","s":268.488,"e":276.914,"p":false,"h":false},{"t":"출애굽기의 바로가 비슷한 사례입니다.","s":277.56,"e":280.332,"p":false,"h":false},{"t":"하나님이 바로의 마음을 강퍅하게 하시겠다고 미리 말씀하셨고(출 4:21), 본문은 바로가 스스로 마음을 완악하게 했다는 말도 여러 번 합니다(출 8:15, 32).","s":280.98,"e":295.133,"p":false,"h":false},{"t":"주권과 책임이 한 이야기 안에 나란히 놓여 있습니다.","s":295.488,"e":298.817,"p":false,"h":false},{"t":"이 긴장은 다음 물음에서 본문이 어디까지 말하고 어디서 멈추는지를 살피며 따로 다루겠습니다.","s":299.448,"e":305.98,"p":false,"h":false},{"t":"이 자리에서는 하나님이 변덕스럽게 눈을 멀게 하시는 분이 아니라, 이미 닫힌 마음을 심판 가운데 닫아 두시는 분으로 그려진다는 점만 붙들고 가겠습니다.","s":306.612,"e":316.793,"p":true,"h":false},{"t":"그런데 왜 그래도 보내시는가","s":317.88,"e":320.067,"p":false,"h":true},{"t":"이제 처음의 물음으로 돌아옵니다.","s":321.228,"e":323.531,"p":false,"h":false},{"t":"결과가 정해져 있다면 선지자를 보내시는 일은 헛수고가 아닙니까.","s":324.144,"e":328.23,"p":false,"h":false},{"t":"이사야서는 이 물음에 하나의 답이 아니라 여러 겹의 답을 줍니다.","s":328.86,"e":333.355,"p":true,"h":false},{"t":"먼저, 말씀은 설득 기술이 아니라 빛입니다.","s":334.44,"e":338.121,"p":false,"h":false},{"t":"빛은 비치는 것만으로 일을 합니다.","s":338.724,"e":341.346,"p":false,"h":false},{"t":"어둠에 익숙한 눈은 빛 앞에서 눈을 감고, 그것이 바로 그 눈의 상태를 드러냅니다.","s":341.964,"e":348.042,"p":false,"h":false},{"t":"요한은 빛이 세상에 왔으나 사람들이 자기 행위가 악하므로 빛보다 어둠을 더 사랑했다고 말합니다(요 3:19).","s":348.696,"e":357.613,"p":false,"h":false},{"t":"바울도 복음이 구원받는 자에게는 생명의 향기가 되고 망하는 자에게는 사망의 냄새가 된다고 말합니다(고후 2:15-16).","s":358.164,"e":367.791,"p":false,"h":false},{"t":"같은 말씀이 사람의 상태를 따라 다르게 작용합니다.","s":368.388,"e":371.944,"p":false,"h":false},{"t":"선포의 열매는 회개만이 아니라 사람의 실상을 드러내는 것이기도 합니다.","s":372.564,"e":377.404,"p":true,"h":false},{"t":"다음으로, 이사야는 설득자가 아니라 증인입니다.","s":378.468,"e":382.095,"p":false,"h":false},{"t":"에스겔도 같은 처지에서 이런 말씀을 받았습니다.","s":382.716,"e":386.132,"p":false,"h":false},{"t":"그들이 듣든지 아니 듣든지 그들 가운데 선지자가 있음을 알게 하라는 것입니다(겔 2:5).","s":386.784,"e":394.137,"p":false,"h":false},{"t":"말씀이 먼저 선포되어야 백성은 \"몰랐다\"고 말할 수 없고, 심판은 정당해집니다.","s":394.704,"e":400.572,"p":false,"h":false},{"t":"하나님은 아무 예고 없이 치시는 분이 아니라, 수십 년 동안 한 사람을 세워 경고하게 하신 뒤에 치시는 분입니다.","s":401.184,"e":408.35,"p":false,"h":false},{"t":"그 집요함은 비효율이 아니라 심판의 정당성을 쌓는 인내입니다.","s":408.996,"e":413.636,"p":true,"h":false},{"t":"그리고 말씀은 보존됩니다.","s":414.612,"e":416.714,"p":false,"h":false},{"t":"8장 16절에서 이사야는 \"증거의 말씀을 싸매며 율법을 내 제자들 가운데에서 봉함하라\"고 합니다.","s":417.24,"e":423.889,"p":false,"h":false},{"t":"당대에 받아들여지지 않아도 말씀은 제자들 손에 맡겨져 남습니다.","s":424.548,"e":428.928,"p":false,"h":false},{"t":"예언대로 심판이 이루어졌을 때 그 말씀은 하나님이 참으로 말씀하셨다는 증거가 됩니다.","s":429.588,"e":435.821,"p":false,"h":false},{"t":"다니엘이 포로기에 예레미야의 책을 읽고 때를 깨달았다는 기록(단 9:2)은, 선지자가 살아 있을 때 외면당한 말씀이 후대에 다시 읽히며 힘을 얻는 방식을 보여 줍니다.","s":436.464,"e":448.556,"p":false,"h":false},{"t":"이사야서 자체가 그 증거입니다.","s":449.208,"e":451.691,"p":false,"h":false},{"t":"그의 사역은 당대의 눈으로는 실패였으나, 그 말씀이 지금 우리 손에 있습니다.","s":452.34,"e":457.865,"p":true,"h":false},{"t":"또한 이사야서는 55장에서 스스로 이렇게 답합니다.","s":458.964,"e":462.991,"p":false,"h":false},{"t":"비와 눈이 땅을 적셔 싹을 나게 하고 돌아가지 않듯이, 하나님의 입에서 나간 말씀도 헛되이 돌아오지 않고 하나님이 기뻐하시는 바를 이룬다는 것입니다(55:10-11).","s":463.644,"e":476.21,"p":false,"h":false},{"t":"말씀이 이루는 바가 이사야의 기대나 백성의 반응과 같을 필요는 없습니다.","s":476.712,"e":481.577,"p":false,"h":false},{"t":"말씀은 하나님이 보내신 목적을 이룹니다.","s":482.22,"e":485.204,"p":true,"h":false},{"t":"마지막으로, 하나님은 이 사명을 이사야 혼자 지게 하지 않으셨습니다.","s":486.288,"e":491.08,"p":false,"h":false},{"t":"이사야는 판결을 듣고 조용히 받아들이지 않았습니다.","s":491.688,"e":495.52,"p":false,"h":false},{"t":"\"주여 어느 때까지니이까\"(6:11) 하고 되묻습니다.","s":496.152,"e":500.895,"p":false,"h":false},{"t":"선지자는 냉정한 전달자가 아니라 탄식하는 중보자였습니다.","s":501.552,"e":506.012,"p":false,"h":false},{"t":"하나님의 대답은 설명이 아니라 시간표입니다.","s":506.664,"e":509.744,"p":false,"h":false},{"t":"성읍이 황폐하여 사람이 없을 때까지라는 것입니다.","s":510.048,"e":513.615,"p":false,"h":false},{"t":"그러나 이어서 한 줄기 희망이 붙습니다.","s":514.26,"e":516.969,"p":false,"h":false},{"t":"베임을 당한 나무의 그루터기처럼, 남은 것이 있으리라는 약속입니다(6:13).","s":517.572,"e":523.828,"p":false,"h":false},{"t":"이 그루터기가 남은 자의 첫 모습입니다.","s":524.052,"e":527.027,"p":false,"h":false},{"t":"남은 자는 왜 있고 무엇을 위한 것인지는 네 번째 물음에서 따로 다루겠습니다.","s":527.58,"e":533.096,"p":true,"h":false},{"t":"신약은 이 본문을 어떻게 읽는가","s":534.204,"e":536.713,"p":false,"h":true},{"t":"신약에서 이사야 6장 9~10절은 복음서 네 권과 사도행전에 모두 인용됩니다.","s":537.876,"e":543.66,"p":false,"h":false},{"t":"이 본문이 그만큼 중요한 해석의 열쇠였다는 뜻입니다.","s":544.32,"e":548.148,"p":false,"h":false},{"t":"마태복음 13장에서 예수님은 비유로 말씀하시는 이유를 설명하시며 이 구절을 인용하십니다.","s":548.784,"e":555.277,"p":false,"h":false},{"t":"같은 이야기를 듣고도 어떤 사람은 열매를 맺고 어떤 사람은 더 닫힙니다.","s":555.912,"e":561.542,"p":true,"h":false},{"t":"요한복음 12장은 더 깊이 들어갑니다.","s":562.644,"e":565.576,"p":false,"h":false},{"t":"예수님이 많은 표적을 보이셨는데도 사람들이 믿지 않았다고 하며, 요한은 이것을 이사야 53장 1절(\"우리가 전한 것을 누가 믿었느냐\")과 6장 10절로 함께 설명합니다.","s":566.208,"e":578.914,"p":false,"h":false},{"t":"그리고 요한은 놀라운 해석을 덧붙입니다.","s":579.564,"e":582.365,"p":false,"h":false},{"t":"\"이사야가 그의 영광을 보았으므로 그에 대하여 말한 것\"(12:41).","s":582.948,"e":588.215,"p":false,"h":false},{"t":"이사야가 6장에서 본 보좌의 주님이 곧 그리스도라는 말입니다.","s":588.816,"e":593.391,"p":false,"h":false},{"t":"이 해석을 따르면 이사야서는 처음부터 그리스도의 영광을 보고 시작한 책이고, 그를 거부하는 일 또한 이미 본문이 내다본 일입니다.","s":594.036,"e":603.043,"p":false,"h":false},{"t":"그렇다고 책임이 사라지는 것은 아닙니다.","s":603.684,"e":606.482,"p":false,"h":false},{"t":"요한은 같은 자리에서 \"그들이 믿지 아니하니\"라고 분명히 적습니다.","s":607.032,"e":611.585,"p":false,"h":false},{"t":"예언의 성취와 인간의 책임이 나란히 서 있습니다.","s":612.18,"e":615.492,"p":true,"h":false},{"t":"그리고 사도행전은 이 본문으로 끝납니다.","s":616.572,"e":619.55,"p":false,"h":false},{"t":"바울이 로마에서 유대인들에게 말씀을 전했으나 믿는 사람도 있고 믿지 않는 사람도 있었을 때, 그는 성령이 이사야를 통해 하신 말씀이 옳다며 6장 9~10절을 인용하고 이렇게 선언합니다.","s":620.136,"e":633.266,"p":false,"h":false},{"t":"\"이 하나님의 구원이 이방인에게 보내어진 줄을 알라.","s":633.852,"e":637.376,"p":false,"h":false},{"t":"그들은 달게 들으리라\"(행 28:28).","s":638.028,"e":642.256,"p":false,"h":false},{"t":"이사야의 사명이 실패로 끝난 곳에서 열방으로 문이 열립니다.","s":642.708,"e":646.91,"p":false,"h":false},{"t":"이 연결은 열네 번째 물음에서 다시 다루게 됩니다.","s":647.496,"e":651.247,"p":true,"h":false},{"t":"전하는 사람에게 남는 것","s":652.32,"e":654.119,"p":false,"h":true},{"t":"이사야의 소명을 오늘의 말로 옮기면 이렇습니다.","s":655.2,"e":658.548,"p":false,"h":false},{"t":"하나님이 맡기신 사명의 기준은 성공이 아니라 신실함입니다.","s":659.16,"e":663.228,"p":false,"h":false},{"t":"그러나 이 말을 체념으로 읽으면 안 됩니다.","s":663.84,"e":666.806,"p":false,"h":false},{"t":"이사야는 결과를 알고도 자원했고, 탄식했고, 수십 년을 말했고, 마지막까지 말씀을 지켜 후대에 넘겼습니다.","s":667.368,"e":676.144,"p":false,"h":false},{"t":"그는 포기한 사람이 아니라 하나님이 일하시는 방식을 신뢰한 사람입니다.","s":676.8,"e":681.588,"p":false,"h":false},{"t":"말씀은 빛으로, 증거로, 보존된 씨로 일하며, 열매의 때와 방식은 하나님께 있습니다.","s":682.236,"e":689.317,"p":true,"h":false},{"t":"다만 이 사실이 선포하는 사람을 면책해 주지는 않습니다.","s":690.372,"e":694.325,"p":false,"h":false},{"t":"이사야는 먼저 속죄를 받았고, 자기도 부정한 입술의 백성 가운데 산다고 고백한 사람이었습니다.","s":694.908,"e":701.715,"p":false,"h":false},{"t":"보냄을 받은 자는 백성보다 나은 사람이어서가 아니라 용서받은 사람이어서 보냄을 받습니다.","s":702.324,"e":708.179,"p":true,"h":false}]},{"title":"2. 하나님이 굳히시는가 백성이 굳어지는가","audio":"doc02_2610241127.mp3","dur":658,"segs":[{"t":"하나님이 굳히시는가, 백성이 굳어지는가: 완고함의 주체를 묻다","s":0,"e":5.469,"p":false,"h":true},{"t":"본문: 이사야 6:9-10; 63:17 (함께 읽을 본문: 출 4~14장, 사 29:9-14, 30:9-15, 롬 9:14-24, 11:7-10, 25-32)","s":6.516,"e":27.663,"p":true,"h":false},{"t":"앞의 글에서 우리는 이사야에게 맡겨진 사명이 설득이 아니라 증언이라는 데까지 왔습니다.","s":28.656,"e":34.11,"p":false,"h":false},{"t":"그런데 거기서 풀지 못한 물음이 하나 남았습니다.","s":34.74,"e":38.006,"p":false,"h":false},{"t":"백성의 마음이 둔해지고 귀가 막히는 일을 누가 하는가 하는 것입니다.","s":38.52,"e":42.955,"p":false,"h":false},{"t":"6장 10절은 하나님의 명령으로 읽힙니다.","s":43.596,"e":46.699,"p":false,"h":false},{"t":"그렇다면 백성은 하나님이 굳혀 놓으신 대로 굳어진 것이고, 그들을 책망하시는 일이 공정한가 하는 물음이 따라옵니다.","s":47.268,"e":54.92,"p":false,"h":false},{"t":"이 물음은 신학교 강의실에서 시작된 것이 아닙니다.","s":55.512,"e":59.093,"p":false,"h":false},{"t":"이사야서를 처음 읽는 사람 대부분이 이 대목에서 걸립니다.","s":59.688,"e":63.864,"p":true,"h":false},{"t":"이사야서 안에서 두 말이 함께 나옵니다","s":64.98,"e":67.723,"p":false,"h":true},{"t":"먼저 본문이 한쪽으로만 말하지 않는다는 점을 확인해야 합니다.","s":68.94,"e":72.985,"p":false,"h":false},{"t":"6장 10절에서 마음을 둔하게 하는 동사는 사역형 명령입니다.","s":73.62,"e":77.839,"p":false,"h":false},{"t":"하나님의 뜻 안에 이 굳어짐이 있다는 말입니다.","s":78.48,"e":81.533,"p":false,"h":false},{"t":"29장 10절도 여호와께서 깊이 잠들게 하는 영을 부어 주셨다고 말합니다.","s":82.152,"e":87.155,"p":false,"h":false},{"t":"하나님이 주체이신 것입니다.","s":87.804,"e":89.872,"p":true,"h":false},{"t":"그러나 같은 책이 정반대 방향으로도 말합니다.","s":90.828,"e":93.969,"p":false,"h":false},{"t":"29장 13절은 이 백성이 입으로는 가까이하나 마음은 멀리 떠나 있다고 책망합니다.","s":94.464,"e":100.483,"p":false,"h":false},{"t":"30장 9절부터 15절은 더 분명합니다.","s":101.124,"e":104.505,"p":false,"h":false},{"t":"이 백성은 패역한 자식이어서 선지자에게 \"바른 것을 보지 말라, 부드러운 말을 하라\"고 합니다.","s":105.084,"e":111.692,"p":false,"h":false},{"t":"하나님은 돌이켜 조용히 있으면 구원을 얻을 것이라고 하셨으나 \"너희가 원하지 아니하였다\"(30:15)고 하십니다.","s":112.32,"e":121.262,"p":false,"h":false},{"t":"65장 12절도 내가 불러도 대답하지 않았고 내가 기뻐하지 않는 것을 택하였다고 말합니다.","s":121.896,"e":128.151,"p":false,"h":false},{"t":"여기서 주체는 백성입니다.","s":128.772,"e":130.817,"p":true,"h":false},{"t":"6장 10절 자체에도 눈여겨볼 대목이 있습니다.","s":131.904,"e":135.282,"p":false,"h":false},{"t":"그 구절은 굳어지는 목적을 \"그들이 보고 듣고 깨닫고 돌이켜 고침을 받을까 하노라\"로 밝힙니다.","s":135.792,"e":142.536,"p":false,"h":false},{"t":"이 말은 돌이킴과 치유가 본래 열려 있던 길임을 전제합니다.","s":143.208,"e":147.251,"p":false,"h":false},{"t":"하나님이 그 길을 막는 방식으로 일하신다는 것이 이 구절의 무게이지만, 막히는 길이 원래 있었다는 사실도 함께 남습니다.","s":147.852,"e":156.174,"p":true,"h":false},{"t":"바로의 이야기가 보여 주는 방식","s":157.248,"e":159.566,"p":false,"h":true},{"t":"이 긴장은 출애굽기에서 가장 분명하게 나타납니다.","s":160.668,"e":164.215,"p":false,"h":false},{"t":"하나님은 모세를 보내시기 전에 \"내가 그의 마음을 완악하게 하리니\"(출 4:21)라고 미리 말씀하십니다.","s":164.844,"e":173.436,"p":false,"h":false},{"t":"그런데 재앙 이야기가 진행되면 본문은 바로의 마음이 완악해졌다고 말하고, 바로가 스스로 마음을 완악하게 했다고도 말하며(8:15, 32; 9:34), 하나님이 그의 마음을 완악하게 하셨다고도 말합니다(9:12; 10:1).","s":174.096,"e":193.312,"p":false,"h":false},{"t":"대체로 서사 앞부분에서는 바로 쪽의 완악함이 먼저 나오고, 뒤로 갈수록 하나님이 하신 일로 서술되는 비중이 커집니다.","s":193.896,"e":201.847,"p":false,"h":false},{"t":"이 순서를 두고 학자들은 하나님의 굳히심이 바로의 거부를 확정하는 방식으로 이루어졌다고 읽어 왔습니다.","s":202.5,"e":209.354,"p":false,"h":false},{"t":"다만 본문은 이 관계를 철학적으로 설명하지 않습니다.","s":210.024,"e":213.78,"p":false,"h":false},{"t":"두 문장을 나란히 놓고 이야기를 계속할 뿐입니다.","s":214.416,"e":217.819,"p":true,"h":false},{"t":"세 가지 이해","s":218.916,"e":219.979,"p":false,"h":true},{"t":"전통은 이 긴장을 몇 가지로 풀어 왔습니다.","s":221.076,"e":224.08,"p":false,"h":false},{"t":"공정하게 소개하겠습니다.","s":224.676,"e":226.583,"p":true,"h":false},{"t":"개혁주의 전통은 하나님의 굳히심을 실제로 하나님이 하시는 일로 인정하면서, 그것을 심판적인 행위로 이해합니다.","s":227.664,"e":235.382,"p":false,"h":false},{"t":"이미 거부하는 죄인에게 하나님이 은혜를 거두시고 그 마음이 스스로 향하던 방향으로 더 굳어지게 두시는 것입니다.","s":236.016,"e":243.584,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서는 하나님이 죄의 조성자가 아니시고 피조물의 의지에 폭력이 가해지는 것도 아니라고 하면서(3장), 의로운 재판관이신 하나님이 이전의 죄 때문에 눈을 멀게 하시고 마음을 완고하게 하신다고 말합니다(5장).","s":244.188,"e":260.89,"p":false,"h":false},{"t":"칼뱅도 이 일을 단순한 허용으로만 설명하는 것은 부족하다고 보면서도, 죄책은 어디까지나 죄인에게 있다고 했습니다.","s":261.432,"e":269.186,"p":false,"h":false},{"t":"이 입장의 강점은 하나님의 주권을 본문이 말하는 만큼 진지하게 받는다는 점이고, 약점은 주권과 죄책의 접점을 끝내 설명하지 못한다는 점입니다.","s":269.82,"e":279.822,"p":true,"h":false},{"t":"다른 입장은 완고함이 먼저 사람 쪽에서 시작되고 하나님의 굳히심은 그 거부에 대한 응답이라고 봅니다.","s":280.836,"e":287.802,"p":false,"h":false},{"t":"하나님이 미리 아신 거부에 따라 일하신다는 이해입니다.","s":288.468,"e":292.238,"p":false,"h":false},{"t":"이 입장은 하나님의 공정성과 사람의 책임을 분명히 지키지만, 출애굽기 4장 21절처럼 하나님이 먼저 말씀하시는 본문과 부딪히고, 굳어짐이 하나님의 목적 안에 있다는 로마서 9장의 논지를 약하게 만든다는 비판을 받습니다.","s":292.86,"e":308.314,"p":true,"h":false},{"t":"세 번째는 이 일을 개인의 구원 문제보다 구속사의 흐름 안에서 읽습니다.","s":309.42,"e":314.567,"p":false,"h":false},{"t":"이스라엘의 굳어짐은 하나님의 계획 안에서 일정한 기간 동안 일어나는 일이며 목적이 있다고 봅니다.","s":315.108,"e":321.7,"p":false,"h":false},{"t":"바울이 로마서 11장에서 이스라엘의 일부가 우둔하게 된 것이 이방인의 충만한 수가 들어오기까지라고 한 것이 대표적입니다.","s":322.344,"e":330.373,"p":false,"h":false},{"t":"이 이해는 앞의 두 입장과 배타적이지 않아서 개혁주의 쪽에서도 함께 받아들이는 경우가 많습니다.","s":331.02,"e":338.006,"p":true,"h":false},{"t":"신약은 두 말을 그대로 둡니다","s":339.084,"e":341.321,"p":false,"h":true},{"t":"흥미롭게도 신약 저자들 자신이 이 긴장을 정리하지 않고 그대로 인용합니다.","s":342.54,"e":348.073,"p":false,"h":false},{"t":"마태복음 13장 15절은 70인역 이사야를 따라 \"이 백성의 마음이 둔해졌다\"는 형태로 인용합니다.","s":348.372,"e":355.375,"p":false,"h":false},{"t":"백성의 상태를 기술하는 문장입니다.","s":356.004,"e":358.646,"p":false,"h":false},{"t":"반면 요한복음 12장 40절은 \"그가 그들의 눈을 멀게 하시고 그 마음을 굳게 하셨다\"는 형태로 하나님을 주체로 세웁니다.","s":359.28,"e":367.574,"p":false,"h":false},{"t":"같은 구절이 한쪽에서는 상태로, 다른 쪽에서는 하나님의 행하심으로 읽힌 것입니다.","s":368.172,"e":373.965,"p":false,"h":false},{"t":"그리고 요한은 바로 앞 절에서 \"그들이 믿지 아니하니\"(12:37)라고 책임도 적습니다.","s":374.58,"e":381.611,"p":true,"h":false},{"t":"바울은 로마서 9장에서 이 문제의 정면에 섭니다.","s":382.716,"e":386.187,"p":false,"h":false},{"t":"하나님이 하고자 하시는 자를 긍휼히 여기시고 하고자 하시는 자를 완악하게 하신다고 말한 뒤(9:18), 곧바로 \"그러면 어찌하여 여전히 허물하시느냐 누가 그 뜻을 대적하느냐\"(9:19) 하는 반문을 스스로 꺼냅니다.","s":386.784,"e":403.026,"p":false,"h":false},{"t":"그리고 그 물음에 논리로 답하지 않고 \"이 사람아 네가 누구기에 하나님께 반문하느냐\"(9:20)로 응수합니다.","s":403.704,"e":412.292,"p":false,"h":false},{"t":"이것을 회피로 읽는 사람도 있으나, 바울은 반문 자체를 받아들이면서 이 물음이 서 있는 자리가 피조물의 자리임을 상기시키는 것으로 읽는 편이 낫습니다.","s":412.92,"e":423.124,"p":false,"h":false},{"t":"그리고 11장 32절에서 방향을 돌립니다.","s":423.396,"e":426.786,"p":false,"h":false},{"t":"하나님이 모든 사람을 순종하지 않는 가운데 가두어 두신 것은 모든 사람에게 긍휼을 베풀려 하심이라는 것입니다.","s":427.32,"e":434.314,"p":false,"h":false},{"t":"굳힘의 끝에 긍휼이 있다는 선언입니다.","s":434.952,"e":437.595,"p":true,"h":false},{"t":"63장 17절: 이 말을 하는 사람은 누구인가","s":438.624,"e":442.689,"p":false,"h":true},{"t":"이제 처음에 함께 놓은 또 하나의 본문으로 돌아가겠습니다.","s":443.88,"e":447.534,"p":false,"h":false},{"t":"이사야 63장 17절은 이렇게 기도합니다.","s":448.164,"e":451.64,"p":false,"h":false},{"t":"\"여호와여 어찌하여 우리로 주의 길에서 떠나게 하시며 우리 마음을 완고하게 하사 주를 경외하지 아니하게 하시나이까 주의 종들 곧 주의 기업의 지파들을 위하여 돌아오소서.\"","s":452.304,"e":463.01,"p":true,"h":false},{"t":"이 구절은 6장 10절과 짝을 이루는 것처럼 보입니다.","s":464.076,"e":467.745,"p":false,"h":false},{"t":"하나님이 마음을 완고하게 하신다는 말이 여기서는 백성의 입에서 나옵니다.","s":468.396,"e":473.056,"p":false,"h":false},{"t":"그런데 말하는 방식이 중요합니다.","s":473.724,"e":476.071,"p":false,"h":false},{"t":"이것은 책임을 하나님께 돌리며 자신을 변호하는 말이 아닙니다.","s":476.604,"e":480.803,"p":false,"h":false},{"t":"같은 기도의 64장 5절부터 7절은 우리가 범죄하였고 주의 이름을 부르는 자가 없으며 우리 죄악이 우리를 바람같이 몰아갔다고 고백합니다.","s":481.356,"e":491.284,"p":false,"h":false},{"t":"이 백성은 자신의 죄를 인정하면서, 동시에 자기 힘으로는 돌이킬 수 없다는 무력함을 하나님 앞에 내놓습니다.","s":491.904,"e":499.422,"p":false,"h":false},{"t":"그리고 그 무력함을 근거로 \"돌아오소서\" 하고 구합니다.","s":500.04,"e":503.831,"p":true,"h":false},{"t":"여기서 이 교리가 어떤 자리에서 말해지는지가 드러납니다.","s":504.9,"e":508.655,"p":false,"h":false},{"t":"하나님이 마음을 굳히신다는 말은 이사야서에서 한 번도 백성이 자기 변명으로 쓰는 말로 나오지 않습니다.","s":509.292,"e":515.809,"p":false,"h":false},{"t":"그것은 선지자에게 맡겨진 선고이고, 회개하는 자가 무력함을 고백하며 드리는 기도입니다.","s":516.42,"e":522.739,"p":false,"h":false},{"t":"책임을 피하려는 사람은 \"하나님이 굳히셨으니 어쩔 수 없다\"고 말하지만, 이사야서의 이 말은 오히려 \"우리는 스스로 돌이킬 수 없으니 주께서 돌이켜 주소서\"라고 말하는 쪽에 쓰입니다.","s":523.368,"e":535.328,"p":true,"h":false},{"t":"본문이 멈추는 곳","s":536.4,"e":537.906,"p":false,"h":true},{"t":"정리하겠습니다.","s":538.956,"e":540.26,"p":false,"h":false},{"t":"이사야서는 완고함의 주체가 하나님이시라고 말하고, 백성이라고도 말합니다.","s":540.864,"e":546.221,"p":false,"h":false},{"t":"어느 한쪽을 지워서 다른 쪽을 매끄럽게 만들지 않습니다.","s":546.876,"e":550.811,"p":false,"h":false},{"t":"본문이 분명히 하는 것은 몇 가지입니다.","s":551.412,"e":554.023,"p":false,"h":false},{"t":"굳히심은 이미 거부하는 백성에게 내려지는 심판의 성격을 띱니다.","s":554.652,"e":559.144,"p":false,"h":false},{"t":"그 굳어짐은 영원한 것이 아니라 \"어느 때까지니이까\"(6:11)에 답이 있는 시한과 그루터기를 가진 것입니다.","s":559.728,"e":567.847,"p":false,"h":false},{"t":"그리고 사람의 책임은 그 어디에서도 면제되지 않습니다.","s":568.512,"e":572.47,"p":true,"h":false},{"t":"본문이 하지 않는 일도 분명합니다.","s":573.228,"e":575.649,"p":false,"h":false},{"t":"하나님의 주권과 사람의 책임이 어떤 방식으로 하나가 되는지를 설명하지 않습니다.","s":576.252,"e":581.522,"p":false,"h":false},{"t":"저는 이 침묵이 본문의 미완이 아니라 의도라고 읽습니다.","s":582.156,"e":586.024,"p":false,"h":false},{"t":"설명하는 순간 둘 중 하나를 깎아야 하기 때문입니다.","s":586.656,"e":590.211,"p":false,"h":false},{"t":"주권을 깎으면 하나님이 역사의 주인이 아니게 되고, 책임을 깎으면 백성의 죄가 변명거리가 됩니다.","s":590.832,"e":597.677,"p":false,"h":false},{"t":"성경은 둘 다 세워 둔 채로 우리에게 이 자리에서 무엇을 하라고 말합니다.","s":598.32,"e":603.298,"p":false,"h":false},{"t":"바로 앞의 63장 17절처럼 부르짖으라는 것입니다.","s":603.936,"e":607.909,"p":true,"h":false},{"t":"이것은 판단의 문제이므로 구분해 두겠습니다.","s":609.012,"e":612.088,"p":false,"h":false},{"t":"위에서 소개한 세 이해 가운데 어느 것이 옳은지는 신학 전통마다 다르게 답해 왔고, 저는 개혁주의의 심판적 굳힘 이해가 본문 전체와 가장 잘 어울린다고 보지만 이것이 유일한 읽기는 아닙니다.","s":612.72,"e":626.01,"p":true,"h":false},{"t":"한 가지 실천적 주의도 덧붙이겠습니다.","s":627.12,"e":629.989,"p":false,"h":false},{"t":"이 교리는 남을 진단하는 데 쓰는 도구가 아닙니다.","s":630.54,"e":633.95,"p":false,"h":false},{"t":"6장에서 이사야는 자기도 부정한 입술을 가진 백성 가운데 산다고 고백한 뒤에야 이 말을 맡았습니다.","s":634.572,"e":641.482,"p":false,"h":false},{"t":"누가 굳어졌고 누가 그렇지 않은지를 가려내는 일은 선지자에게도 맡겨지지 않았습니다.","s":642.132,"e":648.01,"p":false,"h":false},{"t":"이 본문이 읽는 사람에게 던지는 것은 \"저들은 왜 저러는가\"가 아니라 \"내 마음은 지금 어디에 있는가\"라는 물음입니다.","s":648.576,"e":656.957,"p":true,"h":false}]},{"title":"3. 약속을 듣고도 왜 돌이키지 않는가","audio":"doc03_2610241127.mp3","dur":730.7,"segs":[{"t":"약속을 듣고도 왜 돌이키지 않는가: 아하스의 불신과 임마누엘 징조","s":0,"e":5.203,"p":false,"h":true},{"t":"본문: 이사야 7:1-17; 8:1-22; 9:1-7 (함께 읽을 본문: 왕하 16:1-9, 대하 28:16-21, 마 1:18-25)","s":6.3,"e":24.491,"p":true,"h":false},{"t":"앞의 두 글은 물음의 틀을 다루었습니다.","s":25.416,"e":28.16,"p":false,"h":false},{"t":"이번에는 장면으로 들어갑니다.","s":28.8,"e":31.053,"p":false,"h":false},{"t":"이사야 7장은 한 사람의 선택이 나라의 운명을 가르는 역사의 현장입니다.","s":31.68,"e":36.728,"p":false,"h":false},{"t":"왕이 하나님의 약속 앞에 섰고, 그 약속을 받아들이지 않았습니다.","s":37.332,"e":42.187,"p":false,"h":false},{"t":"해설서의 9장에서 느끼셨던 답답함이 사실은 여기서 시작됩니다.","s":42.84,"e":47.302,"p":false,"h":false},{"t":"9장의 백성이 돌이키지 않는 것은 갑자기 생긴 일이 아니라, 7장에서 왕이 먼저 보인 모습이 백성 전체로 퍼진 결과입니다.","s":47.952,"e":55.996,"p":true,"h":false},{"t":"위기의 장면","s":57.096,"e":58.264,"p":false,"h":true},{"t":"때는 주전 735년경입니다.","s":59.112,"e":61.943,"p":false,"h":false},{"t":"북쪽에서는 앗수르가 세력을 넓히고 있었고, 이에 맞서려고 아람 왕 르신과 북이스라엘 왕 베가가 동맹을 맺었습니다.","s":62.424,"e":70.693,"p":false,"h":false},{"t":"두 나라는 남쪽 유다에도 동맹에 가담하라고 압박했고, 유다 왕 아하스가 거절하자 군대를 이끌고 쳐내려와 그를 폐위하고 다른 사람을 왕으로 세우려 했습니다(7:6).","s":71.316,"e":83.422,"p":false,"h":false},{"t":"본문은 이때 아하스와 백성의 마음이 \"수풀이 바람에 흔들림 같았다\"(7:2)고 적습니다.","s":83.736,"e":91.201,"p":true,"h":false},{"t":"그 한복판에서 하나님은 이사야를 보내십니다.","s":92.34,"e":95.568,"p":false,"h":false},{"t":"그리고 아들 스알야숩을 데려가라고 하십니다.","s":96.12,"e":99.107,"p":false,"h":false},{"t":"이름의 뜻이 \"남은 자가 돌아오리라\"입니다.","s":99.756,"e":102.959,"p":false,"h":false},{"t":"이사야는 아들의 이름을 앞세워 왕을 만나러 갑니다.","s":103.608,"e":107.064,"p":false,"h":false},{"t":"설교보다 먼저 그 이름이 메시지의 절반을 말하고 있었던 셈입니다.","s":107.64,"e":111.981,"p":false,"h":false},{"t":"장소도 눈여겨볼 만합니다.","s":112.644,"e":114.685,"p":false,"h":false},{"t":"윗못 수도 끝, 곧 성이 포위될 때를 대비해 물을 확보하려고 점검하던 자리입니다.","s":115.308,"e":121.502,"p":false,"h":false},{"t":"왕은 하나님을 의지하는 대신 물 걱정을 하고 있었습니다.","s":122.148,"e":125.853,"p":true,"h":false},{"t":"약속의 내용: 두려워하지 말라","s":126.936,"e":129.662,"p":false,"h":true},{"t":"이사야가 전한 말은 위로입니다.","s":130.824,"e":133.116,"p":false,"h":false},{"t":"\"삼가며 조용하라 두려워하지 말라 이 연기 나는 두 부지깽이 그루터기 때문에 낙심하지 말라\"(7:4).","s":133.74,"e":140.734,"p":false,"h":false},{"t":"르신과 베가를 하나님은 다 타고 연기만 나는 부지깽이 토막이라고 부르십니다.","s":141.3,"e":146.359,"p":false,"h":false},{"t":"위협처럼 보이지만 이미 끝난 세력이라는 말입니다.","s":146.988,"e":150.578,"p":false,"h":false},{"t":"그들의 계획은 서지 못할 것이라는 약속이 이어집니다(7:7).","s":151.164,"e":156.219,"p":true,"h":false},{"t":"이 약속에는 조건이 하나 붙어 있습니다.","s":157.212,"e":160.003,"p":false,"h":false},{"t":"9절 끝입니다.","s":160.668,"e":161.967,"p":false,"h":false},{"t":"\"너희가 굳게 믿지 아니하면 정녕 굳게 서지 못하리라.\"","s":162.576,"e":166.142,"p":false,"h":false},{"t":"히브리어로 이 구절은 말놀이입니다.","s":166.752,"e":169.457,"p":false,"h":false},{"t":"\"믿다\"와 \"굳게 서다\"가 같은 어근에서 나온 말이어서, 우리말로 하면 \"믿음에 굳게 서지 않으면 굳게 서지 못한다\"에 가깝습니다.","s":169.992,"e":178.852,"p":false,"h":false},{"t":"나라가 서는가는 군사력이나 동맹이 아니라 하나님을 믿는가에 달려 있다는 선언입니다.","s":179.532,"e":185.087,"p":true,"h":false},{"t":"징조를 구하라는 초대와 거절","s":186.156,"e":188.376,"p":false,"h":true},{"t":"여기서 가장 이상한 장면이 나옵니다.","s":189.468,"e":192.085,"p":false,"h":false},{"t":"하나님은 아하스에게 직접 말씀하십니다.","s":192.744,"e":195.711,"p":false,"h":false},{"t":"\"너는 너의 하나님 여호와께 징조를 구하되 깊은 데서든지 높은 데서든지 구하라\"(7:11).","s":196.344,"e":203.072,"p":false,"h":false},{"t":"무엇이든 구하라는 백지 위임입니다.","s":203.616,"e":206.4,"p":false,"h":false},{"t":"믿기 어려운 왕에게 하나님이 믿음을 도울 수단까지 먼저 내미신 것입니다.","s":207.072,"e":211.881,"p":true,"h":false},{"t":"아하스는 이렇게 답합니다.","s":213.012,"e":215.015,"p":false,"h":false},{"t":"\"나는 구하지 아니하겠나이다 나는 여호와를 시험하지 아니하겠나이다\"(7:12).","s":215.64,"e":221.57,"p":false,"h":false},{"t":"겉으로는 신앙 깊은 말입니다.","s":222.156,"e":224.409,"p":false,"h":false},{"t":"신명기 6장 16절의 \"시험하지 말라\"를 인용한 듯 들립니다.","s":224.712,"e":228.899,"p":false,"h":false},{"t":"그러나 하나님이 먼저 구하라고 하신 것을 거절하면서 그 말을 쓰는 것은 경건이 아니라 불순종입니다.","s":229.572,"e":236.153,"p":false,"h":false},{"t":"이사야가 곧바로 \"너희가 사람을 괴롭게 하는 것을 작은 일로 여겨서 내 하나님도 괴롭게 하려느냐\"(7:13)고 책망하는 이유가 여기 있습니다.","s":236.772,"e":247.203,"p":false,"h":false},{"t":"앞 장에서 다룬 물음이 여기서 장면으로 나타납니다.","s":247.824,"e":251.227,"p":false,"h":false},{"t":"하나님의 편에서 길은 열려 있었고, 왕의 마음이 그 길을 거절했습니다.","s":251.856,"e":256.981,"p":true,"h":false},{"t":"왜 거절했을까요.","s":258.084,"e":259.608,"p":false,"h":false},{"t":"본문이 직접 이유를 말하지는 않지만, 역사서가 단서를 줍니다.","s":260.244,"e":264.772,"p":false,"h":false},{"t":"열왕기하 16장 7절부터 9절과 역대하 28장 16절 이하에 따르면 아하스는 이미 앗수르 왕 디글랏빌레셀에게 사람을 보내 도움을 청하기로 마음을 정했고, 성전과 왕궁의 은금을 예물로 바쳤습니다.","s":265.392,"e":279.722,"p":false,"h":false},{"t":"하나님의 징조를 받아들이면 이미 세워 둔 정치 계획을 접어야 합니다.","s":280.368,"e":285.051,"p":false,"h":false},{"t":"그는 하나님의 약속이 필요 없어서가 아니라, 약속을 받으면 자기 계획을 포기해야 해서 거절한 것입니다.","s":285.336,"e":292.301,"p":false,"h":false},{"t":"이는 어디까지나 본문 정황에서 읽어 낸 추론이지만, 7장과 8장이 앗수르를 의지하는 일을 강하게 책망하는 점(7:17-20; 8:5-8)과도 맞아떨어집니다.","s":292.968,"e":306.399,"p":true,"h":false},{"t":"임마누엘 징조","s":307.512,"e":308.787,"p":false,"h":true},{"t":"아하스가 구하지 않자 하나님은 스스로 징조를 주십니다.","s":309.888,"e":313.763,"p":false,"h":false},{"t":"\"보라 처녀가 잉태하여 아들을 낳을 것이요 그 이름을 임마누엘이라 하리라\"(7:14).","s":314.388,"e":320.469,"p":false,"h":false},{"t":"이 구절은 이사야서에서 가장 많이 논의된 본문 가운데 하나여서, 읽는 방식을 정직하게 나누어 소개해야 합니다.","s":321.12,"e":328.65,"p":true,"h":false},{"t":"첫째 쟁점은 \"처녀\"로 옮긴 히브리어 알마입니다.","s":329.76,"e":333.229,"p":false,"h":false},{"t":"이 말은 결혼하지 않은 젊은 여성을 가리키는 말로, 성적 순결을 뜻하는 베툴라와 구별된다는 점이 자주 지적됩니다.","s":333.864,"e":341.758,"p":false,"h":false},{"t":"그러나 구약에서 알마가 쓰인 곳은 리브가(창 24:43)처럼 문맥상 처녀인 경우가 많아서, 이 말이 처녀를 배제한다고 단정하기도 어렵습니다.","s":342.396,"e":354.101,"p":false,"h":false},{"t":"70인역은 이 말을 파르테노스(처녀)로 옮겼고, 마태는 이 번역을 따라 예수님의 탄생에 적용했습니다(마 1:23).","s":354.672,"e":366.182,"p":true,"h":false},{"t":"둘째 쟁점은 이 징조가 누구를 가리키는가입니다.","s":367.2,"e":370.729,"p":false,"h":false},{"t":"크게 세 가지 읽기가 있습니다.","s":371.376,"e":373.557,"p":true,"h":false},{"t":"하나는 당대의 인물, 곧 아하스의 아내나 이사야의 아내가 낳을 아이로 보는 읽기입니다.","s":374.616,"e":380.968,"p":false,"h":false},{"t":"이 해석은 8장 3절에서 이사야의 아들 마헬살랄하스바스가 태어나는 것과 이어 보고, 이 아이가 자라 선악을 알기 전에 아람과 이스라엘이 멸망한다는 7장 16절의 시한과 잘 맞는다는 점을 강점으로 삼습니다.","s":381.6,"e":395.43,"p":true,"h":false},{"t":"다른 하나는 오직 예수 그리스도만을 가리킨다고 보는 읽기입니다.","s":396.54,"e":400.76,"p":false,"h":false},{"t":"이 해석은 마태복음의 인용과 \"처녀\"라는 표현의 무게를 강점으로 삼고, 당대의 아하스에게 이 징조가 어떤 의미였는지를 설명하기 어렵다는 점이 약점으로 지적됩니다.","s":401.4,"e":412.82,"p":true,"h":false},{"t":"세 번째는 이중 성취 혹은 모형론적 읽기입니다.","s":413.892,"e":417.497,"p":false,"h":false},{"t":"이사야 당대에 한 아이가 태어나는 것이 실제 징조였고, 그것은 더 큰 임마누엘, 곧 하나님이 참으로 우리와 함께 계신 사건을 미리 보여 주는 그림이었다고 봅니다.","s":418.068,"e":429.396,"p":false,"h":false},{"t":"많은 개혁주의 학자들이 이 입장을 취하며, 저도 본문의 구조와 신약의 인용을 가장 균형 있게 설명한다고 봅니다.","s":430.056,"e":437.816,"p":false,"h":false},{"t":"다만 이는 제 판단이고, 학자들 사이에서 합의된 것은 아닙니다.","s":438.444,"e":443.226,"p":true,"h":false},{"t":"어느 읽기를 택하든 흔들리지 않는 것이 있습니다.","s":444.348,"e":447.413,"p":false,"h":false},{"t":"이름의 뜻입니다.","s":447.984,"e":449.264,"p":false,"h":false},{"t":"임마누엘, 곧 \"하나님이 우리와 함께 계신다\"는 말은 이 위기에서 아하스가 가장 필요로 한 것이었고, 그가 거절한 것이 바로 이것이었습니다.","s":449.892,"e":459.887,"p":false,"h":false},{"t":"징조의 내용은 곧 \"너는 앗수르와 함께 있으려 하지만, 내가 너와 함께 있다\"는 선언입니다.","s":460.548,"e":466.839,"p":true,"h":false},{"t":"거절의 결과: 물은 이쪽으로 흘러옵니다","s":467.964,"e":471.481,"p":false,"h":true},{"t":"하나님의 약속을 거절한 결과는 7장 17절부터 20절에 나옵니다.","s":472.644,"e":477.504,"p":false,"h":false},{"t":"아하스가 의지한 앗수르가 도리어 유다에 임하는 심판의 도구가 된다는 것입니다.","s":478.116,"e":483.185,"p":false,"h":false},{"t":"8장 6절과 7절은 이 일을 물에 비유합니다.","s":483.84,"e":487.335,"p":false,"h":false},{"t":"백성이 실로아의 잔잔히 흐르는 물, 곧 하나님이 주신 조용한 도움을 싫어하고 르신과 베가를 기뻐하였으므로, 주께서 앗수르 왕의 강하고 큰 물을 그들 위에 넘치게 하시리라는 것입니다.","s":487.98,"e":500.615,"p":false,"h":false},{"t":"이 물이 \"임마누엘이여, 그 펼친 날개가 네 땅에 가득하리라\"는 말로 끝나는 점이 인상적입니다.","s":501.3,"e":507.956,"p":false,"h":false},{"t":"심판의 물결 속에서도 땅은 여전히 임마누엘의 땅입니다.","s":508.572,"e":512.737,"p":true,"h":false},{"t":"8장: 두려움의 두 방향","s":513.72,"e":516.358,"p":false,"h":true},{"t":"왕이 거절한 뒤 백성은 어떻게 반응했을까요.","s":517.5,"e":520.788,"p":false,"h":false},{"t":"8장 11절부터 15절이 이를 보여 줍니다.","s":521.424,"e":524.702,"p":false,"h":false},{"t":"하나님은 이사야에게 이 백성이 두려워하는 것을 두려워하지 말고 만군의 여호와만을 거룩하게 여기라고 하십니다.","s":525.348,"e":532.22,"p":false,"h":false},{"t":"그러면 그분이 성소가 되실 것이나, 이스라엘 두 집에게는 걸려 넘어지는 돌과 걸림 바위가 되실 것이라고 합니다.","s":532.872,"e":540.382,"p":false,"h":false},{"t":"같은 하나님이 믿는 자에게는 피난처이고 믿지 않는 자에게는 장애물이 됩니다.","s":541.008,"e":545.976,"p":true,"h":false},{"t":"이어서 백성은 문제 앞에서 신접한 자와 박수에게 가서 묻습니다(8:19).","s":547.02,"e":552.866,"p":false,"h":false},{"t":"이사야는 이에 대해 \"백성이 자기 하나님께 구할 것이 아니냐\"고 되묻고, 율법과 증거의 말씀으로 가라고 합니다(8:19-20).","s":553.464,"e":563.242,"p":false,"h":false},{"t":"그 말씀을 따르지 않는 자에게는 새벽빛이 없다고 합니다.","s":563.832,"e":567.649,"p":false,"h":false},{"t":"6장에서 닫힌 마음이 7장에서 왕의 선택으로 나타났고, 8장에서 백성의 생활 방식이 되었습니다.","s":568.224,"e":574.996,"p":false,"h":false},{"t":"해설서의 9장은 그 끝에 서 있습니다.","s":575.64,"e":578.375,"p":true,"h":false},{"t":"빛은 바로 그 어둠 속으로 옵니다","s":579.384,"e":581.997,"p":false,"h":true},{"t":"이제 질문의 답에 가까워집니다.","s":583.164,"e":585.47,"p":false,"h":false},{"t":"이 약속을 듣고도 왜 돌이키지 않는가.","s":586.152,"e":588.907,"p":false,"h":false},{"t":"본문이 보여 주는 이유는 세 가지입니다.","s":589.536,"e":592.218,"p":true,"h":false},{"t":"하나는 약속을 받아들이면 포기해야 할 것이 있기 때문입니다.","s":593.316,"e":597.197,"p":false,"h":false},{"t":"아하스에게 약속은 위로이기 전에 요구였습니다.","s":597.744,"e":601.097,"p":false,"h":false},{"t":"자기 계획과 동맹과 계산을 내려놓으라는 요구입니다.","s":601.74,"e":605.319,"p":false,"h":false},{"t":"하나님의 약속을 믿는 일은 언제나 다른 안전장치를 내려놓는 일을 포함합니다.","s":605.952,"e":611.274,"p":true,"h":false},{"t":"다음은 하나님의 도움이 너무 조용해 보이기 때문입니다.","s":612.324,"e":615.934,"p":false,"h":false},{"t":"실로아의 잔잔한 물은 앗수르의 큰 강 앞에서 초라하게 보였습니다.","s":616.572,"e":620.879,"p":false,"h":false},{"t":"하나님의 약속은 대개 군사 동맹처럼 눈에 보이는 힘으로 오지 않습니다.","s":621.54,"e":626.407,"p":false,"h":false},{"t":"한 아기의 모습으로 옵니다.","s":627.012,"e":628.952,"p":false,"h":false},{"t":"두려움에 사로잡힌 사람에게는 이것이 터무니없이 약해 보입니다.","s":629.28,"e":633.608,"p":true,"h":false},{"t":"마지막은 두려움이 믿음의 자리를 대신 차지하기 때문입니다.","s":634.68,"e":638.753,"p":false,"h":false},{"t":"\"수풀이 바람에 흔들림 같았다\"는 묘사는 한 번의 불신이 아니라 상태를 말합니다.","s":639.36,"e":644.745,"p":false,"h":false},{"t":"두려움이 마음을 채우면 약속이 들어올 자리가 없어집니다.","s":645.372,"e":649.204,"p":true,"h":false},{"t":"그런데 이 어둠의 기록 끝에 9장이 옵니다.","s":650.304,"e":653.295,"p":false,"h":false},{"t":"8장 22절은 환난과 흑암과 우거진 어둠으로 끝나는데, 9장 1절은 \"그러나\"로 시작합니다.","s":653.94,"e":660.908,"p":false,"h":false},{"t":"하나님이 아하스에게 주려 하셨던 임마누엘이 이제는 왕의 거절과 상관없이 약속으로 확정됩니다.","s":661.572,"e":667.839,"p":false,"h":false},{"t":"하나님은 구하지 않은 자에게도 징조를 주셨고, 받지 않으려는 자에게도 아기를 주십니다.","s":668.448,"e":674.351,"p":false,"h":false},{"t":"약속을 붙드는 일이 사람의 믿음에 달려 있다면 7장에서 끝났을 것입니다.","s":675,"e":679.91,"p":false,"h":false},{"t":"약속이 이어지는 것은 그것이 하나님의 열심에 달려 있기 때문입니다(9:7).","s":680.544,"e":686.503,"p":true,"h":false},{"t":"이 장면이 오늘에 남기는 것","s":687.528,"e":689.474,"p":false,"h":true},{"t":"아하스의 이야기는 불신앙을 가르치는 이야기라기보다, 믿음이 어디서 갈리는지를 보여 주는 이야기입니다.","s":690.516,"e":697.863,"p":false,"h":false},{"t":"그는 하나님을 모르지 않았고, 이사야를 만났고, 말씀을 들었으며, 징조까지 제안받았습니다.","s":698.508,"e":705.939,"p":false,"h":false},{"t":"부족했던 것은 정보가 아니라 내려놓음이었습니다.","s":706.572,"e":710.078,"p":true,"h":false},{"t":"신앙이 흔들릴 때 우리는 대개 하나님이 충분히 말씀하지 않으셨다고 느끼지만, 본문은 오히려 말씀은 충분했고 붙들던 것을 놓기가 어려웠음을 보여 줍니다.","s":711.216,"e":721.563,"p":false,"h":false},{"t":"그리고 그 자리에서도 하나님이 함께하시겠다는 선언을 거두지 않으신다는 것이 이 이야기의 가장 깊은 위로입니다.","s":722.196,"e":729.647,"p":true,"h":false}]},{"title":"4. 남은 자는 왜 있으며 무엇을 위한 것인가","audio":"doc04_2610241127.mp3","dur":658,"segs":[{"t":"남은 자는 왜 있으며, 무엇을 위한 것인가: 약속이 살아서 이어지는 방식","s":0,"e":6.143,"p":false,"h":true},{"t":"본문: 이사야 1:9; 4:2-6; 6:13; 7:3; 10:20-23; 11:11, 16; 37:30-32 (함께 읽을 본문: 창 6~9장, 왕상 19:14-18, 롬 9:27-29, 11:1-6)","s":7.272,"e":34.376,"p":true,"h":false},{"t":"앞의 세 글에서 우리는 이사야의 사명이 증언이라는 것, 완고함에 주권과 책임이 함께 놓여 있다는 것, 왕이 약속을 거절한 자리에서도 임마누엘이 확정된다는 것을 보았습니다.","s":35.208,"e":46.985,"p":false,"h":false},{"t":"이제 남은 물음이 하나 있습니다.","s":47.556,"e":49.734,"p":false,"h":false},{"t":"나라가 무너지고 백성이 돌이키지 않는다면, 약속은 도대체 누구에게 이어지는가 하는 것입니다.","s":50.364,"e":56.696,"p":false,"h":false},{"t":"이사야서의 대답이 \"남은 자\"입니다.","s":57.312,"e":60.243,"p":false,"h":false},{"t":"이 말은 이사야서를 읽는 사람에게 위로로 들리기도 하고, 선택에서 빠진 사람들을 생각하면 불편하게도 들립니다.","s":60.912,"e":68.505,"p":false,"h":false},{"t":"둘 다 정직하게 다루어야 합니다.","s":69.156,"e":71.495,"p":true,"h":false},{"t":"말이 처음 나오는 자리들","s":72.612,"e":74.526,"p":false,"h":true},{"t":"\"남은 자\"는 이사야가 만든 말이 아닙니다.","s":75.6,"e":78.603,"p":false,"h":false},{"t":"노아의 홍수 때 방주에 든 사람들, 엘리야 시대에 바알에게 무릎 꿇지 않은 칠천 명(왕상 19:18)처럼, 성경은 심판이 닥칠 때마다 남겨진 사람들을 말해 왔습니다.","s":79.236,"e":92.441,"p":false,"h":false},{"t":"이사야는 이 오래된 생각을 책 전체의 뼈대로 끌어올립니다.","s":93.06,"e":97.35,"p":true,"h":false},{"t":"이사야서에서 이 주제는 처음부터 끝까지 깔려 있습니다.","s":98.424,"e":102.276,"p":false,"h":false},{"t":"1장 9절은 만군의 여호와께서 생존자를 조금 남겨 두지 않으셨더라면 우리가 소돔 같고 고모라 같았으리라고 말합니다.","s":102.888,"e":110.891,"p":false,"h":false},{"t":"6장 13절은 소명 기사의 마지막에서 베임을 당한 나무의 그루터기를 말하고, 그것을 \"거룩한 씨\"라고 부릅니다.","s":111.528,"e":119.259,"p":false,"h":false},{"t":"7장에서는 이사야가 아하스를 만나러 가며 아들 스알야숩을 데려갑니다.","s":119.916,"e":125.122,"p":false,"h":false},{"t":"앞에서 보았듯 그 이름이 \"남은 자가 돌아오리라\"입니다.","s":125.784,"e":129.612,"p":false,"h":false},{"t":"이 이름에는 날카로운 양면이 있습니다.","s":130.248,"e":132.938,"p":false,"h":false},{"t":"돌아오는 자가 있다는 것은 위로이지만, 남은 자만 돌아온다는 것은 나머지는 돌아오지 못한다는 경고입니다.","s":133.272,"e":140.339,"p":false,"h":false},{"t":"이사야는 한 아들의 이름 속에 심판과 희망을 함께 담아 걸어 다닌 셈입니다.","s":141.012,"e":146.021,"p":true,"h":false},{"t":"남은 자는 누구인가","s":147.096,"e":148.763,"p":false,"h":true},{"t":"가장 먼저 짚어야 할 것은, 남은 자가 자격을 갖춘 소수가 아니라는 점입니다.","s":149.94,"e":155.356,"p":false,"h":false},{"t":"10장 20절부터 23절은 남은 자가 \"이스라엘의 남은 자와 야곱 족속 중 피난한 자\"이며 그들이 \"진실하게 여호와를 의지\"하리라고 말합니다.","s":156.024,"e":165.891,"p":false,"h":false},{"t":"그러나 같은 대목에서 이스라엘 백성이 바다의 모래 같을지라도 돌아오는 자는 남은 자뿐이라고 하며, 멸망이 작정되었다고 합니다.","s":166.464,"e":174.936,"p":false,"h":false},{"t":"여기서 중요한 것은 순서입니다.","s":175.608,"e":177.898,"p":false,"h":false},{"t":"남은 자는 의로워서 살아남은 사람들이 아니라, 심판을 통과해 \"피난한 자\"가 된 사람들입니다.","s":178.452,"e":185.208,"p":false,"h":false},{"t":"1장 9절도 이 생존을 사람의 공로가 아니라 하나님이 남겨 두신 결과로 말합니다.","s":185.868,"e":191.171,"p":false,"h":false},{"t":"하나님이 남기셨기에 남았다는 것입니다.","s":191.736,"e":194.479,"p":true,"h":false},{"t":"바울이 로마서 11장 1절부터 6절에서 같은 이해를 확인합니다.","s":195.516,"e":200.093,"p":false,"h":false},{"t":"엘리야는 자기만 남았다고 탄식했으나 하나님은 칠천 명을 남겨 두셨다고 하시며, 바울은 이 남은 자가 \"은혜로 택하심을 따라\" 있다고 말합니다.","s":200.736,"e":209.967,"p":false,"h":false},{"t":"행위로 되면 은혜가 아니라는 것입니다.","s":210.528,"e":213.125,"p":false,"h":false},{"t":"남은 자는 상을 받은 사람들이 아니라 은혜의 증거입니다.","s":213.768,"e":217.758,"p":true,"h":false},{"t":"남은 자는 무엇을 위해 있는가","s":218.808,"e":221.028,"p":false,"h":true},{"t":"이 질문에 이사야서는 적어도 네 가지로 답합니다.","s":222.156,"e":225.659,"p":true,"h":false},{"t":"첫째, 심판이 철저하되 끝이 아님을 보이기 위해서입니다.","s":226.728,"e":230.863,"p":false,"h":false},{"t":"하나님의 심판은 가벼운 경고가 아닙니다.","s":231.444,"e":234.327,"p":false,"h":false},{"t":"6장은 성읍이 황폐하여 사람이 없을 때까지라고 하고, 10장 23절은 멸망이 \"작정되었다\"고 합니다.","s":234.9,"e":242.27,"p":false,"h":false},{"t":"그러나 그루터기가 있다는 사실이 이 심판을 진노의 폭발이 아니라 목적이 있는 정화로 읽게 합니다.","s":242.928,"e":249.306,"p":false,"h":false},{"t":"이사야 4장 2절부터 4절은 그 정화의 끝을 그립니다.","s":249.948,"e":253.937,"p":false,"h":false},{"t":"여호와의 싹이 아름답고 영화로우며, 시온에 남은 자가 거룩하다 일컬음을 받을 것인데, 이는 주께서 심판의 영과 소멸의 영으로 예루살렘의 피를 씻어 내신 뒤라고 합니다.","s":254.52,"e":266.177,"p":true,"h":false},{"t":"둘째, 약속이 끊기지 않게 하기 위해서입니다.","s":267.3,"e":270.835,"p":false,"h":false},{"t":"하나님이 다윗에게 하신 약속, 아브라함에게 하신 약속은 백성 전체가 무너져도 소멸되지 않아야 합니다.","s":271.476,"e":278.385,"p":false,"h":false},{"t":"그 약속을 맡아 이어 가는 통로가 남은 자입니다.","s":279.036,"e":282.176,"p":false,"h":false},{"t":"이사야서의 가장 아름다운 장면 하나가 여기에 있습니다.","s":282.708,"e":286.375,"p":false,"h":false},{"t":"11장 1절은 이새의 줄기에서 한 싹이 나온다고 합니다.","s":287.028,"e":290.975,"p":false,"h":false},{"t":"나무가 베인 뒤에 줄기가 아니라 그루터기에서 싹이 난다는 그림입니다.","s":291.6,"e":296.184,"p":false,"h":false},{"t":"6장의 그루터기와 9장의 아기와 11장의 싹이 이어집니다.","s":296.856,"e":300.989,"p":false,"h":false},{"t":"남은 자의 이야기는 결국 한 사람, 곧 약속의 중심인 왕에게로 모이는 이야기입니다.","s":301.608,"e":308.227,"p":true,"h":false},{"t":"셋째, 말씀이 보존되게 하기 위해서입니다.","s":309.348,"e":312.821,"p":false,"h":false},{"t":"1번 글에서 보았듯 8장 16절에서 이사야는 증거의 말씀을 제자들 가운데 봉합니다.","s":313.452,"e":319.284,"p":false,"h":false},{"t":"남은 자는 숫자로 세는 집단이기 전에 말씀을 받아 간직한 공동체입니다.","s":319.86,"e":324.853,"p":false,"h":false},{"t":"이사야서가 지금 우리 손에 있다는 사실 자체가 이 사람들이 있었다는 증거입니다.","s":325.512,"e":331.069,"p":true,"h":false},{"t":"넷째, 새로운 시작의 씨앗이 되기 위해서입니다.","s":332.208,"e":335.88,"p":false,"h":false},{"t":"37장 31절과 32절은 앗수르의 위기 속에서 유다 족속 가운데 피난하여 남은 자가 아래로 뿌리를 박고 위로 열매를 맺으리라고 하며, 이를 \"만군의 여호와의 열심이 이루시리라\"로 맺습니다.","s":336.456,"e":350.446,"p":false,"h":false},{"t":"남은 자는 끝의 이름이 아니라 시작의 이름입니다.","s":351.036,"e":354.427,"p":true,"h":false},{"t":"불편한 물음: 남지 못한 사람들은 어떻게 되는가","s":355.176,"e":359.104,"p":false,"h":true},{"t":"이제 앞서 말한 불편함을 마주해야 합니다.","s":360.252,"e":363.108,"p":false,"h":false},{"t":"남은 자가 은혜로 남겨진 사람이라면, 남겨지지 않은 사람들은 어떻게 되는가.","s":363.78,"e":369.123,"p":false,"h":false},{"t":"이 물음 앞에서 두 가지를 구분해 말씀드리겠습니다.","s":369.756,"e":373.223,"p":true,"h":false},{"t":"본문이 분명히 말하는 것이 있습니다.","s":374.328,"e":376.802,"p":false,"h":false},{"t":"심판받는 사람들에게 하나님은 책임을 면제하지 않으십니다.","s":377.388,"e":381.484,"p":false,"h":false},{"t":"이사야서에서 멸망은 변덕이 아니라 5장 포도원 노래가 보여 준 응답입니다.","s":382.104,"e":387.273,"p":false,"h":false},{"t":"기회는 주어졌고 거절되었습니다.","s":387.9,"e":390.532,"p":false,"h":false},{"t":"그리고 이사야서에서 남은 자의 숫자는 위협으로만 쓰이지 않습니다.","s":391.176,"e":395.641,"p":false,"h":false},{"t":"10장 22절은 백성이 모래 같아도 남은 자만 돌아온다고 하지만, 같은 책 후반부로 갈수록 이 경계는 열립니다.","s":396.288,"e":403.935,"p":false,"h":false},{"t":"56장 3절부터 8절은 이방인과 고자도 하나님의 집에 들어올 수 있다고 하고, 66장 18절부터 21절은 열방에서 사람들이 모여든다고 합니다.","s":404.568,"e":415.135,"p":false,"h":false},{"t":"남은 자의 선이 혈통의 선에서 믿음과 은혜의 선으로 옮겨 가는 것입니다.","s":415.8,"e":420.731,"p":true,"h":false},{"t":"한편 본문이 말하지 않는 것도 있습니다.","s":421.776,"e":424.485,"p":false,"h":false},{"t":"개별 사람이 구원받는지 아닌지를 이사야서가 판정해 주지는 않습니다.","s":425.088,"e":429.998,"p":false,"h":false},{"t":"이 책이 말하는 남은 자는 공동체와 역사의 차원에서의 이야기이고, 한 사람 한 사람의 영원한 운명을 이 개념으로 계산해 낼 수 없습니다.","s":430.56,"e":439.775,"p":false,"h":false},{"t":"개혁주의 전통이 예정과 선택을 이 본문들과 연결해 가르쳐 온 것은 사실이고 저도 그 이해가 본문의 방향과 어울린다고 보지만, 이사야서 자체가 그 교리를 정리해 내놓은 것은 아니라는 점은 구분해 두어야 합니다.","s":440.424,"e":454.815,"p":true,"h":false},{"t":"로마서 11장은 이 불편함에 한 가지를 더합니다.","s":455.868,"e":459.497,"p":false,"h":false},{"t":"바울은 이스라엘의 대부분이 굳어진 것이 끝이 아니라고 하며, 이방인의 충만한 수가 들어오고 나서 \"온 이스라엘이 구원을 얻으리라\"(11:26)고 말합니다.","s":460.116,"e":471.771,"p":false,"h":false},{"t":"이 \"온 이스라엘\"이 누구를 가리키는가는 교회사에서 크게 갈립니다.","s":472.392,"e":477.018,"p":false,"h":false},{"t":"민족 이스라엘의 장차 회복으로 보는 읽기, 유대인과 이방인을 아우르는 하나님의 백성 전체로 보는 읽기, 이스라엘 가운데서 시대마다 구원받는 사람들의 총합으로 보는 읽기가 있습니다.","s":477.648,"e":490.042,"p":false,"h":false},{"t":"개혁주의 안에서도 의견이 나뉘는 문제이므로, 이 자리에서 한쪽으로 정리하지 않겠습니다.","s":490.68,"e":496.624,"p":false,"h":false},{"t":"다만 세 읽기 모두 바울이 이 대목을 하나님의 긍휼을 찬양하는 송영(11:33-36)으로 맺었다는 점을 존중합니다.","s":497.304,"e":507.131,"p":true,"h":false},{"t":"남은 자는 어디서 완성되는가","s":508.248,"e":510.538,"p":false,"h":true},{"t":"이사야서가 진행되면서 남은 자의 모습은 점점 한 사람에게 모입니다.","s":511.74,"e":516.721,"p":false,"h":false},{"t":"1~39장의 남은 자는 공동체입니다.","s":517.356,"e":520.609,"p":false,"h":false},{"t":"40~55장에 들어서면 \"종\"이라는 이름이 이스라엘 전체에서 시작해 점점 좁혀져, 마침내 52장 13절부터 53장 12절의 한 사람에게 이릅니다.","s":521.244,"e":532.836,"p":false,"h":false},{"t":"백성이 다 무너졌는데 그 한 분이 백성의 죄를 대신 지십니다.","s":533.412,"e":537.742,"p":false,"h":false},{"t":"그루터기가 더 이상 줄어들 수 없을 만큼 줄어든 자리가 한 사람이라고 읽는 학자들이 있습니다.","s":538.38,"e":544.477,"p":false,"h":false},{"t":"하나님의 일이 소수를 통해 이어진다는 방식이 끝까지 가면 한 분에게 이른다는 것입니다.","s":545.112,"e":550.767,"p":false,"h":false},{"t":"이 해석은 이사야서의 구조에 대한 한 가지 읽기이며, 종의 정체는 11번 물음에서 따로 다루겠습니다.","s":551.376,"e":558.436,"p":true,"h":false},{"t":"그러면 이 구조가 신약에서 어떻게 이어지는지 보입니다.","s":559.512,"e":563.428,"p":false,"h":false},{"t":"그리스도는 그루터기에서 난 싹이며, 그분 안에서 남은 자의 개념이 다시 넓어집니다.","s":564.048,"e":569.976,"p":false,"h":false},{"t":"로마서 9장 24절부터 26절은 이 남은 자가 유대인 가운데서뿐 아니라 이방인 가운데서도 부름받는다고 말합니다.","s":570.6,"e":579.242,"p":false,"h":false},{"t":"하나님의 일이 소수를 통해 이어지다가, 한 분을 통해 모든 민족으로 열리는 모양입니다.","s":579.852,"e":585.644,"p":true,"h":false},{"t":"이 개념이 읽는 사람에게 묻는 것","s":586.728,"e":589.018,"p":false,"h":true},{"t":"남은 자 개념은 두 방향의 오해를 막아 줍니다.","s":590.04,"e":593.407,"p":false,"h":false},{"t":"하나는 교만의 오해입니다.","s":594.072,"e":596.078,"p":false,"h":false},{"t":"내가 남은 자에 속한다고 생각하는 사람은 자기 자격이 아니라 은혜로 남겨진 것임을 기억해야 합니다.","s":596.664,"e":602.718,"p":false,"h":false},{"t":"엘리야처럼 \"나만 남았다\"고 생각하는 사람에게 하나님은 칠천 명을 보여 주셨습니다.","s":603.36,"e":608.814,"p":false,"h":false},{"t":"하나님의 일은 내가 아는 것보다 넓고, 내가 그 일을 혼자 지고 있는 것이 아닙니다.","s":609.48,"e":615.097,"p":true,"h":false},{"t":"다른 하나는 절망의 오해입니다.","s":616.176,"e":618.511,"p":false,"h":false},{"t":"교회가 작아지고 말씀이 외면당하는 시대에 \"아무것도 남지 않았다\"고 느끼는 사람에게, 이사야서는 그루터기를 보여 줍니다.","s":619.092,"e":627.234,"p":false,"h":false},{"t":"눈에 보이는 것이 베어 낸 밑동뿐일 때에도, 하나님은 그 안에 거룩한 씨를 두셨다고 말씀하십니다(6:13).","s":627.876,"e":636.047,"p":false,"h":false},{"t":"숫자가 약속의 척도가 아닙니다.","s":636.552,"e":638.969,"p":true,"h":false},{"t":"그러므로 남은 자는 우월한 집단의 이름이 아니라, 은혜로 붙들려 말씀을 간직하고 다음 세대에 넘기는 자들의 이름입니다.","s":640.044,"e":648.371,"p":false,"h":false},{"t":"이사야가 아들의 이름을 걸고 걸어 다녔듯, 그들은 자기 존재 자체가 하나님이 아직 포기하지 않으셨다는 증거가 됩니다.","s":648.936,"e":656.909,"p":true,"h":false}]},{"title":"5. 도구로 쓰셨는데 왜 벌하시는가","audio":"doc05_2610241127.mp3","dur":676.5,"segs":[{"t":"도구로 쓰셨는데 왜 벌하시는가: 앗수르의 교만과 하나님의 공의","s":0,"e":4.984,"p":false,"h":true},{"t":"본문: 이사야 10:5-19 (함께 읽을 본문: 사 5:25-30; 9:8-10:4; 10:20-34; 14:24-27; 36~37장; 합 1:12-2:8; 창 50:20; 행 2:23, 4:27-28)","s":6.156,"e":34.913,"p":true,"h":false},{"t":"앞의 네 편에서 고소당한 쪽은 언제나 이스라엘과 유다였습니다.","s":35.748,"e":40.193,"p":false,"h":false},{"t":"그런데 이사야 10장 5절에서 본문은 방향을 틀어, 심판의 몽둥이를 든 쪽에 \"화 있을진저\"를 외칩니다.","s":40.788,"e":48.16,"p":false,"h":false},{"t":"하나님이 보내서 간 자를 왜 벌하시는가, 이것이 공정한가 하는 물음이 여기서 생깁니다.","s":48.816,"e":54.922,"p":false,"h":false},{"t":"이 물음은 이사야 시대에만 있던 것이 아니라, 제국의 칼 아래서 고난당한 사람들이 늘 물어 온 것입니다.","s":55.548,"e":62.652,"p":true,"h":false},{"t":"후렴이 끝나는 자리","s":63.756,"e":65.254,"p":false,"h":true},{"t":"문맥부터 보겠습니다.","s":66.42,"e":68.188,"p":false,"h":false},{"t":"9장 8절부터 이어진 후렴, 곧 \"그래도 그의 노가 돌이켜지지 아니하고 그의 손이 여전히 펴져 있도다\"는 10장 4절에서 네 번째로 나오고 끝납니다.","s":68.724,"e":79.362,"p":false,"h":false},{"t":"그리고 곧바로 10장 5절이 이어집니다.","s":80.028,"e":82.836,"p":false,"h":false},{"t":"앗수르는 난데없이 나타난 이방 나라가 아니라, 해설서 9장에서 우리가 답답하게 읽은 그 펴진 손이 쥐고 있는 몽둥이입니다.","s":83.448,"e":91.67,"p":true,"h":false},{"t":"\"화 있을진저\"라는 말도 눈여겨볼 만합니다.","s":92.736,"e":95.814,"p":false,"h":false},{"t":"5장에서 포도원 노래 뒤에 여섯 번 나온 선고, 10장 1절에서 불의한 재판관들에게 던진 선고와 같은 말입니다.","s":96.444,"e":104.022,"p":false,"h":false},{"t":"이스라엘의 죄에 쓰이던 선고가 이제 앗수르에게 쓰입니다.","s":104.652,"e":108.68,"p":false,"h":false},{"t":"선택받은 백성이라고 면제되지 않았듯, 쓰임받는 도구라고 면제되지도 않습니다.","s":109.224,"e":115.067,"p":true,"h":false},{"t":"보내는 분과 가는 자","s":116.136,"e":117.736,"p":false,"h":true},{"t":"5절과 6절은 하늘의 시점입니다.","s":118.944,"e":121.442,"p":false,"h":false},{"t":"앗수르는 \"내 노의 막대기\"이고, 하나님은 내가 그를 보내고 내가 그에게 명령한다고 하십니다.","s":122.04,"e":128.53,"p":false,"h":false},{"t":"보내는 주체가 하나님이시라는 점을 본문은 조금도 감추지 않습니다.","s":129.168,"e":133.623,"p":false,"h":false},{"t":"대상은 \"경건하지 아니한 나라\"인데, 10장 1절과 2절이 이 나라의 죄를 적어 두었습니다.","s":134.244,"e":140.524,"p":false,"h":false},{"t":"불의한 법령으로 가난한 자의 권리를 빼앗는 일입니다.","s":141.192,"e":144.762,"p":true,"h":false},{"t":"그런데 7절이 장면을 뒤집습니다.","s":145.872,"e":148.387,"p":false,"h":false},{"t":"앗수르의 뜻은 그렇지 않았다는 것입니다.","s":148.86,"e":151.779,"p":false,"h":false},{"t":"그의 마음에 있는 것은 징계가 아니라 파괴였고, 한두 나라가 아니라 허다한 나라를 멸절하는 일이었습니다.","s":152.46,"e":159.37,"p":false,"h":false},{"t":"같은 사건이 두 시점으로 기록된 셈입니다.","s":160.02,"e":163.036,"p":false,"h":false},{"t":"하늘에서 보면 징계이고, 앗수르가 보면 정복입니다.","s":163.548,"e":167.458,"p":true,"h":false},{"t":"문제는 그의 마음이었다","s":168.48,"e":170.528,"p":false,"h":true},{"t":"8절에서 11절은 앗수르의 속말을 그대로 들려줍니다.","s":171.648,"e":175.471,"p":false,"h":false},{"t":"내 신하들이 다 왕이 아니냐며 갈로, 갈그미스, 하맛, 아르밧, 사마리아, 다메섹을 줄줄이 꼽습니다.","s":176.076,"e":186.329,"p":false,"h":false},{"t":"그러고는 결론에 이릅니다.","s":186.984,"e":188.926,"p":false,"h":false},{"t":"내가 사마리아와 그 우상에게 행한 것처럼 예루살렘과 그 우상에게 못 하겠느냐는 것입니다.","s":189.54,"e":195.596,"p":false,"h":false},{"t":"죄의 핵심이 여기서 드러납니다.","s":196.272,"e":198.539,"p":false,"h":false},{"t":"그는 예루살렘의 하나님을 이미 꺾은 다른 나라들의 신들과 같은 한 지역 신으로 보았습니다.","s":199.188,"e":205.005,"p":false,"h":false},{"t":"13절과 14절에서는 \"내 손의 힘과 내 지혜로 하였다\"고 자랑하며, 나라들의 재물을 새 둥지의 알을 줍듯 거두었다고 말합니다.","s":205.668,"e":214.578,"p":false,"h":false},{"t":"고대 앗수르 왕들의 비문이 왕의 힘으로 이룬 정복을 즐겨 자랑하는 것으로 알려져 있으니, 이 대목은 그 어조를 그대로 옮긴 것으로 읽힙니다.","s":215.172,"e":224.613,"p":true,"h":false},{"t":"12절은 판결의 근거를 밝힙니다.","s":225.684,"e":228.146,"p":false,"h":false},{"t":"주께서 시온과 예루살렘에 대한 일을 마치신 뒤에 앗수르 왕을 벌하시는데, 그 이유로 드는 것은 그의 교만한 마음에서 맺힌 열매와 높은 눈의 자랑입니다.","s":228.78,"e":239.14,"p":false,"h":false},{"t":"이 본문이 앗수르의 죄로 지목하는 것은 보냄을 받았다는 사실이 아니라, 그 일을 하면서 품은 마음입니다.","s":239.76,"e":246.842,"p":true,"h":false},{"t":"도끼의 자랑","s":247.932,"e":249.088,"p":false,"h":true},{"t":"15절은 이 장에서 가장 날카로운 그림입니다.","s":250.236,"e":253.477,"p":false,"h":false},{"t":"도끼가 자기를 찍는 사람 앞에서 자랑하겠느냐, 톱이 자기를 켜는 사람 앞에서 큰 체하겠느냐, 막대기가 자기를 든 사람을 휘두르려는 격이 아니냐는 것입니다.","s":254.124,"e":264.29,"p":false,"h":false},{"t":"도구는 쓰는 이의 손 안에서만 도구입니다.","s":264.888,"e":267.821,"p":true,"h":false},{"t":"이 그림이 앗수르를 꼭두각시로 만드는 것은 아닙니다.","s":268.92,"e":272.461,"p":false,"h":false},{"t":"7절은 앗수르에게 자기 뜻과 마음이 있었고 그 마음이 악했다고 분명히 말합니다.","s":272.808,"e":278.688,"p":false,"h":false},{"t":"15절이 말하는 것은 그의 힘이 파생된 것이라는 점입니다.","s":279.324,"e":283.293,"p":false,"h":false},{"t":"그가 이긴 것은 자기 지혜 때문이 아니라 쥐고 있는 손이 있었기 때문인데, 그 사실을 잊고 스스로 주인이라 믿은 것이 그의 죄입니다.","s":283.896,"e":292.986,"p":true,"h":false},{"t":"같은 사건, 두 개의 뜻","s":294.048,"e":296.511,"p":false,"h":true},{"t":"이런 구조는 성경에서 이 본문에만 나오지 않습니다.","s":297.504,"e":300.96,"p":false,"h":false},{"t":"요셉은 형들에게 당신들은 나를 해하려 했으나 하나님은 그것을 선으로 바꾸셨다고 말합니다(창 50:20).","s":301.572,"e":309.627,"p":false,"h":false},{"t":"한 사건에 형들의 악한 뜻과 하나님의 선한 뜻이 함께 있습니다.","s":310.248,"e":314.382,"p":false,"h":false},{"t":"가장 큰 사례는 십자가입니다.","s":315.036,"e":317.334,"p":false,"h":false},{"t":"사도행전 2장 23절은 예수께서 하나님의 정하신 계획과 미리 아심을 따라 넘겨지셨다고 하면서 동시에 \"너희가 법 없는 자들의 손을 빌려 못 박아 죽였다\"고 책임을 묻습니다.","s":317.952,"e":329.846,"p":false,"h":false},{"t":"4장 27절과 28절도 헤롯과 빌라도와 이방인과 이스라엘 백성이 모인 일을 하나님의 손과 뜻이 미리 정하신 일을 이루려는 것이었다고 말합니다.","s":330.516,"e":340.285,"p":true,"h":false},{"t":"개혁주의 전통은 이것을 섭리 교리로 정리해 왔습니다.","s":341.028,"e":344.734,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서 5장 4항은 하나님의 섭리가 죄에까지 미치되 단순한 허용이 아니라 지혜롭고 능력 있게 경계를 정하고 다스리는 방식이며, 그러면서도 죄악됨은 오직 피조물에게서 나오고 하나님은 죄의 조성자도 시인자도 아니시라고 말합니다.","s":345.348,"e":362.258,"p":true,"h":false},{"t":"여기서도 2번 글에서처럼 한계를 말씀드려야 합니다.","s":363.348,"e":366.951,"p":false,"h":false},{"t":"본문은 두 뜻이 한 사건 안에서 어떻게 만나는지를 설명하지 않습니다.","s":367.524,"e":372.268,"p":false,"h":false},{"t":"다만 한 가지는 분명히 합니다.","s":372.888,"e":375.129,"p":false,"h":false},{"t":"책임이 놓이는 자리입니다.","s":375.768,"e":377.683,"p":false,"h":false},{"t":"이 장에서 죄가 놓이는 곳은 하나님의 명령이 아니라 앗수르의 마음입니다.","s":378.288,"e":383.153,"p":false,"h":false},{"t":"또 본문은 하나님이 앗수르에게 교만을 불어넣으셨다고 말하지 않고, 이미 정복을 향하던 그의 걸음을 징계의 방향으로 돌려세우시는 모습으로 그립니다.","s":383.796,"e":393.349,"p":false,"h":false},{"t":"그 방향 지으심이 어디까지 미치는지는 본문이 정하지 않으므로, 거기서 더 나아가는 것은 신학적 추론의 몫입니다.","s":393.948,"e":401.623,"p":true,"h":false},{"t":"시한이 있는 몽둥이","s":402.696,"e":404.256,"p":false,"h":true},{"t":"이 몽둥이에는 시한이 있습니다.","s":405.324,"e":407.706,"p":false,"h":false},{"t":"12절은 하나님이 시온과 예루살렘에 대한 일을 다 이루신 뒤에 앗수르를 벌하신다고 하고, 25절은 조금만 있으면 분노가 그치고 진노가 앗수르를 멸하는 쪽으로 옮겨 간다고 말합니다.","s":408.348,"e":420.113,"p":false,"h":false},{"t":"9장에서 느낀 답답함이 여기서 한 줄기 빛을 받습니다.","s":420.66,"e":424.427,"p":false,"h":false},{"t":"펴진 손은 끝없이 펴져 있는 것이 아니라 징계의 목적이 이루어질 때까지 펴져 있다가 몽둥이를 내려놓습니다.","s":425.052,"e":432.155,"p":true,"h":false},{"t":"16절에서 19절은 앗수르의 심판을 불로 그립니다.","s":433.152,"e":436.918,"p":false,"h":false},{"t":"그런데 17절은 \"이스라엘의 빛이 불이 되고 그의 거룩한 이가 불꽃이 되어\"라고 합니다.","s":437.544,"e":443.488,"p":false,"h":false},{"t":"9장 2절에서 흑암에 행하던 백성에게 비친 그 큰 빛이 여기서는 교만한 자를 사르는 불입니다.","s":444.132,"e":450.45,"p":false,"h":false},{"t":"8장 14절에서 같은 하나님이 성소도 되시고 걸림돌도 되셨듯, 겸손한 자에게 빛인 분이 교만한 자에게는 불이 되십니다.","s":451.044,"e":459.291,"p":false,"h":false},{"t":"이 읽기는 제 연결이며, 같은 하나님이 사람의 자리에 따라 다르게 마주 서신다는 이사야서의 일관된 방식을 따른 것입니다.","s":459.936,"e":468.641,"p":true,"h":false},{"t":"19절은 앗수르의 숲에 남은 나무가 어린아이도 셀 수 있을 만큼 적으리라고 합니다.","s":469.764,"e":474.943,"p":false,"h":false},{"t":"바로 뒤 20절부터 23절은 이스라엘의 남은 자가 돌아오리라고 말합니다.","s":475.56,"e":480.966,"p":false,"h":false},{"t":"4번에서 본 남은 자와 앗수르의 남은 숲이 마주 놓인 것입니다.","s":481.536,"e":485.566,"p":false,"h":false},{"t":"장의 끝, 33절과 34절에서는 하나님이 쇠로 숲의 무성한 곳을 베시고, 이어지는 11장 1절은 이새의 그루터기에서 싹이 난다고 합니다.","s":486.216,"e":496.356,"p":false,"h":false},{"t":"도끼를 자랑하던 쪽이 베이고 다윗의 줄기에서 새 순이 돋는 대비입니다.","s":497.016,"e":502.126,"p":true,"h":false},{"t":"14장 24절부터 27절은 앗수르를 꺾으시는 계획을 말한 뒤, 이것이 온 땅에 대한 계획이며 모든 나라 위에 펴신 손이라고 맺습니다.","s":503.136,"e":513.179,"p":false,"h":false},{"t":"이 이야기는 6번 글로 이어집니다.","s":513.792,"e":516.402,"p":true,"h":false},{"t":"역사가 보여 준 것","s":517.464,"e":518.91,"p":false,"h":true},{"t":"주전 701년 산헤립이 유다를 침공했을 때 일어난 일은 8번 글에서 자세히 읽겠습니다.","s":519.876,"e":526.448,"p":false,"h":false},{"t":"여기서는 한 가지만 짚어 둡니다.","s":527.076,"e":529.511,"p":false,"h":false},{"t":"37장 26절부터 29절에서 하나님은 앗수르의 오만을 두고 갈고리로 코를 꿰고 재갈을 물려 온 길로 돌려보내리라고 하십니다.","s":530.1,"e":538.956,"p":false,"h":false},{"t":"10장 15절의 도끼가 어떻게 되는지를 역사 속에서 보여 주는 장면입니다.","s":539.532,"e":544.338,"p":true,"h":false},{"t":"같은 물음을 던진 하박국","s":545.4,"e":547.431,"p":false,"h":true},{"t":"이 물음을 정면으로 묻고 따진 사람이 성경 안에도 있습니다.","s":548.532,"e":552.462,"p":false,"h":false},{"t":"하박국은 유다의 죄를 벌하러 바벨론을 일으키신다는 말씀을 듣고 항의합니다.","s":553.032,"e":558.085,"p":false,"h":false},{"t":"눈이 너무 정결하여 악을 보지 못하시는 분이 어찌 악인이 의인을 삼키는데 잠잠하시냐는 것입니다(합 1:13).","s":558.72,"e":567.289,"p":false,"h":false},{"t":"응답은 설명이 아니라 바벨론에게 내려질 다섯 번의 화(2장)와 \"의인은 믿음으로 말미암아 살리라\"(2:4)는 말씀입니다.","s":567.864,"e":578.054,"p":false,"h":false},{"t":"예레미야도 칠십 년이 차면 바벨론을 벌하신다고 말합니다(렘 25:12).","s":578.664,"e":584.809,"p":false,"h":false},{"t":"답하는 방식이 같습니다.","s":585.396,"e":587.266,"p":false,"h":false},{"t":"도구는 반드시 심판받고, 그동안 의인은 기다립니다.","s":587.952,"e":592.204,"p":true,"h":false},{"t":"이 본문이 말하는 것","s":593.208,"e":594.654,"p":false,"h":true},{"t":"이 본문은 읽는 사람의 자리에 따라 다르게 말합니다.","s":595.692,"e":599.284,"p":false,"h":false},{"t":"압제 아래 있는 사람에게는 위로입니다.","s":599.904,"e":602.619,"p":false,"h":false},{"t":"제국의 승리가 마지막 말이 아니고, 그들이 쥔 칼에도 시한이 있습니다.","s":603.252,"e":608.055,"p":false,"h":false},{"t":"징계를 받는 사람에게는 그 징계에 목적과 끝이 있고, 몽둥이를 쥔 손이 하나님의 손이라는 위로입니다.","s":608.688,"e":615.957,"p":true,"h":false},{"t":"힘을 가진 사람에게는 경고입니다.","s":617.04,"e":619.4,"p":false,"h":false},{"t":"쓰임받는다는 사실은 의롭다는 증명서가 아닙니다.","s":619.992,"e":623.862,"p":false,"h":false},{"t":"앗수르는 하나님의 계획에 정확히 들어맞는 일을 하고도 그 일로 심판받았습니다.","s":624.492,"e":629.614,"p":false,"h":false},{"t":"성공과 영향력을 하나님의 인정으로 읽는 순간이 도끼가 자랑하는 순간입니다.","s":630.252,"e":635.458,"p":false,"h":false},{"t":"이것은 나라와 지도자에게만이 아니라 \"하나님이 나를 쓰셨다\"고 말하는 모든 사역자에게 해당합니다.","s":636.084,"e":642.35,"p":false,"h":false},{"t":"쓰시는 일은 은혜이고, 그 은혜를 자기 능력으로 바꿔 읽는 것이 죄입니다.","s":642.96,"e":648.183,"p":true,"h":false},{"t":"마지막으로 주의할 점이 있습니다.","s":649.26,"e":651.54,"p":false,"h":false},{"t":"이사야에게는 앗수르가 하나님의 막대라는 계시의 말씀이 있었습니다.","s":651.816,"e":656.343,"p":false,"h":false},{"t":"우리에게는 그런 말씀이 없습니다.","s":656.928,"e":659.493,"p":false,"h":false},{"t":"이 본문으로 오늘의 어느 나라가 하나님의 몽둥이이고 어느 나라가 그의 대적인지 가려내려 해서는 안 됩니다.","s":660.132,"e":667.067,"p":false,"h":false},{"t":"이 본문은 역사를 해독하는 열쇠가 아니라, 내가 지금 쥐고 있는 힘이 누구의 손에서 온 것인지를 묻는 물음입니다.","s":667.656,"e":675.447,"p":true,"h":false}]},{"title":"6. 이방 나라들의 심판이 왜 이스라엘의 책에 들어 있는가","audio":"doc06_2610241127.mp3","dur":666.7,"segs":[{"t":"이방 나라들의 심판이 왜 이스라엘의 책에 들어 있는가: 열방 신탁의 신학","s":0,"e":5.468,"p":false,"h":true},{"t":"본문: 이사야 13~23장 (함께 읽을 본문: 사 2:2-4; 14:24-27; 19:16-25; 25:6-9; 암 1~2장; 렘 46~51장; 겔 25~32장; 습 2:4-15)","s":6.588,"e":30.796,"p":true,"h":false},{"t":"앞의 다섯 편은 이스라엘과 유다, 그리고 그들을 치는 앗수르를 다루었습니다.","s":31.68,"e":37.273,"p":false,"h":false},{"t":"그런데 이사야서를 차례대로 읽다가 13장에 들어서면 독자는 당황합니다.","s":37.908,"e":42.948,"p":false,"h":false},{"t":"바벨론, 앗수르, 블레셋, 모압, 다메섹, 구스, 애굽, 에돔, 아라비아, 두로가 줄줄이 나오고, 그 나라들에 대한 선고가 열 장 넘게 이어집니다.","s":43.596,"e":59.837,"p":false,"h":false},{"t":"이스라엘이 읽으려고 받은 책에 남의 나라 이야기가 이렇게 많은 까닭이 무엇인가, 이것이 이번 물음입니다.","s":60.444,"e":67.909,"p":false,"h":false},{"t":"이 대목은 해설서에서도 가장 건너뛰고 싶어지는 부분이어서, 왜 건너뛰면 안 되는지를 먼저 말씀드리려 합니다.","s":68.544,"e":76.123,"p":true,"h":false},{"t":"이 장들이 하는 일","s":77.184,"e":78.585,"p":false,"h":true},{"t":"13~23장은 학자들이 흔히 \"열방 신탁\"이라 부르는 모음입니다.","s":79.776,"e":84.91,"p":false,"h":false},{"t":"이런 모음은 이사야서에만 있지 않습니다.","s":85.536,"e":88.541,"p":false,"h":false},{"t":"아모스 1~2장, 예레미야 46~51장, 에스겔 25~32장, 스바냐 2장에도 있어서, 선지서의 한 전통이라 할 만합니다.","s":89.172,"e":100.859,"p":false,"h":false},{"t":"이 장들이 이사야서 한가운데 놓인 이유를 본문 안에서 읽어 보면 몇 가지가 보입니다.","s":101.484,"e":106.915,"p":true,"h":false},{"t":"먼저 이 선고들은 이방 나라가 들으라고 쓴 것이 아닙니다.","s":108,"e":111.965,"p":false,"h":false},{"t":"바벨론이나 애굽이 이사야서를 읽었을 리는 없습니다.","s":112.284,"e":116.061,"p":false,"h":false},{"t":"이 말씀은 이스라엘이 읽도록 주어졌고, 그래서 기능은 열방을 향한 선고이면서 동시에 이스라엘을 향한 가르침입니다.","s":116.712,"e":125.339,"p":false,"h":false},{"t":"무엇을 가르치는지는 아래에서 보겠습니다.","s":125.964,"e":128.998,"p":true,"h":false},{"t":"첫째 가르침: 두려움의 대상이 작아진다","s":130.104,"e":133.667,"p":false,"h":true},{"t":"7장에서 아하스는 아람과 북이스라엘이 무서워 앗수르를 의지했고, 36~37장의 히스기야 시대에는 앗수르가 무섭고 애굽이 의지처로 보였습니다.","s":134.82,"e":145.701,"p":false,"h":false},{"t":"이사야 시대의 유다는 늘 강대국 틈에서 어느 쪽에 설지를 계산하며 살았습니다.","s":146.34,"e":151.575,"p":false,"h":false},{"t":"그 한복판에서 이 장들은 그 강대국들이 모두 하나님의 손 아래 있는 나라라고 말합니다.","s":152.208,"e":158.1,"p":false,"h":false},{"t":"14장 24절부터 27절이 그 요지를 밝힙니다.","s":158.688,"e":162.794,"p":false,"h":false},{"t":"앗수르를 꺾으시는 계획이 온 땅에 대한 계획이며, 모든 나라 위에 펴신 손이라는 말입니다.","s":163.404,"e":169.521,"p":false,"h":false},{"t":"만군의 여호와께서 계획하셨으니 누가 그것을 폐하며, 그 손이 펴졌으니 누가 그것을 돌이키겠느냐고 하십니다.","s":170.136,"e":177.839,"p":true,"h":false},{"t":"이 선고들을 읽은 유다 사람은 자기가 두려워하던 대상의 목록이 심판 목록과 같다는 것을 보게 됩니다.","s":178.92,"e":185.677,"p":false,"h":false},{"t":"의지하려던 나라와 두려워하던 나라가 한 줄에 서 있습니다.","s":186.336,"e":190.104,"p":false,"h":false},{"t":"20장이 이 점을 가장 극적으로 보여 줍니다.","s":190.764,"e":193.918,"p":false,"h":false},{"t":"이사야는 삼 년 동안 벗은 몸과 벗은 발로 다니며, 애굽과 구스를 의지하던 이들이 앗수르에게 그렇게 끌려가리라는 표징이 됩니다.","s":194.508,"e":203.43,"p":false,"h":false},{"t":"그리고 해변 주민들이 \"우리가 의지하던 자가 이 꼴이 되었으니 우리가 어떻게 피하겠느냐\" 하고 탄식하게 될 것이라고 합니다(20:6).","s":204.084,"e":213.86,"p":false,"h":false},{"t":"열방 신탁은 의지할 곳이 못 되는 것들의 목록입니다.","s":214.452,"e":218.192,"p":true,"h":false},{"t":"둘째 가르침: 심판의 기준은 이스라엘에게도 적용되는 같은 기준이다","s":219.312,"e":224.494,"p":false,"h":true},{"t":"그렇다면 이 나라들은 무슨 죄로 심판받는가를 보아야 합니다.","s":225.648,"e":230.109,"p":false,"h":false},{"t":"몇 편을 읽으면 반복되는 것이 있습니다.","s":230.724,"e":233.481,"p":false,"h":false},{"t":"바벨론에게는 교만과 포악이 지적되고(13:11; 14:4-6), 바벨론 왕을 향한 조롱 노래에서는 \"내가 하늘에 올라가 하나님의 뭇별 위에 내 보좌를 높이리라\"(14:13)는 자기 신격화가 죄로 드러납니다.","s":234.144,"e":251.464,"p":false,"h":false},{"t":"모압의 죄도 교만입니다(16:6).","s":252.108,"e":255.436,"p":false,"h":false},{"t":"두로는 재물과 영화로 열국의 상인이 되어 있던 나라입니다(23장).","s":255.924,"e":261.344,"p":false,"h":false},{"t":"에돔과 애굽, 구스에 대해서도 정치적 계략과 자기 의지가 문제로 지적됩니다.","s":261.936,"e":267.892,"p":true,"h":false},{"t":"이 목록을 5장의 포도원 노래, 2장의 \"사람의 교만이 낮아지고\"(2:17)와 나란히 놓으면 같은 기준이 드러납니다.","s":268.956,"e":278.176,"p":false,"h":false},{"t":"하나님은 이스라엘에게 하신 말씀을 열방에게도 하시고, 이스라엘에게 적용하신 기준으로 열방도 재십니다.","s":278.82,"e":285.549,"p":false,"h":false},{"t":"이것은 하나님이 한 민족의 수호신이 아니시라는 선언입니다.","s":286.2,"e":290.094,"p":false,"h":false},{"t":"10장에서 앗수르가 자기를 주인으로 여긴 것이 죄였듯, 열방의 죄도 하나님 자리에 자기를 앉힌 것입니다.","s":290.664,"e":297.631,"p":true,"h":false},{"t":"여기서 한 가지는 구별해야 합니다.","s":298.728,"e":301.14,"p":false,"h":false},{"t":"이 장들은 모든 이방 나라가 이스라엘을 해쳐서 심판받는다고 말하지 않습니다.","s":301.716,"e":306.935,"p":false,"h":false},{"t":"이스라엘과 아무 관계없는 나라의 교만도 심판 목록에 올라 있습니다.","s":307.584,"e":312.19,"p":false,"h":false},{"t":"심판의 이유는 이스라엘을 건드렸기 때문만이 아니라 하나님의 자리를 넘보았기 때문입니다.","s":312.804,"e":319.036,"p":true,"h":false},{"t":"셋째 가르침: 심판 속에서 우는 하나님","s":320.04,"e":323.615,"p":false,"h":true},{"t":"열방 신탁을 읽다 보면 예상하지 못한 대목이 있습니다.","s":324.792,"e":328.575,"p":false,"h":false},{"t":"모압에 대한 선고(15~16장)에서 선지자가 우는 것입니다.","s":329.256,"e":334.859,"p":false,"h":false},{"t":"\"그러므로 내 마음이 수금 같이 모압을 위하여 울리며\"(16:11)라고 하고, 15장 5절에서는 \"내 마음이 모압을 위하여 부르짖는다\"고 합니다.","s":335.52,"e":346.541,"p":false,"h":false},{"t":"선고하는 사람이 이를 갈지 않고 곡을 합니다.","s":347.184,"e":350.348,"p":false,"h":false},{"t":"야셀을 위해 우는 것처럼 십브마의 포도나무를 위해 운다는 말도 나옵니다(16:9).","s":350.64,"e":356.494,"p":false,"h":false},{"t":"이 눈물을 선지자 자신의 것으로 읽을 수도 있고 하나님의 마음을 대신 말하는 것으로 읽을 수도 있는데, 본문이 어느 쪽인지 단정하지 않아서 학자들 사이에서도 갈립니다.","s":357.084,"e":368.062,"p":false,"h":false},{"t":"어느 쪽으로 읽든 이 책은 심판을 구경하며 즐기는 책이 아닙니다.","s":368.712,"e":373.142,"p":true,"h":false},{"t":"이 점은 이 단락을 원수에 대한 보복 선언으로 읽는 오해를 막아 줍니다.","s":374.184,"e":378.874,"p":false,"h":false},{"t":"열방 신탁이 이스라엘의 민족적 복수심을 달래려고 쓰였다면 모압을 위한 울음이 들어갈 이유가 없습니다.","s":379.548,"e":386.538,"p":true,"h":false},{"t":"넷째 가르침: 열방의 끝이 심판만은 아니다","s":387.648,"e":391.501,"p":false,"h":true},{"t":"이 단락에서 가장 놀라운 대목은 19장입니다.","s":392.688,"e":396.031,"p":false,"h":false},{"t":"애굽에 대한 선고로 시작하는 이 장은 16절부터 달라집니다.","s":396.648,"e":400.754,"p":false,"h":false},{"t":"애굽이 떨고, 그 땅에서 가나안 말을 하는 성읍이 생기고, 애굽 한가운데 여호와의 제단이 서고, 그들이 압박하는 자 때문에 여호와께 부르짖으면 구원자를 보내 건지신다고 합니다(19:18-22).","s":401.4,"e":415.942,"p":false,"h":false},{"t":"그리고 이렇게 끝납니다.","s":416.484,"e":418.275,"p":false,"h":false},{"t":"\"그날에 이스라엘이 애굽 및 앗수르와 더불어 셋이 이루어 세계 가운데 복이 되리니 만군의 여호와께서 복 주시며 이르시기를 나의 백성 애굽이여 나의 손으로 지은 앗수르여 나의 기업 이스라엘이여 복이 있을지로다\"(19:24-25).","s":418.824,"e":434.99,"p":true,"h":false},{"t":"이스라엘을 해치던 두 제국이 하나님의 백성이라고 불립니다.","s":435.996,"e":439.812,"p":false,"h":false},{"t":"\"나의 백성\"이라는 말이 이스라엘만의 이름이던 것이 애굽에게 주어지고, \"나의 손으로 지은\"이 앗수르에게 붙고, \"나의 기업\"이 이스라엘에게 남습니다.","s":440.424,"e":450.713,"p":false,"h":false},{"t":"이 구절을 처음 읽는 이스라엘 사람에게는 충격이었을 것입니다.","s":451.368,"e":455.415,"p":false,"h":false},{"t":"앞 장들에서 선고받던 나라들이 이름을 얻는 순간입니다.","s":456.084,"e":459.837,"p":true,"h":false},{"t":"이 연결이 특별한 것은 아닙니다.","s":460.872,"e":463.337,"p":false,"h":false},{"t":"이 책은 처음부터 이 방향을 향해 있었습니다.","s":463.644,"e":466.836,"p":false,"h":false},{"t":"2장 2절부터 4절은 모든 민족이 여호와의 산으로 몰려와 그분의 길을 배우리라고 했고, 25장 6절부터 9절은 만민을 위한 잔치를 말합니다.","s":467.424,"e":477.25,"p":false,"h":false},{"t":"열방 신탁은 그 큰 그림 한가운데 서 있습니다.","s":477.864,"e":481.379,"p":false,"h":false},{"t":"그러니 이 장들의 의미는 열방의 교만이 꺾여야 하나님의 이름 아래 모일 수 있다는 데 있습니다.","s":482.004,"e":487.92,"p":false,"h":false},{"t":"교만이 낮아지지 않고서는 어떤 나라도, 이스라엘도 그곳에 이를 수 없습니다.","s":488.556,"e":493.908,"p":false,"h":false},{"t":"다만 이 두 방향, 곧 열방의 심판과 열방의 구원이 어떻게 이어지는지는 14번 글에서 따로 다루겠습니다.","s":494.532,"e":502.545,"p":true,"h":false},{"t":"읽기 어려운 대목들","s":503.676,"e":505.253,"p":false,"h":true},{"t":"솔직히 말씀드려야 할 점이 있습니다.","s":506.34,"e":508.871,"p":false,"h":false},{"t":"이 단락에는 읽기 어려운 대목이 많습니다.","s":509.508,"e":512.627,"p":false,"h":false},{"t":"13장 16절은 바벨론의 어린아이들이 메치어지고 집이 약탈당하며 아내들이 욕을 당하리라고 합니다.","s":513.288,"e":520.257,"p":false,"h":false},{"t":"현대 독자에게는 하나님이 이런 폭력을 말씀하시는가 하는 물음이 일어납니다.","s":520.884,"e":525.906,"p":false,"h":false},{"t":"몇 가지를 구분해 두겠습니다.","s":526.536,"e":528.501,"p":true,"h":false},{"t":"이 말씀은 폭력을 명령하거나 승인하는 말씀이 아닙니다.","s":529.596,"e":533.652,"p":false,"h":false},{"t":"이스라엘에게 이 일을 하라고 하신 것이 아니라, 앗수르와 바벨론 같은 제국이 전쟁에서 늘 해 오던 일을 심판의 그림으로 쓰셨다는 점에서 그렇습니다.","s":534.24,"e":543.909,"p":false,"h":false},{"t":"이 선고들의 수신자는 이스라엘이어도 집행자는 이스라엘이 아닙니다.","s":544.536,"e":549.314,"p":false,"h":false},{"t":"5번에서 본 대로 하나님은 자기 뜻을 이루시되 그 폭력의 죄는 행하는 자의 몫으로 남겨 두십니다.","s":549.972,"e":556.257,"p":false,"h":false},{"t":"또 하나는, 이 표현들이 고대 근동의 전쟁 선고에서 흔히 쓰이던 과장법과 상투어를 따른 것일 수 있다는 점입니다.","s":556.884,"e":564.901,"p":false,"h":false},{"t":"학자들 사이에 이 점을 짚는 사람이 많지만, 그렇다고 이 표현이 주는 충격이 줄어드는 것은 아니니 거리를 두려고 이 설명을 쓰고 싶지는 않습니다.","s":565.524,"e":575.468,"p":false,"h":false},{"t":"그리고 14장 12절 이하의 \"계명성\"을 사탄의 타락으로 읽는 오랜 전통이 있는데, 본문은 바벨론 왕을 향한 조롱 노래로 소개되고(14:4) 있어서, 그렇게 읽는 것이 본문의 일차적 뜻은 아니라는 견해가 학자들 사이에 널리 퍼져 있습니다.","s":576,"e":593.579,"p":false,"h":false},{"t":"이것도 읽기가 갈리는 대목이므로 한쪽으로 정하지 않고, 본문이 먼저 바벨론 왕에게 하는 말이라는 점만 분명히 해 두겠습니다.","s":594.216,"e":602.513,"p":true,"h":false},{"t":"이 장들이 오늘에 말하는 것","s":603.576,"e":605.433,"p":false,"h":true},{"t":"이 단락은 큰 나라가 말하는 소리가 가장 크게 들리는 시대에 읽을 말씀입니다.","s":606.456,"e":611.669,"p":false,"h":false},{"t":"우리는 늘 어느 나라가, 어느 세력이, 어느 구조가 역사의 방향을 정하는 것처럼 느낍니다.","s":612.252,"e":618.783,"p":false,"h":false},{"t":"이사야서는 그 모든 이름이 하나님의 손 아래 있는 이름이라고 말하되, 그 이유로 우리가 교만해지는 것은 허락하지 않습니다.","s":619.416,"e":627.595,"p":false,"h":false},{"t":"열방에게 적용된 기준이 곧 우리에게도 적용되기 때문입니다.","s":628.236,"e":632.563,"p":true,"h":false},{"t":"또 이 단락은 하나님의 시선이 우리가 가진 지도보다 넓다는 것을 일깨웁니다.","s":633.672,"e":639.05,"p":false,"h":false},{"t":"이스라엘이 자기 문제만 바라보던 때에 하나님은 모압을 위해 우셨고, 애굽을 \"나의 백성\"이라 부르려 하셨습니다.","s":639.684,"e":647.228,"p":false,"h":false},{"t":"이 사실이 이스라엘의 선택을 가볍게 만들지는 않습니다.","s":647.856,"e":651.784,"p":false,"h":false},{"t":"선택은 열방 위에 군림하는 특권이 아니라 열방에게 복이 되라는 부르심이었다는 것을 보여 줍니다.","s":652.356,"e":658.634,"p":false,"h":false},{"t":"그러므로 이 장들을 건너뛰는 일은 이사야서가 가장 크게 말하는 곳 중 하나를 놓치는 일입니다.","s":659.268,"e":665.608,"p":true,"h":false}]},{"title":"7. 심판과 회복은 왜 번갈아 나오는가","audio":"doc07_2610241127.mp3","dur":942.7,"segs":[{"t":"심판과 회복은 왜 번갈아 나오는가: 이사야 24~35장을 읽는 법","s":0,"e":6.229,"p":false,"h":true},{"t":"본문: 이사야 24~35장 (함께 읽을 본문: 사 1:24-27; 4:2-6; 5:1-7; 6:9-13; 40:1-11; 고전 15:54-55; 벧전 2:4-8; 계 21:1-4)","s":7.452,"e":33.018,"p":true,"h":false},{"t":"앞 글에서 열방 신탁을 읽고 나면 독자는 24장에서 다시 한 번 흔들립니다.","s":33.984,"e":39.39,"p":false,"h":false},{"t":"땅이 텅 비고 황폐해지는 장면이 나오는가 싶으면 곧바로 만민을 위한 잔치가 열립니다.","s":40.032,"e":46,"p":false,"h":false},{"t":"28장에서 \"화 있을진저\"가 시작되어 선고가 이어지다가, 어느 틈에 광야에 꽃이 피고 눈먼 자의 눈이 열립니다.","s":46.656,"e":54.662,"p":false,"h":false},{"t":"심판과 구원이 이렇게 짧은 간격으로 오가면 독자는 이 책이 일관성이 있는지 의심하게 됩니다.","s":55.296,"e":61.95,"p":false,"h":false},{"t":"한 하나님이 진노하시다가 달래시다가 하는 것처럼 읽히기 때문입니다.","s":62.568,"e":67.212,"p":false,"h":false},{"t":"이번 물음은 그 오감이 어지러움이 아니라 의도라는 것을 보여 드리는 것입니다.","s":67.824,"e":72.852,"p":true,"h":false},{"t":"열두 장의 짜임","s":73.944,"e":75.452,"p":false,"h":true},{"t":"먼저 이 열두 장의 짜임을 봐 두면 길을 잃지 않습니다.","s":76.608,"e":80.712,"p":false,"h":false},{"t":"24장부터 27장은 땅 전체에 대한 심판과 그 뒤의 잔치, 사망의 소멸을 그립니다.","s":81.36,"e":88.333,"p":false,"h":false},{"t":"학자들은 이 단락을 흔히 \"이사야 소묵시록\"이라 부르는데, 이 이름은 후대 학자들이 붙인 것이고 이 단락이 묵시 문학이라 할 수 있는지에 대해서는 논쟁이 있습니다.","s":88.92,"e":99.913,"p":false,"h":false},{"t":"28장부터 33장까지는 \"화 있을진저\"로 시작하는 선고가 여섯 번 반복되고, 그 사이사이에 회복의 약속이 끼어 있습니다.","s":100.584,"e":109.849,"p":false,"h":false},{"t":"34장과 35장은 한 쌍입니다.","s":110.448,"e":113.304,"p":false,"h":false},{"t":"34장은 열방과 에돔에 대한 심판이고, 35장은 광야가 꽃피는 회복입니다.","s":113.796,"e":120.014,"p":true,"h":false},{"t":"이 가운데 가장 눈에 띄는 것은 28~33장의 되풀이되는 리듬입니다.","s":121.104,"e":126.631,"p":false,"h":false},{"t":"화를 선고하고, 심판을 말하고, 그러다 말씀의 방향이 돌아서서 회복을 말합니다.","s":127.296,"e":133.514,"p":false,"h":false},{"t":"29장은 아리엘, 곧 예루살렘이 포위되는 장면으로 시작해(29:1-14) 17절부터는 레바논이 기름진 밭이 되는 그림으로 넘어갑니다.","s":134.136,"e":145.122,"p":false,"h":false},{"t":"30장은 애굽을 의지하는 패역한 자식들을 책망하다가(30:1-17) 18절에서 돌아섭니다.","s":145.728,"e":153.696,"p":false,"h":false},{"t":"31장의 애굽 의존에 대한 화 다음에는 32장의 공의로운 왕이 옵니다.","s":154.368,"e":159.347,"p":false,"h":false},{"t":"같은 리듬이 세 번 되풀이됩니다.","s":159.984,"e":162.317,"p":true,"h":false},{"t":"돌아서는 자리에 놓인 낱말","s":163.332,"e":165.481,"p":false,"h":true},{"t":"이 되풀이에서 가장 놀라운 것은 돌아서는 자리입니다.","s":166.68,"e":170.447,"p":false,"h":false},{"t":"30장 15절에서 하나님은 \"돌이켜 조용히 하여야 구원을 얻을 것이요 잠잠하고 신뢰하여야 힘을 얻을 것이거늘\" 하셨는데, 곧바로 \"너희가 원하지 아니하였다\"고 하십니다.","s":171.036,"e":182.268,"p":false,"h":false},{"t":"백성은 말을 타고 도망하겠다고 했습니다(30:16).","s":182.916,"e":187.205,"p":false,"h":false},{"t":"여기까지는 심판의 이유입니다.","s":187.74,"e":190.086,"p":false,"h":false},{"t":"그런데 18절이 이렇게 시작합니다.","s":190.368,"e":193.033,"p":false,"h":false},{"t":"\"그러므로 여호와께서 너희에게 은혜 베풀기를 기다리시며.\"","s":193.608,"e":197.259,"p":true,"h":false},{"t":"\"그러므로\"라는 말에 주목하십시오.","s":198.396,"e":200.883,"p":false,"h":false},{"t":"사람의 논리라면 \"그러므로 벌하시리라\"가 와야 합니다.","s":201.528,"e":205.409,"p":false,"h":false},{"t":"그런데 본문은 거절한 백성 앞에서 하나님이 기다리시는 쪽을 택하십니다.","s":206.064,"e":210.97,"p":false,"h":false},{"t":"회복이 시작되는 이유가 백성의 회개에 있지 않고 하나님의 기다림에 있습니다.","s":211.608,"e":217.063,"p":false,"h":false},{"t":"9장의 후렴이 주던 무서움 옆에, 같은 하나님이 은혜 베풀기를 기다리신다는 말이 놓입니다.","s":217.656,"e":223.771,"p":true,"h":false},{"t":"낯선 일","s":224.856,"e":225.874,"p":false,"h":true},{"t":"그렇다면 심판은 하나님의 어떤 일입니까.","s":227.016,"e":229.947,"p":false,"h":false},{"t":"28장 21절에 이상한 표현이 나옵니다.","s":230.256,"e":233.5,"p":false,"h":false},{"t":"하나님이 \"자기의 일을 이루시리니 그의 일이 이상하며 자기의 일을 이루실 것이라 그의 일이 비상하도다\"라는 말씀입니다.","s":234.108,"e":241.805,"p":false,"h":false},{"t":"앞 구절을 보면 이 일이 일어나는 곳이 브라심 산과 기브온 골짜기입니다.","s":242.46,"e":247.485,"p":false,"h":false},{"t":"이 두 곳은 옛날 하나님이 이스라엘을 위해 원수와 싸우셨던 장소입니다(삼하 5:20, 수 10장).","s":248.076,"e":256.614,"p":false,"h":false},{"t":"그 하나님이 이번에는 같은 방식으로 이스라엘을 치시니, 하나님 자신에게도 낯선 일이라는 것입니다.","s":257.148,"e":263.891,"p":false,"h":false},{"t":"많은 학자가 이렇게 읽는데, 어느 쪽이든 심판이 하나님의 본성처럼 상시 일하시는 모습이 아니라 \"낯선 일\"로 불린다는 점은 분명합니다.","s":264.492,"e":273.669,"p":true,"h":false},{"t":"같은 장 뒤쪽의 농부 비유가 이 낯섦에 한계를 정해 줍니다.","s":274.752,"e":278.807,"p":false,"h":false},{"t":"밭 가는 사람이 씨 뿌리려고 종일 갈기만 하겠느냐는 것입니다(28:24).","s":279.468,"e":285.687,"p":false,"h":false},{"t":"농부는 흙을 갈아엎고 이랑을 만들지만 그것으로 끝내지 않고 소회향과 대회향을 심고 밀과 보리를 심습니다.","s":286.236,"e":294.251,"p":false,"h":false},{"t":"곡식도 도리깨와 바퀴로 타작하지만 가루가 되도록 부수지는 않습니다.","s":294.876,"e":299.682,"p":false,"h":false},{"t":"그리고 이 지혜를 농부에게 가르치신 분이 하나님이라고 합니다(28:26, 29).","s":300.24,"e":307.385,"p":false,"h":false},{"t":"갈아엎는 일은 심기 위한 일이고, 때려 부수는 일은 거두기 위한 일입니다.","s":307.944,"e":313.074,"p":false,"h":false},{"t":"이사야서 첫머리에서 하나님이 은 찌꺼기를 녹여 깨끗하게 하겠다고 하신 것(1:25)과 같은 방식입니다.","s":313.632,"e":321.834,"p":false,"h":false},{"t":"심판은 이사야서에서 대개 정화의 모양을 하고 있습니다.","s":322.488,"e":326.256,"p":true,"h":false},{"t":"눈과 귀가 열리는 방식","s":327.348,"e":329.339,"p":false,"h":true},{"t":"여기서 이 시리즈 전체를 지나온 우리가 놓치지 말아야 할 연결이 있습니다.","s":330.408,"e":335.099,"p":false,"h":false},{"t":"6장 9~10절의 눈멂과 귀막힘이 이 열두 장 안에서 풀리는 장면이 세 번 나옵니다.","s":335.7,"e":341.843,"p":false,"h":false},{"t":"29장 18절은 그날에 귀먹은 자가 책의 말씀을 듣고 맹인의 눈이 어둡고 캄캄한 데서 보리라고 합니다.","s":342.504,"e":350.022,"p":false,"h":false},{"t":"32장 3절은 보는 자의 눈이 감기지 않고 듣는 자의 귀가 기울여지리라고 합니다.","s":350.676,"e":356.179,"p":false,"h":false},{"t":"35장 5절은 맹인의 눈이 밝아지고 못 듣는 사람의 귀가 열리리라고 합니다.","s":356.796,"e":361.888,"p":false,"h":false},{"t":"6장의 단어들이 거꾸로 되돌려지는 것입니다.","s":362.52,"e":365.5,"p":false,"h":false},{"t":"이 연결은 제가 읽어 낸 문학적 연결이지만, 쓰인 낱말이 겹치는 점에서 우연으로 보기는 어렵다고 생각합니다.","s":366.12,"e":373.774,"p":true,"h":false},{"t":"이 개방이 누구의 일인지도 봐야 합니다.","s":374.868,"e":377.64,"p":false,"h":false},{"t":"29장 22절부터 24절은 아브라함을 속량하신 여호와께서 야곱의 집을 새롭게 하시고, 마음이 혼미하던 자들이 총명해진다고 합니다.","s":378.288,"e":387.806,"p":false,"h":false},{"t":"32장 15절은 \"마침내 위에서부터 성령을 우리에게 부어 주시리니\"라고 합니다.","s":388.404,"e":393.707,"p":false,"h":false},{"t":"닫힌 눈과 귀가 열리는 것은 백성의 결심 때문이 아니라 위에서 부어지는 영 때문입니다.","s":394.344,"e":400.346,"p":false,"h":false},{"t":"2번 글에서 63장 17절의 기도, 곧 \"우리가 스스로 돌이킬 수 없으니 주께서 돌이켜 주소서\"라는 호소를 보았습니다.","s":400.968,"e":409.471,"p":false,"h":false},{"t":"이 열두 장은 그 기도에 대한 약속의 형태로 답하고 있습니다.","s":410.112,"e":414.318,"p":false,"h":false},{"t":"눈멂은 심판이었으나 마지막은 아닙니다.","s":414.972,"e":417.899,"p":true,"h":false},{"t":"포도원 노래가 다시 불린다","s":418.968,"e":421.119,"p":false,"h":true},{"t":"27장 2절부터 6절은 이 책의 구조를 가장 잘 보여 주는 대목입니다.","s":422.244,"e":427.471,"p":false,"h":false},{"t":"\"그날에 아름다운 포도원이 있으리니 너희는 그것에 대하여 노래하라.\"","s":428.076,"e":432.506,"p":false,"h":false},{"t":"5장에서 들포도가 열려서 하나님이 담을 헐고 구름에게 비를 내리지 말라고 명하신 그 포도원이 여기서 다시 노래로 불립니다.","s":433.188,"e":441.273,"p":false,"h":false},{"t":"이번에는 주인이 때때로 물을 주고 밤낮으로 간수하며 아무도 해치지 못하게 하겠다고 하십니다.","s":441.9,"e":448.158,"p":false,"h":false},{"t":"그리고 이런 말씀이 나옵니다.","s":448.812,"e":450.957,"p":false,"h":false},{"t":"\"내게는 노가 없나니\"(27:4).","s":451.548,"e":454.73,"p":false,"h":false},{"t":"5장에서 포도원을 짓밟게 하신 하나님이 이제는 가시와 찔레와 맞서 싸우겠다고 나서시고, 결국 야곱이 뿌리를 박고 이스라엘이 싹이 나서 열매로 세계에 가득하게 되리라고 하십니다(27:6).","s":455.292,"e":468.995,"p":true,"h":false},{"t":"같은 비유가 심판의 노래로 한 번, 회복의 노래로 한 번 불립니다.","s":470.052,"e":474.721,"p":false,"h":false},{"t":"이사야서에서 심판과 회복은 두 개의 다른 이야기가 아니라 하나의 이야기를 두 번 말하는 방식입니다.","s":475.344,"e":482.261,"p":false,"h":false},{"t":"5장의 노래가 끝난 자리에서 27장의 노래가 시작됩니다.","s":482.904,"e":487.15,"p":true,"h":false},{"t":"돌 하나와 시온의 잔치","s":488.232,"e":490.191,"p":false,"h":true},{"t":"28장 16절은 심판의 선고 한가운데서 갑자기 말합니다.","s":491.436,"e":495.954,"p":false,"h":false},{"t":"\"보라 내가 한 돌을 시온에 두어 기초를 삼았노니 곧 시험한 돌이요 귀하고 견고한 기촛돌이라 그것을 믿는 이는 다급하지 아니하리로다.\"","s":496.512,"e":505.09,"p":false,"h":false},{"t":"앞 구절의 배경이 있습니다.","s":505.728,"e":507.793,"p":false,"h":false},{"t":"15절에서 지도자들은 \"우리가 사망과 언약을 맺고 스올과 맹약하였으니 넘치는 재앙이 지나갈 때에도 우리에게 미치지 못하리라\" 하고 거짓을 피난처로 삼았습니다.","s":508.356,"e":519.435,"p":false,"h":false},{"t":"그 거짓의 피난처와 대비해서 하나님이 놓으신 돌 하나가 있습니다.","s":520.092,"e":524.514,"p":false,"h":false},{"t":"8장에서 하나님이 걸림돌이 되신다고 했던 말씀(8:14)과 이 기촛돌의 말씀이 짝을 이룹니다.","s":525.132,"e":533.222,"p":false,"h":false},{"t":"믿는 사람에게는 기초이고 믿지 않는 사람에게는 걸림이 됩니다.","s":533.844,"e":538.178,"p":false,"h":false},{"t":"신약에서 베드로와 바울이 이 구절을 그리스도에게 적용한 것(벧전 2:6, 롬 9:33)도 이 두 얼굴의 돌에 근거합니다.","s":538.776,"e":549.582,"p":true,"h":false},{"t":"25장 6절부터 8절은 이 시온에서 일어날 일을 보여 줍니다.","s":550.692,"e":555.213,"p":false,"h":false},{"t":"만민을 위한 잔치가 열리고, 사망을 영원히 멸하시며, 모든 얼굴에서 눈물을 닦아 주신다는 약속입니다.","s":555.876,"e":563.382,"p":false,"h":false},{"t":"바울은 고린도전서 15장 54절에서 이 말씀을 부활의 소망으로 인용합니다.","s":564.012,"e":569.408,"p":false,"h":false},{"t":"26장 19절의 \"주의 죽은 자들은 살아나고 그들의 시체들은 일어나리이다\"는 해석이 갈립니다.","s":570.06,"e":576.513,"p":false,"h":false},{"t":"어떤 학자는 에스겔 37장처럼 민족의 회복을 부활의 그림으로 쓴 것이라 보고, 어떤 학자는 몸의 부활을 직접 말한 구절이라 봅니다.","s":577.152,"e":586.383,"p":false,"h":false},{"t":"이 문제는 개혁주의 안에서도 읽기가 갈리므로 한쪽으로 정하지 않겠습니다.","s":587.016,"e":592.226,"p":false,"h":false},{"t":"다만 25장 8절의 사망의 소멸은 신약이 분명히 부활과 연결해 읽었다는 점을 기억해 두십시오.","s":592.884,"e":599.58,"p":true,"h":false},{"t":"왜 이렇게 번갈아 쓰였는가","s":600.588,"e":602.584,"p":false,"h":true},{"t":"이제 처음의 물음으로 돌아가겠습니다.","s":603.756,"e":606.286,"p":false,"h":false},{"t":"이사야서가 심판과 회복을 이렇게 번갈아 쓴 이유를 본문에서 읽어 낼 수 있는 대로 말씀드리겠습니다.","s":606.924,"e":613.392,"p":true,"h":false},{"t":"먼저, 회복이 값싼 위로가 되지 않게 하려는 것으로 보입니다.","s":614.484,"e":618.887,"p":false,"h":false},{"t":"33장 14절에서 시온의 죄인들이 두려워하며 \"우리 중에 누가 능히 삼키는 불을 감당하며 누가 영영히 타는 것 가운데 거하리요\" 하고 묻습니다.","s":619.452,"e":629.244,"p":false,"h":false},{"t":"회복의 약속이 한창 이어지는 가운데에서도 이 두려움은 지워지지 않습니다.","s":629.82,"e":634.989,"p":false,"h":false},{"t":"이 물음에 대한 이 장의 답은 33장 22절입니다.","s":635.616,"e":639.546,"p":false,"h":false},{"t":"여호와는 우리의 재판장이시요 율법을 세우신 이시요 왕이시니 그가 우리를 구원하시리라는 것입니다.","s":640.188,"e":646.942,"p":false,"h":false},{"t":"삼키는 불 앞에서 설 수 있는 이유는 사람이 의로워서가 아니라 재판장이 직접 구원자가 되시기 때문입니다.","s":647.604,"e":654.629,"p":true,"h":false},{"t":"다음은 심판이 절망이 되지 않게 하려는 것입니다.","s":655.632,"e":658.961,"p":false,"h":false},{"t":"심판만 있는 책이라면 읽는 사람은 체념합니다.","s":659.592,"e":663.004,"p":false,"h":false},{"t":"하나님이 \"원하지 아니하였다\"는 대답에도 기다리신다는 사실이 심판의 말씀을 끝까지 읽어 낼 힘을 줍니다.","s":663.336,"e":670.293,"p":true,"h":false},{"t":"마지막으로 이 구조 자체가 가르침이기도 합니다.","s":671.4,"e":674.817,"p":false,"h":false},{"t":"읽는 사람은 두 말씀 사이를 오가면서 하나님이 두 모습을 가진 분이 아니라 한 모습으로 두 일을 하시는 분임을 배웁니다.","s":675.468,"e":683.635,"p":false,"h":false},{"t":"거룩하시기 때문에 죄를 두고 보지 않으시고, 그 같은 거룩하심이 기다리고 새롭게 하시는 사랑으로 나타납니다.","s":684.288,"e":691.314,"p":true,"h":false},{"t":"비평 학자들 가운데는 회복의 대목이 훗날 편집자들에 의해 심판의 말씀 사이에 끼워 넣어진 것이라 보는 이들이 많습니다.","s":692.352,"e":700.055,"p":false,"h":false},{"t":"이 책의 저자와 형성 과정에 대한 논쟁은 9번 글에서 다루겠습니다.","s":700.704,"e":705.435,"p":false,"h":false},{"t":"어느 쪽 입장이든 지금 우리 손에 있는 책의 최종 형태가 심판과 회복을 서로 얽어 놓았다는 점은 같고, 이 시리즈는 그 최종 형태를 읽고 있습니다.","s":706.068,"e":715.865,"p":true,"h":false},{"t":"34장과 35장: 마지막 한 쌍","s":716.976,"e":720.665,"p":false,"h":true},{"t":"이 열두 장은 34장과 35장으로 닫힙니다.","s":721.8,"e":725.509,"p":false,"h":false},{"t":"34장은 모든 나라를 향한 분노로 시작하여 에돔을 대표로 세워 땅이 유황과 역청으로 변하고 영원히 황폐해진다고 합니다.","s":726.156,"e":734.422,"p":false,"h":false},{"t":"34장 8절은 이것을 \"여호와의 보수일이요 시온의 송사를 위하여 갚아 주는 해\"라고 부릅니다.","s":735.048,"e":741.143,"p":false,"h":false},{"t":"현대 독자에게 이 보복의 언어는 불편합니다.","s":741.78,"e":745.155,"p":false,"h":false},{"t":"학자들은 이 장이 에돔 한 나라의 역사적 운명만이 아니라 열방 전체의 심판을 에돔이라는 이름 아래 그린 것이라고 흔히 읽습니다.","s":745.812,"e":754.092,"p":false,"h":false},{"t":"앞 글에서 본 열방 신탁의 연장입니다.","s":754.74,"e":757.681,"p":false,"h":false},{"t":"이 불편함을 매끈하게 풀어 버리려 하지 않겠습니다.","s":758.304,"e":761.508,"p":false,"h":false},{"t":"다만 책이 이 장에서 끝나지 않는다는 점이 중요합니다.","s":762.156,"e":765.826,"p":true,"h":false},{"t":"바로 뒤에 35장이 옵니다.","s":766.908,"e":769.056,"p":false,"h":false},{"t":"광야와 마른 땅이 즐거워하고 사프란처럼 꽃이 피며, 맹인의 눈이 밝아지고, 절뚝발이가 사슴처럼 뛰며, 광야에 물이 솟습니다.","s":769.68,"e":779.501,"p":false,"h":false},{"t":"그리고 거기에 대로가 있어 \"거룩한 길\"이라 불리고, 속량받은 자들이 그 길로 시온에 이르러 슬픔과 탄식이 달아난다고 합니다(35:8-10).","s":780.156,"e":790.722,"p":false,"h":false},{"t":"심판이 먼저 나오고 회복이 마지막에 나오는 이 순서가 이 단락의 결론입니다.","s":791.244,"e":796.662,"p":false,"h":false},{"t":"이 거룩한 길은 40장 3절의 \"광야에서 외치는 자의 소리, 여호와의 길을 예비하라\"로 이어집니다.","s":797.328,"e":804.306,"p":false,"h":false},{"t":"그 이야기는 9번 글에서 하겠습니다.","s":804.96,"e":807.69,"p":true,"h":false},{"t":"그런데 이 35장의 회복도 곧 현실로 돌아옵니다.","s":808.74,"e":812.68,"p":false,"h":false},{"t":"다음 장인 36장은 갑자기 히스기야 때의 산헤립 침공으로 시작합니다.","s":813.276,"e":818.223,"p":false,"h":false},{"t":"약속의 꽃이 핀 광야 바로 다음에 앗수르 군대가 성벽 앞에 서 있습니다.","s":818.82,"e":823.767,"p":false,"h":false},{"t":"왜 이야기가 이렇게 이어지는지는 8번 물음이 됩니다.","s":824.436,"e":828.256,"p":true,"h":false},{"t":"읽기 어려운 곳과 조심할 곳","s":829.368,"e":831.477,"p"
