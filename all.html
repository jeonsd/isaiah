h":false},{"t":"이것은 제 읽기입니다.","s":227.556,"e":229.536,"p":true,"h":false},{"t":"고치시겠다는 약속, 그리고 공의 없는 금식","s":230.616,"e":234.5,"p":false,"h":true},{"t":"57장은 우상숭배를 다시 책망합니다.","s":235.584,"e":238.781,"p":false,"h":false},{"t":"그러나 이 장에서 가장 눈에 들어오는 것은 15절입니다.","s":239.436,"e":243.214,"p":false,"h":false},{"t":"\"지극히 높고 영원히 거하시며 거룩하다 이름하는 이가 이와 같이 말씀하시되 내가 높고 거룩한 곳에 있으며 또한 통회하고 마음이 겸손한 자와 함께 있나니.\"","s":243.828,"e":254.065,"p":false,"h":false},{"t":"높은 곳과 낮은 마음이 한 분 안에서 만납니다.","s":254.664,"e":257.879,"p":false,"h":false},{"t":"그리고 17절부터 19절은 6장 10절의 말씀을 뒤집는 것처럼 읽힙니다.","s":258.48,"e":263.925,"p":false,"h":false},{"t":"6장 10절은 \"돌이켜 고침을 받을까 하노라\"고 했는데, 57장 18절은 이렇게 말합니다.","s":264.528,"e":271.194,"p":false,"h":false},{"t":"\"내가 그의 길을 보았은즉 그를 고쳐 주며 그를 인도하며.\"","s":271.872,"e":275.754,"p":false,"h":false},{"t":"돌이킬 수 없던 백성에게 하나님이 먼저 고치시겠다고 나서십니다.","s":276.192,"e":280.552,"p":false,"h":false},{"t":"2번 글에서 6장 10절의 목적절에 주목했던 것을 기억하시면, 그 막혀 있던 길이 여기서 하나님 쪽에서 열리는 것으로 읽을 수 있습니다.","s":281.196,"e":290.24,"p":false,"h":false},{"t":"이것도 제 문학적 읽기입니다.","s":290.844,"e":293.11,"p":true,"h":false},{"t":"58장은 같은 공동체의 다른 문제를 보여 줍니다.","s":294.156,"e":297.91,"p":false,"h":false},{"t":"이 백성은 금식합니다.","s":298.476,"e":300.416,"p":false,"h":false},{"t":"그것도 열심히 합니다.","s":300.996,"e":302.726,"p":false,"h":false},{"t":"그런데 3절에서 항의합니다.","s":303.264,"e":305.41,"p":false,"h":false},{"t":"\"우리가 금식하되 주께서 보지 아니하심은 어찌함이니이까.\"","s":305.712,"e":309.32,"p":false,"h":false},{"t":"대답은 날카롭습니다.","s":309.924,"e":311.66,"p":false,"h":false},{"t":"금식하는 날에도 자기 이익을 구하고 일꾼을 압제하며 다투고 싸운다는 것입니다(58:3-4).","s":312.3,"e":319.867,"p":false,"h":false},{"t":"하나님이 기뻐하시는 금식은 흉악의 결박을 풀어 주고, 주린 자에게 양식을 나누며, 유리하는 빈민을 집에 들이는 일입니다(58:6-7).","s":320.364,"e":331.404,"p":false,"h":false},{"t":"그러면 \"네 빛이 아침같이 비칠 것이며\"(58:8)라고 합니다.","s":331.884,"e":338.185,"p":false,"h":false},{"t":"9장에서 흑암에 행하던 백성에게 비친 큰 빛이, 여기서는 공의를 행하는 공동체 안에서 비치는 빛으로 말해집니다.","s":338.796,"e":346.806,"p":false,"h":false},{"t":"회복된 공동체에게도 예배의 형식은 있으나 삶의 정의가 비어 있을 수 있다는 경고입니다.","s":347.472,"e":353.332,"p":true,"h":false},{"t":"59장: 손이 짧은 것이 아니다","s":354.42,"e":357.386,"p":false,"h":true},{"t":"이 단락의 중심은 59장입니다.","s":358.524,"e":361.227,"p":false,"h":false},{"t":"1절과 2절은 이 시리즈가 계속 물어 온 물음에 정면으로 답합니다.","s":361.872,"e":366.243,"p":false,"h":false},{"t":"\"여호와의 손이 짧아 구원하지 못하심도 아니요 귀가 둔하여 듣지 못하심도 아니라 오직 너희 죄악이 너희와 너희 하나님 사이를 갈라놓았고.\"","s":366.876,"e":375.713,"p":false,"h":false},{"t":"구원이 오지 않는 이유가 하나님의 능력 부족이 아니라는 선언입니다.","s":375.984,"e":380.303,"p":false,"h":false},{"t":"9장 후렴의 \"그의 손이 여전히 펴져 있도다\"를 읽고 느낀 답답함의 한 답이 여기 있다고 저는 봅니다.","s":380.916,"e":387.774,"p":false,"h":false},{"t":"손은 짧아진 적이 없고, 문제는 사이를 막은 죄입니다.","s":388.44,"e":392.755,"p":true,"h":false},{"t":"3절부터 8절은 백성의 죄를 열거하고, 9절부터 15절에서 말하는 이가 \"우리\"로 바뀝니다.","s":393.84,"e":400.787,"p":false,"h":false},{"t":"\"그러므로 공평이 우리에게서 멀고 의가 우리에게 미치지 못한다.","s":401.436,"e":405.788,"p":false,"h":false},{"t":"우리가 빛을 바라나 어둠뿐이요...","s":406.404,"e":408.616,"p":false,"h":false},{"t":"우리가 소경같이 담을 더듬으며\"(59:9-10).","s":409.248,"e":413.808,"p":false,"h":false},{"t":"그리고 12절은 이렇게 고백합니다.","s":414.36,"e":416.905,"p":false,"h":false},{"t":"\"우리의 허물이 주 앞에 많고 우리의 죄가 우리에게 대하여 증언하오니.\"","s":417.42,"e":421.977,"p":false,"h":false},{"t":"이 대목이 중요합니다.","s":422.604,"e":424.314,"p":false,"h":false},{"t":"1~39장에서 이 백성은 고소당하는 쪽이었고 책망을 듣고도 돌이키지 않았습니다.","s":424.98,"e":431.322,"p":false,"h":false},{"t":"그런데 이제 처음으로 백성 자신이 자기 죄를 자기 입으로 말합니다.","s":431.928,"e":436.32,"p":false,"h":false},{"t":"53장 4절에서 \"우리\"가 처음으로 알아본 것과 같은 형식입니다.","s":436.932,"e":441.759,"p":false,"h":false},{"t":"탄식이 계속된다는 것은 이 책의 후반부에서 백성이 달라졌다는 증거이기도 합니다.","s":442.404,"e":448.163,"p":false,"h":false},{"t":"고소를 부인하던 백성이 고백하는 백성이 되었습니다.","s":448.776,"e":452.52,"p":true,"h":false},{"t":"그리고 15절 끝부터 16절이 이어집니다.","s":453.6,"e":456.771,"p":false,"h":false},{"t":"하나님이 공의가 없는 것을 보시고 \"사람이 없음을 보시며 중보자가 없음을 이상히 여기셨으므로 자기 팔로 구원을 베푸시고 자기의 공의를 스스로 의지하사.\"","s":457.056,"e":467.162,"p":false,"h":false},{"t":"12번 글에서 이 구절을 본 적이 있습니다.","s":467.748,"e":470.627,"p":false,"h":false},{"t":"53장 1절의 \"여호와의 팔이 누구에게 나타났느냐\"와 같은 \"팔\"입니다.","s":470.952,"e":475.862,"p":false,"h":false},{"t":"53장의 대속이 이미 이루어졌다면 왜 여기서 다시 \"중보자가 없다\"고 말하는가 하는 의문이 생길 수 있습니다.","s":476.532,"e":483.917,"p":false,"h":false},{"t":"이 점은 읽기가 갈립니다.","s":484.596,"e":486.526,"p":false,"h":false},{"t":"한 읽기는 59장이 53장 이전의 상태를 회고하는 말이라 하고, 다른 읽기는 53장의 구원이 선포되었어도 그 구원이 온 공동체에서 완성되려면 하나님이 다시 일하셔야 한다는 말이라 합니다.","s":487.188,"e":500.592,"p":false,"h":false},{"t":"저는 후자 쪽으로 읽는 것이 이 장의 흐름과 맞는다고 보지만, 본문이 이 문제를 직접 설명하지는 않으므로 제 판단일 뿐입니다.","s":501.192,"e":509.585,"p":true,"h":false},{"t":"구속자가 오시고, 영이 머문다","s":510.66,"e":513.504,"p":false,"h":true},{"t":"20절과 21절은 이 장의 답입니다.","s":514.692,"e":517.733,"p":false,"h":false},{"t":"\"구속자가 시온에 이르며 야곱 가운데에서 죄과를 떠나는 자에게 이르리라.\"","s":518.328,"e":523.072,"p":false,"h":false},{"t":"바울은 로마서 11장 26절에서 이 구절을 인용합니다.","s":523.656,"e":527.846,"p":false,"h":false},{"t":"4번 글에서 \"온 이스라엘이 구원을 얻으리라\"의 읽기가 갈린다고 말씀드린 그 대목입니다.","s":528.444,"e":534.409,"p":true,"h":false},{"t":"이어서 21절은 언약을 말합니다.","s":535.5,"e":538.12,"p":false,"h":false},{"t":"\"내가 그들과 세운 언약이 이러하니 곧 네 위에 있는 나의 영과 네 입에 두는 나의 말이 이제부터 영원까지 네 입에서나 네 후손의 입에서나 네 후손의 후손의 입에서 떠나지 아니하리라.\"","s":538.812,"e":550.584,"p":false,"h":false},{"t":"여기서 이 책의 두 줄기가 만납니다.","s":551.16,"e":553.916,"p":false,"h":false},{"t":"하나는 말씀입니다.","s":554.58,"e":556.121,"p":false,"h":false},{"t":"40장 8절의 \"우리 하나님의 말씀은 영원히 서리라\"와 55장 11절의 \"헛되이 돌아오지 아니하고\"가 이 줄기입니다.","s":556.74,"e":565.12,"p":false,"h":false},{"t":"다른 하나는 영입니다.","s":565.74,"e":567.383,"p":false,"h":false},{"t":"32장 15절의 \"위에서부터 성령을 우리에게 부어 주시리니\"와 44장 3절의 \"내 영을 네 자손에게 부어 주리니\"가 이 줄기입니다.","s":567.972,"e":576.891,"p":false,"h":false},{"t":"이 두 줄기가 한 언약 안에서 후손에게 이어진다고 합니다.","s":577.512,"e":581.521,"p":true,"h":false},{"t":"이 구절은 이 글의 물음에 가장 직접적인 답을 줍니다.","s":582.624,"e":586.408,"p":false,"h":false},{"t":"53장은 죄의 문제를 해결합니다.","s":587.052,"e":589.761,"p":false,"h":false},{"t":"그러나 이 책이 처음부터 물어 온 것은 죄책만이 아니라 닫힌 눈과 완고한 마음이었습니다.","s":590.364,"e":596.715,"p":false,"h":false},{"t":"닫힌 마음이 열리는 일은 영이 부어지는 일이며, 이는 사죄와 같은 순간에 완성되는 일이 아니라 세대를 이어 가는 일로 그려집니다.","s":597.312,"e":605.947,"p":false,"h":false},{"t":"사함과 변화는 연결되어 있으되 같은 것이 아니라는 이해가 책 안에서 가능합니다.","s":606.6,"e":611.735,"p":false,"h":false},{"t":"이것은 제 종합입니다.","s":612.36,"e":614.264,"p":false,"h":false},{"t":"개혁주의 전통이 칭의와 성화를 구별하되 나누지 않는 것과 이 구조가 어울린다고 저는 봅니다.","s":614.88,"e":621.037,"p":false,"h":false},{"t":"다만 이사야서 자체가 이 교리를 정리한 것은 아니며, 이 연결은 신학적 해석입니다.","s":621.684,"e":627.719,"p":true,"h":false},{"t":"60~62장: 약속은 줄어들지 않는다","s":628.812,"e":632.954,"p":false,"h":true},{"t":"59장 뒤에 오는 60장부터 62장은 영광의 약속입니다.","s":634.14,"e":638.831,"p":false,"h":false},{"t":"60장 1절은 \"일어나 빛을 발하라 이는 네 빛이 이르렀고\"라고 하고, 61장 1절부터 3절은 기름 부음 받은 이가 가난한 자에게 복음을 전하고 마음이 상한 자를 고치며 갇힌 자에게 놓임을 선포한다고 말합니다.","s":639.468,"e":654.147,"p":false,"h":false},{"t":"예수께서 나사렛 회당에서 이 구절을 읽으시고 \"이 글이 오늘 너희 귀에 응하였느니라\"고 하셨습니다(눅 4:21).","s":654.768,"e":663.688,"p":false,"h":false},{"t":"이 장들은 탄식으로 책이 끝나지 않도록 약속을 두텁게 쌓습니다.","s":664.2,"e":668.781,"p":false,"h":false},{"t":"59장의 고백 바로 뒤에 이 약속이 오는 순서가 중요합니다.","s":669.384,"e":673.489,"p":false,"h":false},{"t":"고백이 먼저 있고, 약속이 이어집니다.","s":674.136,"e":677.416,"p":true,"h":false},{"t":"63~64장: 마지막 기도","s":678.528,"e":682.194,"p":false,"h":true},{"t":"그리고 63장 7절부터 64장 12절에 이 책에서 가장 긴 공동체의 기도가 있습니다.","s":683.352,"e":689.946,"p":false,"h":false},{"t":"구조가 분명합니다.","s":690.552,"e":692.107,"p":false,"h":false},{"t":"먼저 은혜를 회상합니다(63:7-14).","s":692.676,"e":697.031,"p":false,"h":false},{"t":"하나님이 출애굽에서 그들과 함께하시고 \"그들의 모든 고난에 동참하사\"(63:9) 안아 주셨다는 것입니다.","s":697.536,"e":705.746,"p":false,"h":false},{"t":"그런데 10절은 곧바로 말합니다.","s":706.392,"e":708.899,"p":false,"h":false},{"t":"\"그러나 그들이 반역하여 주의 성령을 근심하게 하셨으므로.\"","s":709.452,"e":713.246,"p":false,"h":false},{"t":"은혜의 기억이 곧 죄의 기억으로 이어집니다.","s":713.736,"e":716.791,"p":true,"h":false},{"t":"그다음 탄원입니다.","s":717.876,"e":719.318,"p":false,"h":false},{"t":"15절에서 백성이 묻습니다.","s":719.784,"e":721.964,"p":false,"h":false},{"t":"\"주의 열성과 주의 능력이 어디 있나이까.\"","s":722.484,"e":725.262,"p":false,"h":false},{"t":"이 \"열성\"은 앞에서 따라온 \"만군의 여호와의 열심이 이를 이루시리라\"(9:7; 37:32)와 이어 읽을 수 있습니다.","s":725.616,"e":735.563,"p":false,"h":false},{"t":"약속받은 백성이 그 열심이 어디 있느냐고 묻는 것입니다.","s":736.2,"e":740.181,"p":false,"h":false},{"t":"이 물음은 불신이라기보다 약속을 붙들고 하는 물음입니다.","s":740.808,"e":745.023,"p":true,"h":false},{"t":"16절의 고백도 눈에 띕니다.","s":746.136,"e":748.402,"p":false,"h":false},{"t":"\"아브라함은 우리를 모르고 이스라엘은 우리를 인정하지 아니할지라도 주는 우리 아버지시라.\"","s":748.944,"e":754.673,"p":false,"h":false},{"t":"조상의 공로에 기대지 않고 직접 \"아버지\"를 부릅니다.","s":755.316,"e":759.407,"p":false,"h":false},{"t":"이 부름은 1장 2절의 \"자식을 양육하였거늘 그들이 나를 거역하였느니라\"로 시작한 책의 첫 장면과 이어집니다.","s":760.068,"e":767.741,"p":false,"h":false},{"t":"하나님이 아버지로서 탄식하며 시작한 책이, 백성이 하나님을 \"우리 아버지\"라 부르는 기도로 맺어지는 것입니다.","s":768.384,"e":775.938,"p":false,"h":false},{"t":"이 수미상관은 제 읽기입니다.","s":776.592,"e":779.097,"p":true,"h":false},{"t":"17절은 2번 글에서 다룬 구절입니다.","s":780.192,"e":783.113,"p":false,"h":false},{"t":"\"어찌하여 우리로 주의 길에서 떠나게 하시며 우리 마음을 완고하게 하사.\"","s":783.432,"e":788.239,"p":false,"h":false},{"t":"그때 이 기도가 책임을 피하려는 말이 아니라 무력함의 고백이라는 점을 보았습니다.","s":788.832,"e":794.327,"p":false,"h":false},{"t":"이제 이 책의 마지막 부분에서 그 기도가 다시 나옵니다.","s":794.988,"e":798.979,"p":false,"h":false},{"t":"6장에서 선고된 완고함이 책의 맨 끝에서 기도로 올려지는 것입니다.","s":799.632,"e":804.326,"p":true,"h":false},{"t":"그리고 64장 1절의 간구가 이 기도의 중심입니다.","s":805.392,"e":809.445,"p":false,"h":false},{"t":"\"원하건대 주는 하늘을 찢고 강림하사.\"","s":810.072,"e":812.741,"p":false,"h":false},{"t":"40장 3절의 \"여호와의 길을 예비하라\"에서 하나님이 오시는 그림이 시작되었는데, 이제 백성이 직접 \"오소서\" 하고 부릅니다.","s":813.384,"e":821.788,"p":false,"h":false},{"t":"이 간구는 초대의 말씀을 받은 백성의 응답이라고 읽을 수 있습니다.","s":822.42,"e":826.926,"p":false,"h":false},{"t":"마가복음 1장 10절이 예수의 세례에서 \"하늘이 갈라지심\"을 말하는 것이 이 구절과 이어진다고 보는 학자들이 있으나, 이 연결은 제가 확인하지 못했으므로 책으로 내실 때 대조가 필요합니다.","s":827.568,"e":840.273,"p":true,"h":false},{"t":"5절부터 7절은 고백입니다.","s":841.356,"e":843.787,"p":false,"h":false},{"t":"\"우리는 다 부정한 자 같아서 우리의 의는 다 더러운 옷 같으며.\"","s":844.056,"e":848.394,"p":false,"h":false},{"t":"여기서 \"더러운 옷\"은 의식적으로 부정한 옷을 가리키는 표현으로 읽는 것이 일반적이라고 알고 있습니다.","s":849.024,"e":855.816,"p":false,"h":false},{"t":"정확한 용법은 원어 사전으로 확인해 주십시오.","s":856.476,"e":859.506,"p":false,"h":false},{"t":"이 구절의 요점은 분명합니다.","s":859.968,"e":862.212,"p":false,"h":false},{"t":"이 백성이 가진 의로는 하나님 앞에 설 수 없다는 고백입니다.","s":862.812,"e":866.931,"p":false,"h":false},{"t":"그리고 8절이 이어집니다.","s":867.564,"e":869.492,"p":false,"h":false},{"t":"\"그러나 여호와여 이제나 주는 우리 아버지시니이다 우리는 진흙이요 주는 토기장이시니.\"","s":870.012,"e":876.031,"p":false,"h":false},{"t":"45장 9절에서 토기장이와 다투지 말라고 경고받았던 토기가, 여기서는 토기장이의 손에 자신을 맡기며 부르짖습니다.","s":876.636,"e":884.955,"p":false,"h":false},{"t":"같은 비유가 반발의 자리에서 한 번, 항복의 자리에서 한 번 쓰이는 것입니다.","s":885.6,"e":890.931,"p":true,"h":false},{"t":"왜 탄식이 계속되는가","s":892.008,"e":893.892,"p":false,"h":true},{"t":"이제 처음의 물음에 본문에서 읽을 수 있는 만큼 답하겠습니다.","s":895.068,"e":899.224,"p":true,"h":false},{"t":"우선, 선포된 구원과 이루어진 구원 사이에 시간이 있습니다.","s":900.324,"e":904.7,"p":false,"h":false},{"t":"40장 1절의 \"위로하라\"는 선언이고, 60~62장의 영광은 약속입니다.","s":905.292,"e":911.273,"p":false,"h":false},{"t":"이 책은 처음부터 말씀을 먼저 주시고 사건을 뒤따르게 하는 방식으로 일해 왔습니다.","s":911.916,"e":917.445,"p":false,"h":false},{"t":"위로가 사건에 앞서는 것(9번 글에서 본 대로)은 탄식이 그 사건 이후에도 남는 것과 같은 구조의 다른 면입니다.","s":918.072,"e":926.299,"p":false,"h":false},{"t":"약속은 확실하지만 아직 이루어지는 중에 있습니다.","s":926.964,"e":930.305,"p":true,"h":false},{"t":"다음으로, 죄책이 해결되는 일과 마음이 새로워지는 일은 같은 일이 아닙니다.","s":931.392,"e":936.587,"p":false,"h":false},{"t":"53장은 앞의 일을 다루고, 59장 21절의 영과 말씀의 언약은 뒤의 일을 약속합니다.","s":937.224,"e":944.029,"p":false,"h":false},{"t":"그 사이의 시간에 공동체는 여전히 자기 죄를 봅니다.","s":944.388,"e":948.147,"p":false,"h":false},{"t":"고백이 계속되는 것은 새로워지는 중에 있는 공동체의 모습이라고 읽을 수 있습니다.","s":948.78,"e":954.173,"p":true,"h":false},{"t":"그리고 이 책은 회복된 공동체의 불순함을 감추지 않습니다.","s":955.26,"e":959.495,"p":false,"h":false},{"t":"56장의 눈먼 파수꾼, 58장의 공의 없는 금식, 65장에서 종들과 배반자를 가르는 선(65:8-15)이 그것입니다.","s":960.048,"e":971.517,"p":false,"h":false},{"t":"4번 글에서 본 대로 남은 자는 선택된 우월한 집단이 아니라 은혜로 붙들린 사람들입니다.","s":972.18,"e":978.109,"p":false,"h":false},{"t":"회복된 공동체가 완전하다는 말은 어디에도 없고, 오히려 그 안에서도 종과 배반자를 구별하시는 하나님이 그려집니다.","s":978.768,"e":987.05,"p":true,"h":false},{"t":"끝으로, 탄식은 실패의 흔적이 아니라 믿음의 형식으로 책에 남겨져 있습니다.","s":988.164,"e":993.793,"p":false,"h":false},{"t":"이 마지막 기도는 은혜의 회상으로 시작하고 아버지 호칭으로 이어지며, \"오소서\"로 간구합니다.","s":994.428,"e":1001.059,"p":false,"h":false},{"t":"하나님이 이 기도를 지우지 않고 정경에 두셨다는 것이 중요합니다.","s":1001.664,"e":1006.316,"p":false,"h":false},{"t":"탄식하는 백성을 향해 65장 1절과 2절의 응답이 이어집니다.","s":1006.884,"e":1011.602,"p":false,"h":false},{"t":"\"나는 내 이름을 부르지 아니하던 나라에게 말하기를 내가 여기 있노라 내가 여기 있노라 하였으며 나는 패역하는 백성 곧 ...","s":1012.212,"e":1019.971,"p":false,"h":false},{"t":"종일 손을 펴서 불렀나니.\"","s":1020.492,"e":1022.503,"p":false,"h":false},{"t":"이 부르는 손은 14번 글에서 이어 읽겠습니다.","s":1023.12,"e":1026.512,"p":true,"h":false},{"t":"이미와 아직","s":1027.584,"e":1028.693,"p":false,"h":true},{"t":"신약은 같은 구조를 그대로 가지고 있습니다.","s":1029.852,"e":1032.899,"p":false,"h":false},{"t":"그리스도 안에서 죄가 사해졌다고 선언하면서도, 요한일서 1장 8절부터 9절은 \"만일 우리가 죄가 없다고 하면 스스로 속이는 것이니\", \"우리가 우리 죄를 자백하면 그는 미쁘시고 의로우사 우리 죄를 사하시고\"라고 합니다.","s":1033.488,"e":1048.577,"p":false,"h":false},{"t":"개혁주의 전통은 이것을 성화의 문제로 설명해 왔습니다.","s":1049.22,"e":1053.08,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서는 이 생에서 성도 안에 부패의 잔재가 남아 있어서 영과 육의 싸움이 계속된다고 말하는 것으로 알고 있습니다.","s":1053.72,"e":1062.514,"p":false,"h":false},{"t":"조항 번호와 정확한 문구는 확인하지 못했으므로, 책으로 내실 때는 원문을 대조해 주십시오.","s":1063.188,"e":1069.264,"p":false,"h":false},{"t":"이사야서의 탄식과 이 교리는 같은 현실의 구약과 신약 쪽 표현으로 읽을 수 있습니다.","s":1069.848,"e":1075.98,"p":false,"h":false},{"t":"이것은 제 연결입니다.","s":1076.616,"e":1078.489,"p":true,"h":false},{"t":"읽는 사람에게 남는 것","s":1079.532,"e":1081.246,"p":false,"h":true},{"t":"이 장들은 구원을 받은 사람이 겪는 곤혹에 이름을 붙여 줍니다.","s":1082.232,"e":1086.39,"p":false,"h":false},{"t":"용서를 믿는데도 같은 죄를 다시 짓고, 위로를 받았는데도 마음이 여전히 굳어 있다고 느끼는 경험입니다.","s":1086.948,"e":1094.157,"p":false,"h":false},{"t":"이사야서는 그 경험이 믿음의 부족을 증명한다고 말하지 않고, 그 경험을 하나님 앞에 그대로 올려 드리는 기도의 길을 보여 줍니다.","s":1094.796,"e":1103.372,"p":false,"h":false},{"t":"회상하고, 고백하고, 아버지를 부르고, \"오소서\" 하는 것입니다.","s":1104.012,"e":1109.538,"p":true,"h":false},{"t":"그리고 이 기도가 기도로 끝나지 않는다는 점을 기억해야 합니다.","s":1110.636,"e":1115.019,"p":false,"h":false},{"t":"59장은 하나님의 손이 짧지 않다고 했고, 구속자가 오시리라고 했으며, 영과 말씀이 후손에게 이어지리라고 했습니다.","s":1115.568,"e":1124.236,"p":false,"h":false},{"t":"탄식하는 백성에게 이 책이 주는 것은 고백을 거두라는 말이 아니라, 고백하는 자리로 오시는 분에 대한 약속입니다.","s":1124.856,"e":1132.625,"p":true,"h":false}]},{"title":"14. 이스라엘의 불순종과 열방의 구원은 어떻게 이어지는가","audio":"doc14_2610241127.mp3","dur":879.6,"segs":[{"t":"이스라엘의 불순종과 열방의 구원은 어떻게 이어지는가: 이사야서가 그리는 만민의 길","s":0,"e":6.344,"p":false,"h":true},{"t":"본문: 이사야 2:2-4; 19:16-25; 25:6-9; 42:1-7; 45:14-25; 49:1-6; 56:1-8; 60:1-14; 65:1-2; 66:18-24 (함께 읽을 본문: 창 12:1-3; 왕상 8:41-43; 욘 4:10-11; 마 21:12-13; 행 13:44-48; 28:23-28; 롬 9:25-26; 10:19-21; 11:11-32; 엡 2:11-22)","s":7.164,"e":60.935,"p":true,"h":false},{"t":"앞 글들에서 이 물음은 두 번 미뤄졌습니다.","s":61.848,"e":65.017,"p":false,"h":false},{"t":"6번에서는 애굽을 \"나의 백성\"이라 부르는 장면을, 10번에서는 고레스 이후 열방이 이스라엘에게 와서 \"하나님이 너희 중에 계시다\"고 말하는 장면을 보았습니다.","s":65.664,"e":76.461,"p":false,"h":false},{"t":"13번은 책의 끝에서 이스라엘의 탄식이 계속되는 것을 보았고, 65장 1~2절의 부르는 손을 예고했습니다.","s":77.112,"e":85.093,"p":false,"h":false},{"t":"이제 이 물음을 정면으로 다룹니다.","s":85.752,"e":88.246,"p":false,"h":false},{"t":"이스라엘은 거듭 불순종했는데, 왜 이 책은 열방의 구원을 그렇게 크게 말하는가.","s":88.848,"e":94.786,"p":false,"h":false},{"t":"둘은 서로 이어지는가, 아니면 이스라엘이 밀려나고 열방이 그 자리를 차지하는가.","s":95.4,"e":101.27,"p":true,"h":false},{"t":"책의 처음과 끝에 놓인 같은 그림","s":102.312,"e":104.914,"p":false,"h":true},{"t":"이 주제는 곁가지가 아니라 책의 뼈대입니다.","s":106.056,"e":109.169,"p":false,"h":false},{"t":"2장 2절부터 4절은 \"말일에\" 모든 민족이 여호와의 산으로 몰려와 \"그의 길을 우리에게 가르치시리니\"라고 하고, 칼을 쳐서 보습을 만든다고 합니다.","s":109.8,"e":119.985,"p":false,"h":false},{"t":"66장 18절부터 21절은 같은 그림으로 책을 닫습니다.","s":120.636,"e":125.352,"p":false,"h":false},{"t":"하나님이 모든 나라와 언어의 사람들을 모으시고, 그들이 하나님의 영광을 보며, 열방 가운데서 일부를 제사장과 레위인으로 삼으시겠다고 합니다.","s":125.892,"e":135.363,"p":false,"h":false},{"t":"처음 비전과 마지막 비전이 같은 방향을 가리킵니다.","s":136.008,"e":139.45,"p":false,"h":false},{"t":"이 틀 사이에서 이스라엘의 실패와 종의 고난이 일어납니다.","s":140.112,"e":144.194,"p":false,"h":false},{"t":"열방의 구원은 이스라엘의 실패 뒤에 덧붙은 보상책이 아니라, 책이 처음부터 향하던 목적지로 읽힙니다.","s":144.828,"e":152.021,"p":true,"h":false},{"t":"이스라엘의 사명은 처음부터 열방을 향해 있었다","s":153.108,"e":156.523,"p":false,"h":true},{"t":"이 방향은 아브라함에게 하신 약속, 곧 \"땅의 모든 족속이 너로 말미암아 복을 얻을 것이라\"(창 12:3)와 이어집니다.","s":157.644,"e":167.337,"p":false,"h":false},{"t":"이사야서에서 이 사명은 종의 노래에서 가장 분명합니다.","s":168.012,"e":172.29,"p":false,"h":false},{"t":"42장 6절은 종을 \"백성의 언약과 이방의 빛\"으로 세운다고 하고, 49장 6절은 야곱의 지파를 일으키는 일은 \"오히려 가벼운 일\"이며 이방의 빛이 되어 땅 끝까지 구원을 이르게 하리라고 합니다.","s":172.872,"e":186.189,"p":false,"h":false},{"t":"11번 글에서 본 대로 이 사명은 이스라엘이 감당하지 못하고 한 종이 대신 이루는 일로 그려집니다.","s":186.876,"e":193.93,"p":true,"h":false},{"t":"여기서 이 글의 물음에 첫 답이 나옵니다.","s":195.012,"e":197.852,"p":false,"h":false},{"t":"이스라엘의 불순종은 열방 구원의 길을 막지 못했고, 오히려 그 길이 어떤 분을 통해 열리는지를 드러냈습니다.","s":198.468,"e":206.078,"p":false,"h":false},{"t":"이스라엘이 빛이 되지 못했기에 빛이 되실 분이 오십니다.","s":206.712,"e":210.272,"p":false,"h":false},{"t":"불순종과 열방의 구원은 대립이 아니라, 하나님이 실패한 사명을 직접 맡아 이루신다는 한 이야기의 두 면입니다.","s":210.888,"e":218.437,"p":false,"h":false},{"t":"이것은 책의 구조를 따라 읽은 제 종합입니다.","s":219.096,"e":222.387,"p":true,"h":false},{"t":"열방은 어떤 자리로 들어오는가","s":223.344,"e":225.562,"p":false,"h":true},{"t":"열방이 들어오는 모습이 책 안에서 한 가지로 그려지지는 않습니다.","s":226.728,"e":231.059,"p":false,"h":false},{"t":"몇 가지를 구분해서 보겠습니다.","s":231.696,"e":233.828,"p":true,"h":false},{"t":"먼저 굴복하고 찾아오는 열방의 그림이 있습니다.","s":234.936,"e":238.39,"p":false,"h":false},{"t":"45장 14절은 애굽과 구스의 재물이 이스라엘에게 오고 그들이 엎드려 \"하나님이 과연 너희 중에 계시다\"고 말한다고 하고, 60장은 열방이 빛을 향해 오며 그 재물을 가져온다고 합니다.","s":239.04,"e":251.896,"p":false,"h":false},{"t":"이 그림은 이스라엘 중심의 언어로 읽힙니다.","s":252.54,"e":255.728,"p":false,"h":false},{"t":"그러나 이것을 이스라엘의 우월로만 읽으면 45장 22절의 \"땅 끝의 모든 사람아 나를 앙망하라 그리하면 구원을 받으리라\"를 놓칩니다.","s":256.32,"e":265.787,"p":false,"h":false},{"t":"열방이 향하는 곳은 이스라엘이 아니라 이스라엘 중에 계신 하나님입니다.","s":266.436,"e":271.33,"p":true,"h":false},{"t":"다음으로 동등하게 이름을 받는 열방의 그림이 있습니다.","s":272.448,"e":276.051,"p":false,"h":false},{"t":"6번 글에서 본 19장 24절부터 25절이 가장 놀랍습니다.","s":276.696,"e":281.536,"p":false,"h":false},{"t":"애굽은 \"나의 백성\", 앗수르는 \"나의 손으로 지은\", 이스라엘은 \"나의 기업\"으로 불립니다.","s":282.168,"e":289.087,"p":false,"h":false},{"t":"56장 3절부터 8절은 이방인과 고자가 하나님의 집에서 \"아들과 딸보다 나은 이름\"을 받는다고 합니다.","s":289.728,"e":297.056,"p":false,"h":false},{"t":"혈통의 경계로 막혀 있던 사람들이 은혜로 들어옵니다.","s":297.72,"e":301.373,"p":false,"h":false},{"t":"4번 글에서 본 대로 남은 자의 선이 혈통에서 은혜로 옮겨 가는 모습과 같습니다.","s":301.968,"e":307.172,"p":true,"h":false},{"t":"마지막으로 섬기는 자리로 부름받는 열방의 그림이 있습니다.","s":308.268,"e":312.246,"p":false,"h":false},{"t":"66장 21절에서 열방 가운데서 제사장과 레위인이 나옵니다.","s":312.84,"e":317.51,"p":false,"h":false},{"t":"이 구절은 이스라엘 가운데서 나온다는 읽기도 있고 열방 가운데서 나온다는 읽기도 있어서, 학자들 사이에 갈립니다.","s":318.168,"e":326.171,"p":false,"h":false},{"t":"히브리어 문장이 둘 다 가능하다는 지적이 있는데, 저는 확인하지 못했으므로 원어 성경으로 대조하시길 권합니다.","s":326.808,"e":334.418,"p":false,"h":false},{"t":"어느 쪽이든 제사장직이 한 혈통에 닫혀 있지 않다는 방향은 분명하다고 봅니다.","s":335.088,"e":340.017,"p":false,"h":false},{"t":"이것은 제 판단입니다.","s":340.668,"e":342.566,"p":true,"h":false},{"t":"65장 1~2절: 부르는 손","s":343.62,"e":346.974,"p":false,"h":true},{"t":"13번 글에서 미룬 구절입니다.","s":348.048,"e":350.404,"p":false,"h":false},{"t":"65장 1절은 \"나는 내게 구하지 아니하던 자에게 물음을 받았으며 나를 찾지 아니하던 자에게 찾아냄을 입었노라 내 이름을 부르지 아니하던 나라에게 내가 여기 있노라 내가 여기 있노라 하였노라\"고 합니다.","s":350.712,"e":364.314,"p":false,"h":false},{"t":"2절은 이어서 \"순종하지 아니하고 자기 생각대로 옳지 않은 길을 걸어가는 패역한 백성\"에게 \"종일 내 손을 폈다\"고 합니다.","s":364.968,"e":373.147,"p":true,"h":false},{"t":"이 두 절의 배치가 중요합니다.","s":374.256,"e":376.538,"p":false,"h":false},{"t":"열방에게 \"내가 여기 있노라\"고 하시는 말씀과, 이스라엘에게 종일 손을 펴셨다는 말씀이 나란히 있습니다.","s":377.208,"e":384.505,"p":false,"h":false},{"t":"9장에서 네 번 반복된 후렴의 \"펴진 손\"이 심판의 손이었다면, 여기서 손은 부르는 손입니다.","s":385.164,"e":391.747,"p":false,"h":false},{"t":"같은 하나님이 같은 손으로 열방도 부르시고 이스라엘도 부르십니다.","s":392.328,"e":397.013,"p":false,"h":false},{"t":"바울은 로마서 10장 20절부터 21절에서 이 두 구절을 나누어 인용하며 앞 구절은 이방인에게, 뒤 구절은 이스라엘에게 적용합니다.","s":397.656,"e":407.478,"p":false,"h":false},{"t":"이 인용이 본문의 원래 대상, 곧 1절의 \"나를 찾지 아니하던 자\"가 누구를 가리키는가에 대한 해석과 맞는지는 학자들 사이에 논쟁이 있습니다.","s":408.132,"e":417.799,"p":false,"h":false},{"t":"일부는 1절도 이스라엘 가운데 불순종하는 자를 가리킨다고 읽습니다.","s":418.464,"e":423.169,"p":false,"h":false},{"t":"이 점은 정하지 않겠습니다.","s":423.828,"e":425.856,"p":false,"h":false},{"t":"어느 읽기든 2절의 \"종일 손을 폈다\"는 말이 이스라엘에게 하나님의 인내가 끝나지 않았음을 말한다는 점은 같습니다.","s":426.492,"e":433.547,"p":true,"h":false},{"t":"열방의 구원은 이스라엘이 버려졌다는 뜻인가","s":434.664,"e":437.983,"p":false,"h":true},{"t":"이 물음이 이 글에서 가장 무겁습니다.","s":439.2,"e":442.055,"p":false,"h":false},{"t":"이스라엘이 불순종하는 동안 열방이 들어온다면, 이스라엘은 자리를 내준 것인가.","s":442.656,"e":448.341,"p":false,"h":false},{"t":"사도행전 28장의 바울이 이 물음을 극적으로 보여 줍니다.","s":448.992,"e":453.234,"p":false,"h":false},{"t":"바울이 로마에서 유대인에게 말씀을 전했으나 믿는 사람도 있고 믿지 않는 사람도 있자, 이사야 6장 9~10절을 인용하며 \"이 하나님의 구원이 이방인에게 보내어진 줄을 알라\"(행 28:28)고 합니다.","s":453.816,"e":470.219,"p":false,"h":false},{"t":"1번 글에서 본 대로 이사야의 사명이 실패로 끝난 곳에서 열방으로 문이 열린 것입니다.","s":470.844,"e":476.762,"p":true,"h":false},{"t":"로마서 9장부터 11장은 이 물음에 대한 바울의 길고 신중한 답입니다.","s":477.828,"e":482.931,"p":false,"h":false},{"t":"11장 1절에서 바울은 \"하나님이 그의 백성을 버리셨느냐 그럴 수 없느니라\"고 하고, 자신이 이스라엘 사람임을 증거로 듭니다.","s":483.552,"e":491.983,"p":false,"h":false},{"t":"이어서 이스라엘의 일부가 우둔해진 것이 이방인의 충만한 수가 들어오기까지이고(11:25), 이방인이 들어오는 것이 이스라엘을 시기하게 하려는 것이라고 합니다(11:11).","s":492.624,"e":505.592,"p":false,"h":false},{"t":"그리고 11장 26절에서 \"온 이스라엘이 구원을 얻으리라\"고 하고 이사야 59장 20절부터 21절을 인용합니다.","s":506.124,"e":514.718,"p":false,"h":false},{"t":"13번 글에서 본 그 구절입니다.","s":515.304,"e":517.797,"p":false,"h":false},{"t":"이 \"온 이스라엘\"을 어떻게 읽을지는 4번 글에서 세 갈래로 소개했고, 개혁주의 안에서도 갈리는 문제여서 여기서도 정하지 않겠습니다.","s":518.076,"e":527.382,"p":false,"h":false},{"t":"다만 세 읽기 모두 바울이 이 논의를 하나님의 긍휼을 찬양하는 송영으로 맺었다는 점(11:33-36)을 존중합니다.","s":528.048,"e":537.354,"p":true,"h":false},{"t":"이사야서 안에서 이 물음에 대한 답의 방향은 분명하다고 봅니다.","s":538.452,"e":542.534,"p":false,"h":false},{"t":"열방이 들어오는 것은 이스라엘을 밀어내는 일로 그려지지 않고, 오히려 이스라엘이 회복되는 일과 함께 일어납니다.","s":543.132,"e":550.922,"p":false,"h":false},{"t":"49장 5절부터 6절에서 종은 야곱을 돌아오게 하는 일과 이방의 빛이 되는 일을 둘 다 맡고, 60장에서 열방이 오는 곳은 회복된 시온이며, 66장 20절은 열방이 이스라엘의 형제들을 하나님께 예물로 데려온다고 합니다.","s":551.556,"e":567.2,"p":false,"h":false},{"t":"이 구절들이 보여 주는 것은 교체가 아니라 확장입니다.","s":567.864,"e":571.649,"p":false,"h":false},{"t":"이것은 제 읽기이고, 이 확장이 민족 이스라엘의 장차 회복을 포함하는지는 앞서 말한 대로 갈리는 문제입니다.","s":572.328,"e":579.956,"p":true,"h":false},{"t":"신약이 이 줄기를 어떻게 이었는가","s":581.04,"e":583.684,"p":false,"h":true},{"t":"신약은 이 책의 비전이 성취되는 방식을 이렇게 증언합니다.","s":584.856,"e":588.791,"p":false,"h":false},{"t":"예수께서 성전을 정화하시며 56장 7절을 인용하여 \"내 집은 만민이 기도하는 집이라\"고 하신 것(마 21:13)은 이 책의 열린 문 비전을 성전에서 되살린 것입니다.","s":589.428,"e":602.768,"p":false,"h":false},{"t":"사도행전 13장 46절부터 47절에서 바울과 바나바는 유대인이 말씀을 거절하자 이방으로 향하면서 49장 6절을 자기들의 사명으로 인용합니다.","s":603.396,"e":613.648,"p":false,"h":false},{"t":"11번 글에서 본 \"종에서 종들로\"의 모양이 여기서 실현됩니다.","s":614.268,"e":618.535,"p":false,"h":false},{"t":"에베소서 2장 11절부터 22절은 멀리 있던 자들과 가까이 있던 자들이 하나가 되어 한 새사람이 되었다고 하며, 이것을 평화의 복음으로 말합니다.","s":619.128,"e":628.986,"p":false,"h":false},{"t":"57장 19절의 \"먼 데 있는 자에게든지 가까운 데 있는 자에게든지 평강이 있을지어다\"를 이 평화의 선포의 뿌리로 읽는 학자들이 많습니다.","s":629.604,"e":639.046,"p":false,"h":false},{"t":"바울이 이 구절을 인용한다고 직접 말하지는 않으므로, 이 연결은 학자들의 읽기로 소개합니다.","s":639.612,"e":646.079,"p":true,"h":false},{"t":"열방 신탁에서 만민의 비전으로","s":647.172,"e":649.583,"p":false,"h":true},{"t":"이 시리즈의 흐름을 돌아보면 6번 글에서 시작된 줄기가 여기서 한 바퀴를 돕니다.","s":650.772,"e":656.207,"p":false,"h":false},{"t":"13~23장에서 열방은 심판받는 나라들로 나왔습니다.","s":656.82,"e":661.426,"p":false,"h":false},{"t":"하나님이 그들의 교만을 낮추시는 것은 그들을 멸망시키려는 것만이 아니라 하나님 이름 아래 모일 수 있는 자리를 만들기 위해서였다고 읽었습니다.","s":662.076,"e":671.032,"p":false,"h":false},{"t":"5번 글의 앗수르는 도구이면서 심판받는 자였는데, 19장 25절에서는 \"나의 손으로 지은\"이라는 이름을 받습니다.","s":671.544,"e":679.524,"p":false,"h":false},{"t":"10번 글의 고레스는 이름을 모르는 채로 쓰임받은 자였고, 45장 22절에서는 모든 사람이 똑같이 초대받습니다.","s":680.184,"e":687.915,"p":false,"h":false},{"t":"심판받던 나라들, 도구로 쓰이던 나라들, 하나님을 알지 못하던 사람들이 모두 같은 초대 앞에 서게 되는 모양입니다.","s":688.5,"e":696.601,"p":true,"h":false},{"t":"불편한 대목들","s":697.68,"e":699.008,"p":false,"h":true},{"t":"솔직히 말씀드려야 할 곳이 있습니다.","s":700.128,"e":702.693,"p":false,"h":false},{"t":"열방의 구원을 말하는 같은 장들이 열방의 굴복과 심판도 말합니다.","s":703.332,"e":708.189,"p":false,"h":false},{"t":"60장 12절은 섬기지 않는 나라는 패망하리라고 하고, 66장 24절은 반역한 자들의 시체가 구더기와 불 속에 있다고 하면서 책을 맺습니다.","s":708.876,"e":718.606,"p":false,"h":false},{"t":"이 마지막 장면의 읽기가 갈립니다.","s":719.172,"e":721.693,"p":false,"h":false},{"t":"어떤 학자는 구원의 책이 구원받지 못한 자의 그림으로 끝나는 것이 이 책의 진지함이라고 보고, 어떤 학자는 최종 형태에서 이 구절이 독자를 향한 경고의 역할을 한다고 봅니다.","s":722.304,"e":733.9,"p":false,"h":false},{"t":"마가복음 9장 48절이 이 구절의 낱말을 쓰는 것으로 알려져 있지만, 이 연결과 의미는 15번 글에서 새 하늘과 새 땅과 함께 다루겠습니다.","s":734.184,"e":743.627,"p":true,"h":false},{"t":"또 하나는 열방이 들어오는 방식에 관한 불편입니다.","s":744.696,"e":748.302,"p":false,"h":false},{"t":"열방이 재물을 가져오고 왕들이 시중든다는 60장의 그림은 이스라엘 중심의 언어로 읽혀서, 오늘의 독자에게 불편하게 들릴 수 있습니다.","s":748.908,"e":758.314,"p":false,"h":false},{"t":"이 언어를 고대 근동의 위로의 문법으로 읽는 학자가 있고, 열방이 하나님 앞에 오는 모습의 시적 표현으로 읽는 학자가 있습니다.","s":758.952,"e":766.874,"p":false,"h":false},{"t":"어느 쪽이든 이 그림이 어떤 민족의 우월을 가르치는 것이 아니라는 점은 같은 책이 45장 22절, 56장 7절, 66장 21절에서 열방이 동등한 이름과 제사장직까지 받는다고 말하는 것으로 보강됩니다.","s":767.52,"e":783.153,"p":false,"h":false},{"t":"이 보강은 제 읽기입니다.","s":783.792,"e":785.901,"p":true,"h":false},{"t":"이 비전이 읽는 사람에게 묻는 것","s":786.996,"e":789.324,"p":false,"h":true},{"t":"이 장들은 두 가지 오해를 막아 줍니다.","s":790.308,"e":793.12,"p":false,"h":false},{"t":"하나는 교만의 오해입니다.","s":793.8,"e":795.806,"p":false,"h":false},{"t":"열방 구원의 비전은 하나님의 선택이 어떤 민족이나 집단의 특권이 아니라 복의 통로였음을 보여 줍니다.","s":796.392,"e":803.115,"p":false,"h":false},{"t":"교회가 이 책의 비전을 받았다면, 이스라엘이 사명을 놓쳤던 것과 같은 자리에 설 수 있다는 경고도 함께 받은 것입니다.","s":803.736,"e":811.408,"p":false,"h":false},{"t":"로마서 11장 20절부터 21절에서 바울이 접붙임 받은 이방인에게 \"높은 마음을 품지 말고 도리어 두려워하라\"고 한 것이 이 점입니다.","s":812.088,"e":821.455,"p":true,"h":false},{"t":"다른 하나는 포기의 오해입니다.","s":822.564,"e":824.786,"p":false,"h":false},{"t":"이스라엘이 거듭 불순종했는데도 하나님은 종일 손을 펴 부르셨습니다.","s":825.372,"e":830.038,"p":false,"h":false},{"t":"그 인내가 이스라엘에게 끝나지 않았다면, 우리가 누군가를 완고하다고 쉽게 포기하는 것도 이 책의 방식은 아닙니다.","s":830.664,"e":838.598,"p":false,"h":false},{"t":"그리고 열방을 부르시는 \"내가 여기 있노라\"는 말씀이 우리를 향해 있었다면, 우리의 몫은 그 부름을 다른 이에게 전하는 일입니다.","s":839.232,"e":847.838,"p":false,"h":false},{"t":"11번 글에서 본 것처럼 단수의 종 뒤에는 복수의 종들이 있고, 그 종들에게 맡겨진 일은 눈을 여는 일입니다.","s":848.484,"e":856.349,"p":true,"h":false},{"t":"이 글의 물음에 한 줄로 답하면 이렇습니다.","s":857.376,"e":860.282,"p":false,"h":false},{"t":"이스라엘의 불순종과 열방의 구원은 서로 엇갈리는 두 이야기가 아니라, 실패한 사명을 하나님이 직접 이루시는 한 이야기입니다.","s":860.868,"e":869.523,"p":false,"h":false},{"t":"그리고 그 이야기의 마지막은 아직 열려 있어서, 읽는 사람은 구경꾼이 아니라 그 이야기 안의 한 사람으로 서게 됩니다.","s":870.192,"e":878.523,"p":true,"h":false}]},{"title":"15. 새 하늘과 새 땅은 어떻게 읽어야 하는가","audio":"doc15_2610241127.mp3","dur":786.8,"segs":[{"t":"새 하늘과 새 땅은 어떻게 읽어야 하는가: 이사야서의 마지막 두 장","s":0,"e":5.033,"p":false,"h":true},{"t":"본문: 이사야 65:1-66:24 (함께 읽을 본문: 사 6:11-13; 11:6-9; 40:1-2; 43:18-19; 51:6; 55:12-13; 행 7:48-50; 롬 8:18-23; 벧후 3:10-13; 계 21:1-5; 막 9:42-48)","s":6.228,"e":41.835,"p":true,"h":false},{"t":"이 시리즈의 첫 물음은 \"전해도 깨닫지 못할 것을 아시면서 왜 이사야를 보내시는가\"였고, 이사야는 6장 11절에서 \"주여 어느 때까지니이까\" 하고 물었습니다.","s":42.768,"e":53.748,"p":false,"h":false},{"t":"마지막 두 장은 그 물음에 대한 이 책의 최종 답입니다.","s":54.432,"e":58.213,"p":false,"h":false},{"t":"다만 이 답은 읽기가 가장 크게 갈리는 말로 주어집니다.","s":58.86,"e":63.004,"p":false,"h":false},{"t":"새 하늘과 새 땅을 문자 그대로 읽을지 상징으로 읽을지, 66장 24절의 마지막 장면을 어떻게 이해할지가 그렇습니다.","s":63.684,"e":72.201,"p":false,"h":false},{"t":"이 글은 각 입장의 가장 좋은 논리를 공정하게 소개하고, 제 판단은 구분해서 말씀드리겠습니다.","s":72.828,"e":79.459,"p":true,"h":false},{"t":"마지막 두 장의 짜임","s":80.532,"e":82.299,"p":false,"h":true},{"t":"두 장은 크게 여섯 대목으로 읽힙니다.","s":83.448,"e":86.216,"p":false,"h":false},{"t":"65장 1~7절은 13번 글에서 본 대로 종일 손을 펴 부르셨는데도 돌이키지 않는 백성을 다룹니다.","s":86.796,"e":93.912,"p":false,"h":false},{"t":"8~16절은 공동체 안을 나눕니다.","s":94.572,"e":97.689,"p":false,"h":false},{"t":"하나님의 종들은 먹고 마시고 기뻐하지만 하나님을 버린 자들은 주리고 부끄러움을 당합니다.","s":98.316,"e":104.319,"p":false,"h":false},{"t":"17~25절이 새 창조의 선언입니다.","s":104.94,"e":108.159,"p":false,"h":false},{"t":"66장 1~6절은 성전을 다루고, 7~14절은 시온이 아이를 낳고 어머니가 위로하듯 하나님이 위로하신다고 말합니다.","s":108.792,"e":117.908,"p":false,"h":false},{"t":"15~24절은 심판과 열방의 모임, 그리고 책의 마지막 장면입니다.","s":118.548,"e":124.505,"p":false,"h":false},{"t":"이 순서에서 눈여겨볼 점이 있습니다.","s":125.172,"e":127.713,"p":false,"h":false},{"t":"새 창조는 공동체가 둘로 갈리는 장면 바로 뒤에 옵니다.","s":128.304,"e":132.037,"p":false,"h":false},{"t":"새 하늘과 새 땅은 모두가 자동으로 들어가는 곳으로 그려지지 않습니다.","s":132.66,"e":137.107,"p":true,"h":false},{"t":"약속들이 모이는 자리","s":138.204,"e":139.973,"p":false,"h":true},{"t":"65장 17절은 \"보라 내가 새 하늘과 새 땅을 창조하나니 이전 것은 기억되거나 마음에 생각나지 아니할 것이라\"고 합니다.","s":141.12,"e":149.312,"p":false,"h":false},{"t":"\"창조하다\"는 이 책에서 이스라엘과 하나님의 새 일에 반복해서 쓰이던 낱말입니다.","s":149.976,"e":155.518,"p":false,"h":false},{"t":"43장 18절부터 19절의 \"새 일\"과 이어진다고 보는 학자들이 많습니다.","s":156.168,"e":161.874,"p":true,"h":false},{"t":"이 단락을 읽으면 앞에서 만난 약속들이 한곳에 모이는 것이 보입니다.","s":162.936,"e":167.796,"p":false,"h":false},{"t":"25절의 \"이리와 어린양이 함께 먹을 것이며\"는 11장 6절부터 9절의 그림입니다.","s":168.408,"e":174.518,"p":false,"h":false},{"t":"11장에서 이새의 싹이 다스리는 나라로 약속되었던 평화가 여기서 새 창조의 모습으로 나옵니다.","s":175.176,"e":181.249,"p":false,"h":false},{"t":"19절의 \"울음소리와 부르짖는 소리가 다시 들리지 아니할 것\"은 25장 8절의 눈물을 닦아 주시는 약속과 겹칩니다.","s":181.872,"e":189.776,"p":false,"h":false},{"t":"24절의 \"그들이 부르기 전에 내가 응답하겠고\"는 64장 1절의 \"하늘을 찢고 강림하사\"라는 간구에 대한 답으로 읽을 수 있습니다.","s":190.44,"e":199.483,"p":false,"h":false},{"t":"이 연결들은 제가 읽어 낸 것입니다.","s":200.052,"e":202.793,"p":false,"h":false},{"t":"본문이 서로를 가리킨다고 직접 말하지는 않습니다.","s":203.112,"e":206.6,"p":true,"h":false},{"t":"어떻게 읽을 것인가: 세 갈래","s":207.648,"e":210.224,"p":false,"h":true},{"t":"첫째는 물리적인 새 창조로 읽는 입장입니다.","s":211.392,"e":214.552,"p":false,"h":false},{"t":"이 입장은 하나님이 실제로 하늘과 땅을 새롭게 하신다고 봅니다.","s":215.136,"e":219.565,"p":false,"h":false},{"t":"이사야의 그림에 집과 포도원과 수고의 열매(65:21-23)가 나오는 점을 근거로 들고, 신약의 로마서 8장 19~23절이 피조물도 썩어짐의 종노릇에서 해방되리라고 한 것과 연결합니다.","s":220.176,"e":236.258,"p":false,"h":false},{"t":"이 입장의 강점은 구원을 영혼만의 일로 좁히지 않는다는 점입니다.","s":236.88,"e":241.587,"p":false,"h":false},{"t":"약점은 65장 20절입니다.","s":242.208,"e":244.721,"p":false,"h":false},{"t":"이 구절은 수명이 차지 못하고 죽는 영아와 노인이 다시는 없을 것이며, 백 세에 죽는 자도 젊은이로 여겨지고 백 세 전에 죽는 자는 저주받은 자라고 합니다.","s":245.34,"e":255.696,"p":false,"h":false},{"t":"죽음이 여전히 있고 죄인도 있는 땅입니다.","s":256.356,"e":259.484,"p":true,"h":false},{"t":"둘째는 귀환 이후 예루살렘의 갱신을 시적 언어로 그렸다고 읽는 입장입니다.","s":260.568,"e":265.627,"p":false,"h":false},{"t":"새 하늘과 새 땅은 하나님이 돌보시는 공동체의 완전한 회복을 가리키는 과장된 표현이고, 65장 20절은 그 풍요가 당대의 수명과 안전 같은 익숙한 범주로 그려진 것이라고 봅니다.","s":266.256,"e":278.973,"p":false,"h":false},{"t":"이 입장은 65장 20절의 죽음 언급을 가장 자연스럽게 설명하고, 이사야서가 다른 곳에서 비슷한 우주적 언어로 역사적 사건을 그린다는 점(13:10; 34:4)을 근거로 듭니다.","s":279.648,"e":294.547,"p":false,"h":false},{"t":"약점은 이 약속이 귀환 이후 역사 속에서 이루어졌다고 보기 어렵다는 점과, 신약이 이 구절을 역사적 사건으로 읽지 않는다는 점입니다.","s":295.128,"e":304.538,"p":true,"h":false},{"t":"셋째는 구약의 범주로 그려진 마지막 완성의 그림으로 읽는 입장입니다.","s":305.64,"e":310.25,"p":false,"h":false},{"t":"베드로후서 3장 13절은 \"우리는 그의 약속대로 의가 거하는 새 하늘과 새 땅을 바라보도다\"라고 하고, 요한계시록 21장 1절부터 4절은 새 하늘과 새 땅을 보며 다시는 사망이 없다고 말합니다.","s":310.896,"e":324.63,"p":false,"h":false},{"t":"신약이 이사야 65~66장의 낱말을 가져다 마지막 완성으로 적용했다고 보는 읽기입니다.","s":325.296,"e":331.951,"p":false,"h":false},{"t":"이 입장에서 65장 20절은 구약 독자가 알아들을 수 있는 말, 곧 수명과 안전의 언어로 완전한 생명을 그린 것으로 이해합니다.","s":332.604,"e":341.72,"p":false,"h":false},{"t":"이 입장의 약점은 본문이 죽음의 폐지를 말하지 않는데 요한계시록의 내용을 이사야에게 읽어 넣게 될 위험이 있다는 점입니다.","s":342.396,"e":350.781,"p":true,"h":false},{"t":"이 세 갈래는 개혁주의 안에서도 갈립니다.","s":351.9,"e":354.881,"p":false,"h":false},{"t":"무천년, 역사적 전천년, 후천년 같은 종말론의 입장에 따라 같은 구절을 다르게 배치하기 때문입니다.","s":355.5,"e":363.262,"p":false,"h":false},{"t":"이 구절 하나로 종말의 시간표가 결정되지는 않으며, 시간표는 요한계시록을 어떻게 읽느냐에 달려 있습니다.","s":363.816,"e":371.158,"p":true,"h":false},{"t":"제 판단을 구분해서 말씀드리겠습니다.","s":372.24,"e":374.831,"p":false,"h":false},{"t":"저는 셋째 읽기가 책의 구조와 신약의 인용에 가장 잘 맞는다고 봅니다.","s":375.48,"e":380.274,"p":false,"h":false},{"t":"다만 65장 20절이 남기는 긴장을 매끄럽게 해소하지는 못한다고 생각합니다.","s":380.916,"e":386.447,"p":false,"h":false},{"t":"이 긴장은 첫째 읽기와 셋째 읽기가 함께 안고 가야 할 숙제입니다.","s":387.108,"e":391.714,"p":false,"h":false},{"t":"입장과 상관없이 지킬 선이 두 가지 있습니다.","s":392.364,"e":395.821,"p":false,"h":false},{"t":"하나는 이 약속이 영혼이 육체를 떠나 가는 곳에 대한 말씀이 아니라는 점입니다.","s":396.468,"e":401.447,"p":false,"h":false},{"t":"집을 짓고 포도원을 가꾸는 삶, 수고가 헛되지 않은 땅이 이사야의 그림입니다.","s":402.084,"e":407.703,"p":false,"h":false},{"t":"다른 하나는 이 본문으로 날짜나 순서를 계산하지 않는 것입니다.","s":408.348,"e":412.692,"p":false,"h":false},{"t":"7번 글에서 \"그날\"을 한꺼번에 하나로 묶지 말라고 했던 경고가 여기서도 같습니다.","s":413.352,"e":418.708,"p":true,"h":false},{"t":"66장: 성전을 짓겠다는 백성에게","s":419.796,"e":423.319,"p":false,"h":true},{"t":"66장 1절은 놀라운 말씀으로 시작합니다.","s":424.332,"e":427.788,"p":false,"h":false},{"t":"\"하늘은 나의 보좌요 땅은 나의 발판이니 너희가 나를 위하여 어떤 집을 지을 수 있으며.\"","s":428.472,"e":434.019,"p":false,"h":false},{"t":"그리고 2절은 하나님이 돌아보시는 사람이 \"가난하고 마음이 상하며 내 말을 두려워하며 떠는 자\"라고 합니다.","s":434.628,"e":442.063,"p":false,"h":false},{"t":"이 구절은 스데반이 사도행전 7장 49절부터 50절에서 인용한 구절입니다.","s":442.692,"e":448.536,"p":false,"h":false},{"t":"이 말씀은 성전을 부정하는 것이 아니라, 하나님이 건물에 갇히지 않으시며 겸손한 사람과 함께하신다는 선언으로 읽힙니다.","s":449.1,"e":457.221,"p":false,"h":false},{"t":"같은 장 20절부터 21절에서 열방이 예물을 가져와 성전에서 섬기는 그림이 나오기 때문입니다.","s":457.848,"e":464.663,"p":false,"h":false},{"t":"1절과 20절의 긴장을 학자들은 서로 다르게 읽는데, 저는 둘 다 하나님의 집이 건물이 아니라 사람들의 겸손과 만남에 있다는 방향을 가리킨다고 봅니다.","s":465.3,"e":475.354,"p":false,"h":false},{"t":"이것은 제 읽기입니다.","s":475.92,"e":477.9,"p":true,"h":false},{"t":"3절부터 4절은 제사를 사람을 죽이는 일, 개의 목을 꺾는 일에 견주는 어려운 구절입니다.","s":478.98,"e":485.587,"p":false,"h":false},{"t":"제사 제도 자체를 거부하는 말로 읽는 학자도 있고, 악을 선택한 사람의 제사를 책망하는 말로 읽는 학자도 있습니다.","s":486.216,"e":493.488,"p":false,"h":false},{"t":"어느 쪽이든 형식이 마음을 대신할 수 없다는 점은 58장의 금식과 같은 맥락입니다.","s":494.136,"e":500.106,"p":true,"h":false},{"t":"66장 7~14절: 어머니의 위로","s":501.228,"e":505.071,"p":false,"h":true},{"t":"이 대목은 시온이 진통이 오기 전에 아들을 낳는다는 놀라운 그림으로 시작해 13절로 이어집니다.","s":506.16,"e":512.757,"p":false,"h":false},{"t":"\"어미가 자식을 위로함같이 내가 너희를 위로할 것인즉.\"","s":513.396,"e":517.261,"p":false,"h":false},{"t":"이 책은 40장 1절의 \"위로하라 내 백성을 위로하라\"로 후반부를 열었고, 여기서 그 위로가 어머니의 품이라는 그림으로 마무리됩니다.","s":517.86,"e":527.004,"p":false,"h":false},{"t":"40장에서는 팔로 다스리시는 분이 목자로 안으셨는데, 66장에서는 어머니로 안으십니다.","s":527.616,"e":534.144,"p":false,"h":false},{"t":"이 수미상관은 제 읽기입니다.","s":534.78,"e":537.285,"p":true,"h":false},{"t":"66장 24절: 책이 이렇게 끝나는 이유","s":538.38,"e":542.075,"p":false,"h":true},{"t":"이제 가장 어려운 대목입니다.","s":543.24,"e":545.422,"p":false,"h":false},{"t":"22절부터 23절은 새 하늘과 새 땅이 항상 있을 것이고, 너희 자손과 이름도 그와 같이 있으리라고 하며, 모든 육체가 안식일마다 와서 경배하리라고 합니다.","s":546.084,"e":557.478,"p":false,"h":false},{"t":"그런데 바로 24절은 이렇게 끝납니다.","s":558.072,"e":561.15,"p":false,"h":false},{"t":"사람들이 나가서 하나님께 반역한 자들의 시체를 보게 되는데, 그들을 먹는 벌레가 죽지 아니하고 그들을 사르는 불이 꺼지지 아니할 것이며, 모든 육체에게 가증이 되리라는 것입니다.","s":561.78,"e":573.698,"p":true,"h":false},{"t":"세 가지 읽기가 있습니다.","s":574.812,"e":576.737,"p":false,"h":false},{"t":"첫째 읽기는 이 구절을 최종적이고 영원한 형벌의 그림으로 봅니다.","s":577.404,"e":581.951,"p":false,"h":false},{"t":"예수께서 마가복음 9장 48절에서 \"거기에서는 구더기도 죽지 않고 불도 꺼지지 않느니라\"고 하신 것이 이 구절의 낱말을 쓴 것이라는 근거입니다.","s":582.624,"e":592.78,"p":false,"h":false},{"t":"둘째 읽기는 본문이 살아 있는 사람이 아니라 \"시체\"를 말하고 불과 벌레가 그것을 삼킨다는 점에 주목합니다.","s":593.424,"e":600.59,"p":false,"h":false},{"t":"불과 벌레가 꺼지지 않는다는 말은 완전하고 최종적인 멸절을 뜻한다는 읽기입니다.","s":601.236,"e":606.706,"p":false,"h":false},{"t":"이 읽기를 따르는 학자들이 있고, 개혁주의 전통의 다수는 첫째 읽기를 따라 왔습니다.","s":607.392,"e":613.334,"p":false,"h":false},{"t":"셋째 읽기는 이 구절을 구체적인 사건, 곧 예루살렘 밖 골짜기에서 일어나는 심판의 현장으로 읽으면서 최종 형태에서는 독자를 향한 경고의 기능을 한다고 봅니다.","s":613.98,"e":625.222,"p":false,"h":false},{"t":"저는 예수께서 이 낱말을 쓰셨다는 점이 첫째 읽기에 무게를 준다고 보지만, 이 구절 하나가 영원한 형벌의 성격을 결정해 주지는 않는다고 생각합니다.","s":625.896,"e":635.525,"p":false,"h":false},{"t":"본문은 형벌의 지속 방식을 설명하지 않고 그 가증함이 독자에게 보인다는 것만 말합니다.","s":636.192,"e":642.469,"p":true,"h":false},{"t":"주목할 만한 전승이 있습니다.","s":643.536,"e":645.597,"p":false,"h":false},{"t":"유대교 회당에서는 이사야서를 낭독할 때 이 어두운 구절로 끝나지 않도록 23절을 한 번 더 읽는 관습이 있는 것으로 알려져 있습니다.","s":646.164,"e":655.411,"p":false,"h":false},{"t":"이 관습의 정확한 기원은 제가 확인하지 못했지만, 이 책의 마지막 장면이 얼마나 무겁게 읽혀 왔는지 보여 줍니다.","s":656.064,"e":663.931,"p":false,"h":false},{"t":"이 책은 정말로 심판의 장면으로 끝납니다.","s":664.596,"e":667.786,"p":false,"h":false},{"t":"하나님의 인내가 끝이 없다는 것과 마지막에 가름이 있다는 것이 함께 놓여 있습니다.","s":668.412,"e":673.772,"p":false,"h":false},{"t":"이것을 매끄럽게 풀려 하지 않겠습니다.","s":674.352,"e":676.981,"p":false,"h":false},{"t":"다만 이 장면을 보는 사람이 \"모든 육체\"라는 것, 곧 그 앞에서 구경만 하는 자리가 아니라 그 가증함 앞에서 자기 자리를 묻게 되는 자리에 놓인다는 점은 지적해 둡니다.","s":677.592,"e":688.923,"p":true,"h":false},{"t":"처음 물음으로 돌아가며","s":690.012,"e":691.618,"p":false,"h":true},{"t":"이제 이 시리즈의 처음 물음으로 돌아가겠습니다.","s":692.748,"e":695.866,"p":false,"h":false},{"t":"6장 11절의 \"어느 때까지니이까\"에 하나님은 시간표 대신 그루터기로 답하셨고, 이 책은 그 그루터기가 66장 22절의 \"너희 자손과 너희 이름이 항상 있으리라\"에 이르는 것으로 끝납니다.","s":696.492,"e":709.67,"p":false,"h":false},{"t":"베어진 나무의 밑동에서 새 하늘과 새 땅까지가 이 책이 그려 온 길입니다.","s":710.244,"e":715.1,"p":true,"h":false},{"t":"그리고 9장의 답답함은 이 책의 끝에서 어떻게 되었는가를 물을 수 있습니다.","s":716.22,"e":721.477,"p":false,"h":false},{"t":"돌이키지 않는 백성은 66장에서도 완전히 사라지지 않고, 24절의 시체들로 남아 있습니다.","s":722.088,"e":728.819,"p":false,"h":false},{"t":"그러나 책은 거기에 하나를 더합니다.","s":729.468,"e":732.021,"p":false,"h":false},{"t":"돌이키지 못하는 사람들을 위해 하나님이 직접 오시고, 그들의 죄를 짊어질 종을 세우시고, 닫힌 마음을 여시는 영을 부어 주신다는 약속입니다.","s":732.672,"e":742.174,"p":false,"h":false},{"t":"이사야서는 죄 문제가 풀렸다고 말하지 않고, 풀어 주시는 분이 계시다고 말합니다.","s":742.752,"e":748.681,"p":false,"h":false},{"t":"그 약속의 한쪽 끝에는 새 창조가 있고, 다른 쪽 끝에는 아직 돌이키지 않은 이들에 대한 엄중함이 있습니다.","s":749.34,"e":756.499,"p":true,"h":false},{"t":"그러므로 이 마지막 장들을 읽는 사람에게 남는 것은 시간표가 아니라 방향입니다.","s":757.548,"e":762.966,"p":false,"h":false},{"t":"하나님의 일은 눈물이 닦이고, 수고가 열매를 맺고, 이리와 어린양이 함께 먹는 곳을 향합니다.","s":763.596,"e":770.401,"p":false,"h":false},{"t":"그리고 이 약속을 믿는 사람은 지금 이 땅에서 가난하고 마음이 상하며 말씀 앞에 떠는 자의 자리에 서도록 부름받습니다.","s":771.012,"e":779.39,"p":false,"h":false},{"t":"66장 2절이 하나님이 돌아보시는 사람으로 꼽은 사람이 그런 사람이기 때문입니다.","s":780.048,"e":785.741,"p":true,"h":false}]},{"title":"16. 하나의 줄기로 읽는 이사야서","audio":"doc16_2610241127.mp3","dur":393.1,"segs":[{"t":"마무리: 하나의 줄기로 읽는 이사야서","s":0,"e":3.107,"p":false,"h":true},{"t":"이 시리즈는 열다섯 가지 물음으로 이사야서를 따라왔습니다.","s":4.284,"e":8.54,"p":false,"h":false},{"t":"하나씩 읽을 때는 서로 다른 물음처럼 보이지만, 끝까지 오고 보면 한 줄기입니다.","s":9.216,"e":15.036,"p":false,"h":false},{"t":"마지막으로 그 줄기를 한 번에 돌아보고, 이 시리즈를 어떻게 읽으면 좋은지 말씀드리겠습니다.","s":15.66,"e":21.94,"p":true,"h":false},{"t":"처음 물음과 마지막 답","s":23.04,"e":24.806,"p":false,"h":true},{"t":"모든 것은 6장 11절의 한마디에서 시작되었습니다.","s":25.704,"e":29.497,"p":false,"h":false},{"t":"이사야는 전해도 깨닫지 못할 것이라는 선고를 듣고 이렇게 물었습니다.","s":30.06,"e":35.15,"p":false,"h":false},{"t":"\"주여 어느 때까지니이까.\"","s":35.784,"e":37.604,"p":false,"h":false},{"t":"하나님의 대답은 시간표가 아니었습니다.","s":38.232,"e":40.936,"p":false,"h":false},{"t":"나무가 베인 뒤에도 그루터기가 남고, 그루터기에 거룩한 씨가 있다는 말씀이었습니다.","s":41.544,"e":47.413,"p":false,"h":false},{"t":"이사야서 육십육 장은 그 그루터기가 어디까지 자라는지를 보여 주는 책입니다.","s":48.06,"e":53.312,"p":false,"h":false},{"t":"66장 22절에서 \"너희 자손과 너희 이름이 항상 있으리라\"는 약속에 이르면, 처음의 물음에 대한 답이 완성됩니다.","s":53.964,"e":61.935,"p":true,"h":false},{"t":"네 마디로 보는 줄기","s":63.036,"e":64.682,"p":false,"h":true},{"t":"첫째 마디는 사명과 완고함입니다.","s":65.844,"e":68.476,"p":false,"h":false},{"t":"이사야는 설득자가 아니라 증인으로 보내졌습니다.","s":69.084,"e":72.478,"p":false,"h":false},{"t":"백성의 굳어짐에는 하나님의 주권과 백성의 책임이 함께 놓여 있고, 성경은 그 둘을 하나로 설명하지 않은 채 나란히 세워 둡니다.","s":73.08,"e":81.46,"p":false,"h":false},{"t":"아하스 왕은 약속이 부족해서가 아니라 붙들고 있던 것을 내려놓지 못해서 돌이키지 않았습니다.","s":82.08,"e":88.134,"p":false,"h":false},{"t":"그래서 약속은 백성의 자격이 아니라 은혜로 남은 자를 통해 이어집니다.","s":88.812,"e":93.931,"p":true,"h":false},{"t":"둘째 마디는 심판과 열방입니다.","s":95.004,"e":97.585,"p":false,"h":false},{"t":"앗수르는 하나님의 몽둥이였으나 그 마음의 교만 때문에 심판받았고, 열방 신탁은 두려워하던 강대국들이 모두 하나님의 손 아래 있음을 보여 주었습니다.","s":98.244,"e":108.338,"p":false,"h":false},{"t":"심판과 회복이 번갈아 나오는 것은 어지러움이 아니라 한 하나님이 한 일을 두 번 말씀하시는 방식이었습니다.","s":108.972,"e":116.139,"p":false,"h":false},{"t":"그리고 가장 좋은 왕 히스기야도 마지막에 넘어지면서, 이 책은 왕이 아니라 하나님 자신이 오셔야 한다는 쪽으로 방향을 바꿉니다.","s":116.748,"e":125.244,"p":true,     b.textContent = auto ? '🔁 이어듣기 켜짐 ✔' : '⏹ 이어듣기 꺼짐';
    h.classList.toggle('off', !auto);
    h.textContent = auto ? '초록색이면 켜진 상태입니다. 그대로 두고 아래 ▶ 재생만 누르세요. (이 단추를 누르면 꺼집니다)' : '지금은 꺼져 있어서 한 글만 듣고 멈춥니다. 위 회색 단추를 눌러 켜세요.';
  }
  function hideNote() { $('note').style.display = 'none'; }
  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.defaultPlaybackRate = SPEEDS[spd]; audio.playbackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applyAuto();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { const S = segs(); let k = -1; for (let i = 0; i < S.length; i++) { if (S[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function clearMark() { const o = $('g' + lastK + '_' + lastI); if (o) { o.classList.remove('on'); } lastK = -1; lastI = -1; }
  function mark(i, follow) {
    if (i === lastI && ti === lastK) { return; }
    const old = $('g' + lastK + '_' + lastI); if (old) { old.classList.remove('on'); }
    lastK = ti; lastI = i;
    const el = $('g' + ti + '_' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function updateNow() { $('now').textContent = (ti + 1) + ' / ' + N + ' · ' + TRACKS[ti].title; }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || TRACKS[ti].dur || 0;
    $('cur').textContent = fmt(t);
    $('tot').textContent = fmt(d);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
    try { if ('mediaSession' in navigator) { navigator.mediaSession.playbackState = p ? 'playing' : 'paused'; } } catch (e) {}
  }
  function savePos() { pref('pos', ti + ':' + (audio.currentTime || 0)); }
  function play() { const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); savePos(); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || TRACKS[ti].dur || t))); paint(); }

  function mediaMeta() {
    try { if ('mediaSession' in navigator && window.MediaMetadata) { navigator.mediaSession.metadata = new MediaMetadata({ title: TRACKS[ti].title, artist: TITLE, album: TITLE }); } } catch (e) {}
  }
  function prefetch(k) { if (k >= 0 && k < N) { try { const a = new Audio(); a.preload = 'auto'; a.src = TRACKS[k].audio; } catch (e) {} } }

  /* 글 바꾸기: 같은 페이지, 같은 소리 재생기를 계속 써서 폰에서도 끊기지 않고 이어집니다 */
  function loadTrack(k, start, auto) {
    if (k < 0 || k >= N) { return; }
    ti = k; lastUser = 0;
    audio.src = TRACKS[k].audio;
    applySpd();
    const st = start || 0;
    const onMeta = () => { audio.removeEventListener('loadedmetadata', onMeta); if (st > 0) { try { audio.currentTime = st; } catch (e) {} } paint(); };
    audio.addEventListener('loadedmetadata', onMeta);
    clearMark(); updateNow(); mediaMeta(); prefetch(k + 1);
    if (auto) { play(); } else { paint(); }
  }
  function jump(k, i) {
    const S = TRACKS[k] && TRACKS[k].segs; if (!S || i < 0 || i >= S.length) { return; }
    lastUser = 0;
    if (k !== ti) { loadTrack(k, S[i].s, true); return; }
    seek(S[i].s); mark(i, true); if (!playing) { play(); }
  }

  audio.addEventListener('timeupdate', () => {
    if (!playing) { paint(); }
    if (Date.now() - lastSave > 4000) { lastSave = Date.now(); savePos(); }
  });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => {
    if (ti < N - 1) {
      if (auto) { loadTrack(ti + 1, 0, true); return; }
      setPlaying(false); clearMark(); pref('pos', (ti + 1) + ':0');
      const n = $('note'); n.style.display = 'block';
      n.innerHTML = '이어듣기가 <b>꺼져 있어서</b> 멈췄습니다. <button type="button" id="nb">이어듣기 켜고 다음 글 듣기</button>';
      $('nb').onclick = () => { auto = true; applyAuto(); hideNote(); loadTrack(ti + 1, 0, true); };
    } else { setPlaying(false); pref('pos', '0:0'); clearMark(); }
  });
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('auto').onclick = () => { auto = !auto; applyAuto(); hideNote(); };
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => {
    const t = audio.currentTime || 0, i = idxAt(t), cur = segs()[i];
    if (cur && t - cur.s > 2) { jump(ti, i); }
    else if (i > 0) { jump(ti, i - 1); }
    else if (ti > 0) { loadTrack(ti - 1, 0, true); }
    else { seek(0); }
  };
  $('next').onclick = () => {
    const i = idxAt(audio.currentTime || 0) + 1;
    if (i < segs().length) { jump(ti, i); } else if (ti < N - 1) { loadTrack(ti + 1, 0, true); }
  };
  $('pt').onclick = () => { if ((audio.currentTime || 0) > 5 || ti === 0) { jump(ti, 0); } else { loadTrack(ti - 1, 0, true); } };
  $('nt').onclick = () => { if (ti < N - 1) { loadTrack(ti + 1, 0, true); } };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || TRACKS[ti].dur || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-k'), +s.getAttribute('data-i')); } });
  $('toc').addEventListener('click', e => {
    const a = e.target.closest ? e.target.closest('a') : null; if (!a) { return; }
    e.preventDefault(); $('lst').open = false; lastUser = 0;
    const k = +a.getAttribute('data-k');
    loadTrack(k, 0, true);
    const sec = $('t' + k); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} }
  });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  /* 잠금 화면·이어폰 단추 */
  try {
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      const set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
      set('play', play); set('pause', pause);
      set('nexttrack', () => $('nt').onclick()); set('previoustrack', () => $('pt').onclick());
      set('seekbackward', () => seek((audio.currentTime || 0) - 10)); set('seekforward', () => seek((audio.currentTime || 0) + 10));
    }
  } catch (e) {}

  /* 시작: 첫 글을 준비해 두고, 지난번 위치가 있으면 이어 듣기 안내 */
  loadTrack(0, 0, false);
  const sp = (pref('pos') || '').split(':'), rk = parseInt(sp[0], 10), rt = parseFloat(sp[1]);
  if (rk >= 0 && rk < N && rt > 10 && rt < (TRACKS[rk].dur || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + esc(TRACKS[rk].title) + '</b> ' + fmt(rt) + '까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { r.style.display = 'none'; loadTrack(rk, rt, true); };
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, loadTrack, toggle, audio, TRACKS, state: () => ({ ti, auto, playing }) };
})();
</script>
</body>
</html>
