(function () {
  const TITLE = "isaiah_45", AUDIO_SRC = "isaiah_45_2610230230.mp3", DUR = 484, SEGS = [{"t":"이사야 45장","s":0,"e":1.749,"p":true,"h":false},{"t":"제목 고레스에게 주신 말씀, 빛도 만들고 어둠도 창조하는 하나님","s":2.412,"e":7.498,"p":true,"h":false},{"t":"핵심 한 줄 하나님은 이방 왕 고레스까지 도구로 쓰시며, 땅 끝의 모든 사람에게 \"나를 앙망하고 구원을 받으라\"고 부르십니다.","s":8.136,"e":16.87,"p":true,"h":false},{"t":"풀어 읽기","s":17.496,"e":18.566,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 44장 마지막에 이름이 나온 고레스에게 하나님이 직접 말씀하시는 장입니다.","s":19.404,"e":26.427,"p":false,"h":false},{"t":"하나님은 이 이방 왕에게 \"내가 네 오른손을 붙잡아 네 앞에 열국을 항복시키리라\"고 하십니다.","s":26.784,"e":33.656,"p":false,"h":false},{"t":"놀라운 것은 하나님이 고레스에게 이렇게 말씀하시는 이유입니다.","s":34.02,"e":38.331,"p":false,"h":false},{"t":"고레스를 위해서가 아니라 \"내 종 야곱, 내가 택한 이스라엘을 위해서\", 그리고 \"너로 나를 알게 하려고\"입니다.","s":38.556,"e":46.842,"p":true,"h":false},{"t":"이 장은 세 가지 흐름으로 이어집니다.","s":47.52,"e":50.181,"p":false,"h":false},{"t":"하나님이 고레스를 부르시는 일, 이 일을 두고 사람이 하나님께 따지는 어리석음, 그리고 모든 민족이 하나님께 돌아오라는 초청입니다.","s":50.4,"e":59.809,"p":false,"h":false},{"t":"이 장은 하나님이 온 세계의 역사를 다스리시고, 그 구원이 이스라엘만이 아니라 땅 끝까지 향한다는 것을 보여 줍니다.","s":60.156,"e":68.292,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":68.652,"e":71.928,"p":true,"h":false},{"t":"1절에서 7절, 고레스를 붙드시는 하나님 \"나 여호와께서 기름 부음을 받은 자 고레스의 오른손을 잡고 그 앞에 열방을 항복하게 하며.\"","s":72.576,"e":81.887,"p":false,"h":false},{"t":"기름 부음을 받은 자는 원래 이스라엘의 왕이나 제사장처럼 하나님이 특별한 일을 맡겨 구별하신 사람을 가리키는 말인데, 여기서는 이방 왕 고레스에게 쓰입니다.","s":82.08,"e":92.552,"p":false,"h":false},{"t":"하나님은 고레스 앞에서 성문이 닫히지 않게 하시고 앞서 가서 험한 곳을 평탄하게 하시며 놋문을 깨뜨리고 쇠빗장을 꺾으십니다.","s":92.88,"e":101.143,"p":false,"h":false},{"t":"어둠 속의 보화와 은밀한 곳의 재물도 주십니다.","s":101.484,"e":104.943,"p":false,"h":false},{"t":"이유는 \"너로 너를 지명하여 부르는 이가 나 여호와 이스라엘의 하나님인 줄을 알게 하려 함\"이라고 하십니다.","s":105.156,"e":112.31,"p":false,"h":false},{"t":"그런데 고레스는 하나님을 알지 못했습니다.","s":112.68,"e":115.778,"p":false,"h":false},{"t":"5절에서 \"너는 나를 알지 못하였으나 내가 네게 띠를 띠우리라\"고 하십니다.","s":115.992,"e":121.561,"p":false,"h":false},{"t":"하나님을 알지 못하는 왕이 하나님의 일을 한 것입니다.","s":121.752,"e":125.494,"p":false,"h":false},{"t":"하나님은 이 모든 일의 목적을 말씀하십니다.","s":125.712,"e":128.945,"p":false,"h":false},{"t":"해 뜨는 곳에서부터 해 지는 곳까지 사람들이 나밖에 다른 이가 없는 줄을 알게 하려는 것입니다.","s":129.168,"e":135.166,"p":false,"h":false},{"t":"그리고 7절이 중요합니다.","s":135.54,"e":137.614,"p":false,"h":false},{"t":"\"나는 빛도 지었고 어둠도 창조하며 평안도 짓고 환난도 창조하나니 나는 여호와라.","s":137.844,"e":143.566,"p":false,"h":false},{"t":"이 모든 일을 행하는 자니라.\"","s":143.784,"e":145.983,"p":false,"h":false},{"t":"환난과 재앙까지 하나님이 주관하신다는 뜻입니다.","s":146.196,"e":149.838,"p":false,"h":false},{"t":"이 구절이 악을 하나님이 만드셨다는 말은 아닙니다.","s":150.048,"e":153.684,"p":false,"h":false},{"t":"심판과 재앙을 포함해서 이 모든 일이 하나님의 손 안에 있다는 것입니다.","s":153.9,"e":158.751,"p":false,"h":false},{"t":"개혁파가 말하는 하나님의 주권이 이 말씀에 담겨 있습니다.","s":159.12,"e":163.104,"p":true,"h":false},{"t":"8절, 하늘이 의를 내리고 짧지만 아름다운 노래가 끼어 있습니다.","s":163.764,"e":168.614,"p":false,"h":false},{"t":"\"하늘이 위로부터 이슬 같이 내리며 궁창이 의를 부을지어다.","s":168.84,"e":172.888,"p":false,"h":false},{"t":"땅이 열려 구원을 싹트게 하고 공의도 함께 움돋게 할지어다.\"","s":173.088,"e":177.307,"p":false,"h":false},{"t":"구원과 공의가 하늘에서 내리고 땅에서 싹터 오른다는 그림입니다.","s":177.516,"e":182.238,"p":false,"h":false},{"t":"의와 구원은 사람의 땅에서 저절로 나는 것이 아니라 하늘에서 이슬처럼 내려옵니다.","s":182.448,"e":188.12,"p":true,"h":false},{"t":"9절에서 13절, 토기장이에게 따지지 말라 그런데 어떤 사람들은 하나님이 이방 왕을 쓰신다는 사실에 불만을 가졌을 것입니다.","s":188.784,"e":197.522,"p":false,"h":false},{"t":"하나님은 이렇게 말씀하십니다.","s":197.856,"e":200.204,"p":false,"h":false},{"t":"\"화 있을진저 자기를 지으신 이와 다투는 자여.","s":200.412,"e":203.573,"p":false,"h":false},{"t":"질그릇 조각 가운데 한 조각 같은 자가 어찌 토기장이와 다투겠느냐?\"","s":203.76,"e":208.292,"p":false,"h":false},{"t":"진흙이 토기장이에게 \"무엇을 만드느냐\" 하며, 만든 물건이 \"그에게 손이 없다\" 하겠느냐는 것입니다.","s":208.512,"e":216.312,"p":false,"h":false},{"t":"부모에게 \"무엇을 낳았느냐\", \"무엇을 낳으려고 해산하느냐\"고 따지는 자식도 화가 있다고 하십니다.","s":216.54,"e":223.636,"p":false,"h":false},{"t":"29장 16절에서도 토기장이 비유가 나왔습니다.","s":223.992,"e":227.903,"p":false,"h":false},{"t":"그리고 하나님은 이렇게 말씀하십니다.","s":228.096,"e":230.83,"p":false,"h":false},{"t":"\"내가 땅을 만들고 그 위에 사람을 창조하였으며 내 손으로 하늘을 펼쳤고 그 모든 군대를 명령하였노라.","s":231.048,"e":238.313,"p":false,"h":false},{"t":"내가 공의로 그를 일으켰으니 그의 모든 길을 곧게 하리니 그가 내 성읍을 건축하며 사로잡힌 나의 백성을 값이나 갚음이 없이 놓으리라.\"","s":238.5,"e":247.335,"p":false,"h":false},{"t":"고레스는 포로를 대가 없이 풀어 줄 것이라고 하십니다.","s":247.536,"e":251.197,"p":false,"h":false},{"t":"하나님이 누구를 쓰시든 그 선택에 대해 피조물은 토기장이를 판단할 수 없다는 가르침입니다.","s":251.424,"e":257.471,"p":true,"h":false},{"t":"14절에서 17절, 구원의 하나님은 숨어 계시는 분 이방 나라들이 이스라엘에게 와서 \"하나님이 오직 너희 가운데 계시고 그 밖에는 다른 신이 없다\"고 고백한다는 약속입니다.","s":258.264,"e":270.618,"p":false,"h":false},{"t":"이집트의 수고한 것과 구스의 상품과 키 큰 스바 사람들이 이스라엘에게 속하게 됩니다.","s":270.936,"e":276.821,"p":false,"h":false},{"t":"그리고 이방 사람들은 쇠사슬에 매여 이스라엘에게 절하며 \"하나님이 참으로 너희 중에 계시고 그 밖에는 신이 없다\"고 말합니다.","s":277.164,"e":285.938,"p":false,"h":false},{"t":"그리고 15절에서 이스라엘이 탄식하듯 말합니다.","s":286.272,"e":289.695,"p":false,"h":false},{"t":"\"진실로 주는 스스로 숨어 계시는 하나님이시여 이스라엘의 하나님 구원자시니이다.\"","s":289.908,"e":295.281,"p":false,"h":false},{"t":"하나님은 숨어 계신 것처럼 보이지만 구원자이시라는 고백입니다.","s":295.488,"e":300.155,"p":false,"h":false},{"t":"하나님이 침묵하시는 시간이 길어도 그것이 버림이 아니라는 뜻입니다.","s":300.348,"e":305.12,"p":false,"h":false},{"t":"우상 만드는 자들은 다 수치와 욕을 당하고 함께 수욕 중에 들어가지만, 이스라엘은 여호와 안에서 영원한 구원을 얻고 영원무궁토록 수치와 욕을 당하지 않습니다.","s":305.316,"e":315.883,"p":true,"h":false},{"t":"18절에서 21절, 헛되이 찾으라 하지 않았다 하나님은 하늘을 창조하신 분이시고 땅을 짓고 만드시고 견고하게 하신 분이며, 혼돈하게 창조하지 않고 사람이 거하도록 지으신 분입니다.","s":316.656,"e":329.36,"p":false,"h":false},{"t":"그리고 말씀하십니다.","s":329.688,"e":331.336,"p":false,"h":false},{"t":"\"나는 여호와라 나 외에 다른 이가 없느니라.","s":331.596,"e":334.827,"p":false,"h":false},{"t":"내가 은밀한 데서나 어두운 곳에서 말하지 아니하였고 야곱의 후손에게 너희가 나를 혼돈 중에 찾으라고 이르지 아니하였노라.\"","s":335.052,"e":343.192,"p":false,"h":false},{"t":"하나님은 숨바꼭질하듯 사람을 헤매게 하시는 분이 아닙니다.","s":343.404,"e":347.476,"p":false,"h":false},{"t":"분명하게 말씀하시고 공의를 말하며 바른 것을 알려 주십니다.","s":347.688,"e":351.86,"p":false,"h":false},{"t":"그리고 우상을 의지하는 자를 향해 모여서 가까이 오라고 하십니다.","s":352.08,"e":356.526,"p":false,"h":false},{"t":"나무 우상을 메고 다니며 구원하지 못하는 신에게 기도하는 자들은 아는 것이 없습니다.","s":356.724,   if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
