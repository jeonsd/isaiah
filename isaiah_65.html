(function () {
  const TITLE = "isaiah_65", AUDIO_SRC = "isaiah_65_2610230230.mp3", DUR = 424, SEGS = [{"t":"이사야 65장","s":0,"e":1.739,"p":true,"h":false},{"t":"제목 \"내가 응답하려 했으나 너희가 부르지 않았다\", 새 하늘과 새 땅","s":2.376,"e":7.788,"p":true,"h":false},{"t":"핵심 한 줄 하나님은 부르지 않는 백성을 향해 손을 펴 두고 기다리셨으나, 마침내 완악한 자는 심판하시고 종들에게는 새 하늘과 새 땅을 주십니다.","s":8.424,"e":18.125,"p":true,"h":false},{"t":"풀어 읽기","s":18.9,"e":19.97,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 64장의 기도에 대한 하나님의 대답이 65장입니다.","s":20.808,"e":26.538,"p":false,"h":false},{"t":"그런데 이 대답은 뜻밖입니다.","s":26.748,"e":29.184,"p":false,"h":false},{"t":"하나님은 \"내가 응답하려 했고 찾게 하려 했는데 너희가 나를 찾지 않았다\"고 하십니다.","s":29.412,"e":35.65,"p":false,"h":false},{"t":"하나님이 침묵하셔서 이렇게 된 것이 아니라 백성이 하나님을 부르지 않았다는 것입니다.","s":35.856,"e":41.515,"p":true,"h":false},{"t":"이 장은 세 부분입니다.","s":42.156,"e":44.098,"p":false,"h":false},{"t":"반역하는 백성에 대한 하나님의 고발과 심판, 그 가운데서도 하나님의 종들은 남기시고 복을 주시는 구분, 그리고 마지막에 새 하늘과 새 땅을 창조하시고 사자와 어린 양이 함께 먹는 평화의 세상을 보여 주시는 약속입니다.","s":44.316,"e":59.683,"p":false,"h":false},{"t":"같은 백성 가운데서도 하나님을 찾는 자와 찾지 않는 자가 나뉜다는 것이 이 장의 줄기입니다.","s":60.012,"e":66.271,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":66.636,"e":69.912,"p":true,"h":false},{"t":"1절에서 7절, 종일 손을 펴 두었으나 \"나는 나를 구하지 아니하던 자에게 물음을 받았으며 나를 찾지 아니하던 자에게 찾아냄을 입었노라.\"","s":70.56,"e":79.75,"p":false,"h":false},{"t":"하나님은 자기 이름을 부르지 않던 나라에게도 \"내가 여기 있노라, 내가 여기 있노라\" 하셨다고 하십니다.","s":79.956,"e":87.376,"p":false,"h":false},{"t":"이방 나라가 하나님을 찾지 않았는데도 하나님이 먼저 나타나셨다는 놀라운 말씀입니다.","s":87.588,"e":93.301,"p":false,"h":false},{"t":"그런데 이 말씀은 신약에서 이방인이 복음을 받는 일의 근거로 인용됩니다.","s":93.492,"e":98.708,"p":false,"h":false},{"t":"그러나 하나님의 백성에게는 \"종일 내 손을 펴서 패역한 백성을 불렀다\"고 하십니다.","s":98.928,"e":105.152,"p":false,"h":false},{"t":"이 백성은 선하지 않은 길, 곧 제 생각을 따라 걷고 동산에서 제사하며 벽돌 위에 분향하며 무덤 사이에 앉고 은밀한 곳에서 밤을 지새우며 돼지고기를 먹고 가증한 것의 국을 그릇에 담았습니다.","s":105.336,"e":118.286,"p":false,"h":false},{"t":"그러면서 \"너는 네 자리에 서 있고 내게 가까이 오지 말라, 나는 너보다 거룩하니라\"고 말합니다.","s":118.62,"e":126.131,"p":false,"h":false},{"t":"스스로 거룩하다고 여기며 이웃을 멀리하는 교만입니다.","s":126.324,"e":130.21,"p":false,"h":false},{"t":"하나님은 이런 자들이 \"내 코의 연기요 종일 타는 불\"이라 하시고, 그 죄악과 그 조상들의 죄악을 함께 갚으시겠다고 하십니다.","s":130.428,"e":139.576,"p":false,"h":false},{"t":"하나님의 기다림이 길었다는 것이 이 구절에서 분명합니다.","s":139.932,"e":143.891,"p":false,"h":false},{"t":"종일 손을 펴고 기다리셨는데 그 기다림이 외면당했다는 말입니다.","s":144.108,"e":148.714,"p":false,"h":false},{"t":"이것이 하나님의 진노가 엄중한 이유이기도 합니다.","s":148.932,"e":152.395,"p":true,"h":false},{"t":"8절에서 10절, 포도송이 속의 즙 그러나 하나님은 다 멸하지는 않으십니다.","s":153.072,"e":158.556,"p":false,"h":false},{"t":"\"포도송이에 즙이 있으므로 사람들이 말하기를 그것을 상하게 하지 말라, 거기 복이 있느니라 하나니 나도 내 종들을 위하여 그와 같이 행하여 다 멸하지 아니하고.\"","s":158.76,"e":169.264,"p":false,"h":false},{"t":"포도송이에 아직 쓸 만한 즙이 있으면 버리지 않고 건지는 것과 같습니다.","s":169.452,"e":174.14,"p":false,"h":false},{"t":"야곱에게서 씨를, 유다에게서 내 산들을 상속할 자를 내겠다고 하십니다.","s":174.348,"e":179.63,"p":false,"h":false},{"t":"6장의 그루터기, 4장의 싹, 10장의 남은 자, 37장의 남은 자가 여기서 다시 확인됩니다.","s":179.856,"e":187.678,"p":false,"h":false},{"t":"샤론은 양 떼의 우리가 되고 아골 골짜기는 소 떼가 눕는 곳이 되어 나를 찾는 내 백성의 것이 됩니다.","s":187.884,"e":194.72,"p":false,"h":false},{"t":"이스라엘이 심판 속에서도 남은 자를 통해 이어지는 것은 하나님이 약속을 지키시기 때문입니다.","s":195.084,"e":201.245,"p":true,"h":false},{"t":"11절에서 16절, 종들과 반역자의 갈림 \"그러나 여호와를 버리며 나의 성산을 잊고 갓 신에게 상을 베풀며 므니 신에게 섞은 술을 가득히 붓는 너희여.\"","s":202.032,"e":212.608,"p":false,"h":false},{"t":"갓과 므니는 운수의 신, 곧 복을 가져다준다고 믿던 우상의 이름입니다.","s":212.796,"e":218.193,"p":false,"h":false},{"t":"하나님은 이들을 칼에 넘기시겠다고 하십니다.","s":218.412,"e":221.521,"p":false,"h":false},{"t":"\"내가 불렀으나 너희가 대답하지 아니하였고 내가 말하였으나 너희가 듣지 아니하고 나의 눈에 악을 행하며 내가 기뻐하지 아니하는 일을 택하였음이니라.\"","s":221.724,"e":231.343,"p":false,"h":false},{"t":"그리고 종들과 반역자의 운명을 하나씩 대비하십니다.","s":231.552,"e":235.4,"p":false,"h":false},{"t":"내 종들은 먹으려니와 너희는 주릴 것이요, 내 종들은 마시려니와 너희는 목마를 것이요, 내 종들은 기뻐하려니와 너희는 수치를 당할 것이요, 내 종들은 마음이 즐거워 노래하려니와 너희는 마음이 아파 울며 심령이 상하여 통곡할 것이라고 하십니다.","s":235.62,"e":252.493,"p":false,"h":false},{"t":"이 대비가 심판의 구분을 분명히 보여 줍니다.","s":252.828,"e":256.076,"p":false,"h":false},{"t":"너희 이름은 내가 택한 자에게 저주거리가 되고 하나님은 다른 이름으로 자기 종들을 부르실 것이라고 합니다.","s":256.284,"e":263.156,"p":false,"h":false},{"t":"그리하여 땅에서 복을 구하는 자가 진리의 하나님으로 복을 구하고 땅에서 맹세하는 자가 진리의 하나님으로 맹세하게 됩니다.","s":263.376,"e":271.175,"p":false,"h":false},{"t":"이전 환난은 잊혀서 내 눈앞에서 숨겨졌기 때문입니다.","s":271.512,"e":275.421,"p":true,"h":false},{"t":"17절에서 25절, 새 하늘과 새 땅 이 장의 가장 큰 약속입니다.","s":276.084,"e":281.42,"p":false,"h":false},{"t":"\"보라 내가 새 하늘과 새 땅을 창조하나니 이전 것은 기억되거나 마음에 생각나지 아니할 것이라.\"","s":281.772,"e":288.153,"p":false,"h":false},{"t":"지금의 하늘과 땅이 고쳐지는 것이 아니라 하나님이 새로 창조하신다는 말씀입니다.","s":288.36,"e":293.869,"p":false,"h":false},{"t":"그러므로 \"너희는 내가 창조하는 것으로 말미암아 영원히 기뻐하며 즐거워할지니.\"","s":294.084,"e":299.652,"p":false,"h":false},{"t":"하나님이 예루살렘을 기쁨으로, 그 백성을 즐거움으로 창조하시고, 예루살렘을 즐거워하며 내 백성을 기뻐하신다고 하십니다.","s":299.844,"e":308.828,"p":false,"h":false},{"t":"거기서는 다시는 우는 소리와 부르짖는 소리가 들리지 않습니다.","s":309.168,"e":313.44,"p":false,"h":false},{"t":"그곳에는 며칠 살다 죽는 어린아이가 없고 수명을 다 채우지 못하는 노인이 없으며, 백 세에 죽는 자는 젊은이요 백 세가 못 되어 죽는 자는 저주받은 자로 여겨집니다.","s":313.668,"e":324.791,"p":false,"h":false},{"t":"집을 지으면 그 집에 살고 포도원을 가꾸면 그 열매를 먹으며, 다른 사람이 살 집을 짓지 않고 다른 사람이 먹을 것을 심지 않습니다.","s":325.116,"e":334.338,"p":false,"h":false},{"t":"이는 내 백성의 수명이 나무의 수명 같고 내 택한 자가 손으로 수고한 것을 길이 누릴 것이기 때문입니다.","s":334.692,"e":341.966,"p":false,"h":false},{"t":"수고하여도 헛되지 않고 재난을 위해 자녀를 낳지 않으며 그들은 여호와께 복 받은 자손이기 때문입니다.","s":342.324,"e":348.972,"p":false,"h":false},{"t":"그리고 하나님이 이렇게 약속하십니다.","s":349.308,"e":352,"p":false,"h":false},{"t":"\"그들이 부르기 전에 내가 응답하겠고 그들이 말하는 중에 내가 들을 것이며.\"","s":352.224,"e":357.312,"p":false,"h":false},{"t":"64장에서 \"주여 하늘을 찢고 내려오소서\" 하고 부르짖은 기도에 하나님이 부르기도 전에 응답하신다는 약속입니다.","s":357.516,"e":365.263,"p":false,"h":false},{"t":"그리고 11장에서 본 평화의 모습이 다시 나옵니다.","s":365.616,"e":369.352,"p":false,"h":false},{"t":"\"이리와 어린양이 함께 먹을 것이요 사자가 소처럼 짚을 먹을 것이며 뱀은 티끌을 먹을 것이니 나의 거룩한 산에서는 해됨도 상함도 없을 것이니라.\"","s":369.576,"e":379.535,"p":false,"h":false},{"t":"뱀은 티끌을 먹는다는 말은, 에덴에서 인간을 속인 뱀에게 내려진 저주가 끝까지 이어져 그가 더 이상 힘을 쓰지 못함을 보여 주는 것으로 읽는 해석이 있습니다.","s":379.728,"e":389.991,"p":false,"h":false},{"t":"새 하늘과 새 땅은 신약 마지막 책에서 다시 한번 확인되는 약속입니다.","s":390.348,"e":395.477,"p":true,"h":false},{"t":"이 장을 마치며 65장에서 가져갈 것은 이것입니다.","s":396.288,"e":400.119,"p":false,"h":false},{"t":"하나님은 종일 손을 펴 두고 기다리셨고, 그 기다림을 끝내 거절한 사람에게는 심판이 있습니다.","s":400.356,"e":407.073,"p":false,"h":false},{"t":"그러나 하나님을 찾는 종들에게는 새 하늘과 새 땅이 약속되어 있고, 하나님은 부르기 전에 응답하십니다.","s":407.448,"e":414.621,"p":false,"h":false},{"t":"지금 말씀을 들을 수 있을 때 하나님께 돌아와야 합니다.","s":414.972,"e":418.743,"p":false,"h":false},{"t":"이사야서의 마지막 장인 66장이 마무리를 짓습니다.","s":418.932,"e":422.888,"p":true,"h":false}], NAV = {"prev":{"href":"isaiah_64.html","title":"isaiah_64"},"next":{"href":"isaiah_66.html","title":"isaiah_66"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
