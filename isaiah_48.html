(function () {
  const TITLE = "isaiah_48", AUDIO_SRC = "isaiah_48_2610230230.mp3", DUR = 418, SEGS = [{"t":"이사야 48장","s":0,"e":1.786,"p":true,"h":false},{"t":"제목 \"내 명령에 귀를 기울였더라면\", 고통의 풀무에서 택하신 백성","s":2.448,"e":7.846,"p":true,"h":false},{"t":"핵심 한 줄 완고한 백성에게도 하나님은 새 일을 미리 알리시고, 고난의 풀무에서 자기 이름을 위해 건져 내십니다.","s":8.496,"e":16.157,"p":true,"h":false},{"t":"풀어 읽기","s":16.956,"e":18.026,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 48장은 하나님이 이스라엘을 향해 하시는 마음 아픈 말씀입니다.","s":18.864,"e":25.106,"p":false,"h":false},{"t":"이 백성은 하나님의 이름으로 맹세하면서도 진실과 공의가 없었고, 하나님이 미리 말씀하신 것을 다 보고도 우상의 공으로 돌렸습니다.","s":25.452,"e":34.85,"p":false,"h":false},{"t":"그래서 하나님은 말씀하십니다.","s":35.208,"e":37.492,"p":false,"h":false},{"t":"네가 완고한 줄 내가 알았기 때문에 일이 이루어지기 전에 미리 알려 두었다고.","s":37.728,"e":43.068,"p":true,"h":false},{"t":"이 장에서 하나님의 마음은 탄식과 구원이 섞여 있습니다.","s":43.704,"e":47.726,"p":false,"h":false},{"t":"\"네가 내 명령에 귀를 기울였더라면 네 평강이 강 같았을 것을\"이라는 탄식이 있고, 동시에 \"바벨론에서 나오라\"는 부름이 있습니다.","s":48.096,"e":57.818,"p":false,"h":false},{"t":"하나님이 구원하시는 이유는 백성이 좋아서가 아니라 자기 이름 때문이라는 점이 이 장을 붙드는 줄기입니다.","s":58.176,"e":65.068,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":65.412,"e":68.688,"p":true,"h":false},{"t":"1절에서 5절, 이름만 부르는 백성 \"야곱의 집이여 이를 들으라.","s":69.336,"e":74.409,"p":false,"h":false},{"t":"너희는 이스라엘이라 일컬음을 받고 유다의 허리에서 나왔으며 여호와의 이름으로 맹세하며 이스라엘의 하나님을 말하나 진실도 없고 공의도 없도다.\"","s":74.628,"e":83.875,"p":false,"h":false},{"t":"이름은 하나님의 백성이라 하면서 삶에는 진실이 없었습니다.","s":84.06,"e":88.408,"p":false,"h":false},{"t":"1장에서 겉으로는 예배를 드리면서 삶에서는 악을 행하던 모습과 같습니다.","s":88.632,"e":93.866,"p":false,"h":false},{"t":"하나님은 옛적 일을 미리 말씀하신 이유를 밝히십니다.","s":94.248,"e":98.059,"p":false,"h":false},{"t":"\"내가 알기에 너는 완고하여 네 목은 쇠 힘줄이요 네 이마는 놋이니.\"","s":98.28,"e":103.148,"p":false,"h":false},{"t":"그래서 일이 이루어지기 전에 미리 알려 주어, 이 일을 \"내 우상이 행하였고 내 새긴 우상과 부어 만든 우상이 명령하였다\"고 말하지 못하게 하셨다는 것입니다.","s":103.356,"e":114.653,"p":true,"h":false},{"t":"6절에서 8절, 이제 새 일, 숨겨진 일을 보이신다 하나님은 이제 새 일, 곧 지금까지 몰랐던 숨은 일을 알려 주십니다.","s":115.452,"e":124.636,"p":false,"h":false},{"t":"이것은 옛날에 지어진 것이 아니라 지금 지으신 것이고, 이전에는 듣지 못하게 하신 것입니다.","s":124.992,"e":131.429,"p":false,"h":false},{"t":"그래야 \"내가 이미 알았노라\"고 말하지 못합니다.","s":131.616,"e":135.42,"p":false,"h":false},{"t":"하나님은 이 백성의 본성을 아십니다.","s":135.648,"e":138.395,"p":false,"h":false},{"t":"\"너는 듣지 못하였고 알지 못하였고 네 귀가 옛적부터 열리지 아니하였나니 이는 내가 알기를 네가 정녕 속이는 자라 모태에서부터 네가 패역한 자라 불린 줄을 알았음이라.\"","s":138.6,"e":149.709,"p":false,"h":false},{"t":"이 백성은 태어날 때부터 패역한 자라고 하나님이 밝히십니다.","s":149.904,"e":154.14,"p":false,"h":false},{"t":"6장에서 들어도 깨닫지 못한다고 하신 마음의 상태가 이 백성의 뿌리 깊은 문제임을 보여 줍니다.","s":154.368,"e":160.752,"p":true,"h":false},{"t":"9절에서 11절, 내 이름을 위하여 그러나 이 장의 가장 중요한 말씀이 여기 있습니다.","s":161.532,"e":167.657,"p":false,"h":false},{"t":"\"내가 나의 이름을 위하여 노를 더디 하며 내가 나의 영예를 위하여 참고 너를 멸절하지 아니하리라.\"","s":168.012,"e":174.549,"p":false,"h":false},{"t":"하나님이 이 백성을 멸하지 않으시는 이유는 백성이 잘해서가 아니라 하나님 자신의 이름과 영예 때문입니다.","s":174.744,"e":181.586,"p":false,"h":false},{"t":"그리고 하나님은 이 백성을 연단하셨다고 하십니다.","s":181.944,"e":185.461,"p":false,"h":false},{"t":"\"보라 내가 너를 연단하였으나 은처럼 하지 아니하고 고난의 풀무에서 너를 택하였노라.\"","s":185.688,"e":191.438,"p":false,"h":false},{"t":"은은 풀무에서 불순물이 걸러져 순은이 되는데, 이 백성은 그렇게도 깨끗해지지 않았습니다.","s":191.664,"e":197.912,"p":false,"h":false},{"t":"그런데도 하나님은 고난의 풀무 속에서 이 백성을 택하셨다고 하십니다.","s":198.288,"e":203.247,"p":false,"h":false},{"t":"11절에서 다시 말씀하십니다.","s":203.436,"e":205.995,"p":false,"h":false},{"t":"\"내가 나를 위하며 나를 위하여 이를 이루리니 내 이름이 어찌 욕되게 하리요.","s":206.208,"e":211.255,"p":false,"h":false},{"t":"내 영광을 다른 자에게 주지 아니하리라.\"","s":211.464,"e":214.395,"p":false,"h":false},{"t":"43장 25절에서 보았던 오직 은혜가 이 장에서 다시 선명하게 확인됩니다.","s":214.596,"e":220.363,"p":true,"h":false},{"t":"12절에서 16절, 처음이요 나중인 나의 부르심 하나님은 다시 자기를 소개하십니다.","s":221.184,"e":227.426,"p":false,"h":false},{"t":"\"야곱아 내가 부른 이스라엘아 내 말을 들으라.","s":227.772,"e":231.116,"p":false,"h":false},{"t":"내가 그니 내가 처음이요 또한 나중이라.\"","s":231.336,"e":234.266,"p":false,"h":false},{"t":"하나님이 땅의 기초를 놓으시고 오른손으로 하늘을 펴셨습니다.","s":234.468,"e":238.639,"p":false,"h":false},{"t":"내가 부르면 모두 일제히 서겠다고 하십니다.","s":238.86,"e":241.996,"p":false,"h":false},{"t":"그리고 말씀하십니다.","s":242.208,"e":243.856,"p":false,"h":false},{"t":"\"너희는 모여 들으라.","s":244.116,"e":245.733,"p":false,"h":false},{"t":"그들 중에 누가 이 일을 예언하였느냐?","s":246.024,"e":248.654,"p":false,"h":false},{"t":"여호와께서 그를 사랑하시니 그가 여호와의 뜻을 바벨론에 행하리니.\"","s":248.904,"e":253.485,"p":false,"h":false},{"t":"고레스를 가리킵니다.","s":253.692,"e":255.316,"p":false,"h":false},{"t":"그리고 16절 끝에서 이야기하는 사람이 갑자기 바뀝니다.","s":255.6,"e":259.709,"p":false,"h":false},{"t":"\"이제는 주 여호와께서 나와 그의 영을 보내셨느니라.\"","s":259.92,"e":263.812,"p":false,"h":false},{"t":"이 말하는 분은 누구일까요.","s":264.024,"e":266.188,"p":false,"h":false},{"t":"하나님이 보내신 분이 말하는 목소리로 읽을 수 있고, 앞에서 42장에서 만난 하나님의 종의 음성이 여기서 한 번 더 들리는 것으로 이해하는 해석이 많습니다.","s":266.364,"e":276.763,"p":false,"h":false},{"t":"이 종의 이야기는 49장에서 더 분명하게 이어집니다.","s":277.092,"e":281.228,"p":true,"h":false},{"t":"17절에서 19절, 귀를 기울였더라면 하나님은 이 장에서 가장 안타깝게 탄식하십니다.","s":281.88,"e":288.402,"p":false,"h":false},{"t":"\"네 구속자요 이스라엘의 거룩한 자인 나 여호와가 이같이 말하노라.","s":288.756,"e":293.367,"p":false,"h":false},{"t":"나는 네 하나님 여호와라 나는 네게 유익하도록 가르치고 너를 마땅히 갈 길로 인도하는 자니라.\"","s":293.58,"e":299.931,"p":false,"h":false},{"t":"그런데 이 백성은 듣지 않았습니다.","s":300.132,"e":302.817,"p":false,"h":false},{"t":"\"네가 나의 명령에 귀를 기울였더라면 네 평강이 강과 같고 네 공의가 바다 물결 같았을 것이요 네 자손이 모래 같고 네 몸의 소생이 모래알 같아서 그 이름이 내 앞에서 끊어지지 아니하며 멸망하지 아니하였으리라.\"","s":303.012,"e":317.365,"p":false,"h":false},{"t":"하나님은 복을 주려 하셨는데 사람이 듣지 않아서 그 복이 막혔습니다.","s":317.556,"e":322.328,"p":false,"h":false},{"t":"이 탄식은 6장에서 명령하신 완악함의 심판과 하나님의 아픈 마음이 함께 있다는 것을 보여 줍니다.","s":322.524,"e":329.164,"p":false,"h":false},{"t":"하나님의 심판은 차갑게 내리시는 것이 아니라 아파하시며 내리신다는 것입니다.","s":329.544,"e":334.878,"p":true,"h":false},{"t":"20절에서 22절, 바벨론에서 나오라 이 장은 명령으로 끝납니다.","s":335.52,"e":340.644,"p":false,"h":false},{"t":"\"너희는 바벨론에서 나오며 갈대아인 중에서 도망하라.","s":340.848,"e":344.458,"p":false,"h":false},{"t":"너희는 기쁜 소리로 이를 전파하여 알게 하며 땅 끝까지 반포하며 이르기를 여호와께서 그의 종 야곱을 속량하셨다 하라.\"","s":344.664,"e":352.542,"p":false,"h":false},{"t":"40장에서 위로를 선언하셨고, 이 구원이 이제 구체적인 \"나오라\"는 부름이 됩니다.","s":352.728,"e":359.326,"p":false,"h":false},{"t":"하나님이 이들을 마른 사막으로 인도하실 때 목마르지 않게 하셨고, 바위에서 물을 내시고 반석을 쪼개어 물이 흐르게 하셨습니다.","s":359.532,"e":367.929,"p":false,"h":false},{"t":"옛날 출애굽 때 광야에서 하신 일처럼 하신다는 것입니다.","s":368.28,"e":372.358,"p":false,"h":false},{"t":"그런데 마지막 22절은 서늘한 말로 끝납니다.","s":372.6,"e":376.225,"p":false,"h":false},{"t":"\"여호와의 말씀에 악인에게는 평강이 없다 하셨느니라.\"","s":376.452,"e":380.146,"p":false,"h":false},{"t":"구원의 소식이 전해지는데도 이 약속을 받아들이지 않는 사람에게는 평강이 없습니다.","s":380.34,"e":385.991,"p":false,"h":false},{"t":"이 구절은 57장 21절에서 한 번 더 반복됩니다.","s":386.208,"e":390.506,"p":true,"h":false},{"t":"이 장을 마치며 48장에서 가져갈 것은 이것입니다.","s":391.176,"e":395.123,"p":false,"h":false},{"t":"우리가 완고해도 하나님은 자기 이름을 위해 우리를 멸하지 않으시고 풀무 속에서 택하십니다.","s":395.352,"e":401.411,"p":false,"h":false},{"t":"하나님은 복을 주려 하셨는데 우리가 듣지 않아 막혔다는 탄식을 들으면서, 오늘 우리가 하나님의 말씀에 귀를 기울이고 있는지 돌아보게 됩니다.","s":401.796,"e":411.18,"p":false,"h":false},{"t":"49장은 이 말씀하시는 분, 곧 하나님의 종이 자기 입으로 말하는 장입니다.","s":411.552,"e":417.177,"p":true,"h":false}], NAV = {"prev":{"href":"isaiah_47.html","title":"isaiah_47"},"next":{"href":"isaiah_49.html","title":"isaiah_49"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
