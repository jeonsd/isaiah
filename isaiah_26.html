(function () {
  const TITLE = "isaiah_26", AUDIO_SRC = "isaiah_26_2610230230.mp3", DUR = 389, SEGS = [{"t":"이사야 26장","s":0,"e":1.784,"p":true,"h":false},{"t":"제목 평강으로 지켜 주시는 하나님, 믿음의 노래","s":2.412,"e":6.171,"p":true,"h":false},{"t":"핵심 한 줄 마음을 하나님께 굳게 두는 사람을 하나님이 온전한 평강으로 지키시고, 죽은 자도 살리십니다.","s":6.84,"e":14.001,"p":true,"h":false},{"t":"풀어 읽기","s":14.796,"e":15.866,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 25장이 모든 민족을 위한 잔치였다면, 26장은 그 구원을 기다리는 하나님의 백성이 \"그날에\" 부르는 노래입니다.","s":16.704,"e":27.238,"p":false,"h":false},{"t":"12장이 구원받은 뒤의 찬양이었다면, 이 노래에는 아직 기다림이 섞여 있습니다.","s":27.432,"e":33.356,"p":false,"h":false},{"t":"세상은 여전히 악인이 잘되는 것처럼 보이고, 하나님의 백성은 고통 속에서 하나님을 바라봅니다.","s":33.552,"e":40.276,"p":true,"h":false},{"t":"노래의 줄기는 이렇습니다.","s":40.932,"e":42.855,"p":false,"h":false},{"t":"하나님을 믿고 의지하는 사람은 온전한 평강을 누립니다.","s":43.092,"e":47.073,"p":false,"h":false},{"t":"하나님은 교만한 성을 낮추시고 가난한 자의 발이 그 위를 걷게 하십니다.","s":47.268,"e":52.172,"p":false,"h":false},{"t":"백성은 \"우리가 밤에 주를 사모합니다\" 하고 기다리고, 하나님은 죽은 자가 살아날 것이라고 약속하십니다.","s":52.38,"e":59.93,"p":false,"h":false},{"t":"마지막은 \"잠깐 숨어 있으라, 진노가 지나갈 때까지\"라는 위로입니다.","s":60.12,"e":65.644,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":65.844,"e":69.12,"p":true,"h":false},{"t":"1절에서 4절, 견고한 성, 평강의 비결 \"그날에\" 유다 땅에서 이 노래를 부릅니다.","s":69.768,"e":76.566,"p":false,"h":false},{"t":"\"우리에게 견고한 성읍이 있어 하나님이 구원을 성벽과 외곽으로 삼으시리로다.\"","s":76.788,"e":82.022,"p":false,"h":false},{"t":"성벽을 사람이 쌓는 것이 아니라 하나님이 구원으로 둘러 주신다는 말입니다.","s":82.224,"e":87.296,"p":false,"h":false},{"t":"성문을 열어 \"신실함을 지키는 의로운 나라\"가 들어오게 하라고 합니다.","s":87.66,"e":92.532,"p":false,"h":false},{"t":"3절은 이 장의 가장 유명한 말씀입니다.","s":92.736,"e":95.795,"p":false,"h":false},{"t":"\"주께서 심지가 견고한 자를 평강에 평강으로 지키시리니 이는 그가 주를 의뢰함이니이다.\"","s":96.012,"e":101.865,"p":false,"h":false},{"t":"심지가 견고하다는 것은 마음이 이리저리 흔들리지 않고 하나님께 붙어 있다는 뜻입니다.","s":102.06,"e":107.959,"p":false,"h":false},{"t":"평강에 평강이라고 겹쳐 말한 것은 온전하고 빈틈없는 평안이라는 강조입니다.","s":108.324,"e":113.641,"p":false,"h":false},{"t":"그러니 영원히 여호와를 의뢰하라고 권합니다.","s":113.868,"e":117.004,"p":false,"h":false},{"t":"여호와는 영원한 반석이시기 때문입니다.","s":117.216,"e":120.195,"p":true,"h":false},{"t":"5절에서 6절, 높은 성이 낮아진다 하나님은 높은 곳에 사는 자들, 곧 교만한 성읍을 낮추십니다.","s":120.852,"e":128.171,"p":false,"h":false},{"t":"땅에 엎드러뜨려 티끌까지 이르게 하십니다.","s":128.376,"e":131.405,"p":false,"h":false},{"t":"그리고 그 위를 가난한 자의 발과 궁핍한 자의 걸음이 밟고 지나갑니다.","s":131.616,"e":136.682,"p":false,"h":false},{"t":"세상에서 짓밟히던 사람들이 도리어 그 자리에 서게 된다는 반전입니다.","s":136.872,"e":141.794,"p":false,"h":false},{"t":"1장과 3장에서 가난한 사람을 짓밟던 지도자들을 기억하시면 이 장면이 더 와닿습니다.","s":141.984,"e":147.982,"p":true,"h":false},{"t":"7절에서 11절, 기다리는 사람, 깨닫지 못하는 악인 의인의 길은 바르고, 하나님은 의인의 길을 평탄하게 하십니다.","s":148.788,"e":157.419,"p":false,"h":false},{"t":"그래서 백성은 말합니다.","s":157.608,"e":159.555,"p":false,"h":false},{"t":"\"주의 심판의 길에서 주를 기다렸습니다.","s":159.768,"e":162.577,"p":false,"h":false},{"t":"우리 영혼의 소원은 주의 이름과 주를 기억하는 것입니다.\"","s":162.792,"e":166.721,"p":false,"h":false},{"t":"8절에서 9절에서 이 사람들은 밤에 주를 사모하고, 아침에도 주를 찾는다고 고백합니다.","s":166.932,"e":173.318,"p":false,"h":false},{"t":"하나님의 심판이 땅에 임할 때 세상 사람들이 의를 배우게 된다는 것입니다.","s":173.52,"e":178.538,"p":false,"h":false},{"t":"그런데 악인은 은혜를 입어도 의를 배우지 않습니다.","s":178.776,"e":182.288,"p":false,"h":false},{"t":"정직한 땅에서도 불의를 행하고 여호와의 위엄을 보지 않습니다.","s":182.484,"e":186.784,"p":false,"h":false},{"t":"하나님의 손이 높이 들려 있어도 알지 못하고, 이 백성에 대한 하나님의 열심을 보면 부끄러워하게 될 것이라고 합니다.","s":186.984,"e":194.796,"p":false,"h":false},{"t":"6장에서 \"들어도 깨닫지 못한다\"고 하신 말씀과 닿아 있습니다.","s":195.012,"e":199.771,"p":false,"h":false},{"t":"은혜를 거듭 받고도 깨닫지 못하는 모습이 얼마나 무서운 일인지를 보여 줍니다.","s":199.98,"e":205.077,"p":true,"h":false},{"t":"12절에서 15절, 주께서 우리의 모든 일을 이루셨습니다 \"여호와여 주는 우리에게 평강을 주시리이다.","s":205.74,"e":212.937,"p":false,"h":false},{"t":"주께서 우리의 모든 일도 우리를 위하여 이루셨음이니이다.\"","s":213.156,"e":217.148,"p":false,"h":false},{"t":"우리가 한 것 같은 일도 사실은 하나님이 이루신 것이라는 고백입니다.","s":217.368,"e":222.047,"p":false,"h":false},{"t":"그러고 나서 백성은 말합니다.","s":222.264,"e":224.561,"p":false,"h":false},{"t":"하나님 외에 다른 주인들이 우리를 다스렸으나, 우리는 오직 주의 이름만 부르겠다는 것입니다.","s":224.784,"e":231.22,"p":false,"h":false},{"t":"그 주인들은 죽은 자라서 다시 살지 못하고 하나님이 벌하셔서 그 기억까지 없어졌습니다.","s":231.408,"e":237.667,"p":false,"h":false},{"t":"반대로 하나님은 이 나라를 더하시고 땅 끝까지 영광을 얻으셨습니다.","s":237.996,"e":242.791,"p":true,"h":false},{"t":"16절에서 18절, 고통을 겪고도 아무것도 낳지 못한 백성 이 백성은 고난 중에 하나님을 찾았습니다.","s":243.432,"e":250.804,"p":false,"h":false},{"t":"하나님이 징계하실 때 그들은 속삭이듯 기도했습니다.","s":251.172,"e":254.971,"p":false,"h":false},{"t":"그런데 17절에서 18절은 슬픈 고백을 합니다.","s":255.204,"e":258.838,"p":false,"h":false},{"t":"해산하는 여인이 아파하며 부르짖는 것처럼 우리도 주 앞에서 괴로웠지만, 바람을 낳은 것 같다고 합니다.","s":259.056,"e":265.855,"p":false,"h":false},{"t":"곧 고통은 겪었는데 구원을 이루지 못했고, 땅에 새로운 사람도 나오지 않았다는 것입니다.","s":266.04,"e":272.262,"p":false,"h":false},{"t":"사람의 힘으로는 아무리 고통스럽게 애써도 구원을 만들어 낼 수 없다는 고백입니다.","s":272.484,"e":278.081,"p":true,"h":false},{"t":"19절, 죽은 자가 살아날 것이다 여기서 하나님이 놀라운 응답을 주십니다.","s":278.748,"e":284.221,"p":false,"h":false},{"t":"\"주의 죽은 자들은 살아나고 내 시체들은 일어나리이다.","s":284.436,"e":288.158,"p":false,"h":false},{"t":"티끌에 누운 자들아 너희는 깨어 노래하라.\"","s":288.36,"e":291.269,"p":false,"h":false},{"t":"이슬이 땅을 적시고 생명을 일으키듯, 하나님이 죽은 자를 살려 내실 것이라는 약속입니다.","s":291.492,"e":297.739,"p":false,"h":false},{"t":"앞에서 사람의 힘으로는 새 생명을 낳을 수 없다고 했는데, 하나님은 그 일을 직접 하시겠다는 것입니다.","s":298.116,"e":305.117,"p":false,"h":false},{"t":"구약에서 죽은 자의 부활을 가장 분명하게 말하는 구절입니다.","s":305.496,"e":309.732,"p":false,"h":false},{"t":"하나님은 자기 백성을 죽음에서 반드시 살려 내십니다.","s":309.96,"e":313.869,"p":false,"h":false},{"t":"이것은 막연한 희망이 아니라 하나님이 하신 약속이고, 그리스도의 부활로 이 약속이 보증되었다고 우리는 믿습니다.","s":314.1,"e":322.072,"p":false,"h":false},{"t":"25장 8절의 \"죽음을 삼키시리라\"는 약속과 한 줄기입니다.","s":322.416,"e":327.204,"p":true,"h":false},{"t":"20절에서 21절, 잠깐 숨어 있으라 이 노래의 끝은 위로의 부름입니다.","s":327.852,"e":333.302,"p":false,"h":false},{"t":"\"내 백성아 가라, 네 밀실에 들어가서 문을 닫고 분노가 지나기까지 잠깐 숨을 지어다.\"","s":333.504,"e":339.61,"p":false,"h":false},{"t":"하나님의 진노가 땅에 내릴 때, 하나님의 백성은 그분 안에 숨으라는 것입니다.","s":339.804,"e":345.121,"p":false,"h":false},{"t":"그 이유는 여호와께서 땅 주민의 죄악을 벌하시려고 그 처소에서 나오시기 때문입니다.","s":345.348,"e":351.286,"p":false,"h":false},{"t":"땅이 그 위에 흘린 피를 드러내고, 죽임당한 자들을 더 이상 가리지 않을 것입니다.","s":351.648,"e":357.295,"p":false,"h":false},{"t":"억울하게 죽은 사람들의 피를 하나님이 잊지 않으신다는 뜻입니다.","s":357.516,"e":361.627,"p":true,"h":false},{"t":"이 장을 마치며 26장에서 가져갈 것은 이것입니다.","s":362.268,"e":366.079,"p":false,"h":false},{"t":"세상이 흔들려도 마음을 하나님께 굳게 둔 사람은 하나님이 평강으로 지키십니다.","s":366.3,"e":371.754,"p":false,"h":false},{"t":"사람의 힘으로는 구원을 낳을 수 없지만, 하나님은 죽은 자도 살리시는 분이십니다.","s":372.132,"e":378.104,"p":false,"h":false},{"t":"그러니 진노의 때에는 하나님 안에 숨고, 기다리며 그분을 바라보십시오.","s":378.324,"e":383.359,"p":false,"h":false},{"t":"27장은 이 심판과 구원의 이야기를 포도원 노래로 마무리합니다.","s":383.544,"e":388.461,"p":true,"h":false}], NAV = {"prev":{"href":"isaiah_25.html","title":"isaiah_25"},"next":{"href":"isaiah_27.html","title":"isaiah_27"},"list":"index.html"};

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
