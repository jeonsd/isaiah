(function () {
  const TITLE = "isaiah_44", AUDIO_SRC = "isaiah_44_2610230230.mp3", DUR = 405, SEGS = [{"t":"이사야 44장","s":0,"e":1.757,"p":true,"h":false},{"t":"제목 우상을 조롱하시는 하나님, 영을 부어 주시는 하나님","s":2.412,"e":6.786,"p":true,"h":false},{"t":"핵심 한 줄 나무토막으로 신을 만드는 어리석음과 달리, 하나님은 자기 백성에게 영을 부으시고 고레스를 통해 예루살렘을 세우십니다.","s":7.416,"e":16.375,"p":true,"h":false},{"t":"풀어 읽기","s":17.172,"e":18.242,"p":true,"h":false},{"t":"이 장은 이런 이야기입니다 44장은 이사야서에서 가장 강하게 우상을 조롱하는 장입니다.","s":19.08,"e":25.253,"p":false,"h":false},{"t":"하나님이 먼저 \"내가 택한 종 야곱아 두려워하지 말라\"고 위로하시고, 이어서 나무를 베어 반은 불을 때고 반은 신을 만드는 사람의 어리석음을 보여 주십니다.","s":25.596,"e":36.155,"p":false,"h":false},{"t":"그다음 하나님이 \"나를 떠나지 말라, 내가 너를 지었다\"고 부르시고, 마지막에는 고레스라는 이름을 처음으로 밝히시며 \"예루살렘이 세워질 것이다\"라고 하십니다.","s":36.504,"e":48.092,"p":true,"h":false},{"t":"이 장은 이렇게 한 가지 질문으로 모입니다.","s":48.744,"e":51.728,"p":false,"h":false},{"t":"누가 진짜 하나님인가?","s":51.948,"e":53.758,"p":false,"h":false},{"t":"사람이 만든 신인가, 사람을 만드신 하나님인가?","s":53.964,"e":57.711,"p":false,"h":false},{"t":"이 흐름을 기억하고 절마다 따라가 보겠습니다.","s":57.924,"e":61.2,"p":true,"h":false},{"t":"1절에서 5절, 영을 부어 주시는 약속 \"그러나 이제 내 종 야곱아, 내가 택한 이스라엘아 들으라.\"","s":61.848,"e":69.197,"p":false,"h":false},{"t":"하나님은 \"너를 지으며 모태에서부터 너를 도와줄 여호와\"라고 자기를 소개하십니다.","s":69.408,"e":75.267,"p":false,"h":false},{"t":"그리고 약속하십니다.","s":75.456,"e":77.165,"p":false,"h":false},{"t":"\"내가 물을 목마른 자에게 붓듯 하며 마른 땅에 시내가 흐르게 하듯 내 영을 네 자손에게 내 복을 네 후손에게 부을 것이니.\"","s":77.364,"e":85.299,"p":false,"h":false},{"t":"32장에서 \"위에서 영을 부어 주신다\"고 한 약속이 이 장에서 이스라엘의 자손에게 주어집니다.","s":85.5,"e":92.372,"p":false,"h":false},{"t":"그 결과 그들은 \"물가의 버드나무같이 풀 가운데서 솟아나리니.\"","s":92.7,"e":97.46,"p":false,"h":false},{"t":"어떤 사람은 \"나는 여호와께 속했다\" 하고, 어떤 사람은 야곱의 이름으로 자기를 부르고, 어떤 사람은 손에 \"여호와께 속한 자\"라고 쓸 것입니다.","s":97.668,"e":108.381,"p":false,"h":false},{"t":"하나님이 영을 부으실 때 사람이 하나님께 자기를 속한 자라고 고백하는 일이 일어납니다.","s":108.612,"e":114.296,"p":true,"h":false},{"t":"6절에서 8절, 나 외에 다른 신이 없다 하나님이 다시 자기를 소개하십니다.","s":114.948,"e":120.682,"p":false,"h":false},{"t":"이스라엘의 왕, 구속자, 만군의 여호와, 처음이요 나중이십니다.","s":120.888,"e":126.326,"p":false,"h":false},{"t":"\"나 외에 다른 신이 없느니라.\"","s":126.54,"e":128.757,"p":false,"h":false},{"t":"누가 하나님처럼 일을 선포하고 알려 줄 수 있겠느냐고 하십니다.","s":128.952,"e":133.311,"p":false,"h":false},{"t":"그리고 백성에게 \"너희는 두려워하지 말며 놀라지 말라.","s":133.524,"e":137.517,"p":false,"h":false},{"t":"내가 예로부터 너에게 듣게 하며 보이지 아니하였느냐?","s":137.736,"e":141.243,"p":false,"h":false},{"t":"너희는 내 증인이라.","s":141.48,"e":143.311,"p":false,"h":false},{"t":"나 외에 신이 있겠느냐?","s":143.532,"e":145.447,"p":false,"h":false},{"t":"다른 반석이 없나니 내가 아는 자가 없노라\"고 하십니다.","s":145.656,"e":149.702,"p":true,"h":false},{"t":"9절에서 20절, 나무토막으로 만든 신 이제 우상 만드는 사람들의 어리석음이 구체적으로 그려집니다.","s":150.372,"e":157.566,"p":false,"h":false},{"t":"우상을 만드는 자들은 헛되고 그들이 기뻐하는 것은 무익합니다.","s":157.896,"e":162.293,"p":false,"h":false},{"t":"대장장이가 연장으로 숯불에 달구어 망치로 쳐서 팔 힘으로 우상을 만들지만, 배가 고프면 힘이 없고 물을 마시지 않으면 피곤합니다.","s":162.504,"e":171.713,"p":false,"h":false},{"t":"목수는 줄을 늘이고 먹줄로 그어 대패로 밀고 규로 그려 사람의 아름다운 모양으로 신상을 만들어 집에 둡니다.","s":172.044,"e":179.466,"p":false,"h":false},{"t":"그런데 그 나무는 어디서 왔습니까?","s":179.82,"e":182.247,"p":false,"h":false},{"t":"백향목을 베거나 삼나무를 가져와 숲의 나무 가운데서 자기를 위해 기르거나, 소나무를 심고 비가 키운 것입니다.","s":182.448,"e":190.116,"p":false,"h":false},{"t":"이 나무는 사람이 땔감으로 쓰기도 합니다.","s":190.476,"e":193.435,"p":false,"h":false},{"t":"그 나무로 불을 피워 몸을 따뜻하게 하고 빵도 굽습니다.","s":193.644,"e":197.581,"p":false,"h":false},{"t":"그런데 같은 나무로 신을 만들어 그 앞에 엎드려 절하고 \"나를 건지소서, 당신은 나의 신이십니다\" 하고 기도합니다.","s":197.784,"e":205.963,"p":false,"h":false},{"t":"그 나무의 반은 불에 태워 고기를 구워 먹고 배부른 뒤 \"아하 따뜻하다, 불을 보았다\" 하고 말하고, 그 남은 것으로 신상을 만든 것입니다.","s":206.316,"e":216.549,"p":false,"h":false},{"t":"이사야는 이 어리석음을 한마디로 꼬집습니다.","s":216.9,"e":220.169,"p":false,"h":false},{"t":"그는 재를 먹고 속은 마음에 미혹되어 자기 영혼을 구원하지 못하며 \"내 오른손에 거짓 것이 있지 아니한가\" 하고 말하지도 못합니다.","s":220.392,"e":229.259,"p":false,"h":false},{"t":"자기 손에 쥔 것이 거짓임을 알지 못하는 것이 우상숭배의 가장 큰 문제입니다.","s":229.608,"e":235.108,"p":true,"h":false},{"t":"21절에서 23절, 나를 잊지 말라, 내가 너를 속량하였다 이스라엘아 이것을 기억하라고 하십니다.","s":235.908,"e":243.671,"p":false,"h":false},{"t":"\"너는 내 종이니라.","s":243.864,"e":245.47,"p":false,"h":false},{"t":"내가 너를 지었고 이스라엘아 너는 나의 종이니 너는 나에게 잊혀지지 아니하리라.\"","s":245.772,"e":251.156,"p":false,"h":false},{"t":"그리고 놀라운 말씀입니다.","s":251.352,"e":253.383,"p":false,"h":false},{"t":"\"내가 네 허물을 빽빽한 구름 같이 네 죄를 안개 같이 도말하였으니 너는 내게로 돌아오라.","s":253.62,"e":259.758,"p":false,"h":false},{"t":"내가 너를 속량하였음이니라.\"","s":259.956,"e":262.1,"p":false,"h":false},{"t":"죄가 구름 같이 쌓였어도 하나님이 바람이 구름을 걷듯 없애 주셨다는 말씀입니다.","s":262.332,"e":267.816,"p":false,"h":false},{"t":"속량은 값을 치르고 되찾아 오는 것입니다.","s":268.2,"e":271.342,"p":false,"h":false},{"t":"용서가 먼저 있고, 그 뒤에 \"돌아오라\"는 부름이 나옵니다.","s":271.548,"e":276.459,"p":false,"h":false},{"t":"사람이 돌아와서 용서받는 것이 아니라 하나님이 먼저 용서하셨기에 돌아오라고 하십니다.","s":276.66,"e":282.446,"p":false,"h":false},{"t":"이 은혜의 순서가 중요합니다.","s":282.816,"e":285.052,"p":false,"h":false},{"t":"그러자 하늘과 땅이 노래합니다.","s":285.264,"e":287.638,"p":false,"h":false},{"t":"하늘아 노래하라, 땅의 깊은 곳들아 높이 부르라, 산들아 숲과 그 가운데 모든 나무여 소리 내어 노래하라.","s":287.856,"e":295.575,"p":false,"h":false},{"t":"여호와께서 야곱을 속량하셨고 이스라엘 중에서 영광을 나타내실 것이기 때문입니다.","s":295.776,"e":301.473,"p":true,"h":false},{"t":"24절에서 28절, 고레스를 통해 일하시는 하나님 하나님은 다시 자기를 소개하십니다.","s":302.292,"e":308.734,"p":false,"h":false},{"t":"\"네 구속자요 모태에서 너를 지은 여호와가 이르노라.","s":309.096,"e":312.68,"p":false,"h":false},{"t":"나는 만물을 지은 여호와라.","s":312.876,"e":314.95,"p":false,"h":false},{"t":"나 혼자 하늘을 폈고 땅을 폈으며.\"","s":315.18,"e":317.866,"p":false,"h":false},{"t":"거짓말하는 자의 징조를 폐하시고 점쟁이를 미치게 하시며 지혜자들을 물러가게 하여 그 지식을 어리석게 하십니다.","s":318.06,"e":325.421,"p":false,"h":false},{"t":"그러나 자기 종의 말을 이루시고 사자들의 계획을 성취하십니다.","s":325.764,"e":330.148,"p":false,"h":false},{"t":"예루살렘에 대해서는 \"사람이 살리라\", 유다 성읍들에는 \"중건함을 입으리라\"고 하십니다.","s":330.336,"e":337.084,"p":false,"h":false},{"t":"그리고 깊은 물에게 \"마르라\"고 하시고 강들을 마르게 하십니다.","s":337.284,"e":341.745,"p":false,"h":false},{"t":"그런데 28절은 놀라운 이름을 밝힙니다.","s":341.964,"e":345.125,"p":false,"h":false},{"t":"\"나는 고레스를 가리켜 이르기를 나의 목자라 그가 나의 기뻐하는 모든 것을 성취하리라 하며 예루살렘을 가리켜 그가 건축되리라 하며 성전을 가리켜 네 기초가 놓여지리라 하리라.\"","s":345.348,"e":356.679,"p":false,"h":false},{"t":"고레스는 페르시아 왕으로, 이사야가 살던 때로부터 약 150년 뒤에 일어난 사람입니다.","s":356.904,"e":363.263,"p":false,"h":false},{"t":"하나님이 아직 태어나지도 않은 이 왕의 이름을 미리 말씀하신 것은, 앞일을 말씀하실 수 있는 분이 오직 하나님 한 분이심을 보이기 위한 것입니다.","s":363.456,"e":372.91,"p":false,"h":false},{"t":"이스라엘 사람이 아니라 이방 왕을 \"나의 목자\"라 부르시며 쓰신다는 점도 놀랍습니다.","s":373.248,"e":379.234,"p":true,"h":false},{"t":"이 장을 마치며 44장에서 가져갈 것은 이것입니다.","s":379.872,"e":383.794,"p":false,"h":false},{"t":"사람이 손으로 만든 신은 땔감과 같은 나무에서 나왔을 뿐입니다.","s":384.012,"e":388.509,"p":false,"h":false},{"t":"진짜 하나님은 사람을 지으시고, 그 죄를 구름처럼 도말하시고, 영을 부어 주시는 분입니다.","s":388.728,"e":395.452,"p":false,"h":false},{"t":"용서가 먼저이고 돌아옴이 그 뒤라는 은혜의 순서를 기억하십시오.","s":395.64,"e":400.025,"p":false,"h":false},{"t":"45장은 이 고레스에게 주시는 하나님의 말씀입니다.","s":400.212,"e":404.209,"p":true,"h":false}], NAV = {"prev":{"href":"isaiah_43.html","title":"isaiah_43"},"next":{"href":"isaiah_45.html","title":"isaiah_45"},"list":"index.html"};
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }
  (function () {
    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
